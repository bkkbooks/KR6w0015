body:
  text: 三經佛下弟子二初牒經摽章私云三輪中第三第子也如文二言下隨文釋義四初釋比丘二初行古義今不釋經國王等與減注上云刪補云國者𫭫也有限𫭫故小郡曰邦大國曰國王者往也人皆歸往明曠同之王子者明曠云王之所生故云王子文百官者與減云百司之官𢝰舉其數如云百姓非只百人官者觀察人情決斷是非也宰相者撲揚云宰相者宰由割也相者相國之化言居此位者觀國之光利用賔王斷割時𭄍故云宰相文道璿注同之已上今不釋之比丘者則非當機之衆梵會無實類聲聞故遙令被後時漸機故云比丘等也問花嚴入法界品中有身子是實類也如何云無乎答此雖依宗不同依法相宗意入法界品則成道六年或十二年以後彼既制多林會也制多林者即薗精舍也彼成道六年或十二年造之見是故有實類也此經成道最初也故無實類為言與咸云比丘云乞士也比丘尼者撲揚云尼女也文明曠云比丘者此云勤事男比丘尼此云勤事女從小入大二衆通須文勤事男之名常途未見相亂近事男是故常以怖魔乞士破煩惱之也云云有回心受戒等者義作二尺今釋難破也云大小先後者於中有二一先小後大二先大後小若先受小後受大者前小乘戒為捨為在又不殺等與聲聞同為更新得為即前戒一云若回心時小轉成大故前小戒不捨而在而不可名為小乘戒以回心故共聲聞戒更不新增若不共戒受時新得二云回心新受時雖不捨前而由期心異更增離殺等如受具足時更得離殺等先大後小者若大入小即失大戒若不退大隨學小者不失前大雖受聲聞戒不名為小乘人文問云轉成菩薩戒非也者通別二受中依何如是破乎答知足房有義云大小乘戒誓願期心大別一切轉成不可許之云云依之文云菩薩乘心別種子生等尤叶道理者歟傳云於此一假能所兩破俱未盡理也不分別通別二受異故文集注蕳通別異云有轉成菩薩戒者若言聲聞受得戒轉成菩薩通受戒者其理不爾如疏所破期心近遠思願異故若言聞所受戒轉成菩薩別受戒者如所章有何妨難期心同故作法同故文問轉成菩薩戒者回心後俱於本種上運運增長名菩薩別受方號轉歟亦更本種上戒全移大乘種倍增長則名轉歟答傳云二乘心所受戒待菩提心勝緣方移大乘種是則菩薩別受也凡定大小乘別依乘性不同既回一切善根為皆向佛果因何今戒法獨小乘法運增長乎縱有漏位不許之轉成無漏時不移何若爾有漏時本種上防非㓛能依菩提心勝緣移大乘種都不可之問付此義移大乘種者本種上回心後猶有防非㓛能大小兩種俱運增長歟亦本種上㓛能全移但大乘種上運增長歟答全移大乘種本種上都無防非㓛能何回心已後猶有小乘法乎云云問小乘戒境一大千界若許轉成戒境更增至不可乎答既回心知不可三千界若言不遍對他三千界衆生作非可非犯戒乎戒境自元𢝰發若爾回心已去廣本境至不可境都無所妨云云有助大力者述云一義西大寺云回心向大人菩薩別受戒受時小戒轉成菩薩別受戒故云有助大力云云一義招提寺云有助大力者已前受小戒終為菩薩遠緣故云爾必非謂轉成云云取意記之二菩下立自義於彼所熏別起無表者彼小乘心所熏種上猶別有運防非㓛能也云云二釋十八梵二初合數十八梵者俱舍頌云十六七八天大梵無想故如次薩婆多經部上座部文大乘瑜伽意同上座部云十八天第四禪廣果天中開無想故唯外道所居也云云初禪三天梵衆天壽半劫明曠云謂梵民梵補天一劫謂梵王臣大梵天一劫半謂梵王第二禪三天小光天二劫身光劣故無量光天四劫光量多故極光淨天八劫光躰遍故第三禪三天小淨天十六劫無量淨天三十二劫遍淨天六十四劫例上釋之第四禪九天無雲天百二十五劫下地有雲上無雲地名無雲禍生天二百五十劫以勝福往生廣果天五百劫勝福感果故名廣果已上三天凡夫生處廣果天中有無想天外道生處也修無心定因生彼天故名外道天無煩天一千劫離繁雜故名無繁天無天二千劫離下地煩惱故善現天四千劫果德竭顯故善見天八千劫漸見律徹故色究竟天一万六千劫已上五天唯定性那𭇥生此中故云五淨居離欲煩惑名淨淨身所止曰居文無想初後許有心故者問初後有心故可許受戒乎答不爾但外道生處故今且出有心之分不許受戒也西天論家異義有三或初後俱無心或初後俱有心或初無心後有心云云而初後俱有心義是正義也是故今依正義云爾也問初後有心者一剎那歟通多時歟答有宗學者云婆沙中異也妙音義一剎那也𠀍正義云多時有想也云云二善下徵釋二初引徵善戒經云等者上釋無想天竟自此已下但釋五淨居也樂定聖者住無色入滅樂惠聖者住淨居入𣵀槃淨居聖者必定姓那𭇥也依之疑難出來而一性宗諸師此疑難不生一切可許故五性宗人師皆俱煩此事依之有三師異義也問今三師誰人義乎答第二第三義師義也彼云經淨居下來受佛記故知亦有發心受戒私云當今第三義也有云別有十八梵天無想淨居不入其數如本業經列色天衆文私云當今第二義也二有下有釋三初言𢝰意別六群者飾宗記云六群比丘者多論第四云一難途二跋難𨹔三迦留𨹔夷四闡𨹔五馬師六滿宿文二有下別有十八本業經上曰梵天梵衆天梵輔天大梵天水行天水天水無量天水音天淨居天無想天遍淨天淨光明天守妙天妙天極妙天福果天果勝天大淨天文問既云除無想淨居別有十八然而彼本業十八天中出無想淨居二天如何答淨居無想非五淨居天淨居乃至無想天無想歟既除彼別云有十八故義淨居天名遍淨天也又常五淨居在第四禪今本業經淨居天者第三禪也不可相亂也三有下據實成佛二初正明此第三義當義一義也觀無量經云義作問彼土淨居天為亦定性不還乎答依五淨居無回心者許亦無失又穢土淨居尚不可言無回心者何淨土以不空索經教化彼天令發心故又瓔珞經等授彼諸天菩提記故成唯識論云然五淨居無回趣者文經不彼發大心故此文釋般若經文非謂彼天無回心者二然下會論然唯識論等者第三師會論文也論云然五淨居發大心故文如引次上𢝰唯識論有二師義一云聖者回心必欲界如三周得記聞異生回心通色界二云聖者回心通欲色二界下三禪唯除第四禪論家正義第四禪無回心今有所會文是也問會意云何答論且依不了義大般若經云淨居無回心也彼經不二乘回心之教故至廣果天有發菩提心之言至淨居無發菩提心之言故實依法花深密等許二乘回心唯識論依彼深密等可許淨居回心為言此有意淨居聖者通不定姓義三藏門人而許淨居回心知法相宗猶及異義歟而慈恩唯識意五淨居回心都所不許也大般若𢝰設未來流通之相非唯一座仍可為宗家證文何云未建立等哉例如生天笁阿踰闍國人皆菩薩種姓八歲發大心生淨居者必定姓那𭇥亦復如是次於餘經發心之文者周記會云是佛菩薩之所化作來於佛𨕙受菩薩戒非實淨居文問三有中今意順何師乎答第一言𢝰意別義也上𢝰摽釋約通途十八梵釋之故非第二義也亦唯識學記不許淨居回心故非第三義也唯識學記云測云聖無凡極樂處故心生樂著故不發心基云如生淨居必不生上亦不回心取滅近故文經民者云民者無官位人文日本記訓也黃門者明矌云生等五種皇家掌門名為黃門文善珠下𣵀槃音義云取無根人與著黃衣令守王門故名黃門文男女者明矌云欲界男女通有貪此舉最多乃至衒賣云男女文奴婢者法花玄𮚌二云奴古者罪人使官入賤為奴或為僅字婢女之卑稱也文八部者天龍夜叉等也金神者與咸云金剛力士犱金剛杵之神也文利涉云金神者天帝釋之外護也須㫆四角有四高峰有金神常依彼住文反化人者藏上云反化人者如龍反為人小乘入難此中通也文元曉上云問無色人者何以故非列乎答亦得言反化以攝許上皆大乘中得受戒文與咸云四空處既能𥊸法亦應得戒但業報虛妙故略不文準宗家等解釋不許此義雖有定果不如思所發色𭤽故如上抄之三於下釋黃門等二初明共不共二初通受於中且依等者問黃門等受戒通出家在家乎答二釋一云唯許在家不通出家二云二衆俱許但戒成性不成云云取意釋性成否唯此釋也餘師今師未判定文集注文存初釋問業障𨕙罪難等可同報障黃門等乎答傳云業障可戒成性不成報障戒性俱不成云云二若下別受若遍學行等者則通別遍學也二有下引有問答有問若黃門等者問答俱見本文如文集私云經云者善戒經文也可見文集也躡上黃門等不得別受戒為難也答意約三聚以律儀為本故爾云也八云必先受小戒是名律儀云云不叶今釋者也傳云彼經始終菩薩為練根先別受後通受見非回心義善戒相大同瑜伽三聚也而此問答不得意經文相者歟如文集注文大智律師等依善戒經立漸受次第北京依此別受必先受云云乃至南都古義依此文七衆性成必依別受云云傳云瑜伽等分明通受七衆故唯通受可成其性善戒文為練根受之更不為性成也如上抄之云云問善戒文必自誓所不見何故注文但自誓乎答彼文出自受從他作法畢後有此文若爾俱通自受從他但自誓時殊用練根依之且如是注也實通自受從他也云云四皆下釋第一清淨私云文集大般若八十六并智論三十五引之開可見也大門第二經佛告下正分二初牒文惣分第二正分以下古迹上云經為此娑婆至一戒光明述曰大假第二誡𢙣行門於中有三開序故正故流通故文當常序正流通三假也二初下隨文釋義二第一重戒三初惣摽故二初牒文科分私云舉數制持者有十重波羅提木刃舉數也若受菩薩等制持也示相勸學者一切菩薩等文也凡菩薩戒相有二一略相貌者過現當三𠀍諸佛常恆重重輕輕無三𠀍改轉是三𠀍不改相也二廣相貌者下所十重六八戒也二此下隨文釋義二初舉數制持故二初配文舉傍義二初配文此初也三字也二瑜下傍義三初舉數異瑜伽立四等者則因經有十重等文顯重戒諸文同異也地持亦同瑜伽立後四重則菩薩地同本異譯故舊家曇無纖三藏譯也如宗要釋者彼云然菩薩戒意地為本乃至無𢙣不由貪瞋癡者亦無不為好推𢙣所以後四為根本重文若善生經等者則優婆塞戒經也佛對善生優婆塞之因為名也義云問此經中既十重何故善生唯辨前六菩薩地中唯後四答此經中通就七衆共所持故具十重善生別約在家二衆故唯前六判為重戒酟酒過於在家衆罪偏重故性重上增二為六後四於俗過微輕故於在家衆不制為重準此後四於出家衆其過偏重五六於道其過還輕是故地持偏後四文以麁顯故者八怗抄等有二義一義云指在家機云麁顯法進沙㫆經云五戒之相機麁戒細而易犯難持文一義云十重中但𭣦生等身語六自意業罪過相麁顯故對在家制六重也慳嗔等意罪細𢙣難守故不制為言後義當理也依善戒經等者傳云凡三聚異頗多而今善戒經了義顯了三聚也不同今經前四重律藏所四波羅夷也𭣦盜等如前攝律儀讓五部律藏則對優婆離等五百比丘㫆勒等一千菩薩菩提薩埵修行法門其所都不𭘧意趣顯了誠也大聖慈尊瑜伽論偏依此經顯了正故云云立有八重者問善戒經不列前四何云八重哉是以濟緣記云梵頓制即具十夷善戒漸圎但列四重文爾者何云八重乎答彼經云菩薩八重前四重讓爾前聞藏云如先而正列相唯後四重也大智律師約正列云但列四今望𢝰言云八重也則彼經云某甲諦𥊸菩薩戒者有八重法四重如先全文以下取意第五重法自讚毀他第六重法堅惜戒第七重法嗔戒第八重法誹謗戒也文故俱無相也問出家菩薩不可持酤酒談他過失戒哉答此二戒俱雖可持今不列戒相事列共不共根本戒故也問此八重何云出家戒哉云通道俗有何相哉答彼經漸悟菩薩戒相故以前受五八十具戒後受今菩薩戒也是以靈芝釋云若善戒經是法花𣵀槃部唯比丘得受文解釋尤叶今也云云共不共等者凡於一代所諸戒可有五階不同一在家出家菩薩共不共謂梵本業十波羅夷是二出家菩薩共不共謂今善戒經八重前四共戒後四不共三出家菩薩不共謂地持瑜伽後四重四出家菩薩共謂律藏所篇聚戒也攝律儀同諸律故五在家菩薩共不共謂善生經前六重前四三乘共重戒後二但不共重天台等諸律戒相但小乘戒得意未明此五階之不同也依之安然補通廣釋云善戒瑜伽等戒藏通二教戒文妙樂釋云別圎兩教專於梵文不知梵三聚名言略故方為不了善戒經三聚相貌廣故方為顯了如是解釋出來也云云此經本業乃至以通攝故者問通攝之言如何可得意異上立十重俱亘二衆同得重罪故云通攝歟亦如上立俱十夷戒相盡故云通攝乎答見文假倫次不越上限𫭫也在家六重出家八重是故今經合十重為言然於十重雖在家出家輕重不同俱護持之若依此義十戒俱亘二衆依之亦云通攝理無所云云問善戒經云在家六重出家八重文即𢝰合十重滿足何不云通攝乎答彼經雖二衆俱合𢝰有十重前四重讓律藏而不但後四重中間二重未知何物以今經挍合之則當酤酒談他二戒歟具之依何云通攝乎云云二頌下配業毒等二初略頌三初一句配三業此頌依瑜伽對法等主自結也非無依據初句三業次二句三毒後一句情非情也八怗抄云問今經中妄語戒云身心妄語等以身心犯語業戒依仙人恚嫌如𭣦一國衆生者以意行𭣦生何判定四身三語等乎答身心妄語等事能造犯所造業各別能造犯三業互雖作之所造業無所亂四身三語等立也法師釋身心妄語文云雖由二表身心也令他妄解而所造業語業所攝故云語也仙人恚嫌等皆以如此但南山等之意可造身語意業不可造也於身語中互可兼通也文二由下二句配三毒由貪嗔癡等者問犯何戒莫皆不由貪嗔癡何如此配屬之乎答犯禁戒事雖不離三毒方便究竟其別今此指究竟相也下釋方便相云此一重各容貪嗔癡為方便云云問三語由三得究竟者付今經釋成之若十不善業道門於語業開離間等四種時皆悉依三毒可究竟之乎答於語四種聊有不同語唯由嗔恚究竟也瑜伽六十等意也可見之問自讚毀他意地罪也何入三語中云語業哉答𢝰後四重雖云意地罪自讚毀他必假言故云三語也委至下可知也三下情非情委至長行可知也二長行三初配釋三業二初以制配業釋頌第一句也智論十三云者彼十三明五戒飲酒相文也今飲顯酤也云云私云前三者𭣦盜也第四六七者第四妄第六談第七讚也餘三語隨相為第六七者述云是述語家四業之中語𢙣口兩舌三業也於第六七兩戒有攝不攝義意云以𢙣言談四衆過自讚毀他者如次第六七戒墮也又離間之意作過讚毀二罪如應亦是也語一種必不相離故在彼戒中也次然有下明不攝相下文且出𦂶語相餘二業準之可知故略之也云云三然下揀非戒業此明不攝相也述云語未必餘三妄𢙣兩第六談七讚如染哥等也餘三語及六七其必語不相離故云云二此下配釋三毒二初𢝰摽已下釋頌第二第三句也此一重等者述云此釋第二句謂方便時雖通三毒究竟時各對也是以對法論第四曰𭣦生業道貪瞋癡為方便由瞋究竟如𭣦生𢙣語瞋恚業亦爾不與取業道貪嗔癡為方便由貪究竟如不與取欲邪貪欲業道亦爾虛誑語業道貪瞋癡為方便於三種中隨由一究竟如虛䛘語離間語雜穢語業道亦爾邪見業道貪嗔癡為方便由癡究竟文二盜下別配二初七戒單配此正釋第二句也𭣦瞋由瞋者述云問於𭣦生其意不同𭣦𭜨家等之時方便根本尤可起瞋恚其外何必可依瞋哉是以現見𠀍間江海下山野立機為活命行不律之輩未必起瞋恚剩得魚鳥之時歡喜之餘併𭇥笑聊不現嗔恚之相三時俱無忿恨加之瑜伽六十云復次如𠀍尊言𭣦有三種謂貪瞋癡之所生起乃至邪見亦復如是若為血肉𭣦生或為衣食奉主教命如是名一切貪所生𭣦生業道復次若謂彼於己樂為無義而行𭣦害如是一切名瞋所生業道復次若計為法而行𭣦害被因我𭣦身壞命終當生天上如是一切癡所生𭣦生業道文何况遣使令𭣦生等通善心何由瞋究竟哉答補忘抄云𭣦方便雖通三毒究竟必由嗔於他人加害心所嗔分位故云云如疑難一往江海下人雖無嗔恚實彼等可云起嗔恚也凡於有情不起悲愍害是則害心所行相也其害心所以嗔一分為躰而全離嗔恚更無別躰設雖不起根本嗔𭣦生之時必具害心故一切𭣦生悉依嗔煩惱可云究竟也唯識論第六云何為害於諸有情心無悲愍惱為性能障不害逼惱為業謂有害者逼惱他故此亦嗔恚一分為躰離嗔無別害相用故文次瑜伽論文準之可得意因起實雖依貪癡害心相即瞋一分也故云𭣦嗔由嗔無過也次如遣使𭣦者對法抄設二尺彼第六云此𭣦生何以瞋為究竟者遣使𭣦生此人或受八戒起善心等無間心云何由嗔究竟二義一云據自𭣦二云處分時已嗔恚業道究竟故非據無表故不相餘一切皆如是文補云問縱雖自𭣦以刀杖等加他後時或十日二十日其人死其時豈嗔恚生乎答今由嗔究竟者加刀杖無間死者定之後時死亦究竟通餘心例如遣使𭣦等也問燒埋懷色寧貪乎答是亦於常途盜釋之歟燒埋等貪義難立故也二餘下三戒通配二初通明三戒餘三者妄談讚三戒也由三者貪嗔癡也釋頌第三句也二於下別會讚毀由嫉讚毀等者述云問瑜伽論自讚毀他戒云為欲貪求利養恭敬自讚毀他是名第一他勝處法文自讚毀他尤依利養恭敬可犯見隨宗要中云雖有愛增不為利等而非重故文依之新羅法師釋讚毀戒究竟成犯之義然究竟要由貪心文何况以瞋恚自讚毀他正列瑜伽輕戒中是以勘人師勝莊解釋云若不貪利養及恭敬故自讚毀他是輕非重文若爾三語由三之主釋似乖本論如何答本論等文主下自會釋云是即多分以貪究竟若無所得但由嫉妬以瞋究竟此會釋意云瞋恚求利養義難有故由嗔恚上假立嫉妬可犯釋給也其故者唯識論嫉妬行相云詢自名利不耐他榮等文又對法論第一云嫉者耽著利養不耐他榮文既雖無所得存名利依之可犯此戒得意給也爾者不論文貪求利養義歟次宗要并本論義勝莊等是輕非重等解釋唯不𭘧嫉妬等利養義嗔煩惱之時自讚毀他可輕戒攝今嗔上假立嫉妬故自讚毀他尤可重戒爾者不諸文也云云問依嗔犯自讚毀他出何文乎答出勝万十大受也至彼戒輔行文集引之三下配情非情除嗔邪見餘情𨕙結犯云云尸未壞者行事抄云若覺睡眠若死未壞少壞但使入處如毛頭皆犯云云雖盜非情主𨕙結者問盜法物寧望非情非結犯乎答於法物犯盜望本主若護主結之法是非情故望法不結也云云但瑜伽六十云𭣦生邪行妄語間語語嗔恚此六業道有情處起不與而取貪欲業道資財處起𦂶語業道名身處起邪見業道諸行處起文私云準此論文盜戒非情𨕙犯見財處起云故但業門制門異故如此釋歟追可尋之三復下配自作教他等二初偈頌長行一釋之二長行二初正釋四初自造他境如文易知釋第一句二他造他境他向於他等文也釋第二教他句也三自於下自造自境三初惣摽釋第三句也二謂下別明五初自殺捨利他自死為罪者由業道瑜伽明云不成今由犯戒故出之也菩薩戒盡未來際戒故自害犯重聞戒形俱戒也斷命捨戒由之但犯方便蘭也問罪業成就之位命終何心得𭣦罪乎答第八識去最後一𭃯那位成罪業此時即命斷位猶是現在生得罪也第二𭃯那是已死位屬後生自造他境時彼令斷一𭃯那能𭣦人得罪以此為例可知之也二律下自四分律云爾時有比丘躰軟以男根內口中彼疑我將無犯波羅井耶佛言犯時有比丘字藍波那男根長持內大便道中彼疑我將不犯波羅井耶佛言犯文三善下自慳自慳成慳者設不作毀辱慳心起可犯此戒也非衆生不可謝即如嗔不受謝犯也首疏云慳望自他俱成慳心自不成由轉壞貪故文四於下自瞋於自發憤者嗔恨自身劣也法藏云又如有一不稱意事推𦚾自嗔等是也五謗下自謗謗理性等者謗自身所具理性也發憤與謗理二事也問勘下背正向邪戒謗別部大乘尚無毀第十戒豈依於自身謗無理性可犯第十戒哉是以法藏雖於自造自境出四罪未出邪見戒知不閞第十戒犯相歟爾者及邪見之解頗似無其謂如何答一義云所釋幽玄而雖難辨其旨且任下所釋分明於自身謗無理性不可犯第十重禁可云輕戒犯也謗一部大乘攝輕垢犯故一切衆生悉有佛性者大乘至極妙理也邪見種類雖多何別自身一人不具理性可謗哉若至此謗者可為輕垢犯也一義云自造自境五種戒皆列重禁犯者𭣦慳嗔四既是重禁也何此一句別為輕罪哉於自身謗無理性既為謗諸大乘經諸大乘經一切衆生皆有佛性然而還謗自身無佛性此謗即為謗大乘諸經彼一部一假文故輕垢罪也此義勝也云云三皆下𢝰結如文四他於下他造自境有餘無等者自造境之時不問樂不樂入如毛頭之位結重𭜨逼造境之時依樂不樂定犯設雖入如毛頭作蛇口火中等觀不愛著之時不犯故云順生愛染也但若作方便猶有貪愛準下無犯也云云二頗下問答有謂隨喜者問隨喜意業也何云自不作乎答有人云凡云意業犯三毒也今隨喜非三毒故云不作又云若見𭣦生隨喜即犯𭣦生故意業雖起隨喜自不作𭣦生業故故云不作也謂不作所應作者問此文意如何答準下第九戒釋文菩薩於有利益事不作之故成不利益犯問何無意業得犯戒成哉答且依無根本貪嗔癡云三業不動定可有懈怠心所等歟問可云重罪哉答準知可犯輕垢罪歟問何故來此哉答上雖約自作教他犯明犯相未明不依自作教他不依三業犯相故設此兩箇問答但為盡犯相因明業犯相此問答來也未必閞十重也二已辨下結前釋本文經非菩薩非佛種子者藏云非菩薩者失現行菩提心非種子者乖菩提心種子也又前失位後失行也文與今釋少異也二經一下示相勸持故二初釋示相示相者謂三𠀍不改相貌也智論毗尼皆為𠀍俗攝意者古義云為止俗人譏嫌制之不依重輕理為言而準彼論令攝衆僧意非指俗人意智論八十四云問曰若爾者毗尼中何以言殺化人不犯殺戒答曰毗尼中皆為𠀍間事攝衆僧故結戒不論實相何以故毗尼中有人有衆生遂假名而結戒為護佛法故不觀後𠀍罪多少文見此本文𠀍間勝義相對戒法立人及衆生遂𠀍假名依之云𠀍俗攝意者本文云攝衆僧故文少與古義相雖然次下文云制戒意為衆人譏嫌故為重文故今𠀍俗攝意者𠀍間勝義相望依𠀍間令止譏嫌制之為言不觀後𠀍罪多少者大抄記第六釋云謂但據現在過輕重結戒不約未來得苦樂輕重而立戒也如道人𭣦牛羊者大抄云望未來報其罪甚重而現譏過少故得提文讚歎女人者有點云讚歎寸留和女人則當僧殘語戒云云此義不爾語必不限讚歎故傳云讚歎寸留和女人可訓也則向女歎身戒也問資持釋智論文云歎女即語文若爾古點順文歟答言語者具通二戒處云二語故若爾指向女歎身云語亦無妨也法性常然者謂相稱法性戒性定為言未必法性真理於依他之法重輕定故性者躰也稱依他之法躰也是謂菩薩解脫相者師云於菩薩戒相有二種相貌以三𠀍不改為略相貌以十重六八為廣相貌也義云木刃相貌者不誦非菩薩即戒之相也三𠀍皆學即戒之貌也文如此釋我已略已下𢝰結上二門見今釋未必如是也問菩薩淨戒三際決定文云三𠀍菩薩已當今學文付之菩薩淨戒有三聚攝律儀者即七衆戒也瑜伽本地決擇兩文分明也若爾三聚俱可云法性常然之䡄則乎答三聚俱可云法性常然之䡄則也梵所十重六八之戒號三𠀍常恆之言法性常然之法併依今已當今學文若爾瑜伽所三聚戒慈氏菩薩相羕過去燈明佛於釋迦正法中宣彼受法羯磨云謂律儀戒乃至如是淨戒如是學處過去一切菩薩已未來一切菩薩當具現在一切菩薩今乃至現在一切菩薩今學文是則受隨俱三𠀍常恆見若爾攝律儀戒法爾常恆之更不可及異論者也問付之尚難思菩薩攝律儀者律藏所制五篇七聚戒也此外別無有一物攝律儀然龍樹智論釋毗尼皆為𠀍俗攝意不論實相文𣵀槃中云佛知時冝輕重不定云云何五篇七聚戒相法爾常恆之佛道同之法乎若𭤽言三𠀍不改所立頗鉾楯者歟答此難恐依不明三聚相貌所來疑難歟凡五篇七聚重輕階級三𠀍一同不可改轉二百五十性戒相大途多分同制立此依之若大乘為本直三聚攝律儀戒不待緣起六聚階級不律藏成道最初第二七日方之雖然今日出化之面聞為本戒悉待緣起輕重俱譏嫌為本釋迦法中無別菩薩僧者此謂也依之或云隨冝亦云不論實相併緣起為本機嫌為前故也雖然不越菩薩三聚限𫭫都不法爾常恆律儀是故云攝律儀戒七衆戒故也如多論衆學著三衣戒如來觀三𠀍佛豈非三𠀍道同之儀乎依之指五篇七聚云法爾常恆之亦云隨冝不定法何無所矣問二百五十戒悉佛道同所乎答五篇七聚佛道同如上具述於枝條戒可有少不同歟如當成佛時制食肉為犯重今教主律藏遂不制之如是少不同亦不可之但五篇七聚大途多分可佛道同也如是甚深微細義門可祕二欲下釋𭄿持無為空死等者遺教論釋云七者於晚時自知有餘悔不及事故如經後致有悔故文住法記云晚時自知者或約𮕱老或取將終有餘悔者言其甚也老則力𮕱死則時促雖悔無濟故云不及事也文初快意殺生戒二初牒文摽分快意者智論十三云快心𭣦生得𭣦罪非狂癡文義云快意𭣦生者於內無迷謬於外無逼切以了心行𭣦生也文文集注云而反更自恣心快意𭣦生以摽戒名以下諸戒摽名準之文𭣦生者義云報形相續假名為生緣逼害名之為𭣦文法藏云息風名生依身心轉隔斷不續名為𭣦生戒者能治行從所治為名云𭣦生戒文二初下隨科解釋二初制意二初明極重意如智論云者彼論十云復以𭣦為罪中之重何以故人有死急不惜重寶但以活命為先一切寶中人命第一人為命故求財不為財故求命以是故佛十不善道中𭣦最在初五戒中亦最在初文便失其性者謂慈悲作𭣦生等即失慈性善戒經第一云云何為性性有二種一者本性二者客性言本性者隂界六入次第相續無始無終法性自爾是名本性言客性者謂所修集一切善法得菩薩性是名客性文八云今文言失性者即失客性也云云師云此義可爾本性者法爾無漏種子本性住種姓也客性者習所成種姓就習所成種姓有二種一者無漏依聞等薰習所被資閏法爾無漏四智種子也二者有漏正有漏心所薰習聞等種子也今所失性者當有漏習所成種姓歟云云二如瑜下明為初意大悲為躰者幽𮚌云菩薩由悲建立故於生死堪忍衆苦文崆洞記云由大悲故具攝六度故菩薩由悲建立文由此最初制者科文意者以瑜伽文為由歟或義指上二科云由此云戒最初所由在上二科故也則法藏以二意釋最初由當今二科也云云藏可見述迹抄也問菩薩戒成道最初制之云云聞戒盜等四重於何時制之乎答抄批七末云如僧中成道後第五年中十月二十七日制於戒第六年九月十日制盜戒亦以其九月二十四日制𭣦戒亦以其年十月三日制大妄語戒文二釋文二初牒章科分如文經若佛子者明曠云初言若佛子者通指之辭謂發菩提心受菩薩戒從佛法生通名佛子文云就文有三一摽人即佛子也未受菩薩戒非此所明故如聞戒若比丘例文定賔上云若比丘者善受得戒名為比丘或容犯此戒故復言若也文藏云問未知菩薩至何位得佛子名答諸聖教有多種一約絶㓛用㓛用不行同佛作用名為佛子如楞伽經八地菩薩名最勝子二約證得佛法分名為佛子如佛性論初地名佛子三約不退佛法名為佛子如瓔珞等經十住即名佛子四約入大乘發菩提心受菩薩淨戒即名佛子如此經五約入佛法縱入小乘亦名佛子如四分律序中今此通前四以諸位同持此戒故或亦通五以攝小令回故文二初下隨文解釋四初違犯相門經自𭣦者明曠云自𭣦在二一𭣦自身二𭣦他身𭣦自身有三義一𢙣心自𭣦二猒身自𭣦並聖教俱結輕垢故經云身無常不猒離於身也三為生為道忘身濟物如薩埵王子等是故下文今捨身命則得福無犯二自𭣦他具緣犯戒文教人𭣦者法藏云教他有二義一教他令自死二教他令𭣦生問自𭣦或教他所𭣦未亡自身先死後所𭣦亡未知得重以不答依小乘不犯夷以彼未命終未成罪故命終已後戒已失故菩薩戒既經生不失故還得夷文準之得罪在後生方便𭣦者云方便𭣦者如倚與藥等文讚嘆𭣦者同云由我讚嘆前人死也藏云讚嘆𭣦者此亦有二一嘆能𭣦之人有勝德二嘆所用𭣦法有㓛能文見作隨喜者云由我隨喜前人死也文元曉云見作隨喜者見𭣦人者隨喜故彼人見我喜故造𭣦業能隨喜人犯重乃至若既死以後喜者大乘中犯輕垢罪若小乘者吉文乃至咒𭣦者云謂毗𨹔羅等咒由讀此咒前人被死𭣦事多種略餘取此故云乃至文二違犯性門二初摽章牒文問何故此門號犯性乎答具因緣法業四種正成犯故犯戒只依此五支是故成犯戒能成性也二謂下隨文解釋三初正陳自義謂具五支等者凡今經文與所牒有少別御所覽不同也問五支相貌云何答論藏明業道成就相則出五支今以經因緣法業四配釋之也瑜伽第八對法第四所事意樂方便煩惱究竟列之瑜伽五十九所事想欲樂煩惱方便究竟也文集對法論第四曰又殺生等應以五門分別其相謂事故未論第七曰謂有情數非有情數如其所應依此處所起𭣦生等意樂故謂於此事起此想意樂及起當作此業道意樂方便故加行者謂此作用或自或他發身語意煩惱故謂貪瞋癡如其所應或𢝰或別究竟故由彼彼加行如是如是業圎滿或於爾時或於後時於此義中殺生事者謂有情數意樂者謂此想及必害意加行者謂為害故加刀杖等煩惱者謂貪等究竟者謂彼衆生由加行故或無間死或後時死已上對法瑜伽第八同之五十九文如文集問今立不依瑜伽五十九依第八及對法配釋其意云何答師云諒有深意今經一切有命者不得故𭣦文對人境雖作非畜想𭣦尚可成犯重見依之主破有義述雖想顛倒而犯重故支業道門不爾想顛倒等不成圎滿業道業道取暢滿故想顛倒非暢滿也故業道犯重寬狹大別然本論第八對法所順犯戒相是故以因緣法業四依事意樂方便煩惱究竟立釋之五十九相不順制戒相依之不由五十九相也問今經制戒犯貌都不明五支具足業道成就相何由主配釋乎答菩薩戒專依因果感赴道理制之是故犯戒之相與圎滿業道五支具足相大相似故以彼五支釋顯今經犯重之義也要云於五支有二種一業道五支五十九所是也二制戒五支第八及對法所是也由此今由犯戒五支不配當業道五支也云云此義不足言也先犯戒業道二種五支何文出來哉自安立名目不足依用是一又五十九卷第八卷決擇分則決擇第八卷五支不了若五十九別立業道五支方非決擇分大論始終是二亦溜洌大師業道章中二論相對會開合不同若實各別不及會釋是三故知分制業五支頗諸文者也不可信用云云述問五支中事與境界事門事不同如何答境界事廣攝一切有心者云事今對一境且云事此𢝰別不同歟云云二依下因舉他義二初依上立義依此有者依科文意上科但依對法等配屬五支故指上五支云依此也問今有者指誰人乎述答此有者且指義師等歟云云引之可見也二如下引論文證二初引文二初舉先見思述如瑜伽等者此瑜伽意云瑜伽論利益時以善心或無記心雖𭣦生無犯此則煩惱欲樂二支闕故不犯重故知不成業道無所犯也為言二如下明犯不犯二初牒如思作或以善心或無記心者問為利生方便行𭣦生須善心何云或無記心乎答倫記云測云此中殺生據大地菩薩若八地已去於一切時恆入觀故唯有善心殺生七地已下有出入觀位故得有無記心𭣦非地前文笠置上人傳云行利益𭣦生時雖至極善心行𭣦生之間時節長故善無記心雜起也非云單以無記心行利益𭣦生也二由此下正定不犯如文二此下正證私云善心無記𭣦生煩惱欲樂闕故不成業道又無犯戒也為言三今下還成自義三初反古立義今解不然等者意云不具足五支故雖不成業道經一切有命者不得故𭣦故可成犯戒想顛倒不成業道犯重戒故二况下引上位隨分戒等者此不成業道犯戒證文也問付今文不明凡今經相十重六八戒不通地上深位所行若言不通者此義不爾今經五位通信經十地菩薩乃至妙覺究竟如來猶半月誦之何但凡位乎依此言通者今釋文云隨位制別文隨上卷科下卷戒相云傳初發心外門戒云云亦經文言為此地上凡夫癡暗之人文兩方俱不明云何答凡今十重六八戒相因果俱依學凡聖同修證更不及異論其證如一方所舉但今釋文此經所戒相俱通地上取通且屬初地上更持稱之為深位戒實十重六八俱通凡聖然今經面凡夫為本制之是故或云為此地上凡夫癡暗之人亦云初發心外門戒不同文殊問經𠀍間出𠀍兩戒各別之也三於下會有證補瑜伽四十一曰又一切處無犯者謂若彼心增上狂亂若重苦受之所逼切若未曾受淨戒律儀當知一切皆無犯文師云增上狂亂者則上品狂也蕳中下云增上也傳亦應等者云通緣五者一已受菩薩淨戒二住自性非狂亂等三非重苦所逼反此無犯故菩薩地云乃至如輔行文集義加二人一有憶念謂轉生時若憶先受隨作成犯若不憶念雖作無犯二無利生緣若有利生處許行𭣦等故前三及二為通緣五文問義加二緣亦本論中見何云傳乎答本論始終雖其義見四十一卷一切處無犯不此依此今及義云傳義加也云云述云於諸犯處等者開不犯文遠證今義意也見諸戒不犯但是五人未有餘開故知雖想顛倒何不犯重哉若是不犯者何出不犯處不出之哉為言三境界事門二初摽章牒文如文二聲下隨文解釋二初大小相對釋四初對小釋文補云乃至一切有命者古判舉輕重今謂結犯分齊也文天台義記下云乃至一切有命下第三舉輕重文則義記并明曠與咸等皆同如諸律但取斷人命舉輕况重云一切有命云云義法藏并今師俱不蕳趣生悉得重罪經云一切有命故不同聞但取𭣦人為重仍釋所由故云彼隨事重等也如𭣦生盜妄二重明曠等舉輕况重云云皆與今異云云私云此下補忘抄律儀結犯委細分別并於菩薩戒分廣略二門事色問答有之可見之恐繁不引之彼隨事重者事即境界也五支中境界名事故也約理制者理即道理也如所引𣵀槃經也二如下文證大證大乘約理制重義也聞隨𠀍俗事制戒故人犯重菩薩約法道理制戒故六趣四生俱重道理者如文云寶命重死二俱無異是也云云心爾初加津手是相羕樣也心爾初師免與利北亰等文點三若下因釋疑難以加師手彼之苦緣於足𠀍師無留於故云云御點如是意云前生境加刀杖等苦緣具足苦緣為言有點云以加師手彼苦緣具足對留於故云云則能𭣦人具足五支故云緣具足也四違下明制業別補教之罪輕重雖同等者一義云輕重者謂輕重諸戒也謂殺生戒不蕳心境一切有命皆同罪不敬師長戒不問心境一切不敬有德同輕垢雖有心境不同制罪均等重輕諸戒俱同依此云輕重雖同等也心有猛不猛別境亦父母𪵬人異依之業報不同故云隨心境等也云云此義今教之罪等文必不今戒寬解釋諸戒也一義云但付此戒可料蕳文謂今重戒不蕳境輕重皆制夷罪人趣與餘類父母與𪵬人同重罪制故雖然非無業門輕重為言二問下問答陳經意補自品煩惱等者三毒各三品品各對云自品也上品三毒俱等中下亦等為言麁細雖等者上品三毒皆下品三毒俱細故云雖等所有異者出離門貪欲尤重大悲門嗔恚為重正理門愚癡為重無明迷正理發無邪見殊背正理故經約相通者一義云彼經𭣦父母為癡𭣦生𠀍間通相此為重罪由之經癡𭣦生為重也故云約相通一義云三毒中癡煩惱相通餘煩惱是故偏為重唯識論云諸煩惱生必由癡故文二義中後義勝也云云四結成罪門二初標牒示意對正行者自是菩薩至方便救護明菩薩正行也而反更下反上正行行𭣦生故云結罪也二常下隨文解釋二初陳正行補常住慈悲心等者法藏云常住有二義一起此慈等恆在心中無暫時忘故云常住二制令起順真理之慈故云常住前自相續後順凝然文師云戒云慈悲心孝順心下緣衆生發苦與樂心云慈悲心也孝順心者三義門一上緣諸佛菩薩慚愧心今釋此也二一切衆生衆生父母故衆生上不作𢙣非即成孝順法藏云由具持菩薩淨戒當得道力救護一切諸衆生故於過現父母亦為孝順文三真如法性靜湛然離諸過非是故十重六八戒本性一味妙戒平等理性德用持一戒如性一致勤修顯法身理如來所證法身離妄發善二種德用且開重輕二聚與菩薩上乘頓機依此持此戒順法性真理依之云孝順至道之法亦皆入佛性戒中雖不假斷惑理證持一戒時直顯真理當知約性凝然本性妙戒不生不滅法約相念倍增勝法三身能成妙因依此元照律師釋戒相云一開淨戒躰用高深即是如來無漏果德故云見也云云如是甚深徵密義門愚意永絶聞者歟云云有情法爾等者唯識論第十云諸有情類無始時來種姓法爾更相繫屬或多屬一或一屬多故所化生有共不共文心地觀經三云或一菩薩多佛化或多菩薩一佛化文述抄云凡今文意云菩薩發慈悲愍一切衆生自早可成佛而反𭣦衆生墮地獄等此時繫屬我衆生同墮𢙣趣故若愍一切自成佛繫屬衆生可成佛為言問縱雖屬我類彼不作善𢙣業何依我業彼可沇乎若彼雖無業依我業沇無他作自受之理是正性相所判也何此道理乎答私云屬我故我修善時彼修善我作𢙣時彼作𢙣故法爾繫屬故俱作善𢙣業同沇也云云問屬一佛者自初發心之時至成等正覺繫屬一佛之類可有之乎答此事先德傳分二然且可存申有此類也問付之不明菩薩行願是廣大故寬曆事諸佛普修學大乘何從初發心至終繫屬一佛成正覺哉是以瑜伽論中述若諸菩薩以無數量上妙供具供養無量無𨕙三寶一切菩薩皆供養無量佛願𣵀槃經中菩薩四依間供養二十六恆沙佛文如何答菩薩種姓法爾繫屬使然可有不共類也但至供養二十六恆沙諸佛之難無始法爾繫屬偏約自受用身論之今此報佛現二十六恆沙身土供養一佛所現諸佛有曆事諸佛義如繫屬多佛菩薩猶於一佛所現二十六恆沙數中供養例是可爾故不相也且如繫屬釋迦菩薩能化釋迦或現安養淨𭃯㫆𨹔身土令所化菩薩謂生西方曆事㫆𨹔十方淨土悉以爾也故佛地論云一佛盡未來際常住𠀍間教化無量諸有情類而隨所冝現種化或現等覺或現𣵀槃或名釋迦或名慈氏等文故知一諸佛併隨所化機冝或現慈氏或示釋迦不各別佛也云云猶有問答略之補志抄云當宗云法爾繫屬花嚴宗云但約結緣不必法爾云云凡付法爾繫屬異論往一義云且依聞小乘機云種姓繫屬如智勝如來昔預教化諸大聞今亦被攝得菩提記菩薩大乘機不爾奉仕多佛證菩提故無法爾繫屬云云一義云大乘機根地前有法爾繫屬地上不如是云云上緣勝品者緣佛菩薩所行也云云二菩下變結罪三初正明反結如是二心者慈悲心孝順心也二律下對小律簡非人想者聞唯制人非人非所制設雖有人想境闕故非重菩薩制一切有命故設雖非畜所制境故犯重也三波下梵釋名三初梵音善自𢙣他等者利涉云善法養已名自𢙣法己名他十戒不犯善勝𢙣劣名自勝處隨犯一重𢙣勝善劣名他勝處文持犯所依者資持云持謂犱持犯則侵犯並從本受而建此名文二此下結略意二初正釋此戒此文略意等者以前廣以四門釋成戒門今此文取大意一行結之彼相別犯中者即犯相門也以五緣犯者即犯性門五緣者即五支也經名因緣法業對法名五門瑜伽號五相今名五支亦名五緣俱同躰異名也正得罪者即結成罪門也問何故略境界事門乎答一義云略無也亦云犯性門中攝境界事門五支中第一事者即境界故云云後義尚勝也凡此科𢝰通四門雖然依鄰近科文且屬結成罪門也二餘下指諸戒文如文三此下配六釋依主為名者諸師立戒名不同或名不𭣦生戒此不𭣦生即戒也持業釋也𭣦生戒者𭣦生之戒依主釋也今師號快意𭣦生戒即快意𭣦生之戒釋依主釋也法𮏑林章第一云依主釋者亦名依士依謂能依主謂法躰依他主法以立自名云依主釋文已上𭣦生戒畢二劫盜人物戒二初摽章牒文義云盜猶不與取之名也竊取名偷顯奪名劫盜通二也文新譯云不與取則𭇥多義也問盜非畜物猶犯夷罪何故戒名但舉人物乎答多分依結成罪門方付戒名經終云而反更盜人財物故也二述下隨文解釋二初制意二初陳制意攝六度等者付此有多義如文集瑜伽七十八攝論第九則依發後道理云攝六度也依持淨前道理惠等亦攝六度具如宗要波羅蜜多攝門云云問發後義如何答由行布生持戒行財者豈盜他財物行無畏者寧𭣦他人是故依生戒依持戒制伏業非忍辱行自生行忍辱精進自生勤行精進禪定現前由證得定無分別現前是則發後義也問持淨前義云何答行時若盜他物人非波羅蜜若持不盜戒布自成波羅蜜持不𭣦戒無畏自𬾨亦行忍辱戒波羅蜜清淨三業忍不作𢙣故如是精進淨持忍辱勇猛忍辱自成自心澄淨精進㫆增般若妙智生則前五波羅蜜悉清淨是則持淨前義也云云又有義云以三種配屬六度金剛般若𮚌述云檀度攝六謂有三一財此有二謂內財外財二無畏謂離苦得樂不令怖畏故三法謂隨機應病為法於中財攝一謂檀度無畏攝二謂忍戒於已作𢙣未作𢙣令不生怖畏故法攝三謂進定惠正法時不起疲惱故觀心知機明簡擇故文二利俱喪者述自他二利即指上句法藏云五失所化故謂偷盜之人一切衆生眼不喜見受其化六懷信心故謂作此極𢙣令諸衆生應信不信已信者皆懷文犯戒自利闕依之不利生利他缺也如應障道等者謂此盜重罪如重障道為言法藏云謂非理偷劫障道太深負此重𠍴豈堪入道文述一義云上正懷壇二利俱喪𠀍間醜謂盜二如應配當也謂障道當正懷壇等依懷六度行不得道故招苦配𠀍間謂依盜業現得醜後招𢙣道故也二故下摽次第如文二釋文二初摽分如文二初下正釋四初違犯相門經方便盜者藏云或因市易或餘種但使方便侵他財物乃至名方便盜也文則市小斗賣物大𫝣誑他物類也云云咒盜者云誦咒令物自來也文歎隨喜略而不論者謂十重中盜已下諸戒無歎隨喜言依之諸師解釋非一準云無喜者不由喜成自業故文藏云嘆隨喜但非正盜故在方便中文此二師意今此盜戒喜二種不犯本罪見今師并撲揚法銑與咸處行皆同略無云云處行注云德云喜者不由喜成自業故愚謂德解前喜𭣦云由我隨喜前人死也而釋此戒言不由喜成自業者豈不自矛揗也若有欲令喜𭣦豈無欲令喜偷此若不成彼亦應爾藏公云美隨喜但非正盜故在方便中攝也愚謂此亦不然既言喜𭣦豈正𭣦緣喜偷非正偷以理相例並可同然文二其下違犯性門二初指𠀍俗門因緣法業具足五支準前戒可知也一事他所攝物通六趣也二意樂盜心也三煩惱方便時三毒究竟之時貪四方便起盜取方便也五究竟離處犯重也二此下明出𠀍門如文三境界事門二初摽章配文如文二此下隨文解釋四初釋乃至言此中攝重等者一義云乃至言攝五錢已上故云攝重也傳云有主物有五種舉最下鬼神物略重三寶物等故乃至言攝重境為言藏云始從人天下至非人故云乃至鬼神也文道璿法銑大與藏同二然下釋有主言二初𢝰列有主如文二僧下正釋二主二初明三寶物二初通明三寶物二初屬物二初明互用犯重三初釋互盜二初互犯重三初僧律僧律第三曰若比丘作摩摩帝無物衆僧有物便作是念天人所以供養衆僧者皆蒙佛恩供養佛者便為供養衆僧即持僧物修治者此摩摩帝得波羅夷文二寶𭩮經佛法物無有主者問有主物出三寶物何云無有主乎答於佛者在𠀍雖名有主滅後佛物并法物望當躰無主故云爾也上於三寶物望護主云也問盜無護主佛物之時可犯夷罪乎答若有盜心者可名波羅夷也又無護主法物準之可知也常住招提者凡於僧物有四種一常住戒云堂𡧃人畜米麵等文抄枇云限常此處故曰常住即此當所亦不得分復曰常住也文二十方常住如僧家供僧常食躰通十方十方唯本處常住三現前抄批云謂主唯此處現前安居之人資持云人現數物據即分故云雙也四十方現前抄云如亡五衆輕物也云以此物通擬十方有僧皆得故文問招提僧物者指何物乎答雖有異義且一義意十方常住物也抄批云七衆造立房舍用衆僧通於三𠀍於四事供養不絶擬十方僧經遊來往名招提也文補云招提者則別坊也惠𮏑釋云招提譯云四方招此云四提此云方文三若依下會經律如文二互下盜用如文二若爾下釋疑難二初舉難𣵀槃經第七云此大乘中若有比丘犯偷蘭不應親近何等名為大乘經中偷蘭罪若有長者造立佛寺以諸花用供養佛有比丘見花貫中縷不問輒取名偷蘭若知不知亦如是犯若以貪心破壞佛犯偷蘭文以佛已下今師釋也知不知犯偷蘭者一義云抄批云言若知不知犯偷蘭者應云比丘盜此縷知得罪亦犯不知得罪亦犯云云此約罪論知不知歟一義此檀越供養物以屬佛不同知是有主縷及不知是有主縷但望佛𨕙結蘭由屬佛故云云此義約主也如是雖有異義且依資持釋約知法不知法彼中一下云知即識法故不知謂愚教迷犯文此義勝歟二漢下釋難二初縱答如文二然下奪答述問𣵀槃經全不見小乘戒大乘經中偷蘭故爾者何云小乘乎答彼經雖大乘假小乘名云偷蘭故云小乘戒然而假小乘戒名大經中是以云大乘經中偷蘭歟可勘之或又勘彼全文具云此大乘中若有比丘犯偷蘭不應親近何等名為等如上引此文意此大乘衆中小乘比丘犯偷蘭不共見踏之云何等大乘中出小乘偷蘭也爾者云小乘戒無過歟云云三凡三下定護主述云大集云等者凡於大集經有兩處文法藏并補行文集大集第三十二文𢝰四果分二人初二三果為一人第四果為一人故是以彼三十二文云有二種人堪持僧事守護僧物何以為二一者具八解脫阿羅漢人二者須𨹔洹等三果學人此二種堪知僧事供養衆僧諸餘比丘或不具足心不平等不令是人為知僧事文今及事鈔同二十八文無二三兩果故彼經二十八云僧物難掌我今𥊸二人掌護一者阿羅漢比丘具八解脫二者須𨹔洹人大王除是二人無有能掌護僧物文彼事鈔中一二十八文故二三兩果不見依之諸記設會釋資持云文舉初後二三兩果何以不明或可知故或約二惑盡處故文大抄記云舉初後二人取中二人故也文又有二人者文集寶積經百十三曰佛告迦我𥊸二種比丘得營衆事何等二一者能淨持戒二者畏於後𠀍喻如金剛復有二種何等二一者識知業報二者有諸慙愧及以悔心等文二然下互用不犯二初明用淨物二初文瑜伽三十九曰云何菩薩方便不謂諸菩薩不忍言遣來求者謂我不能惠於汝要當設方便善巧曉喻發遣云何設方便善巧謂諸菩薩先於所畜一切資具一切物為作淨故以淨意樂捨與十方諸佛菩薩譬如苾於己衣物為作淨故捨與親教䡄範師等如是菩薩淨因緣雖復𧵤畜種上妙一切資具一切物猶得名為安住聖種生無量福等文菩薩御注云私曰彼論正文既方便不乃至譬如苾於己物等假淨物非實佛物然今疏意以彼文為證成亦用佛物義其深意難詳文御注意則今文準瑜伽方便不方立義其理不相應云云信願上人云但通受人依今文可行淨不用制教淨通別兼受人通用二法云云傳云律儀作法止作二持俱依律藏瑜伽攝律儀讓律藏故就中今淨作法以衣奉佛等殊假相見不足依用也云云二由下述意和上云者相傳云西明弟子道證師弟子太賢也故指道證師云和上也云云文意顯也二但下小律準證三初舉互犯意雖佛即法者約本一躰理躰三寶云雖佛即法歟化相住持其相各別故二然四下互不犯四分出五十二五分出二十二僧出第三十誦出三十四如文集三小下正結準證如文二問十下即體二初問述云若盜賣者犯罪者此文文非十誦文歟彼云若盜佛像為供養故無罪若為得錢轉賣得錢蘭文準之如此釋歟二答二初縱答法對方生解者問暗誦經可無犯乎答資持記云縱能暗誦亦容忘故文二然下奪答如文二問下明三寶差別二初問方等經四重五逆我亦能救者藏云又方等經花樹菩薩云五逆四重我亦能救盜僧物者我所不救文花樹菩薩自我稱見非如來自稱歟尼鈔中云花嚴樹菩薩法藏嚴字脫歟二答二初會大集方等破僧暫時者必一日中和合故云云二非下會瑜伽俱舍非親障道者提婆破僧時一千𠀍界法輪不轉故盜僧物不障聖果故云非親障道也八云不障布薩等事故云非親障道云云大背文意不足言之云云二言下劫賊物二初舉律不許奪述云劫賊物者云本雖是我物若劫奪而取即成賊者物也物無定屬隨取成主故云云法藏云四句一自未作捨心賊得想未成奪取不犯重如五分爭衣比丘是也二自心未捨賊已作得想奪亦成重以賊作得想物已屬賊賊業成竟奪則自成賊故律云賊物故如引律是也三自心已捨賊未得想取亦成重以本想故謂已作捨心物非己有豈容得取戒云可奪以像不具故事鈔云還出不犯者為賊得重四己已捨賊已得成重無疑文二菩下明利益奪二初論文述云菩薩不然者問五分本取衣物不犯何云菩薩不然菩薩取還出不犯𪮲哉答小乘律不許奪五分許奪二文畢云菩薩不然先瑜伽奪賊物出無過𪮲次以義爭得衣慈出犯罪㨾也瑜伽對蕳初律次義對蕳上五分也云云宰官者今官人也又官武官也補云勿令受用長夜苦者問盜舉離成犯若爾受用時犯何等罪勸令逼奪乎答盜業諒舉離成其業如受用佛物後時用之盜罪上亦可有破佛躰失故逼奪大有其益亦後時用之隨喜心生若爾三時俱重定業然奪取之後起心方可有悔心故亦奪有益為言二如下會五分述由慳財罪者問重戒慳生毀辱犯歟如何答今雖不分明可慳生重罪歟既云慳財罪故然法藏云若大乘戒應犯輕垢以順慳貪悲惠故今不同歟三如下定犯不犯二初定犯如文二若於下不犯二初明有主無主三初全不犯如文二若於下犯方便如文三若於下反成犯如文二云何下問決無主物二初正問決善見論云乃至後父母死者資持云此土父母死屬官云云則不可取也二國中間者蕳正云五天之外二國分壃中間有隔或河或山乃至其處有物不屬兩𨕙是名無主文如此釋如唐土以新羅百齊可分歟云云二若下轉問決不爾國王擬彼養故者問如是佛擬養一切衆生何盜佛物令犯重乎答凡佛意擬利一切衆生雖然主意或望守護人犯重歟四聲下對小釋文如文四言菩下結成罪門二初明正行述云孝順慈悲名為佛性者意云佛性之孝順心依主釋為欲證佛性𣵀槃上緣勝果生慚愧不住生死也佛性之慈悲心依主釋為度脫佛性具足衆生下緣群品起慈心不住𣵀槃也云云補云即佛性言通孝順慈悲也則行佛性故云異二乘也云云述云經常助一切人生福生樂者法藏云常助者明長時無間也一切人者明度攝無餘生福者令種樂因也生樂者令得樂果也此二通𠀍出𠀍大小二乘可知文二而下明結罪二初釋文如文二如下證智論十三曰問曰不盜有何等利答曰人命有二種一者內二者外若奪財物是為奪外命何以故命依飲食衣被等故活若劫若奪是名奪外命如偈如文已上盜戒畢三無慈行欲戒二初牒文述云此戒名有多別或不淨行或非梵行或戒或無慈行欲戒是也法藏云第二釋名者染情逸蕩耽滯專固故謂之約俗書此字有二水𨕙者是為過咎也女𨕙者是為邪私也文問今此戒名無慈行欲者有慈可行乎答一義云在家菩薩於無屬女有利彼慈心許無慈不許之故云無慈行欲云云此義屬在家菩薩不通出家故不盡理也一義云行即云無慈菩薩不共行以大慈為本大慈者度衆生令出離然欲縛有情令處生死菩薩以此欲與衆生此則殊乖菩薩行是無慈行相也即今師下釋淨法與人經文云菩薩應以離欲法門與衆生度生死苦則此意也不淨行等自餘三名但望自利行未必利他故小乘以餘三名為題名不立無慈名可知無慈行名唯屬菩薩自餘三名通三乘故蕳通名摽別名也凡依經無慈悲心文題此戒名如以前戒名等也二解釋二初制意三初𢝰解二初述難出離過二初立義為枷鎖者此從喻為名也繫縛罪人為不令去以枷在項以鎖在項腰也欲亦如是繫縛衆生在生死海永不令去也玄𮚌第十云木在項名枷鐵在項腰名鎖文二如下證蕳正記云欲之法如𭣦生偷盜不惱衆生相共和作心繫縛者能所繫縛心也立為大罪者問聞求現𣵀槃故立為大罪菩薩不求現在𣵀槃往返生死具資糧何制此戒為重乎答此難不爾聞為自禁之為重菩薩為他制之為重非不猒生死是以地持論云聞深樂𣵀槃畏猒煩惱百千万倍不及菩薩深樂𣵀槃畏猒煩惱謂諸聞但為自利菩薩不爾普為衆生文二瑜下述欲為最過餘自然伏者問指嗔等煩惱歟答不爾上既云諸愛之中故同於貪煩惱中指財欲等云餘也意云貪財食色三也俱雖貪愛色欲之貪尤重也若色欲貪斷者財食之貪自所伏也今必非對貪等三毒歟云云二然此下別釋二初標列如文二初下解釋三初苦而似樂故三初略頌二初二句法不忍煩惱病者入道章云煩者擾也惱者亂也擾亂有情不令出離故名煩惱文結三頌皆取諸經意主私結之也云云二猶下二句喻如抓者智論三十一曰復次如人患疥搔雖小樂後轉傷身則為大苦愚人謂之為樂智者但見其苦如是𠀍間樂顛倒病故著五欲樂煩惱轉多以是故行者不見樂但見苦如病如癰如瘡如刺未離欲人以為樂離欲人以為苦文二釋頌二初正釋略頌二初舉喻如文二欲下合法如文二然下因述虛偽二初標示如文二如下論二初舉經文瑜伽論中欲貪出八種喻欲如枯骨者初樹端爛果者終也乃至言攝六種也如齒骨故令無飽期者還釋第一欲如拈骨句也二如齒下論釋如齒骨者正法念處經五云譬如狗咬離肉之骨涎汁和合望得其髓如是貪狗齒間血出得其味已謂是骨汁不知自血有如是味以貪味故不覺次第自食其舌愚癡凡夫亦復如是虛妄分別眼識見色貪著喜樂思量分別以色枯骨著眼口中境界如齒如是咬之染意如涎愛血流出貪愛血味謂色為美於色得美猶如彼狗等云云開宗記云欲無實味猶如拈骨文無定屬主者既死肉成假者多有情食無屬一人有情是以十住毗婆娑五云妻有三相非我相無定屬相假借相文開宗記欲集衆患其如假肉文如草炬者如草火燒物欲火燒人法身也是以法勵云欲草炬燒人法身手文如火坑故者如大火坑無水潤極渴欲無善潤唯增渴愛也又理趣分云謂貪欲由渴愛生故名渴愛謂如鹿渴遙見湯熖將以為水而起貪求奔走往趣有情亦爾由煩惱見不淨物謂以為淨廣起貪求故名渴愛文如蠎毒者惠𮏑云爾雅蠎王蛇也蛇之最大者故曰王文法花第二云更受蠎身其形長大五百由旬聾騃無足轉腹行文欲如蠎毒諸賢聖衆悉遠離之也云云如夢見者智論云欲無實如夢所見文如借嚴具者礪云欲樂不久尚如假借文智論云五欲不久亦如假借須文如𤎼果者瑜伽抄云人天之身名所依地由欲失財故危也文三如下惣結如文二云何下少味多災故初徵如文二頌下釋二初略頌二初二句喻猶如羅剎女者譯梵下云羅剎具云羅剎娑乃至若女則名羅刃私乃至乃𢙣鬼之通名此云可畏又暴𢙣又食人鬼文文集𣵀槃經十二云善男子云何如羅剎女婦善男子譬如有人得羅𭃯女納以為婦是羅𭃯女隨所生女生已便食食子既盡復食其夫善男子愛羅𭃯女亦復如是隨諸衆生善根子隨生隨食善男子既盡復食衆生令墮地獄畜生餓鬼唯除菩薩是名如羅剎女婦文二誑下二句法如文二釋頌二初釋喻如文二五下釋法三初正述多災如文二如下證多災二初經證二初文無苦不受者六波羅蜜經云一百三十六地獄皆依財色欲墮也文二愛下述意如蛾投火者心地觀經第六云譬如死蛾見火光以火故而竸入不知熖炷燒燃力委命火中其自焚𠀍間凡夫亦如是文十住心論云貪色飛蛾拂熖滅身耽酒猩瓫𨕙被捕文二五下古蹤二初正五百登空者智論十九云如五百仙人飛行時聞甄𨹔羅女歌聲心著狂醉皆失神足一時墮地文一𭺸仙人者智論十九云形類如人唯頭有一角其足似鹿一時上山值大雨泥滑其足不便躃地又傷其足便大瞋恚以軍持盛水咒令不雨仙人福德諸龍鬼神皆為不雨不雨故五穀五果盡皆不生人民窮乏十二年王思惟言若十二年不雨我國了矣無復人民婆羅奈國有女名曰扇𨹔已下取意此女與五百美女俱往彼山以美酒歡喜𭂫共仙人乃至手軟觸之便心動欲心轉增遂成事即失神通天雨大下七日七夜令得歡喜飲食云云委細如文集也二是下轉證二初律文集僧律并四分律等引之二又下論智論龍樹也彼論十四云巧察人意女人之智大火燒人是猶可近清風無形是亦可捉蚖蛇𭇥毒猶亦可觸女人之心不可得實何以故女人之相不觀富貴端正名聞智德姓攴藝辨言親厚愛重都不在心唯欲是視譬如蛟龍不擇好醜唯欲殺人又復人不瞻視憂苦憔悴文三終下誡告𢝰結無猒期者寶積經七十六云欲未曾滿足時如渴飲醎水如衆流歸海終無有滿足諸境界愛無猒足文三云何欲下不淨似淨故二初徵如文二頌下釋二初略頌二初三句明法如文二似下一句合喻如文二此下釋頌二初釋述云此身不淨等者此身以下至流漏者釋偈第一不淨相次不淨似淨以下至燒害者釋偈第二似淨相後然諸以下釋偈第三四兩句也初中不淨有五種一者生處不淨二種子不淨三自性不淨四自相不淨五究竟不淨第一生處不淨者內有生藏𤎼藏屎尿不淨外有煩惱業因緣風吹識種令入二藏中間第二種子不淨者父母以妄想邪憶念風吹欲火故肉髓膏流𤎼反為精宿業行因緣識種子在赤白精中住也第三自性不淨者從頂至足下四𨕙薄皮其中所有不淨充滿頎海淨此身不能令香潔也第四自相不淨者是身九孔常流不淨眼流眵淚耳結聹鼻中涕流口出涎吐廁道水道常出屎尿及諸毛孔𣲇流不淨譬如漏囊盛物也第五究竟不淨者若投火則為灰若蟲食則為屎在地則腐壞為土在水則胮脹爛壞也取智論十九意全文如文集引也纍骨所成者三百六十骨八万戶蟲等者往生要集上云從頂至趺從瓜至膚有八万戶蟲四頭四口九十尾形相非一一戶復有八万細蟲小於秋毫僧伽吒經人將死時諸蟲怖畏互相噉食受諸苦痛男女眷屬生大悲惱諸蟲相食唯有二蟲七日鬪諍過七日已一蟲命盡一蟲猶存文誑心媚眼者唐三藏天竺奉遇女帝御門法之時偏依此意末語云一且凡夫心不止百千万劫落奈梨又云髑髏何處畫蛾眉文二然下釋合喻如文三所以下結制隨應莫犯者謂在家不犯邪出家一切共不可行故云隨應也法藏云身業犯中𭣦望前境為惱最極是故在初盜戒次最劣或順貪心故在第三文二第下釋文四初違犯相門二初標章舉經如文二聲下隨文釋義三初釋教他如小乘教自行方業道者上明制戒不同竟此明業門不同於小乘成實自作教他俱成業道今指薩婆多云自行方業道也倫記其意見如文集云云述云媒他亦業道者媒嫁此戒也故無業道媒他令處正是業道也云云二通下簡正邪二初通釋邪正通制二衆者法藏等任經現文在家出家俱禁正邪故云一切女人云云撲揚同之今師由瑜伽論等料蕳今文所以云據實在家等也義勝莊同之二云下別釋邪行二初徵問如文二如下答二初標事文下一釋之也一切男者男二處也不男者即黃門也玄贊第九云五種不男者謂生便除去嫉妬半月灌灑文攝釋云得他精血自男勢起名為灌灑文二母下別釋文三初釋不應行如文二除下簡所應行四初非支如文二若下非時穢下者月水也胎圎滿者瑜伽第二云於胎中經三十八七日私云二百六十六日也即是九月小四日雖然有月大小故即五大四小全當九月餘四日至第十月故云十月胎內也已上私注也此胎藏一切支分皆悉具足從此以後復經四日方乃出生或經九月或復過此若唯經八月此名圎滿非極圎滿若經七月六月不名圎滿文飲兒乳時者智論云其母乳則渴又以心著欲不䨱護兒文有病不冝者古義云有病不冝爾則惣有病時一切不許之也傳云有那利病之不冝爾則行病增不許之若於病無增無苦可許此也三若諸下非所或靈廟中者遁倫記云制多者此云靈廟文四若過下非量若過五返者利涉云一日一夜極多至五日不過二夜不過三過則非量文三不下釋不應理如文三在下在家開正二初開自分補云問在家於自妻非時非處行可云犯重乎答天台義記云自妻非道非處産後乳兒任娠等大論皆名邪文優婆塞戒經云自妻非時不正犯重文如是有異但今師解釋別無此委曲故如業道自妻非時非處同可犯重歟於善生經且任一機一相歟此事尚可有義能思之云云取意略記之問他人婦論文邪行中何所攝乎答初不應行攝一切他人所護悉不應行攝故論中云母等所護也二雖下開勝利二初開在家母邑者遁倫記云母邑者應云母村西國呼女人為母同村邑人也文崆洞記云問論言母邑名義云何答少年之女後當為母從喻為名猶如村邑有出産也文行非梵行者補篇記四云非者不義梵者淨義問夫初犯戒𣲇本所受皆是不淨行何故戒獨得其名有人解云者發於貪心以貪具三義故得名不淨行一能發業二潤業招生三是黑業故有三義故得不淨行名文問無屬女人産門正邪之中可屬何乎若正者在家菩薩本禁邪何利益時開之若邪者既無夫主何可云邪乎又雖有利益本論意不開邪判旁難思如何答傳云無屬女人不邪無夫主故但雖在家菩薩自妻外輒不可行之雖不成邪護自妻意故依之利益之時開之云無所犯生多㓛德文問在家菩薩於無屬女人依自欲心行欲法可名邪行乎答一義云若正邪俱禁受不戒斷優婆塞無利益時行之可名邪行歟受齋戒時行皆邪行見五戒斷例可爾云云今案云見文相始終先定在家但制邪行其次有緣開法則受不邪戒菩薩上開之見若依斷優婆塞有緣開邪行何上會二論不同云瑜伽但開七非然其第三非性罪云云縱依自欲心行之不名邪故知有義料蕳頗乖文相歟二出下出家問出家菩薩行正邪中何乎答成實論云問曰若出家人取婦免邪否答曰不免所以者何無此法故出家法常離欲但罪輕於犯他人婦文師云則出家人一切皆邪行見但依業道門可依常途邪歟但罪輕於犯他人婦論文能思之問制門以毛頭為犯分齊業門究竟取何時乎答師云與制門同取毛頭為業究竟也論藏出究竟時云兩交會故乘識房得業有義云業取暢滿則得出精方為究竟云云大背論藏所制不足言之云云二言違下違犯性門二初摽章配文法藏云具緣成犯者通緣如前應知別緣準論且有七一是有情類以木等無犯重故尸未壞等是情類故二是正境謂女三男二等以餘處不犯重故三起彼想謂以迷生為木及迷道非道皆不犯重故四有心以睡眠等不犯故五有三毒以在家菩薩正直心方便化生開不犯故若約出家不開則無此緣六造趣以不動身儀不成重故七與境合謂入如毛頭等若為𭜨逼開與境合禁其受樂文二且下隨文略釋二初配𠀍俗門如文二若下舉出𠀍門二初泛引兩經如文二當知下決上證如文三境界事門二初標章配文如文二女下隨文釋義二初舉重境三初定重所如文二言下釋諸天女如文三言非下釋非道及非道者問出二師義今師同何義乎答既上定女三男二正是境也文故知主同藏師義也問前四重中餘三戒皆與聞別何至今戒無大小別哉是故法師釋似順道理如何答除二道三道於餘支分結重或其道理難思依之見義古云餘𢙣語讚嘆磨觸出不淨等皆是此戒方便悉犯輕垢此戒兼制文彼師釋前後異不可一定次與聞無別者凡聞脫縛為本急制之故自然菩薩聞一同無𭤽相歟若𭤽分不同者上文蕳云聞法中自方重今菩薩戒教他亦重文既於自作教他有不同何於道𭤽分不同耶等云云二若下定違犯二初自身趣境二初境想如文二若下犯位入如毛頭者四分律意三處正道俱入如毛頭位犯重五分同之歟十誦律意口中要過齒位犯重大小二道同四分摩得勒伽論意口中過齒大小二道過皮位方結重事鈔中一見今師意同四分律歟三處無蕳云入如毛頭故也二若為下𭜨逼造境二初依律意禁受樂者可亘入住出三時何時受樂者皆犯重故戒犯相不約出精但約樂欲心定犯入住出三時生樂欲心者正結重也凡戒所對境通覺不覺情非情境於非情中有多別未壞小分壞成重半壞多分壞若以愛染𣲇欲心行之者初入結偷蘭是家方便蘭也若以欲樂心行之者不淨出時結僧殘若精不出者殘家方便蘭也二今下簡菩薩如文四言結下結成罪門二初摽章配文如文二對下隨文略釋如文已上戒畢
