body:
  text: 輕戒已下正宗分第二經佛下經三初結前生後二初牒文如文二述解三初標列配文問聲聞戒分五篇七聚何故菩薩但立二篇乎荅凝公云菩薩機𭤽不用廣開故但立波羅夷與輕垢罪小乗根劣不細何知故委細開之也云云此下別誦輕戒者法藏云第二弁名者輕垢者簡前重戒是以名輕簡異無犯故亦名垢又釋點汙淨行名垢躰非重過稱輕善戒地持輕戒惣名突吉羅瑜伽為𢙣作謂作非順理故名𢙣作又作具過𢙣故名𢙣作亦名𢙣即語過也善生經中名失意罪謂妄念所作乖於本志故名失意文又云第四輕重者此四十八中幾唯是輕幾唯是重謂六戒兼重所餘反此一第十一謂國使殺生戒於中為使故入此篇殺生故帯重罪二第十四故火焚燒戒中焚燒故入此篇随所物故為重三第十七依官強乞戒中持官㔟故入此篇強取物犯重戒四第十六為主戒中為主失儀故入此篇三寳物故亦犯重五第三十禁行非戒中以詐現親附等故入此篇自身謗三宝故入重収又殺盜故犯重六齊三長月作非入此篇収六第卅二畜作非法戒中輕秤小㪷等入此篇収取人財物等是犯重故第五多少者幾唯一戒幾具多戒謂有十戒一具多戒乃至第十二販賣戒乃至第二十不能救生戒乃至第廿三輕新求学戒乃至第廿九𢙣𠆸生戒乃至第三十禁行非戒乃至第卅二畜作非法戒乃至第卅三觀𦗟作𢙣戒乃至第卅七故入難處戒乃至第卅九應講大乗戒乃至第四十受戒乖儀戒乃至上來十內散三十五種又前門中六戒內各有所𭇥重戒亦具二戒也所餘三十二戒各唯一種是故𢝰有七十九戒應知文二此下准論惣解二初惣標補云此諸輕戒等者謂瑜伽重戒竟欲輕戒𤼵端文付此諸師及異釈遁倫記及今師同為輕戒𤼵端之詞今先標此諸輕戒後出有犯無犯等故倫記第十云自下第二明輕戒中文分為三先惣勸知以下如文集然元曉持犯要記云於有犯中有其二種重內應知䎡中上品輕中當識是染非染文如此釋今論文輕重中間前後相見師云約本論現文時重戒中但三品相不明染非染輕戒但云是染非染不三品若由此義元曉大師解釈亦有其謂然而約其躰時重兼染非染義輕𬾨耎中上品相依此倫記并今師於輕戒中具云是染非染等亦順論文處也持犯要記云且就初中以示其相於一讚毀有四別若為令彼起信心故自讚毀他是福非犯若由放逸無記心故自讚毀他是犯非染若於他人有愛恚心自讚毀他是染非重若為貪求利養恭敬自讚毀他是重非輕文由此解釈元曉大師亦於重戒作染非染相也今師意亦同宗要中有犯染相對四句未蕳輕重准上釈可料蕳也法藏云約境有三品一於二師二於長友三於同類於此三境犯上中下三罪可知二約心亦三品謂一以嫌恨心恚𢙉心犯上品二無嫌恨等但由憍𢢔癡心是中品三懈怠妄念是下品文於輕戒分三品相此文亦明若尒是染非染耎中上品俱亘輕重然而任處則輕戒始今師於輕戒釈之尤可然欤述云有犯者輕戒犯相無犯者一向無犯是開不犯也是染非染者上有犯中有染汙犯非染汙犯也耎中上品染不染犯上有之此等皆輕戒𤼵端語也故先標此諸戒也云云二就下別釋二初釋是染非染述云下瑜伽云𢢔心嫌心恚心染犯懈怠妄念是犯非染文意云染者𪵬名一切煩𢙉雖然今且分輕重根本貪嗔癡𢢔疑等重煩𢙉相應犯名染犯不然随煩𢙉懈怠等煩𢙉相應犯名非染犯也宗要釈非染罪云此罪助𢙣招彼果故文補云倫記引圎側師義云相應煩𢙉之犯名是染不相應於煩𢙉無記無𣲇所作為非染犯也文又云懈怠忘念者惣善無記心法暫時不進義懈怠忘念非随煩𢙉故非染犯也文由西明意非染犯不相應煩𢙉見若由今師解釈不然釈非染既云設有煩𢙉相應名不染犯文故知非染亦相應煩𢙉也則𢙣意樂煩𢙉所作名染犯非𢙣意樂懈怠等煩𢙉所作号非染也問以𢙣意樂為染犯瑜伽四十三輕戒第一供養三宝戒云若不恭敬懶惰懈怠而犯者是染犯若誤失念而犯者非染犯文既以懈怠為染犯頗今師所立欤荅師云凢染非染相依戒可有不同欤於三宝不可有以𢢔心等不供養𢙣意樂犯難生是故彼戒中懈怠等亦名染犯對失念亦可号𢙣意樂也自餘諸戒等有𢢔心嫌心等𢙣意樂故對此亦懈怠等非染犯也云云二随下釋耎中上品二初標列三品於輕戒中以心境等可分三品別為言法藏具分之如上引述云問若尒者雖同輕罪可有輕重不同乎荅随心境等於業雖有輕重於制罪者可一品故上云教之罪輕重雖同随心境等業有輕重文問上中下三品於染犯中分之欤將合非染分之欤荅八怗抄云法藏意染犯上中二品非染下品見法藏釈第一輕戒約心分三品全文如上之合染非染分三品也遁倫記云明輕戒中分文為三先惣勸知犯非犯相心犯重罪時有品階降故言耎中上也云云今此釈意於輕戒中犯重罪時有三品別染非染犯中指染犯云重罪欤見云云已上私云文集所引倫記文但云犯罪不云犯重罪尒者八怗抄義無其謂欤仍可勘本文也云云二如下別證上品述云今六十八文引證意此文亘輕重戒顕所犯成重相非謂成重禁之重也第一制重限十重第二事重餘四篇中性戒於今菩薩戒中之者四十八輕戒中性戒後四種者通輕重二篇俱可有之除第一制重餘五種於輕戒中談之具一種者輕戒中重罪不具一者輕戒中輕罪瑜伽文意如此故此文證随心境等有三品別也云云補云謂彼本文通亘輕重五篇俱入此六種名重今且證輕戒六種中第一教制為重者則盜等四重諸教同制重故第二事重者則断畜生命等戒也由事是性罪亦号重罪此上二種若望菩薩戒俱重罪不可為今證第三以下俱亘輕重故取輕𨕙證輕戒上品也智力劣者如愚人作罪也不速悔者謂作罪而不懺䨱藏亦成重也云云薩婆多律六種亘輕重旨釈之可見之述云問此六相如何配属心境乎荅初二是境三四五六即可属心欤云云三如此下料蕳諸戒補云問如此諸戒之言但於輕戒論之欤將又冝重戒論之乎荅今文既上摽此諸輕戒若尒如此諸戒之言上下順若由餘師釈㨿實義時寬通輕重諸戒也傳云於菩薩三聚戒有三類不同一瑜伽所顕了共不共三聚二瓔珞所断𢙣門三聚三一戒具三聚此中今師解釈中但初後二断𢙣門三聚未見及釈文今䟽文釈一戒具不舉教懺戒出顕了門三聚義中三門悉顕彼䟽下云此五中随文尅取皆通三聚叚皆離𢙣攝善益生義故私曰則一戒具三聚也圎宗料蕳名撗三聚是也從宗多論前十重戒判為律儀後四十八分為餘二經攝律儀戒所謂十波羅夷乃至又四十八中前三十戒多為攝善後十八戒多為利生也地持四十四輕戒中前三十三亦為攝善後十一戒為利生故彼此戒相雖有出沒举宗判相亦相似故私曰則由本業經釈断𢙣門三聚也論弁戒度九種相中第二一切戒乃至略三種一律儀戒乃至者謂諸菩薩所受七眾別解脫律儀即是苾蒭戒至近事女戒如是七種依止在家出家二分如應當知是名菩薩律儀戒文私云即是瑜伽所共不共顕了三聚也法藏上云第十攝三聚戒者有二義一若從勝為論此十戒惣是律儀攝以俱止過故私曰亦是断𢙣門律儀也二若通弁皆具三聚謂於此十中一不犯律儀戒攝修彼對治十罪之行攝善収謂一慈悲行乃至十讃三宝行以此二戒教化眾生令如自所作即為攝眾生戒是故十戒一皆具三聚文撲揚一云又以義推十重四十八輕戒一戒皆為断𢙣修善化一切眾生即一戒皆具三聚淨戒之義文准此等諸文通亘輕重具三聚戒義理在絕言云云随要開合等者則明輕戒多少瑜伽戒本四十三輕戒或四十二四十三四十四四十五異頗多然而倫記并戒𠷰意四十三地持善戒大同梵本業仁王立四十八但仁王經標數不相也善生經有二十八是故云開合不定也有義云三聚淨戒開合不定云云不可依用也二不敬下次第誦出五第一十戒四初護自心念門二初不敬師長戒第一二初標名牒經法藏云第一輕𢢔師長戒乃至第二次第者既創得戒理湏從師受教若懷輕𢢔教授無由故湏先制以随戒廣行頼此而立故第三釈名者於師及長心輕身𢢔戒防此失從所離為名文法銑云𧦐導為師学先為長不敬為輕陵為𢢔此是戒之所防戒是能防能所通舉故云輕𢢔師長戒文藏師戒名同法銑戒名号輕𢢔師長戒此兩師戒名言今師戒名雖少異至義理者無異故下釈叚還以輕𢢔示此戒犯相云云云具緣成犯理湏應𬾨論然既非性罪未必皆具五緣故輕垢中犯緣存略然五緣中事想欲樂方便究竟雖非性罪業道必應具有第四煩𢙉若染犯亦有不染犯中不必有也文二随文述解二初惣判十戒次三護他心行者食肉戒食五辛戒不舉教懺戒三也次三𠈟修佛法者住不請法戒不能遊学戒背正向邪戒也後二救護眾生者不瞻病苦戒畜𭣦生具戒也二受下別釋此戒四初釋先受菩薩戒二初牒經惣標述云問見下戒多分以制意釈文二門述之然而今戒無制意者如何荅得意此戒諸師異仍今述二傳無取捨依此制意一𨕙難弁故略不宣也或可云上云於僑逸處制輕𢢔故是此制意故又重不述也義意述制意云既欲攝善必憑勝緣若𢥴於所尊即妨於進善故制令敬事文傳有二云云付此戒文有二師諍初師此戒可名不重受戒得意也以前既雖受戒受王等位之時制更令重受云也後師意名不敬師長得意也惣制不敬非謂制重受也初師許重受重𤼵第二師不許重受也初師以經文為本後師以經後文為本也云云二有下別出二義二初重受戒義三初標義此第一師今戒名不重受戒雖前既受受王等位之時制更令重受若不重受犯輕垢罪為言二表等下會論二初正會則此師許重受重𤼵也然瑜伽論四十云若諸菩薩轉受餘生妄失本念值遇善友為欲覺悟菩薩戒念雖數重受而非新受亦不新得云云此文相重受重𤼵義則設會通云表等緣等具等也意云重受之時動𤼵勝思所熏種子別發得運防非㓛能前戒躰外別得無表也但瑜伽論云不新受得者菩薩戒盡未來際法故也𠀍生無失故雖數重受與前戒躰同類非別物故也次下更例證云如對法等二如下例對法意云由三乗解脫𣵀槃起順解脫分善根初起則為至果要由此後時云不新起猶如趣千里道無初一步不能至順解脫分順决擇分善根亦復如是非後時不熏生種例此今亦非新得論文非不許重受重𤼵為言述云此初有當義師義欤云云三若下准文經若佛子之言召已受戒言既有戒故制犯輕垢罪若不許重𤼵此文云何可得意乎云云二有下不重受義四初標義補云此第二師云別解脫戒䡄則同小乗彼既不許重受重𤼵例菩薩戒方可尒云云一小乗中假宗許重受重𤼵資持記云㨿本律得更重受文若實法宗不許重受重𤼵故行事鈔云依薩婆多宗戒不重𤼵亦不重受罪不重犯等文今對實法薩婆多宗云如比丘戒也云云述云對初有別𤼵得戒躰云義不許別躰增故指如比丘等非謂全同不𤼵別躰之𨕙同彼計故云尒也云云二由下證二初理證補云次以理證意云地前一大僧所受戒法至初地之時轉捨轉受也但前戒轉勝成圎滿無漏之法是云轉受非有漏戒之外更有無漏戒若許重𤼵無漏之位更別得無漏戒然而但本有漏戒待無漏增明緣得勝捨劣是号轉成無漏也聲聞先無戒故由要期心見道位始得戒是名見諦得菩薩不尒初受之時誓願不萎渴故依位捨劣得勝無漏之位更不新得若尒則成不重𤼵潤色也云云一轉成無漏委細分別事䟽云由此菩薩入初地已捨有漏戒受無漏戒文問轉成無漏之相其義云何荅付此宗學者各存一義有義云有漏戒為勝增上緣無漏種上更始生無漏戒躰也謂酬地前一大僧熏力法尒無漏種子始生無漏現行此無漏初念所熏種子上生無表而以前有漏思種之上防非㓛能亦不失漏無漏種上俱時各倍增長也至佛果初念有漏戒法随所依為所棄捨躰唯識論護法正義意會攝論諸出𠀍間法從何種子生從㝡清淨法界正聞熏習種子所生之文二解初云無漏性者非所断攝與出𠀍法正為因緣第二解云此正因緣隱難了有寄顕勝增上緣方便為出𠀍心種文非可有漏正生無漏無漏種子各別故由此如是釈今戒法亦尒也不可許有漏種上戒全移無漏種有漏三界逼迫之法無漏破裂三有之法躰既各別故不許轉反也問無漏新得無表支類如何荅有漏種上無表𠀍第一法末後假令四万支無漏種上始成十支無表運倍增也問漏無漏種上俱倍增長何云捨有漏戒乎荅顕勝隱劣故云捨如轉識得智例無漏之位豈無心王今亦如是云云已上彼義八云菩薩入初地時無新得之義初受得之時誓願盡未來際故只轉前有漏戒令成無漏之戒也譬如竹樋水流至金樋云云師云以前兩義俱以非也先第一義有漏種上猶倍增長無漏始得戒大背文相既云先有戒故見道不得文見道之位不新得釈文分明加之初𤼵心受得戒念倍增遙至佛果不許成圎滿法何故号無盡戒亦名盡未來際法何况真見道位唯住無分別觀更無受戒䡄則由何成無漏戒次八怗抄義亦頗非也漏無漏種子法尒各別其上防非㓛能亦別何云以凢位無表至聖位傳云不尒從初受得種子防非㓛能俱念生滅㓛能倍增長也乃至一大僧末後𠀍第一法位有漏思種之上前滅而次𠛴那初無漏所薰思種之上後生也前滅無表增一万者後生無表更倍可二万所依種雖別能依戒一物而前滅後生前滅無表有漏後生無表無漏後生二万支一万支曾得無表後生一万支未曾得有漏戒既前滅已何云有漏戒至無漏乎今文云捨有漏戒亦約此前滅後生之位從前殊轉明義又前有漏思種上從此以後無有防非㓛能若曾得若未曾得是故望種躰亦名捨然念相續更無間断故非捨戒受無漏戒者不作法受得新移轉無漏種上云受領納義故由有漏熏增力移住無漏種子故云無漏戒也問今宗定物躰由種子定之既依有漏種子𤼵得戒豈至無漏種種子躰無表用也躰不離用不離躰處常例水濕物用寧移火躰乎有漏逼迫法無漏不繫之法其躰大別若尒轉成義頗不足信用如何荅此難由不知戒防非作用如是難㔟來也凢論躰用有親踈若如自躰分上具相見二分用水上𭘧濕物作用躰用全不相離是用即望躰甚親豈有水不𭘧濕物用火不具燒物用今戒法不尒雖種躰生未得無表第三羯磨竟始𤼵得之故是用異餘物望躰甚踈望防非用種子增上緣無表種之上假法由此論云假法如無非因緣故文雖然離種無別躰是種之上假法最初𤼵心之位無限遠期來際其心所熏種子上假立無表故𠀍第一法無間欲得見道初無漏遠荅來際廣大之期願近酬尋思如實之觀力有漏種上所假立無表移轉無漏種上譬如春雖青由凉風慕雨力秋變紅青與紅實別種所生如漏無漏躰別如由躰實雖無別依春秋緣有青黃不同防非止𢙣戒躰雖無別依漏無漏緣可有染淨不同譬例可解轉自本亘捨與得二門故捨有漏染汙義成無漏清淨戒名轉也問若尒八怗抄義有何失乎荅言竹𢳟上水即躰至金𢳟上不易水躰則合無表躰全躰同故有漏無漏混乱失若由𢳟易水躰合漏無漏其義可許也問見道始得妙觀平等二智中由何立之乎荅可由妙觀察智相應思心所種子立也轉識得智之時妙觀察智轉第六識所得智故既有漏位第六相應思種假立故無漏位可轉彼智相應思種也問本有新熏中可由何種立乎荅新熏種上假立有漏既尒無漏何異乎問四智初起唯本有生也何云由新熏種乎荅見道初念實雖唯本有生生現行即念熏種子故其所熏種上可假立也種子生現行熏種子自本一念同時故如是得意都無相問今䟽見道位轉成見决擇抄中至佛果轉成見相云何荅撲揚解釈由別受釈之今䟽釈通受故不相問由通別何故轉成時分不同荅通受遠期來際要期遠故决定經見道至佛果由此随位進得勝捨劣別受不尒但期盡形思願促故縱經見道是非决定要期時限故見道不轉至佛果轉成也問由思願分限釈遟速至佛果何故轉乎荅彼位惣一切有漏豈戒法獨留因位不尒故轉不轉異云云已上此外重問荅補忘抄可見并重𤼵不重𤼵委細分別在之畧之二故下文證此引文證瑜伽文分明更不勞曲釈云云三不同下會先二初會對法對法所不閞受戒䡄則有無天地遙異豈成例證云云二雖下會准文佛子之詞雖未受無失𤼵菩提心故今戒結犯由生憍𢢔不敬師長結之經言欲受國王等受王等位特起憍𢢔故偏舉之制憍𢢔戒号不敬師長戒何為不重受犯乎問二師中何師可為正義哉荅傳云此戒結犯第二師順今師解釈至重𤼵不重𤼵以初師可為正先道理者表等緣具引無表故之解釈道理誠難遮三業思種別既𤼵之能依無表不重𤼵道理恐難立者也等云云四若曾下惣結如文二言上下釋見上座等上座云云述云義云於上無人為上座文法藏釈同今師釈也就通為論若別分位者毗尼母論云從無复至九复是下座十复至十九复名中座二十复至四十九复名上座五十复已上一切沙門國王之所尊敬是耆舊長老文和上云云藏云和上亦鄔婆𨹔耶此云親教師也然有三種一十戒和上二具戒和上三菩薩戒和上諸佛是也今此約前二文私云菩薩戒和上出諸佛一徃釈也云云阿闍梨云云云阿闍梨者若正應云阿梨耶此云䡄範此有五種一剃髮二出家三教授四羯磨五依止文今出三種等言顕餘欤藏云然有六種一十戒闍梨二大戒羯磨三威儀教授四受業五依止六授菩薩戒文同學等者法藏云大同學者謂同於一師学菩薩藏年复先已之類也五同見六同行謂同見大乗菩薩藏法同行菩薩所行等初則同解後則同行文有抄云同見者同學法相同学天台等也同行者同宗中同欣安養同求知足類也問小乗人長自我不恭敬犯罪否荅藏云又釈亦通小乗解行之人悉是所重以亦同是佛法內故文由此釈經且約本云大乗小乗人复數長我不恭敬亦犯罪云云經禮拜云云行宗記云三品出智論一口礼言相問訊名下礼二屈脥即跪立名中礼三頭至地即首名上礼九品出周礼文經問訊云云尒雅云訊者言也即用言問彼言小病小𢙉起居輕利云云三言七下釋七寳等藏云七宝約輪王位有二義一是金輪等七一輪宝二玉宝三馬宝四象宝五珠宝六兵臣宝七主藏宝菩薩皆悉布非是所賣二約餘七宝一金二銀三瑠璃四頗梨五赤珠六車𤦲七馬𢙉百物是通一切諸所有等此中七宝百物有二義一是前賣同上男女二是供具謂以此等供彼所湏故云而供給之文今師解釈供具見同第二釈謂賣國城等取七宝可供也云云四言若下釋結犯二初正釋經文如文二瑜下犯不犯二初違犯二初染犯如文二懈下非染如文二無下無違犯護僧制者被僧治罸人而守僧制不敬無犯故也已上不敬師長戒畢二飲酒戒第二二初標名牒經酒者智論云酒有三種一者糓酒二者果酒三者藥草酒文藏云第二次第者前則離外儀不今則內無惛乱故次明也云云又云具緣者一是酒二起想三無重病四飲便犯云云二随文述解二初制意昔是伏龍云云五分第九云佛未制飲酒波綸髮梵志住處有毒龍娑伽𨹔比丘降之入鉢中俗歡喜致其家食肉飲酒飽滿也僧坊外酔臥佛自汲水使阿難洗衣湏轉側伸側伸足踏佛佛言先能伏龍今不能降蝦蟆文取意有人云正蝦蟇在胷上者未見諸律不足依用云云二言下釋文三初釋過失無量二初正釋文如文經文故飲酒者云故飲酒者似開悮飲而律中酒非酒想亦犯若始終無飲酒心悮迷唯謂飲水理應開之若本有飲酒心雖飲時謂非亦應犯也文二如下定性二初申自義故知罪四字非論文今師義决也意云今師先俱舎定自義也即同論主之義也云雖非性𢙣而𤼵性𢙣故云過失無量文勝莊云如是三戒酒戒肉戒五辛戒瑜伽中云護聖教制皆罪攝文此等解釈皆以定罪也云云二持下有義二初持律者義二初標義彼論自持律者之別義也二鄔下證二初文證持律者二事為證立義也初鄔婆離之事彼論文同所引故略之也云云二又下理證此理證意云經生聖者性戒成就雖經多生不犯性戒然而如𭣦生等飲酒亦不犯由此故知性罪為言述云經生聖者者指初二兩果聖者初果聖者七反生下界第二果聖者一度生欲界故云經生也問經生聖者不犯性戒云云若尒沙伽𨹔比丘是羅漢也如何得飲酒乎荅為誡未來𢙣比丘等為緣起人起制戒也云云二諸下對法師義二初標義對法師者謂論師也論名對法故對法属教師属於人本文言對法諸師文義𢏏顕也云云二然下會證三初會文證後於異時飲酒者謂會上持律諸文證也𠀍尊先為病者開罪後為有染病釋種飲酒畢故云後於異時也八云由分別㓛德論祇桓病比丘波離問病者所樂求五斗酒佛令之但病時開之無病時不開之今指無病時不開云後於異時等也云云此義不足言也持律者立性罪義以文理二證成立對法師立罪義會上一證理證次下會之何不會文證持律者不分別㓛德論方為文強設會釈加之彼旦一時一會開之不常途事如佛度三逆逸多阿難以善來度五百仙人是皆一時一會事非教所定何彼方定持犯誤又甚勿過此焉二義中戒義是正義云云犯性罪故者俱舎十四釈五戒云問何緣於彼諸罪中不制離餘唯飲酒頌曰中唯離酒為護餘律儀文二又一下會理證如文三乃下會伏難述云乃至小分等者此伏難也有難可言若云聖者具慙愧故恐失正念不飲酒者湏小分酒有何酔乱此疑難云如毒藥量不定等也下居雖小分如毒藥故云云二言下釋制分齊二初以過器况自飲二初釋經文意經過酒器與人等者云一云過有酒器與之令飲一云唯過空器與彼令斟前遣他飲後教化飲義皆無爽文又云五百𠀍無手者謂手犱酒器與故得無手之報如蚓虫等類或生人中得無手也藏云杜順禪師釈云以俱是脚故云無手即畜生是也文極增上𢙣等者令他人醉乱失正念之意是𢙣心也下云無利益心故言𢙣心故蕳非善心等也云云二若下許善心瑜伽論三十九云若有眾生來求毒火酒等物或為自害或為害他即不應若有眾生來求毒火刀酒等物或自饒益或饒益他是應文次十住文彼論第六云若以酒應生是念今是行檀波羅蜜時随所湏與後方便教使離酒得念智恵令不放逸何以故檀波羅蜜法悉滿人願在家菩薩以酒者是則無罪文二言不下以教他况自飲如文經不得教一切人飲云云問與下句及一切眾生飲酒如何不同乎荅義云不得教一切飲者謂不得教他令飲及一切眾生飲酒者不得遣與人飲文此解釈約教遣分不同也意云遣者遣酒令他飲教者但令教他飲也又一義云上句限人趣故云一切人飲下句通六趣故云一切眾生也即是寬狹異也云云三若下惣結違犯二初随文結犯如文二然下制開文二初文二初文殊問經二初正明酒開制文殊問經文為病開小酒多藥也云云二不下因餘開制一具文故因之也非今所要律中服油無因緣不許也風淡冷三病也淡唾吐病也佛成道時受之食觀三𠀍諸佛以鉢為食知見之時四天各以一石鉢奉之也云云二未曾有經恱心生善者未利夫人將美酒獻王王生善心令免臣下罸佛言不犯等也出家不許也云云二况下釋意如維摩等云云例證也凢入酒家者律文所禁而為利益維摩詰入酒肆准彼為利益何不開飲酒為言維摩經上云遊諸衢饒益眾生入治政法救護一切入講論處導以大乗入諸学堂誘開童蒙入諸舎示欲之過入諸酒肆能立其志文文集注云私曰但此經意開入酒肆立離酒志非開飲酒菩薩護戒性等故文如𣵀槃文已上飲酒戒畢二護他心行門三初食肉戒第三二初標名牒經藏云第二次第者前離惛乱之飲令離命之食文銑云問佛初成道已制此戒何故𣵀槃重復制之荅此制菩薩不待犯緣彼制聲聞待犯緣方禁彼文云我今與諸聲聞弟子唱断肉制文由此佛在𠀍間雖不共戒𣵀槃已後大小同禁文云聲聞𣵀槃已前𦗟三種淨自餘不𦗟𣵀槃已後一切不𦗟菩薩前後一切不𦗟文法𮏑珠林九十三云於漸教中三種淨肉離見聞疑不為己𭣦鳥殘自死者開𦗟食之至𣵀槃夜大聖慇懃始終不開文二随文述解二初制意必至於𭣦者如足王好肉故肉断之時𭣦少兒令食遂為食人鬼十二年間飛行食人之事是也云云二文下釋文二初餘文二初制断如文二若下開許二初開𦗟問自腐爛欲食得食者聲聞許肉食三種淨肉皆𦗟食之不為我𭣦又為我見聞疑三根無之許食之然而今大乗文殊問經所何與聲聞不同乎荅聲聞不問利益不利益三種淨肉𦗟食之菩薩不尒無利益時准下文自死肉不得食也今云欲食得食者准下大慈悲心為教化眾生無罪之文為眾生利益者自死之肉可得食亦必可誦咒又設雖為利益為己𭣦肉不可食成教他𭣦生之業故不可開之云云撲揚云七通塞者約別教三賢位人以不見機一向皆塞初地已上見機而作或以食肉因緣令諸眾生𤼵菩提意成菩提心断𢙣生善破惑見理故應為之文璿注亦同准此等釈亦地上欤云云二文下决疑二初文殊疑文殊因上開許起疑問也文所列四經准知文殊問經以前經文殊列四經疑起佛也云云二佛下如來荅二初述断意三初正明断肉佛告文殊以下佛荅初宣断肉之由給云云二文下泛明随機已下随機故法異也初頭𨹔法為例也意云為樂掃衣者掃衣為樂主衣者開檀越衣人為樂常乞食者乞食法為樂僧食者許受常住食餘頭𨹔例此可知如彼頭𨹔之法此亦尒也眾生懷𭣦𡧱心故制食肉若無害心住慈悲心食自死肉無罪過也為言三文下重明断肉如文二若下述開意無有罪過云云資命為教化一切眾生自腐爛肉可食也故無過也云云二言下釋此經三初釋断大慈悲性種断大慈悲性等者藏𣵀槃云夫食肉者断大慈大悲種此則食肉𡧱大悲性種失自利也眾生見捨失利他文二言下釋見而捨去鷹遂之鴿等云云智論十一云佛在桓住晡時經行舎利弗從佛經行是時有鷹遂鴿飛來佛𨕙住佛經行過之影䨱鴿上鴿身安穩怖畏即除不復作聲後舎利弗影到鴿便作聲戰怖如初舎利弗白佛言佛及我身俱無三毒以何因緣佛影䨱鴿即無聲不復恐怖我影䨱上鴿便作聲顫憟如故佛言汝三毒習氣未盡以是故汝影䨱時恐怖不除文𣵀槃經云畜生見食肉人頭上有血光念言我身有肉彼人食肉彼若得我要當食我遂惶怖而走文三言下釋得無量罪一切智光明仙人云云彼名一切智光明仙慈心因緣經彼云乃徃過去阿僧刧有婆羅門名一切智光明必得成佛号㫆勒即入深山修行乞食七日不食林中有五百白兔有一兔王母子二獸見仙人七日不食而作此言此仙人為佛道故不食多日命不遠我今為無上大法不惜身命以身欲供法自投火中時樹神白仙人兔王母子為供養故投身火中今肉已𤎼汝可食之仙人聞已悲不能言願我𠀍不起𭣦想恒不噉肉乃至成佛制断肉戒作是語已自投火坑今時白兔者我身是仙人者㫆勒是成佛所經典亦名慈三昧光大悲海雲所制木刃不行慈者名犯禁人其食肉者犯重禁後身生處常飲銅文以上取意具如文集當成佛時制食肉犯重者問十重六八三𠀍不改也若制食肉為重可為十一重四十七輕戒乎荅今經三𠀍常恒都不可有不同是故此經中猶可輕罪而由因位本願於餘經中制重戒彼經云所經名慈悲經制肉可為重取意故知餘經也云云已上食肉戒畢二食五辛戒第四二初標名牒經藏云第二次第者前食有命之身分今則犯無命之葷𡋯故次第也文云大小俱制七眾亦同准律女應小重以𤼵花色故文今戒雖不見僧戒本尼律單提中制之比丘得吉云云故亦共戒也四分律云雜揵度尒時𠀍尊在恒中與無數百千眾圍遶法時有比丘噉䔉遠佛住𠀍尊知而故問阿難此比丘何故遠住阿難云此比丘噉䔉佛告阿難寧可食如是味而𦗟法耶自今已去一切不應噉䔉尒時舎利弗風病醫教服䔉佛言𦗟服文准此非尼律中揵度又制之云云二随文述解二初制意梵經私記云五辛經云昔羅吉頭國有長者名善德請一比丘食之訖取一辛與比丘食已去毗首天云淨居天汝食不淨故常時護汝天神皆捨汝去尒時比丘欲至恒河口河神不𦗟後至林中悔責命終堕於屎獄經歷千刧後生猪中千刧文楞嚴經云是五種辛𤎼食𤼵生噉增恚如是𠀍界食辛之人縱能宣十二部經十方天仙嫌其臭穢咸皆遠離文二法下釋文二初釋五辛家䔉者常今䔉也胡䓗者胡國䓗也有人口傳云今時殊大立䓗是胡國䓗也家䓗者常小䓗類也問今時菲如何荅五辛異太多如五辛經五辛各五合二十五云云故今釈菲雖不入五道璿注入五辛楞伽經亦制之仍不可食云云問今時蘿蔔大根如何荅無苦也與减注云若興渠者于闐國有之其根白如𦽦菁臭如䔉文則相似大根依之有人云大根五辛随一也與减釈如是加之蘓悉地經中食囉𮑱神咒無威驗云云又䔉婆呼童子經上云亦不飲酒及以食肉䓗薤韮胡麻羅蔔乃至若食此等食者不名持真言人念誦無驗文由此先師菩薩亦不食故知大根五辛随一也云云此則大誤與减釈興渠云有于闐國云云𠀍間常無物見蘿蔔𠀍間常有故知不同也口傳云大峯有興渠云物其形相似與减釈而非大根云云次真言經禁之必由五辛不禁之若彼所禁一切五辛胡麻亦五辛乎俱禁之故知不由五辛禁之也次先師和尚不食自示言我偏勝餘愛彼由此不食云云故知以蘿蔔為五辛大非也云云芸臺俱礼之於毛阿魏藥者撲揚云阿魏藥樹故知樹名也阿魏藥本草云錫云今人之𭴢䔉白為假者真者極令下細䖝極効文故知下藥也云云二如是下明開制二初正明除自重病等者與减注云毗尼母云舎利弗囙風疾醫令服䔉佛𦗟文二如下證二初證開制如文問五辛禁忌其日數何哉荅經律示之報恩經云七眾等不得食肉重辛讚誦經論得罪有病開在伽藍外白衣家服已滿四十九日香湯澡浴竟然後許讀誦經論不犯文僧律三十一云在一𨕙小房中不得臥僧床蓐不得僧大小便處行不行入溫室不行遶在露處得下風遙礼七日行随順法至八日澡浴洗衣入僧中文二又下證開意十誦律三十九云身中有八万戶䖝若燒身者當𭣦此䖝佛言今死時諸䖝亦死文已上五辛戒畢三不舉教懺戒第五二初標名牒經藏云第二次第者前則自絜己身今則不與穢行同居故也文二随文述解二初制意犯戒苦因轉者謂教令苦因懺云云維摩經等者是維摩大士受病時釈尊遣文殊令問病維摩大士荅文殊言如文集等二此下釋文三初釋犯八戒等三初明通大小今師解釈意律藏所五八十具之戒即為菩薩攝律儀戒以小乗心受之成小乗戒以大菩提心三聚通受之時為攝律儀戒也故云通聲聞菩薩戒也此即任瑜伽誠致料蕳也二瑜下經論證二初證七眾通菩薩瑜伽證七眾通大即通受菩薩戒也二𣵀下證八戒通菩薩次𣵀槃上七眾中不攝八戒是以𣵀槃證八戒通大也則別受八戒也云八戒五戒是在家戒也十戒是沙㫆戒也毀禁者即是比丘尼又十戒謂十重毀禁謂四十八輕垢文三言下釋經毀禁及以菩薩攝律儀戒云云問菩薩攝律儀戒全是七眾戒則瑜伽文分明也尒者八戒五戒十戒比丘戒即可菩薩攝律儀何此外云及以菩薩攝律儀戒乎荅於律儀有共不共瑜伽且出共律儀一𨕙云攝律儀戒七眾戒故也攝善法戒廣故後四重攝之也若由不共後四重名律儀戒故本業經云攝律儀戒所謂十波羅夷也此指不共攝律儀述及以菩薩攝律儀也是以唯識述記云然菩薩戒自息𢙣戒是何戒攝今欲為前別故所以且七眾其實菩薩戒亦得是律儀戒等文二七下釋七逆等二初指七逆如文二八下釋八難三初以八無暇釋二初標列二初列數八難者異頗多八無暇經以𨕙方為八難一玄𮚌九云𨕙地攝北列文無佛法𨕙地也北列樂不能修道依之為八難随一也長壽天者惣有二一云惣色界天名長壽天唯除五淨居唯聖所居故一云非想天名長壽天八万刧久故等云云佛前佛後者㫆勒出𠀍前釈迦入滅後也然有佛法人能解猶名佛𠀍燈云言值佛者有佛教法從他𦗟聞亦名值佛龍宮天藏像末之後佛法豈無以此准知但天上人間無人傳名無佛𠀍文若由此文增刧人壽六万歲猶佛出𠀍也七万歲羅漢入滅以後㫆勒以前正佛前佛後時分此亦且依一明也二彼下釋名如文二彼是下釋疑二初惣標明矌列八難了云此八是果由因尅見所犯因可令懺懈其因者何謂毀戒堕獄因慳貪餓鬼因無慚畜生因為求人間壽持三㱕五戒即此北冽因為求天樂持八戒等即長壽因不為解脫集学𠀍俗防護三業即𠀍智弁聡因折有情身分毀謗正法諸根不具之因不思惟修習大小觀法生佛前後因文此釈與今師解釈大途同小異云云二此下別釋此中十𢙣等者十𢙣上品招地獄中品生餓鬼下品堕畜生論藏意也𠀍善者不欣出𠀍道修善也邪定感長壽者此釈叶無暇經非想天之文欤云云二有下以十三難釋二初舉八難十三難者𨕙罪汙尼賊住破內外道黃門𭣦父𭣦母𭣦阿羅漢破法輪僧出佛身血非人畜生二形也此內五入七逆除之殘之八云八難也二雖下推釋疑於上八可懺業障二形等報障不可懺是故云取汙尼等也云今謂十三難中除二形黃門畜生非人及破二道餘名八難二形等四既是報障無懺除義破二道者以在異道還入佛法故無同住同利養義是故此五不入教懺數中文與今有少不同藏不今具出二大同云云三傳下並結二義如文三言下釋犯輕垢罪二初牒文如文二除下明開二初正明舉罪五德者四分律云一知時不以非時二真實不以虚妄三利益不以减四耎不以鑛五慈心不以瞋恚文二瑜下證不可與語者不受能舉詞也若觀待時者可待時冝也非時者貪嗔癡時大風雨時嫁娶時等此外為時也不可責治罸等者不呵責下品過不治罸中品過不駈上品過也傳奥云瑜伽輕過呵中過罸重過不尒成犯文已上不舉教懺戒畢三仰修佛法門三初住不請法戒第六二初標名牒經藏云第二次第者前則於失者不教悔今則於德者不敬請故也文戒名住者有二義一云住都上免手不請法戒謂制住法師不請法也一云住師手不請法戒謂住字属能犯人對下不能遊学之言次義為勝順文故云云二随文述解三初制意三初立義𣵀槃經第四云諸佛所師所謂法也是故如來恭敬供養以法常故諸佛亦常文問若佛以法為師者三寳中以法可為初乎荅報㤙經荅此問云法雖是佛師而法非佛不𭤩所謂道由人𭤩是故以佛在初文二遺下證問遺教經意如何荅顕智德顕法㓛力依法生智依智断惑依惑盡故證𣵀槃也意實有其謂者欤聞思修恵者三恵中先二散恵後一定也聞謂先文後義思謂先義後文修謂文義俱照也云云三菩下結理如文二言下釋文五初釋僧房等如文二釋日日三時法藏云日三時者約時分也謂震旦供養小食齋時供正食餘時供非時湯藥等故為三時也云云三日下釋日食三兩金二初釋文日食三兩金者法銑云因中果故云食金文智論三十三云或時以因果如言一月食千兩金不可金因金得食故言食金文明矌云三兩金者舉重况輕末代知法補佛處文二何下述意二財別等者瑜伽第五云又非聖財所生樂有怖畏有𭜨對有灾橫有燒𢙉不能断後𠀍大苦聖財所生樂無怖畏無𭜨對無灾橫無燒𢙉断後𠀍大苦文四常下釋常請法師三時法如文五言下釋為法身請法魂洗雪山者洗字寫誤合作沇宗要并古本皆作沇釈迦菩薩四十超刧之內雪山童子時超十二中刧也文三有下開緣如文已上住不請法戒畢二不能遊學戒第七二初標名牒經藏云第二次第者前則通請大法今則別𦗟毘尼故次來也文第六戒何住處知法人來不請法制也今此戒者不徃彼講法處制也云云二随文述解二初制意三初述意付今戒一疑來凢為出離但修一門以為足好廣學非自要旨何此戒制多聞乎為此疑述万行一門等也万行者不可過六度十波羅密之行断𢙣修善利生之義此等諸行但一門也一門者謂菩提一門為菩提修行一切皆為成佛因依因行㓛成成菩提果故云無非是也是以上釈云得𤼵大心所有願行皆成因性文大集經第九云如𦒿婆醫王常作是言天下所有無非是藥菩薩亦尒一切法無非菩提文五怙抄云問付菩提薩埵行願且新學菩薩一切講法處悉徃可𦗟受欤將聞随一法精進奉行欤進云今經中是新学菩薩乃至一切法處悉至𦗟受若不𦗟受者犯輕垢罪文故悉可𦗟受見付之不明凢新学菩薩先堅一行然後可𦗟受餘法若初聞多法無所奉行者可如貧窮人日夜中常數他寳自無半錢分既是聖教所毀也何可云薩埵妙行乎彼如釈尊與阿難同於空王佛所雖𤼵菩提心阿難好多聞故今尚居小位修行勤惰別挍量可知者也若尒者制立今禁戒令進修菩薩位地事其趣不明如何荅先親近善友次𦗟聞正法次思惟義理後行法行是則薩埵妙行䡄則也尤徃講肆所悉可𦗟受者也是以優婆塞經四十里中有講法處不能徃𦗟得失意罪云云即同今經意凢已𤼵菩提心之後所作事悉是菩薩行也設雖此法設雖彼法同㱕一門無有別毫若𤼵偏犱心者是則菩提障也何不閞犯戒乎但於多聞精進相對勝劣者此則古迹問難趣也正荅文云彼但為聞為究竟不多聞聖恵本故云云今既為正恵聞之冝加讚嘆何可毀責乎即勘瑜伽多聞能知法多聞能遠𢙣多聞捨無義多聞得𣵀槃云云次於阿難事者大聖化用難測輙不可推定之望其事捈得者也云云二如下證設滿𠀍界火云云無量壽經下曰經文也此明要誓故云必過要聞法等也云云三所下徵釋二初徵問如文三如下論二初文補云以恵為躰等者四智為躰故也此有二重能所一云第六恵為能前五波羅密為所也文云恵能𤼵所餘等是也二云六度惣名能菩提因故菩提為所万行果故文云於彼菩提及能法等是也述云問於彼菩提及能等皆起邪行文菩提是佛果於佛果位豈起邪行乎荅於菩提果不可有起邪行何度於所修行可立邪正然云於菩提及餘五度起邪行者第六智菩提為本亦於餘五度成本故於此智恵非正理者為彼菩提修行非正行亦餘五度皆為邪行也等云云畧抄之二是故下述勵三初述義徵如文二頌下文釋述云文集注云若指諸文結頌示欤云云意云勘諸經論無此頌文故設疑釈也諸經論中取讚智恵文賢師結此頌為言三問下决來難二初問如文二荅二初直荅如文二如下證捨無義云云彼論次文述頌意云𤼵增上恵由此能捨一切苦本煩𢙉無義證得𣵀槃文准此文無義者指煩𢙉生死輪廻本是煩𢙉即是無義也云云鏡水抄三十一云多聞捨無義者生死𢙣法名無義利故即由多聞能捨生死𢙣法無義之法也文二言毗下釋文三初釋毗尼經法毘尼經律云云義云文中講法毘尼經律者詮法名經詮毘尼名律文此解釈意法毗尼者但舉所詮次經律者皆出能詮經者貫持之義貫持所詮之義故四諦十二緣六度之法皆經所詮故云法也律者䡄則之義定罪業輕重故於律有法分筆三義是名能詮之教所詮毘尼者舊訳云新訳調伏也調和身口意𢙣伏七支十𢙣之諸業故云毘尼是以云毗奈耶者為調伏𠀍親攝論第一卷云調者和御伏者制調和控御身語七非制伏除諸𢙣行故文二釋𦗟受諮問二初牒經文如文二瑜下教用心二初論標四處如文二何下徵述略攝頌瑜伽三十云云何四處一專求領悟無難詰心處二深生敬無憍慢心處三唯求勝善非顕己能處四純為安立自他善根非求利養敬名聞處如是正念到師文三菩下釋結罪二初違犯二初染違犯如文二懶下不染犯如文二無下無犯無犯中有病無力者二緣也本文一安若字謂雖無病必無徃彼力開之云云已上不能遊学戒畢三背正向邪戒第八二初標名牒經藏云第二次第者前雖離慢勤学而或心堕二乗故次制令專習大乗故也文又云第三釈名者心捨大乗故名背正遵崇邪小故曰向邪文述云凢邪正有通別二重一云內外相對時外道邪也大小二乗俱是正二若大小相對大正小正邪也不叶大乗實相故是以下文云二乗謗法空等名為邪見文背大乗正法向二乗外道可當戒犯也云云問此戒結犯分齋受持小乗外道教之時結犯乎荅此戒制意背大乗制向小乗等不為本意若不背大乗兼學小乗是菩薩遍學行故知以背大乗為此戒本制尒者背大乗教時犯也然而經云受持二乗外道經律具舉所造行故云向邪也非謂待向邪犯也又或一義云待向邪犯也藏云一是大乗法二起彼想三心背語非四捨此受彼故結犯文此釈意受持彼時犯也順經文亦戒名也云云二随文述解二初制意如文二問下釋文三初釋心背大乗二初問此問意心背大心時犯重亦起不同分心可失戒何犯輕垢罪乎為言是為顕第十謗戒不同起此問也二荅此謗別教等者問指法花等一經全部云別教欤又於一經中指一處一叚云別教乎荅瑜伽云若聞甚深最甚深所心不信解文則一處一叚見述云第十謗戒中惣謗謗一切大小經律別謗惣謗大乗教今此戒不尒於大乗中謗一部一叚別教故云云補云師云依處或重或輕若聞𣵀槃經一切眾生悉有佛性等文即𤼵謗云眾生無有佛性是雖一文一句謗之可犯重一切大乗故於自謗理性猶定犯重况惣謗佛性何非犯重若執法花一乗謗深密五性云非佛此雖謗全部又犯此戒欤不通一切謗故云云問自宗他宗諍可犯今戒乎荅不尒俱言佛互談實故非犯若執一宗言餘非佛随時犯輕重戒也智論云自法愛染故毀呰他人法雖持戒行人不免三𢙣道文仰推如來云云如恵心僧都云五性一乗之義期慈尊出𠀍是也云云二釋常住經律付常住經律二尺由初釈常住與經律也能詮所詮異故由次釈經律即常住三𠀍常住故藏同之云云三若其下釋邪見經律經邪見經律者如智論云五百異部聞畢竟空如刀傷心是也邪見属機教非邪故矌云受持一切禁戒者非正律儀鷄狗等戒不為解脫並名邪見多念故云一切等文云云已上背正向邪戒畢四救護眾生門二初不瞻病苦戒第九二初標名牒經藏云第二次第者前即背上勝法今則捨下病苦故次制也又前則於法有背今則於生不濟故次制也文云聲聞正在師友同法及被僧此外不制本不兼物故大士一切應救本期兼攝故七眾同制文二随文述解二初制意如文二言下釋文二初釋供養如佛無異義云供養如佛無異者佛是應敬之極病是應慈之至敬悲雖殊田義返同故無異也八福田中𭥬病福田第一福田者崇敬義後救悲心初故田雖有八𭥬病為上云云今師釈義同此也云云二釋八福田二初有義八福田中設無會者如西天日大王無會大唐清冷山無會也注未見聖教云云補行注云如此文散在經論然未見八福田文云云經第一福田云云第字去声呼可得意即㝡上義也若平声呼時次第義也不叶義也二今解二初標列如文二以下徵釋如文經百種病苦云云是百義也但非謂一百僧祇律云病有四百四也水火風難各有百一文三言下釋犯輕垢罪二初正釋二初違犯如文二無犯述云不犯緣惣有九種一若自有病云云私云不堪他𭥬病裎病欤二若無氣力者雖無病氣力不能𭥬病也三若傳請他者論云若轉請他有力随順令徃供事文四若病者有依怙者地持論云若知彼自有眷属文五若知病者自能供事者論云若知病者自有㔟力能自供事文准下是非久病欤故自能供事也六了知等者次前自有力供事此雖無力長病故自支持也七修勝善令無間者論云若為勤修廣大無上殊勝善品若欲護持所修善品令無間文論顕文二種見然今為一種欤或云但一種欤八若自知鈍等者論云若自了知上品愚鈍其恵鈍濁於所聞法難受難於所緣攝心令定九若先許餘為作供事者前既許餘病者故後有病者雖不見病無過也是先約他也云云二如下指餘述云此下指例也謂如𭥬病於自餘苦為作助伴可救其枷鏁等苦為言非閞今戒欤云云已上不瞻病苦戒畢二畜𭣦生具戒第十二初標名牒經藏云第二次第者前防自身不能濟病今就依報不能畜非器故次制也文云大小俱制道俗共禁文二随文述解二初制意如文經乃至𭣦父母等者雖今戒唯制畜𭣦具因有此具可有𡧱我親𭜨故因誡之通在家戒故常可有此事故也云云二乃下釋文二初釋尚不可報彼還等者所𭣦父母自宿業也為言若瞋自𡧱彼𭜨無所益故又有義云若嗔對留和自𡧱那留於毛手無所益故者謂嗔他還自𡧱故自當可受此果故云自𡧱無益也二義俱無也無所益云云云又我親既死不可還活設𡧱彼親於我何益故長壽王經云以𭜨報𭜨終不以德報𭜨乃云云二言下犯輕垢罪二初牒文如文二若下明開如文已上畜𭣦生具戒畢
