body:
  text: 四故心妄語戒二初牒經故者簡誤不犯等詞也妄語者法藏云第二尺名者言非稱實為妄令他領解為語戒防此失此從所為名乃至第三次第者先身業次語業事為次第文二述釋二初制意二初文顕過二初智度論二初妄語過智論十五云云云今出十三調卷不同也云云譬如䨱瓶者法藏云彼論云復次佛子羅雲其年糿稚未知填口人來問之𠀍尊在不詭言不在時人問羅雲𠀍尊在不詐言佛在有人語佛佛語羅雲澡盤取水與吾洗足已語羅雲䨱澡盤如勑即䨱佛言以水注已住問言水入中不荅言不入佛告羅雲無慚愧人妄語䨱心道法不入亦復如是文二又下實語德如文二瑜伽論二初文所犯學處重修行支者五十三卷付近事律儀立三支方攝五戒此即第二支也彼云一受遠離㝡勝他事支𭣦生偷盜邪也遠離𡧱他命壞他財他妻妾名初支也二違越所受重修行支遠離妄語是第二支倫記云若已犯前三師僧撿得由不妄語𤼵露懺悔重修前三也云云三不越所受支遠離諸酒眾放逸處文是第三支周記云由妄語故䨱藏己罪不肯懺悔重修戒也文意云犯前三戒等云越所受其越戒而懺悔云重修行也對不犯前修行今又修行云重修行不䨱藏所犯修行云離妄語䨱藏所犯即妄語故也云云二妄下反證如文二既下因過示次顛墜𢙣趣者花嚴經云妄語之罪亦令眾生堕三𢙣道若生人中得二種果報一者常被誹謗二者為人所誑文二釋文四初違犯相門二初標章舉經如文二言下別釋方便方便者假詫餘事者十誦律云我今日不入𠀍間禪定若人問言昨日云何荅言亦不入如是語應得何罪荅言得偷蘭若禪法得波羅夷文取意天台義記曰方便妄語如蜜塗樹文與咸注云頂山云以蜜塗其樹以物掩之眾蜂奔集詐言得神通尒或問三性之義以不解故妄云我今日不入定故不能荅皆方便妄語之相文二次下違犯性門二初標章舉經五十九曰妄語業道事者謂見聞覺知不見不聞不覺不知想者謂於見等或彼想欲樂者謂䨱藏想樂之欲煩𢙉者謂貪瞋癡或具不具方便究竟者謂時眾及對論者領解文二此下指略餘文此中問荅如大論記者宗要序因述瑜伽纂要三卷准此今師就瑜伽論作纂要記三卷給今指彼云如大論記也然而未流行問荅趣不弁其旨相傳云付今戒究竟諸師解釈不同所謂瑜伽論等究竟相前人領解料蕳此領解或以信解云領解或以聞知云領解慮大論記問荅定决此事欤今師御意前人雖不信只領解妄語言可成重見於今戒者分明解釈雖無之見下法化宗戒云准妄語業雖不信犯文解釈意趣分明也智首云誑人知解結罪不待其信文法礪同之勝莊師對佛菩薩妄語不成文若尒彼師取信解欤云云三境界事門三初摽章配文如文二為下随文略釋三初釋乃至二初大小對簡如文二或下四言對簡或見聞等者攝餘聞觸知也反即八語也以此四配六根時眼耳意三即如次見聞知也鼻舌身三合為觸也云云二釋身妄身妄語者雖不𤼵語言由身表令人妄解也四分律云時有檀越語常供養比丘言若大德是阿羅漢者脫僧伽梨比丘即脫現相不語疑佛言偷蘭文三釋心妄心妄語者今記主意於不見事起見想而離言不見等也法藏同之然而義師不同此欤彼云心妄語者如戒時嘿表清淨雖由二表令他妄解而所成業語業所攝故云妄語文問誑言不見等者若尒何云心妄語哉既假言成即是常途語業是以勘餘師解釈述心妄語者云如戒時嘿表清淨法銑釈同之見此等解釈都無假語業然而今師釈以䨱所知名心妄語似無其謂如何荅今師解釈之趣唯非意念業欤於不見事而起見想欲誑他人未出言時未成業必出言方成其業故必假言唯意念位未成然此心妄語者自稱前事故非語妄語但䨱自所知令他妄解故是名意妄語也非如常途嘿妄意念罪雖然依想成犯故出心妄語之相也云云問妄語者依自表彰令他生異解是名妄語罪而於意念他人不知之又所出言語稱實事無前妄解義尒者何名妄語乎荅實今所稱前事故雖非語妄語異自意念令他生異解故名意業妄語也望自妄念云妄解也尒者無過欤云云三又如下出𠀍戒如文四結成罪門二初標經如文二菩下釋義二初正行私云科文正行者經而菩薩正語正見釈叚故云尒也為蕳䨱想者有義云即上心妄語也蕳心妄語云正見云云今云一切妄語皆䨱想也由想成犯故但蕳邪語言正語蕳邪想云正見也下䨱想正知豈心妄語乎云云二而下反結二初成犯如文二若下開文二初正論文䨱想正知者謂䨱想知之則妄語想也仍訓文云䨱想奈利土正知師手此等皆宗家等意但地上也若依今師意亦通凢夫也理趣分云如在路行見人逐㝹他問見不應坐荅言我實不見為護𭣦事即現坐相云我不見非是立時我不見也不犯妄語護𭣦事故文師云為助他命開之但無利益如是現異相可成方便妄語欤設為利生不假如是相直作妄語於地前者不可開之也云云二不下無利反結如文已上妄語戒畢五酤酒生罪戒二初牒文法藏云第二釈名者令人惽醉名酒貨授與人曰酤防止此患為戒亦從所治為名乃至飲唯己一身過未深故属下輕垢酤多人故今制重又為菩薩二利之中利他為㝡但乖益生已為非理况乃成故非所冝文問生罪之時結此罪欤荅不尒也即下自釈云酒已属彼即為究竟文明知酒前人手取位即犯也然而摽生罪者為顕酟酒之過重摽之也非明結犯分齊云云二述釋二初制意二初制戒意二初躭酒過文集云智論十三曰酒有三十五失何等三十五一者現在𠀍財物虚竭何以故人飲酒酔心無節限用費無度故二者眾疾之門三者闘諍之本乃至六者䨱沒智恵乃至八者伏匿之事盡向人九者種事業不成弁十者酔為愁本等云云同善生經第三曰若復有人樂飲酒者是人現𠀍喜失財物身心多病常樂闘諍𢙣名遠聞失智恵心無慚愧得𢙣色力常為一切之所哥責人不樂見不能修善是名飲酒現在𢙣報捨此身已處在地獄受飢渴等無量苦𢙉是名後𠀍𢙣業之果若得人身心常狂乱不能繫念思惟善法是一𢙣人因緣力故一切外物資產臰爛文二制下酤酒過此不共戒者問今戒至第十戒悉不共戒云云後四重但菩薩不共妙戒更非所論中間二戒亦号不共相不共故如前四重雖名不共躰可云共彼乎亦如後四重躰性不共故得不共稱乎荅付中間二重諸師解釈非一准元曉並遁倫記前六重悉名共戒今師并法藏後六重稱不共依此学者義解徃傳云致中間二戒共不共諸師解釈非一徹雖然何無相由躰共戒酤酒三十販賣中一類談他僧殘二謗並九十罪中随時可攝是故遁倫師及元曉名共戒元曉云第五酤酒戒大小同小乗上二眾同一切販賣犯第三篇下三眾者犯第五篇大乗中酤酒七眾同犯重文若由相大不共彼制輕罪此制重罪故今師及法藏号不共戒藏云上來四戒大小同犯名共戒自下六種小乗非重名不共戒文是故中間二戒躰性是共相大不共可得意也問由相不共十重俱相不共何獨中間二重号相不共乎荅於相不共有重凢今經孝順慈悲為前戒皆制修善利生障若依此義十重俱不共二於四戒分大小聲聞以断人命為夷罪以断畜生命為波逸提今菩薩戒𭣦至一切有命者盜至一針草同得波羅夷名由此亦四重俱号不共是二重由此二義文集注文梵廣本但後二戒相不攝律儀云云雖如是不共前四重猶𭇥断人命過五錢等俱名夷罪則有全同義故亦名共由此今師並香象大師前四重号共戒三酤酒談他雖大小同制小但制輕罪大但制夷罪不同前四重有一分全同義是故但云不共也是三重問中間二戒躰性全共若犯時可致律儀懺乎荅付此亦異義多至下輕戒第四十一戒具抄之亦有躰性不共傳云云同至下戒抄之二或下列次意或對五戒等者法藏云第三次第者前四同聲聞四重此戒非彼故在第五又五戒於此當第五不飲酒戒但以飲唯己一身過未深故属下輕垢酤多人故今制重文円公有義云以法藏挍今明此戒列次意有二意可料蕳也此不共戒者第一意也凢列罪自至細故十業道門列身三語四意三此戒亦如是是故先列共戒列身三語一畢身業尤語業次故酤酒已下亦不共戒故亦由身業先列次及語意不共中酤酒身業戒冝可為不共第一所以亦列不共戒配立身一語二意三也由此云此不共戒當法藏此戒非彼故在第五解釈也或對五戒等者即列次第二意也當藏次釈也依之難科文云大背文相云云若不分二意或言對何乎今案云藏二釈見但向今此不共戒為列次由諒難思或言科文意亦無相就釈列次可有多意且出一意故云或也如是諸師常習也不可始驚矣二餘下釋文二初𢝰指四門補行文集云經曰若佛子至教人酤酒私曰犯相門酤酒囙至酤酒業犯性門一切酒至起罪因緣境界事門而菩薩至波羅夷罪結成罪門云云二具下略釋二門二初釋違犯性酒已属彼即為究竟者法藏云前人領入手便犯文義云方便究竟者一云授與人時便犯不待前人飲與不飲一云待前人飲方犯文勝莊亦有二尺與此同雖義勝莊及兩尺今師並法藏但前人領受便犯欲樂既求利究竟何待飲若尒領受便犯解釈尤可勝欤云云二事下釋境界事唯除破僧者智論云多聞持戒有清淨人方能破僧文飲酒酔乱者其事誠難作故也經明逹之恵者矌云明逹恵者實相般若也文曉云明逹恵者照理為明知事者為逹文已上酤酒戒畢六談他過失戒二初牒經補云藏云第三次第者於此十戒初四同聲聞四重後四同瑜伽菩薩四重中間更加酤酒過酤酒顕故先弁過細隱故後論文又云問何故不制佛及法過荅以彼無過故若無失而即是謗故属第十戒修行之者劣位有失易嫌故是故制也文問所罪過為通輕重但重罪荅諸師解釈不同莊云言罪過者自有兩釈一云他十重七逆罪者犯他勝處法若輕罪是輕非重一云不論輕重但是壞他利養及恭敬故彼過罪皆是犯重文具出兩尺俱無取捨云具緣中事者謂有戒人所有罪過向無戒人七逆十重是正所制自餘輕過亦兼制也文同下云輕戒第十三戒下也向無戒人有戒過若重罪犯重前戒正制若輕過犯輕前戒兼制文義記云所過者謂七逆十重文則天台義兩師但重罪見於今師解釈雖不分明但七逆十重見下問荅於七逆十重分別之故知但重罪見就中今師多分同義法藏時有不同自即破之然今不分明明重罪仍今師解釈同可得意也况解釈趣同彼釈上更不可及餘義也八云見制意云佛法過必壞他信云云無蕳但云過故知寬通輕重之可成此戒犯云云此義恐不足言也制意為顕過重通漫举之結罪必不依此如酤酒戒举酔乱失究竟但取前人領受如是諸戒常例何不明文相始終𭤽立非義冝捨此義勿守株矣二述釋二初制意二初述過彰名佛法過云云述云問此戒所制通三宝欤將限僧眾欤荅佛法二宝無過失也若但謗者犯第十謗戒故此戒唯限僧宝有凢聖二位於凢僧者行有持破故此過之時犯此戒然而佛法二宝並假僧𭤩若僧壞之時佛法随滅故云尒也云云二如下文示苦二初苦果如文二大智下先蹤大智論云等者准彼論勝意者是文殊因位也喜根比丘無戒者以現破戒相云無戒非謂一向無戒也論第八云先過無量阿僧刧有二菩薩比丘一名喜根二名勝意是喜根法師容儀質直不捨𠀍法亦不分別善𢙣喜根第子聡明樂法好聞深義其師不讚少欲知足不讚戒行頭𨹔但諸法實相清淨語諸弟子一切諸法欲相嗔恚相愚癡相此諸法相即是諸法實相無所𦊱㝵以是方便教諸弟子入一切智勝意法師持戒清淨行十二頭𨹔得四禪四無色定勝意異時入聚落中至喜根弟子家於坐處坐讚持戒少欲知足等呰毀喜根言是人法教人入邪見中是欲嗔癡無所𦊱㝵相是雜行人非純清淨是弟子利根得法忍問勝意言大德是欲法名何等相荅言欲是煩𢙉相居士言若欲非內非外非東西南北四維上下來遍𣱵實相不可得是法即不生不滅若無生滅空無所有云何能作煩𢙉勝意聞是語已其心不恱不能加荅從座而起如是言喜根多誑眾人着邪道中從居士家至林樹間入精舎中語諸比丘當知喜根菩薩虚誑多令人入𢙣邪中何以故其言欲恚癡相及一切諸法皆無㝵相是時喜根作是念此人大嗔為𢙣業所䨱當墮大罪我今為甚深法雖今無所得為作後𠀍佛道因緣是時喜根集僧一心偈欲即是道恚癡亦如是三事中無量諸佛道如是等七十餘偈時三万諸天子得無生忍等是時勝意菩薩身即陷入地獄受無量千万億歲苦出生人中七十四万𠀍常被誹謗是喜根菩薩於今東方過十万億佛土作佛其土号宝嚴佛号光踰日明王文殊師利言今時勝意比丘我身是也文問以何義煩𢙉即是道乎荅莊嚴論會之云由離法性外無別有諸法是故如是煩𢙉即菩提依理會之於貪起正思於貪得解脫故貪出貪嗔癡出亦尒於事會之云云初會釈之意云法性之外別不可有諸法何煩𢙉之外別有菩提道哉是故煩𢙉即菩提也次會釈意云於貪煩𢙉起正思惟觀察思惟貪躰相遠離之者即得解脫由此義煩𢙉即道也嗔癡亦如是實非三毒則菩提欤凢欲即道諸法無行經也云云又不思議光等者彼經云尒時毗婆尸如來法中有二菩薩一名賢天二名饒財賢天菩薩於無上道得不退轉得𨹔羅尼彼時饒財菩薩習学頭𨹔為賢天菩薩作給使彼人恒徃聚落城邑多諸事務是賢天菩薩呵責教化彼便生嗔念以忿恚故毀敗身心敗身心已嗔恚罵詈輕賤女兒私通所生從他人得不識其父又不識母况汝當有戒聞定恵彼嗔罵已後不悔過恒有忿心嗔賢天菩薩賢天菩薩即便捨棄既捨棄已倍生嗔恚罵詈揚𢙣以此不善業行因緣身壞命終生女胎為彼賢天菩薩所護不生地獄女生已恒常棄之為𤜶狼犳之所餧食大王以是因故九十一刧常如是死生常棄為多人眾之所罵詈是女子被棄空處𤜶狼食彼饒財今此不思議光菩薩是也彼賢天菩薩今名曰德藏文二釋文二初違犯相門二初標章配文如文口字現流布本無之所覧不同乞二今下兼境界事四初畧標述云初門兼攝境界事門者問餘戒無此義至此戒犯相門攝境界事門有何故乎荅此戒出家在家菩薩比丘尼四眾之過之時犯今戒依之有名四眾過戒之人師若犯相門無左右如𭣦生戒等若自罪過教人過等云者一切眾生罪過談之者皆可犯此戒疑之故為蕳之故初門兼举之也二此下釋文三初菩薩初二受菩薩戒者瑜伽四十云云何菩薩一切戒略有二種一在家分戒二出家分戒是名一切戒又即依此在家出家二分清淨戒略三種一攝律儀戒二攝善法戒三饒益有情戒文二聲聞後二聲聞者法藏云問此中何故制小乗僧尼過哉荅俱是佛法相住持故是自內眾故文文集注意比丘攝沙𢏏比丘尼攝式沙摩尼沙㫆尼𢝰攝五眾也三俱下𢝰結如文三若下决難二初舉難如文二猶下釋難二初立義文意易知傳奥云大悲經出家人左手男右手女從一酒家至一酒家不出賢刧當般𣵀槃是故於彼不應過文又金剛般若𮚌述云慈㤙龍樹釈云如有七宝處金為最大乃至無好物處䥫鍻為㝡大如是有三宝時佛㝡大乃至於末後時破戒僧為㝡大等文二如下證二初證菩薩二眾本業經下云其受戒者入諸佛界菩薩數中超過三刧生死之苦是故應受等已下如今引二又下證比丘比丘尼二初文占匍花者抄枇第五云瞻蔔花者中梵正音瞻愽迦此云黃花而小香西𫭫多有文或抄云樹似躑躅香甚芬馥文若有戒若無戒者一義云此句於破戒中約失戒不失戒述之欤謂以中下犯之者不失故有戒上品犯者失戒故無戒也云云一義云可云無十三難等得戒故是有戒若身具十三難等者不得戒故則無戒也此本受不得者也常途無戒者非此所論云云一義云大集月藏經云若有為佛剃除髮被服袈裟不受禁戒其𭃯利王與作𢙉乱罵辱打者得幾許罪佛言若有人於万億佛所出其身血得罪多彼文准此文今云無戒者為解脫出家剃着袈裟未受戒者欤此等人過所以其罪重者同經云何以故如是為我出家剃髮袈裟片雖不受戒或受毀犯是猶能為諸天人示𣵀槃道是人便已於三宝中心得敬信勝於一切九十五道其人必速能入𣵀槃勝於一切在家俗人唯除在家忍辱者是故天人應當供養文二解云下解意述云問五逆七逆中有出佛身血豈不障道乎荅自雖障道於佛多人未壞信又佛無生煩𢙉有此道理故云不能障道等也云云四是下結勵三初勸求德麟𭺸聖者從喻為名獨覚作𠀍無二佛國無二主思三千界中一人出現如是彼獸國君有道希出現故以喻比也蕳正記云此麟形如馬有一𭺸京房云是肉𭺸非骨也尾似牛脚似人手𤠸蹄頭有五色腹下黃高一丈二尺壽二千歲三千年一現此獸有德行不折草木不踏䖝蟻不入羅不寄穽之中亦号為似人獸君王有德則現堯時曾獲麟於野文有失可取等者俱舎光記二十九云若於有情樂求德者乃至以於断善者有德可錄先福業果貌端正等現可見故若於有情樂求失者以於麟喻獨覚有失可取先罪業果貌黑疲等現可見故文若由文集意以自利心為失云云大順文意断善德𣵀槃文出佛性意頗異光記若尒麟𭺸失必不依形㒵欤金般若讚述云基龍樹釈云如有七宝處金為㝡大乃至無好物處䥫錫為㝡大如是有三宝時佛㝡大乃至於末後時破戒僧為㝡大故經云瞻愽迦花等文二如下證求德𣵀槃經二十四曰菩薩摩訶薩雖見眾生諸𢙣過咎終不之何以故𢙢生煩𢙉若生煩𢙉則堕𢙣趣如是菩薩若見眾生有少善事則讚歎之云何為善所謂佛性讚佛性故令諸眾生𤼵阿耨多羅三藐三菩提心等云云三𠀍下誡談佗二初正誡如文二如下引證二初大集經補云十六行云等者師云十六行中無此文即十六行隣近文叚也故尒云也云云大集經二十六曰復有五種一持戒已不生憍𢢔二見毀戒不生輕𢢔三見持戒心無嫉砳四終不求聲聞之乗五者不念辟支佛乗文二諸下無行經久亦得道者法藏云又大慈經中出家人左手男右手女從一酒家至一酒家不出賢刧當般𣵀槃等是故見有少許佛法所被之處皆應讚歎文二結成罪門三初𢝰摽章配文經外道𢙣人及二乗𢙣人者銑下云一者外道二者二乗之人謂初心者若是得果以無我見不合他以初心人不信大乗人過亦名𢙣人即如諸部小乗不信大乗者是乃至即是外道通佛法二乗別大乗之過言惣意別文矌云言外道者除七眾外並名外道外道即𢙣人也二乗𢙣人者乃至利他心劣乃至此心即𢙣名為𢙣人文二言下別釋常生悲心想似㓛德者瑜伽四十六云又諸菩薩略有五種相似㓛德一者於其暴𢙣毀犯淨戒諸有情所由是因緣作不饒益二詐現種足威儀三者於順𠀍間文詞咒術外道書論相應法中得預智者聡者數四者修行有罪等善行五者宣建立像似正法廣令流布文三問荅决外疑二初問下輕戒云若佛子以𢙣心故無事謗他良人善人法師師僧國王貴人言犯七逆十重於父母兄弟六親中應生孝順心慈悲心而反更加於逆𡧱堕不如意處者犯輕垢罪文二荅二初同法異道荅如文二或下無事有事荅補云問今荅文有二尺為相違釈為𨕙釈荅八云𨕙釈也非相釈謂實犯向異道為重罪不實犯向同法是輕罪為言問實犯向同法不實向異道其罪何荅俱輕也云云傳云見今文叚不尒二尺俱相釈依初荅不問實不實向異道為重向同法為輕次釈不問同法異道實犯重罪不實輕罪為言義輕戒下有兩釈分明如是見仍今師例同可得意也問若相釈以何可為今師正義乎荅以第二尺為正上文言若實有犯過何失文今戒但實犯欤下輕戒名無根謗毀戒無根俱輕亦分明也加之彼戒下釈云離三根故亦言無事乃至於彼自行通輕重故文則付有根無根蕳大小乗不同實犯重不實輕旨分明也同法異道釈餘處都所不見仍為不正義以初同法異道釈為正重戒下云具緣中事者謂有戒人所有罪過向無戒人文致第十三戒名不毀良善戒以第二實不實釈為有人義故知師以初釈為正今師以第二釈為正可得意也云云彼云云文字倒可作彼也云云問今戒究竟時分何荅法藏云七前人領解故成犯也文已上第六談他過失戒畢後四重惣分別補問瑜伽論中於前後四重出随順根本二種得名云何配當乎荅諸師釈不同義并集解意則以前四重名根本四重三乗根本故後四重号随順前四重故又今師并勝莊等以前四重為随順以後四重為根本宗要云無𢙣不由貪嗔癡者亦無不為好推𢙣所以後四為根本重文乃至今後四重戒皆有為根本重言故後四重根本前四重随順今師所存欤勝莊抄畧之問宗家意何荅同今師解釈勝万述記云唯持其性非唯重非輕唯根本非随順也於中有四即四波羅夷文出後四重故知宗家以後四重名根本明鏡而集解釈以宗家同師所以不見勝万述記也問後四重結犯待語言方成其犯亦但居意地得重罪稱乎荅讚毀一戒必待語言諸師一同更無異解經言自讚毀他等釈云四身三語仍無相於慳戒已下三戒人師解釈不同等云云委細如補忘抄必可見之也七自讚毀他戒二初牒經自讚毀他者法藏云顕揚己德為自耻辱有德名毀他防治此失故稱為戒文此戒名者依通途犯相摽名亦有自毀他等犯相至下釈叚可知也二述釋二初制意二初明義通一切二初儒教且孔丘云等者不內典先儒教故云且也史記云魯𮕱公二十二年孔丘生名丘字仲尼姓孔氏長九尺有六寸文朗詠注云孔子之名丘也頂凹如尼丘山頂故名丘也孔子之頂凹可容三合又名孔丘又名仲尼又名宣尼也文天台止觀六云我遣三聖化彼真等文𭤩决六云清淨法行經云月光菩薩彼稱顏回光淨菩薩彼稱仲尼迦菩薩彼稱老子天竺指此震旦為彼文𭤩明集少異之吾有一言等者論語第八云子曰君子不以言舉人苞氏曰有言者不必有德故不以言舉人不以人言子貢問曰有一言而可以終身行者乎子曰其怒乎己所不欲勿人文二此下明此戒義通一切者凢此戒意𢙣事自向己好事與他人是為正行而反好事自向己𢙣事與他是為所制過此義者通諸戒如𭣦盜等比之可知毀之言雖限第七戒其義理通一切故云義通一切也宗要云𢙣無不為好推𢙣文二菩下明為根本重誓處生死者若由三類各別傳且依悲增一類尒云也若依大悲為躰傳俱通三類也述記云六七以前代諸有情受三途苦乃是實身文二釋文四初違犯相門二初摽章配文云亦教人自毀他者此有二一教前人彼自德毀他人失二教前人我自德毀他人失二俱應犯文初釈律常教人也次釈律所謂遣使也俱同犯重撲揚云畧無喜文今師意同准盜戒可解云云私云經口自毀他者御所覧異欤二必下随文畧釋三初釋文別別毀別得兩輕者付此義法藏兩師解釈不同云又要毀方結重若毀而不而不毀唯犯輕垢或先後毀或先毀後但令運毀心𬾨二結重先後毀時方便輕毀時成本重先毀後亦尒如尼八事一作時方便故蘭具八事時方結夷罪若單欲或單欲毀雖前後具二別結兩輕不成重也如断心數取四錢不成重也文今師解釈與此同也藏云一單自亦重如善戒經彼云菩薩若為貪利養故自身德犯菩薩戒住地是名菩薩第五重法樓戒經亦同此二單毀他亦重如此文云他受毀者犯重故文則與今師解釈不同問如藏善戒經文但自得重見如今經毀他因毀他緣等但毀他亦得夷罪見若尒藏師解釈頗本文今師云何會之荅由今師及師義經且举一𨕙可會奥云畧於自理必有之文今經且举一途證也又勝莊䟽云瑜伽第四十云若諸菩薩為欲貪求乃至并善戒經及地持論亦同瑜伽文既以善戒同瑜伽若尒彼亦且举一𨕙也云云述云重云今經及瑜伽論等之意必具二義可成重見今經云若自揚己德隱他人好事令他人受毀者是菩薩波羅夷罪文瑜伽云為欲貪求利養恭敬自毀他是名第一他勝處法文若單自單毀他者好推𢙣二義各闕二義故非重也云云一別毀輕罪與第六戒差別事補忘抄有問荅略之一第六戒與第七戒不同事補云一前七逆十重此通卑賤等事二前實犯此通實不實三前依境意此依希求利養意四前但毀他此通毀應作四句一第六非第七雖七逆十重無利養意二第七非第六如他種姓卑賤形相好𢙣重自德貪求利養三亦六亦七他七逆十重作境意貪求意准謗妄離合可分單腹四俱非形相好𢙣無貪求意是也次輕重相望亦可作四句一第六第七非輕戒如前俱句二輕非六七如貪求利養他種姓卑賤即不自德有貪求意故犯此戒方便不具自故亦非重罪不重過故亦非第六三亦第六亦輕非第七他實犯七逆十重作境意樂作貪求意樂故具犯輕重二戒但不自故非第七重四俱非如盜𭣦等餘戒非輕亦非六七故云云問第六戒但境上玄談云三語由三得究竟文第四六七三戒依三毒究竟見若尒第六貪心犯必非境欤若非境但以貪心犯第六罪與今戒別毀何異乎荅第四六七三戒依三毒究竟其罪更非所論云三語由三得究竟故但由貪究竟境義可通欤欲得自利養若不言沒他我利養難得是故無恚但為利養境心方生是名貪談他也若尒以境意七逆十重方則犯第六由貪求利養心別毀𨕙得輕罪也云云有義云七逆十重一切第六犯縱別毀不可得別毀輕今言別毀得輕且由餘別毀不由七逆十重也二猶下例如文三餘下指廣宗要云若於自他毀必罪設毀者亦是福耶謂有四句或有毀罪毀福如次他𨕙𡧱故饒益故或有毀福毀罪摧邪等故倿利故或有毀亦福亦罪毀亦尒謂順淺小深廣等或有毀非罪非福謂如彼心增上狂乱或重苦逼或未受戒無記所作文二違犯性門二初標章配文法藏云具緣成犯者具六緣一正境謂自他二起彼想三作毀意四為名利等五正加毀六前人領受毀便犯文二次下業重相攝問前以三語随相攝第六第七了今又出其義似無用何荅此可有別所以欤意既於犯性門攝之犯性門以五支成犯究竟門也瑜伽論中於離間等出五支相以彼五相可知第六七犯相為言依之今此以第六七相攝離間等見十不善門無第六七犯相故其相以難知寄離間等如此所釈也其意尤可然也云云妄語雖通等者法藏云解云此中亦攝𢙣口兩舌𦂶語等三從首為名以過患相起故智論云四種口業中妄語實重故復次但妄語已攝三事後次諸法中實為㝡大若實語四種正語皆已攝故文准此等文得意今解釈妄語中雖通餘三前第四戒別既制妄語一種故彼不攝今第六七兩戒攝餘三種也法藏等意妄語中攝餘三智論等文亦尒然而今師御意不尒故安雖字痛之欤或可云第六七戒中通雖容有妄語前戒既為一戒制之故不攝妄語也為言三略下境界事門二初示文闕補問畧無第三境界事門者今師以何為境界事哉荅八云以所毀事所毀人為境界事云具緣成犯中事者有二一所毀人二所毀事大賢意與此同欤云云若由科文意然下論補文則以貪求利養恭敬為境上云畧無第三次云然瑜伽云等以利養恭敬為境界事旨明若以所毀事人為境界事第六第七全無異若以利養恭敬為境二戒都無混乱兩義不同得失遙明云云述云此科文義不審凢境界者以為所毀者為境界事利養恭敬所求非如此之事也全非出境界事也所毀何不為所毀境界事哉但瑜伽文為顕毀戒犯相也云云此事可思之二然下論補二初論文私云瑜伽論前四重讓律部唯後四重故云是名第一他勝處也二是下解論意二初正出論意如文可知之二若下點嫉妬重補云但由嫉妬等者瑜伽但出貪心犯今依勝經釈之也唯識論六云嫉妬者聞見他榮深懷憂慼不安隱故此亦嗔恚一分為躰離嗔無別嫉妬相用故文鏡水抄云問疾妬何別荅緣他人學問道德名嫉緣他人榮樂名利稱妬又見外相名妬見內德名嫉文問依嗔毀無利養希求心乎荅有人云既云以嗔究竟無名利希求心也若有希求心則以貪究竟也非嗔犯故云云今案云此義不尒既此戒境界事者利養恭敬也何但貪犯不通嗔犯境界是一貪嗔方別若依貪嗔境界更別大背文相是一亦以希求但属貪此亦不尒希求行相則是別境中欲心所也若尒欲心所但與貪相應不相應嗔乎是二又今嗔犯者源出勝彼述記云深生嫉妬所有造作皆為名等今既無嫉所作不為名等也文嫉妬猶希求名利證㨿誠明是三問若尒貪嗔二犯別云何荅欲利養恭敬毀是名貪犯雖希求名利意猛利我今利養思不可叶以嫉妬心毀是号嗔犯也雖貪嗔別何為名利也云云四第下結成罪門二初釋正行私云科文正行者指利他行欤二下反結罪二初正結罪如文二若下因釋疑二初問如文二謂下荅云前人無道毀菩薩時菩薩作念如有的箭中無則無所中由有我身故眾生興𢙣無我身則無由起𢙣由我𢙣在我也是則𢙣事自向己也又作是念由前人毀我故我得修戒而防若無前人我善何緣而生生善由彼善在彼也是則好事與他人也文藏云問若自無𢙣而認若他無善而推豈非諂曲而妄語乎荅自居不足安得無失謂無失者唯佛一人以累盡故又他無餘善猶有佛性即是真善若意至此而認推者非直無諂亦無妄語而乃具𤼵無量善根令戒清淨故為持也文八慳生毀辱戒二初牒經云菩薩地中直云不財法不言加毀應名不恵戒秘財法名慳罵辱前人為毀從所防過為戒名也文法藏云云何故嗔依本名貪就慳性謂嗔障慈悲乖菩薩行重貪或容有順悲愍故是故約慳慈齊文同云次第者前毀自他以求名利望未得之財追求時過今約已得属己慳不捨之財貯畜時過前此細義次第故來也文一補云自下三戒未待語言慳心决定可生毀辱則犯重罪都不可業道門依此文集後三業道配當自下三戒此戒當貪欲業道而業成少異是故文集注文釈不同云此戒以慳自有為制業門以欲他財為罪當以業門准知之耳文業門以貪欲為罪於他財物作决定属己思則成究竟制門以慳心為罪故於自所有慳心决定可生罵辱則不待語言結之也唯識論釈慳相云躭着財法不能恵秘為性能障不慳畜積為業文今戒犯相准此可解但慳三雜染中惑也未為此戒犯故浮現業則為戒所防非由此取慳心决徹可生罵辱裎意則為犯也一問此戒必對乞者不與方犯重罪亦雖無乞者慳心决徹故若有人乞時應生罵辱雖不對人應結其犯乎荅有人云必對乞者方犯重罪法藏云具六緣成犯乃至二乞者現前乃至六前人空廻故犯也第五闕緣義者乃至次闕第二緣乃至無乞不犯乃至雖無乞者而不捨福田乃至皆得方便罪非正犯重文今師解釈雖不分明准經文随前人所湏等文依香象大師解釈必對乞者方起慳即犯重罪但無乞者起慳心可犯輕罪也云云師云勘今上下文叚縱雖不對乞者若起慳恡假令有人乞之可生罵辱則可犯今戒也上文云自慳即成慳文不對人犯今戒分明亦下戒云非眾生不懺謝若對起嗔亦成犯取意彼既不對情境亦犯重夷今戒例可尒若尒法藏釈自本別師解釈更不及會文私云今慳生毀辱戒意必至罵辱犯夷罪欤事五怗抄論義也可見之一文集注文經畧無境界事門文問云具緣中事者謂所辱眾生及所惜財法所惜財法者文云乃至一錢一針一草等文既經文明出境界何注文云畧無乎荅別不立境界事門結成罪門中有而但出㝡下一針一草等其躰實狹由此且云畧無論文廣明之也云云私云經自慳教人慳者犯相門也經慳因慳緣等者犯性門也經而菩薩見一切等下結成罪門也故別無境界事門境界事門結成罪門加欤二述釋二初𢝰明佛制戒意二初述不慳財意留生死身者瑜伽四十四云為益諸有情故誓受長時生死流轉文同四十七云於內身命尚能恵何况外物文二故下述根本重意故慳障等者法藏云初制意者初檀為万行首故攝六度故是捨慳成文多求廣等者五戒威儀經云菩薩為他人故從百千非親里波羅門居士盡力所求衣鉢為他人故應乞縷等文故為輕罪者問指何戒云故為輕罪乎荅有人云為利益令多求廣若不多求廣則制輕罪文集引五戒威儀經其意如是云云今案云文集且為顕多求廣相引五戒威儀經文凢今文意此戒不制貪心則制慳心為顕貪慳不同如是釈意云雖慳由貪起貪猶有順大悲義依此染𣲇貪制不為重罪愛順大悲故罪為劣意也瑜伽論第二十三輕戒云若諸菩薩安住菩薩淨戒律儀起貪欲蓋忍受不捨是名有犯有所越是染犯文今指此戒云故罪為劣也若由多求廣不起貪欲方為犯罪若為利益起貪欲大順大悲由此莊嚴論云由利群生意起貪不得罪文何指順大悲多求廣云貪不深乎若云不深有少分若有少分制令多求廣聖言頗𢎨揗者欤故知為顕貪不深由引多求廣非云指多求為輕罪云云私云多求廣事五怗抄論義在之可見之也二釋下別釋結成罪文二初正行二初釋所境二初牒經文經一切貧窮人來乞者藏云但𠀍人貧有二種一財貧二法貧故云一切也菩薩此二事故云一切給與文撲揚同之二菩下論文二初文意二初有勝利欲以財攝易化導故者智論四十五云問曰佛何以檀為初門荅曰攝眾生法無過於檀大小貴賤乃至畜生檀皆攝之乃至𭜨家得則為中人得則成親善文二若下無利不二初摽義瑜伽論三十九云謂諸菩薩若知種內外物於彼眾生唯令安樂不作利益或復於彼不作安樂不作利益便不與若知種內外物於彼眾生定作利益不定安樂或復於彼定作利益定安樂即便與文凢利與樂相對有多別然今此意以濟後𠀍為利與現𠀍樂為樂又以出𠀍為利以𠀍間為樂欤云云二何下徵釋如文可知也二此中下指廣文二初正指如文二略下略攝是弁攝眾生戒文彼論長行也而今賢師以義作略攝頌述彼六處也所謂自他財𮕱財盛法𮕱法盛是名六處也全文如文集遁倫記云即失於三學失於三恵名為法𮕱與此相即名法盛菩薩為他經管財物給眾生自失三恵及失三学此不應為文問菩薩利他為先設雖自𮕱何不為此乎荅此亦不為自利化度眾生以法可攝之故云不𮕱自法也是以幽𮚌中釈輙不與法之義云若不增智資糧當豐巧恵亦為愛念此及餘生若彼時便唯念此如是不非淨戒等云云二言随下明能三初牒經文如文二七下論文二初瑜伽明別二初文如文易知也論文彼所者所從也云云指上僕從欤二今下會經如文二如下十住明意十住毗婆論第四云身如藥樹眾生有用根荎枝花實等各随意與取無護菩薩亦如是為利眾生故能自捨身作是念若眾生取我頭目手足支節血肉骨髄等随其所湏皆能與之文問如彼論文者喻菩薩於身肉手足無恡惜也然而今所喻意似無想無所得之心云何相乎荅一徃釈文相之時似不同深案義理之時還彼此同其所以者若有惜心者設雖身肉等必定可有分別之心若有所惜能捨與之者随分別心以所物人故依之於彼眾生謂有重恩還欲受報恩是即有分別也無恡惜心者反之其相可知也故今師深得彼論意之令知意也三若下釋疑難二初標問如文二不下解荅二初略攝頌未許者人不許物也自無能者我力不堪物也二菩下廣解釋三初釋有㤙故不二初依有利無利身命者瑜伽論三十種不中二三四五四種也毒刀酒等者第六不也以上并無利益時不之故云不若有利之時者開之故云但有義利與也云云二父下設利不父母師長等者第十七不也是無開文故云定不應也瑜伽論云若有來求父母師長定不應何以故諸菩薩於其父母尊重師長乳哺養育有㤙者於長夜中常思頂戴不生猒倦恒持自身繫属随順任所屠𡧱捶貨買尚自不敢竊壞心何况顕然來求者文二言下釋未許故不二初標分如文二一下解釋二初他所有未許他所有者我妻子等之物也有罪福者瑜伽四十六云出五種相似㓛德中第四云四者修行有罪等善行文二自所有未許二初標章論二初論文二初明不能二初未許述自所有者直我妻子等也准藏瑜伽三十種不內第十八十九兩種也從初至來求者是第十八不之物也自雖復曉喻至作奴婢者是第十九也云云二雖下已許如文易知述云問第十九雖復曉喻等之人已是許何科文言下釈未許故不云属未許科乎荅隣次上第十八未許科故𭣣之也云云二不以下明不意述云不以妻子等者述上𭜨家𢙣者所不人躰及其意也准此非𭜨家𢙣者者雖妻子耎姓男子可之欤云云同問正見今經文随前人所湏一切給與云云設雖作奴婢前人有乞求者何可惜哉是以湏逹拏太子對波羅門兩兒令作奴婢見尒者今論文如何荅布行相随位可有其不同何必可一准哉菩薩意樂於一切眾生平等可愍之以姓男女等𭜨家𢙣者令生苦𢙉者平等慈悲似有所闕但今經云一切給與正言曉喻令生歡喜又來乞者非𭜨𢙣之人者可有與欤或又得忍菩薩頭目皮骨一切可之故至深位行如此布欤今論文云不以妻子等或對𭜨家𢙣者或指不曉喻之類或付淺位相或依不歡喜之類如此欤尒者經論一徃無相者欤問梵初心外門戒何云深位之所作乎荅梵唯非初𤼵心既云十地諸菩薩等𢝰舉五十二位故無相也云云補云有人難云今論文三種見初一切曉喻可與來求者是一叚次雖復已下有二叚初雖曉喻不與𭜨𢙣者是二叚次不以已下雖復曉喻不以耎男女來求者是三叚而科文不以下明不意文甚背論文如何荅師云本論文尒也但今師之後湏太拏太子𬾨問荅之言彼亦曉喻故知曉喻亦可也故上云不曉喻不付耎男女言之雖姓男女曉喻亦可為言惣今問荅趣少背道理挍論藏太子所行大而今俱會釈與論令同深有意趣為顕如來因行不思議事假問荅故順今文科文如是科若由本文科之次問荅乖各若由實理如本文可分三叚問若尒湏太拏太子所行云何會之荅深位所行仍不可為難云云問太子何位号深位乎荅有人云十囬向中第六廻向花嚴經二十一云第六囬向乃至布妻妾男女如湏逹拏太子現莊嚴菩薩文既出第六囬向湏逹拏太子故知第六囬向位云云師云為顕布男女行相引此举上例下處常例不知登地所行未以此文成明證追可尋之矣二此意下解意述以下文者今師述上兩種不之意也二若尒下問荅决疑二初疑就前科曉喻之言難之也二彼下釋二初正釋述問前云不令𢙣者姓男女作奴婢云何太子以兩兒波羅門令為奴婢乎荅是波羅門非𢙣者故之給欤問尒者何兩兒不肯随去以鞭捶之而出血流地乎荅𢙣者者或作十𢙣五逆不律儀人欤或又非理逼𢙉他人或又𡧱誑惑於人等人也然而是婆羅門者非如此等人以兩兒不去為欲從随打之計也敢非無慚放逸打之欤文意易知二問下轉難二初以不去難西𫭫記云三國乃至彈多落迦山旧曰檀持山誤也乃至有都婆太子於此山以男女婆羅門其男女流血染地今諸草木猶𭘧絳色文述云太子淚下者此父湏逹拏太子淚也云云二荅下以待母荅女良反也云云平聲陽唐也又如常反三言下釋自不能不二初正明三初明非分不如文二為下非分退智論十二云如舎利弗於六十刧中行菩薩道欲渡布河時有乞人來乞其眼舎利弗言眼無所住何以索之若湏我身及財物者當以相與荅言不湏汝身及以財物唯欲得眼若汝實行檀者以眼見與尒時舎利弗出一眼與之乞者得眼於舎利弗前嗅之嫌臭唾而地又以脚蹹舎利弗思惟言如此㢢人等難可度也眼實無用而強索之既得而棄不如自調早脫生死思惟是已於菩薩道退廻向小乗等文補云問鶖子退位耶實乎荅天台花嚴云退不思議境界經云花嚴賢首品同品異訳也舎利弗等五百聲聞皆是他方極位菩薩文由此等經文云退也法相宗意付舎利弗有實二類花嚴七處八會中前六會舎利弗是不思議境界經由此尒也入法界品已後舎利弗實類此舎利弗古三千塵點當初智勝如來所預䨱講法花莚𤼵菩提心既至第六住而遇乞眼緣趣小乗淺近行是實退也法花論中如是見由此宗家實退云云而今示退之迹者退見宗学者云今師本花嚴宗人後改宗随本習如是釈攝釈中釈云鶖子行誘實人文是退見然而撲揚大師本天台宗人亦由串習釈之例彼得意因旧古本宗主退釈唯識学記二尺恐繁不問玄賛云不退有四一信不退十信第六名不退心自後不退生邪見故二位不退十住第七名不退位自後不退入二乗故三證不退初地以上即名不退所證得法不退失故四行不退八地已上名不退地有為無為法皆能修故文身子既至第六住則信不退位何故本業經云作大邪見及五逆無𢙣不造文乎荅宗大論也一義云雖實不造且毀行云作大邪見也亦開示抄中付信分事理二理信不退所以與目連同味甘露於事信猶有退是故云作大邪見也信不退且依理信也付鶖子退有重論義云云且注大途追可受学述云水抄云有三品𤼵心上品更不退生邪見中下品有退也不妨鶖子當時𤼵中下心文三如十下舉應分齊三初十住論本文如文集二由下毗尼經述云由此云云問指上十住論欤荅不尒也指凢今大科本旨也意云凢菩薩行依分可行非分行退菩薩行即如舎利弗是也故随分出家菩薩者行法在家菩薩可行財如是行之時不失菩薩行各成其行云云問云何經論所不同乎荅且經論各述一𨕙義故似不同其意趣互不可之也紙墨筆類財十住論意不可之亦金銀等重物財决定毗尼經意不可許之也亦在家出家菩薩相對之時在家菩薩法不及出家菩薩法故不之偏於出家菩薩明之若亦有勝利之時可許之故毗尼經許之十住論意不可之也依大途判之故不云有法也云云補云得忍菩薩者云得忍菩薩行三乃至得忍應是十解已上文勝莊云彼無生忍菩薩應行三文如十住已上号得忍勝莊師地上稱得忍經云得無生忍若尒勝莊師意叶經文欤云云三然下會大集大集十三云菩薩於如來所許念捨者所謂捨財捨法復次有捨身及命捨一切邪道文文集注云如是等文散在一部䟽主取大意惣加會釋欤云云二如下證本文如文集二言有下反結二初釋有求法者二初舉法二初明法勝𣵀槃經云若有能知如來常住無有反易或聞常住二字音聲若經耳即生天上文譬喻經云若有凢人深經一句誦之有心念自身中三毒四魔八万垢門皆不能忍何况採眾經法為𠀍福者文𡧘云四言為句四句為偈偈句不滿為法如欲聞無常言而不為此無常言不成句也文二如下廣指論經瑜伽第七十出五相一者戝於他身中𤼵起𢙣行法决定起諸善行二者財於他身中𤼵起煩𢙉法能令對治煩𢙉三者財於他身中無間𤼵有罪安樂法能無間令𤼵無罪安樂四者財若佛現𠀍若不現𠀍易可獲得法若無諸佛現𠀍難可獲得五者財與有盡法與無盡文八卷金光明經第二云其法者有五種事何者為五者一法彼兼利財不尒二者法能令眾生出於三界財不出三界三者法利益法身財增長色身四者法增長無窮財必皆有竭五者法能断無明財止伏貪心文二然下開不瑜伽三十九曰知欲秘藏亦不與不求勝智亦不與必求勝智若自了知於經卷等其義已辨即随所樂如應與文二言下釋而反罵辱三初明罵辱業果慳財反罵等者法藏云得報者略弁七種一生餓鬼中如目連母等餘趣受苦二疥野干乃至無一毛可以䨱身等三於人受貧窮苦六由慳法𠀍常受愚癡七由遲法眼恒無眼目文二瑜下明犯不犯別二初違犯二初染犯補云瑜伽中付不財由慳心不為重戒由嫌恨恚𢙉心不為輕罪則第三十八布障第三戒也今文引彼輕戒且顕犯不犯也云云二若下非染如文二無下無違犯永不冝物者毒刀酒等也王所匪冝者違勑人也云云三問以下因釋大集文二初問如文二頌下荅大集經十四曰妻子珍寳及王位臨命終時無随者唯戒及不放逸今𠀍後𠀍為伴侶文九瞋不受謝戒二初牒經補云云𭇥毒損人謂之嗔結恨不捨名不受謝亦從所防為戒名也文藏云第三次第者前慳貪次嗔恚故來也文此戒亦不待語言嗔恚猛盛不可受謝則犯重夷也云方便究竟者古云前人領解知彼不受被身口罵打結重随身口業多少結今謂不論前人領不領若决意結𭜨不受悔謝便結重也所以知然嗔即嗔恚業道乃至嗔恚業究竟者謂𡧱等期心决定故知不待前人解領文今師意亦三解釈與此同由此文集嗔恚業道也勝莊云五方便究竟謂懷恨心不受彼悔前人領解文嚝云六前人領解便犯文此等諸師待語言結犯見大不得經意也此師但心亦犯今戒見二述釋二初制意二初制戒意唯識論云瞋唯不善自他故文𦗟聞集云問安住淨戒菩薩起嗔恚煩𢙉之時必成犯戒罪欤荅未必然也云云論義也可見之也二菩下根本意二初標意述云菩薩捨二乗有餘無餘二𣵀槃住無住處𣵀槃利眾生也云云二如下證二初論經證補云如𠀍尊等者瑜伽則經也則當善戒經欤彼云若諸菩薩犯如恒河沙等貪如是菩薩不名毀戒若犯一嗔囙緣毀戒是名破戒何以故嗔恚之心能捨眾生貪愛之心能護眾生文二論下論解意釋二初論文二初解非貪所起二初解貪不犯私云所作者利益眾生所作欤二非下解貪亦犯非作所作等者謂非為利有情但由自情貪可成犯戒為言二若諸下解多分瞋起如文二解下䟽解二初述貪實亦犯如文二非下述瞋非通犯二初正釋補云但举顕相等者付此異義頗多且依科文三毒相望嗔自餘二毒第一顕然而於菩薩戒雖無無餘犯為顕嗔毒顕相經文偏举嗔恚深密無餘犯義且顕有無餘犯相意只為禁嗔如是由實理菩薩戒無餘犯極成畢由此上品邪見起時無餘犯義難立問之也仍訓文云但举相示義一義云但举以下属下問荅不釈上嗔恚實十戒俱雖無餘犯十中举顕上品邪見且示無餘義不許無餘犯同前義但付邪見得意為異仍訓文云但举顕相示義一義云但举等一句結上貪嗔相對示深等一句生下上品邪見釈也則結前生後意云貪嗔相對顕門雖無餘犯起上品邪見時可有無餘犯義為言此義於上品邪見許無餘犯義與上義大異也仍訓文云但举相示義云云已上三義俱八怗抄見第一義順科文道理亦尤然仍可為相羕實義後二義中初義少有其謂第三義於上品邪見許無餘犯義大背前後文相能思之云云二上品下問荅二初舉犯上品邪見者問三中上品名上品邪見乎荅不尒於謗有全分謗一分謗今指全分号上品邪見於此中亦三品荅中尒時唯犯一波羅夷者是亦通𣲇失二由三有不同故云云問上品邪見者與断善同異如何荅古義云上品邪見則断善云云師云此義大非也前後文相上品邪見唯犯一重不捨餘戒不同分心位捨戒見其不同分心者則断善前方便菩薩戒無断善捨云云瑜伽九十九卷云由此邪見為依止故有一沙門若婆羅門断諸善根文断善已前有無因果邪見見今指此云上品邪見則非断善也凢今師立随所犯支失戒律儀之義故於上品邪見犯重捨𨕙随所犯支失戒律儀也由不同分心有惣捨不可混乱為言付之有委細分別至下戒具抄之云云二尒下荅釋如上准可知之也二釋文二初指犯相犯性問今境界事門如何荅結成罪門中攝則情非情等境也云具緣中事謂眾生文師但情境犯今戒若由今師意通情非情如下應知云云二言下解結成罪門二初明正行二初標舉如文易知二謂下解釋二初標作三念者第一大集二卷出第二念同經二十五卷智論十五出第三念𣵀槃二十六出二一下釋三初念本淨如文二念本願如文三念彼㤙如文二言以下反結三初釋文以𢙣口罵辱者語業也加以手打及以刀杖者身業也意猶以下意業也二雖下釋疑二初述自解補云以所等起顕嗔重故者謂意地因等起身語所等起由嗔三業方𬾨以此顕嗔重為言述云此意地罪决定時結者此解釈祖師別義亦可亘前後兩戒俱意地戒故云云雖非眾生等者是述今師正解也今師意者木石等非情云非眾生則上文云瞋邪見亦非情今又釈不來懺謝故凢今師意不待猶瞋不解之位意地决定之位結故設雖非情若對彼瞋恚猛利起設雖來謝懺不可受謝懺裎心者可結重為言問今師意不待他來謝意地决定時犯何瑜伽云他來諫謝不受名他勝處哉何况云瞋不受謝戒其義云何荅瑜伽論顕所等起云尒也示意地决定分齋也次瞋不受謝戒名約經現文一徃釈之也云云義云今謂不論前人領不領若决意結𭜨不受悔謝便結重也文二有下有解述云有人意者必加刀杖不受謝位犯重故非情木石等無此義分故云犯輕也依之義師於木石等非情者不犯重釈巴云聖人名非眾生非處受生故云非眾生又云若非情名非眾生是深防語等文雖於非眾生作二尺於非情不犯重莊云於非眾生中者举輕顕重於非眾生嗔非犯他勝故文元曉明嚝等同之今摽有指此等諸師也三百下定躰二初徵如文二即下釋二初立義唯識論第六云云何為忿依對現前不饒益境憤𤼵為性能障不忿執杖為業謂懷忿者多𤼵暴𢙣身表業故此即瞋恚一分為躰離嗔無忿相用故文二如下證他來諫謝者問此他經文前人求悔人嗔所對人欤將傍人等欤荅勝莊云他者自有三尺一云懷嗔心時有餘善友他來諫謝作如是言何湏如是猛利嗔恨長老思擇更不湏嗔如是諫時不捨𭜨結犯他勝法非𭜨家來不捨𭜨結犯他勝法若𭜨來求悔不受其悔止輕非重瑜伽云一云所對𭜨家來求諫謝不受其悔犯他勝處所言他者𭜨家名他非善友他故地持云一云此中他者𭜨家及善友皆名為他問𭜨家來謝不受其悔犯他勝處如前所引輕罪何異解云若有𭜨家犯觸菩薩彼還求悔菩薩不受其謝是輕非重如前所引若此菩薩犯觸於他懷恐怖來求諫謝不受其謝不捨𭜨結犯他勝處故有別文義同之意云他來對我作過彼還謝不受為輕罪我對他作過他來諫我不受為重罪為言師云今師解釈必不如是嗔恚猛利及忿意樂則為重罪但由嫌恨意不受謝為輕罪云云瑜伽輕戒中第十七他侵來謝不受戒文云若諸菩薩安住菩薩淨戒律儀他所侵犯彼還如法平等悔謝懷嫌恨心欲𢙉彼不受其謝是名有犯有所越是染犯文問由忿恨分輕重恨猶可重所以者何唯識論釈恨行相云由忿為先懷𢙣不捨結𭜨為性𢙉為業文既云由忿為先故知忿輕恨猶重見今何㒹倒乎荅唯識論且由重恨一徃釈之若不至忿心所但起恨心豈非恨心所若非恨心所随煩𢙉中何攝當知及盆意樂犱杖為業嫌恨恚𢙉一切俱可為重罪若不及忿意樂嫌恨恚𢙉悉為輕罪文已上第九戒畢十毀謗三寳戒二初牒經藏云第二釈名者勝德可𭹀故稱三寳非理塵黷故名為謗戒防此失故以為名第三次第者前瞋次邪見故來也文問謗三寳樣如何荅勝莊云謗佛寳者謂如有一是外道類作如是言𠀍間無有一切知者或作是言佛非其實唯是幻化謗法者法有四種謂教理行果懷嗔恚故誹謗如來甚深經典作如是言非佛所非法律謗毀僧者謂作是言𠀍間無有真阿羅漢菩薩僧也文問今經通举三宝瑜伽但言謗菩薩藏相如何荅云第十毀謗三宝戒地論唯云謗菩薩藏三中謗法過偏重故文意云地持瑜伽唯云謗菩薩藏且由重云也法是佛僧師也故重佛僧實彼論意通三宝謗之俱為重罪為言一補云藏云第四具緣有五一對人眾二三宝境三起彼二想四作邪見五𤼵謗言便犯文又云闕第五緣言未𤼵故或異言故皆重方便文明矌云別具六緣五言了六前人領解便犯闕緣犯輕文此等諸師今戒皆待語言見義師并今師意不待語業結之見問性相所定後三業道必由方便思貪欲業道作属己思嗔恚業道作𡧱命思邪見業道欲宣人誹謗决定成業道俱皆方便意也今謗戒必方便意可犯乎荅慳戒已下三戒多分順業道門其中少有異制業兩門自元差別故若尒不欲宣內心起無見可犯重戒也勝莊云一切倒見皆名邪見而此中意但取誹謗為波羅夷於諸邪見此㝡重故云云二述釋二初制意二初制戒意必證常樂者𣵀槃四德常樂我淨也常沇苦海者法藏云誹謗三宝罪同五逆堕阿鼻地獄等云云二行下根本意述云因邪見謗三宝終起断善根等故云尒也二釋文二初通指三門私云科文三門者犯相門犯性門境界事門欤二言下別釋結成二初釋如鉾心二初牒文證經見外道及以𢙣人者云外道者謂佛法外行異道者𢙣人者謂佛法中起𢙣見者文見者謂聞如見也云見者聞見文經一言謗佛音聲者奥上云謗佛者不言法僧畧有二意一文不便故二以本未故為法是佛所僧是佛弟子故也文如三百鉾心者與咸注云鉾者長二丈建於兵軍猛剎也三百即表三毒各具諸𢙣以三百言之文二眾下合證釋意無過謗法者倫記第三云問何故謗法不為逆乎解云謗法本重超於逆類故無不立也依薩揵子經五逆者謗三乗法為第二逆也文二言下釋况口自謗二初牒文證經况口自謗文𦗟聞集云問誹謗三宝戒必依語業成犯欤將雖不假語言唯許意業犯欤兩方若必假語業者見古迹上文述四身三語意亦三以誹謗戒正攝意業爰知尤可許意業犯也若依之如此者正見今經文或云見外道乃至一言謗佛音聲或述况口自謗等文相無諍必可依語業見是以勘法藏師解釈妄語毀謗是語業犯也云云旁不明如何荅依邪見謗三宝名之他勝處法設外雖不出謗聲內心中猛利邪見决定之時可有無三寳之義何不犯第十戒哉是以新羅法師釈究竟犯位相究竟者謂誹謗决定云云故於第十戒設雖不假語聲可有犯義欤太賢師既以此戒属意業許意業犯事無疑但本經文者犯彼謗戒之人其類應不同正出謗聲之時其心猛利故可有結犯之軰此類通相也是故顕所如此欤或又犯必雖結意地誹謗正是語聲㓛能也故云謗佛音聲况口自謗事又以如此謗心决定之人遂必有𤼵謗聲旁無其相欤次法藏師釈者法門義理多途也何無其趣乎云云像似正法云云瑜伽論九十九云云何名為像似正法謂略有二種像似正法一似教正法二似行正法若於非法生是法想顕示非法以為是法令他於中生正法想若廣為他如是宣令他受学亦自修行妄法想習諸邪行而自憍𢢔稱言我能修是正行應知是似行正法於諸經中安置偽經於諸律中安置偽律如是名為像似正法文勝莊云瑜伽云如解云相似正法者有兩尺一云外道及小乗教名相似正法一云外道教名相似正法不能顕示出𠀍方便故雖有兩尺初為勝所以者何執小謗大犯他勝處毀菩薩藏故云云云像似正法者謂五法等相狀似正法而非正法故文瑜伽文或随他轉者謂随他受也或自信解但自起邪見或随他轉由邪師𤼵邪見故地持云或從他受文二此下通釋邪見二初明無断善捨此通增益减者上論文愛樂建立增益謗菩薩藏减也上論所制通增二見為言金剛般若釈云有遍斗所犱名增益無依圎名减是是無著義依龍樹義犱有俗諦名增益無真諦名减文菩薩戒無断善捨者問此釈意云何荅本論中於捨戒緣聲聞五緣菩薩四緣然而聲聞五緣中有断善捨菩薩四緣無断善捨故云菩薩戒無断善捨也意云於受戒心有生得加行二心生得心劣故待断善其戒方捨加行心𭤽故断善前加行方捨聲聞戒通二心受得故立断善捨菩薩但加行心方成其戒故所受戒断善方便方捨也表無表章云断善根者有二心受戒謂生得加行断生得善非加行善心受者断善根前加行道其戒已失断善為緣亦名断善若生得心受要邪見起現在前其戒方失文决択抄云方便心受断善方便其戒即捨生得心受正断善時其戒方捨所以然者断善根但断生得善根無力能断方便善故為此其戒捨有前後問生得善心如何得戒感於果乎荅求三乗果名為方便求三界果等皆生得收所以生得亦能受戒文述云於比丘戒者求三界等勝果尚許之菩薩戒唯求無上菩提果不欣三界果故不許生得受戒也為言補云問菩薩淨戒断善前方便捨者何位捨乎荅諸師釈不同由今師意凢及断善有三階心見一無邪見位瑜伽云由此邪見為依止故乃至断諸善根文則断善前方便必𤼵無邪見上戒云尒時唯犯一波羅夷文今戒云若至上亦失淨戒文則不及退菩提心無位可有上𮉐捨義若此位及上但失此戒於犯重捨今師云随所犯支失戒律儀故二起不同分心位雖起無邪見未別起捨菩提有情心不退菩提心無見决徹後別𤼵捨菩提有情心是名退菩提心是位惣捨一切戒上戒云然必生不同分心文今戒云必起不同分心文此也此位菩薩淨戒悉捨無餘故無断善捨也三正断善位文集所引畧纂具明其相此位生得善悉捨畧纂云善根有二一種子二現行唯断現行非種子折伏㔟力令不起現行名之為断非断種子唯断生得非加行善加行善勝前方便時已不起故文問續善時分云何荅瑜伽云云何續善謂由性利根故見親朋友修福業故謂善丈夫聞正法故因生猶預證决定故還續善根文問及断善有三階大難思無見起後欣求何物不退菩提故知無位可退菩提心何更別重立退菩提心乎荅見今師始終解釈断善方便必可有二心見其釈文如上挍之凢邪見心迷惑正理無三宝等也起此心已起佛果難期眾生難度等心是退菩提心若無位一切退菩提第十戒可無犯重捨一切退菩提故若尒下文云若至上亦失淨戒文今戒有犯重捨理在絕言有人料蕳今文云凢於無二種若至上等釈依一分謗釈之若全分謗一切退菩提無犯重捨云云此義大非也上出全分一分竟後云若至上等豈不亘全分有人云無見即断善云云此等大論藏等断善方便無見諸文分明如是諸義恐不足言事也云云二邪下明犯失別問一分謗有断善乎荅師云無断善義不謗餘故云云述云問執小乗謗大乗之時必起不同分心欤乎荅今師意者退菩薩道捨大乗向小乗道此類必起不同分心捨戒不退菩提執小不信大此類非起退菩提心若至上品犯者亦可失所犯一支故云若至上亦失淨戒也又於大乗中別謗法花花嚴等別教故犯輕戒第八背正向邪戒既今師云此謗別教非惣背故文問上品邪見惣一切若至上第十一戒分一切可捨乎曰公荅有人云全分謗時約境可失一切然而約心七毒立中可有所殘故亦第十一戒亦非全捨也若亦一分謗約境亦有所殘云云能思之云云義料蕳并宗家解釈略之問犱大謗小為重罪乎荅勝莊云若有犱大謗小作如是言聲聞藏教非佛所是輕非重一云此亦犯重文犯無取捨今師意順勝莊初釈欤出一分謗但云謗大乗若大小俱犯重何獨出大乗哉取意略記之問若尒全分謗時望大乗犯重望小乗犯輕乎荅思之有義云全分謗時不蕳云犯重大小俱犯重見故知別謗小乗俱犯重全謗既大小同犯重一分謗時小乗豈不犯重乎云云二已上所下結指勝義門述云已上所皆𠀍俗門者問上所明之出𠀍門戒尚取𠀍俗門乎荅八怗抄意猶取𠀍門也一義云已上所等者且指當經十重護持相云皆𠀍俗門云云此義可然欤三輪淨者如宗要以戒罪人云三輪亦古迹上卷云受者授者及所受戒不可得故三輪空也文少與宗要別開合不同更無相文第三經善下結成故二初牒經摽分經善學諸人者法藏云善学諸人者此有二義一謂此諸人是善学戒者二是学善之者告此諸人謂大眾也又是當來無学菩薩道人也文二初下随文解釋三初勸不毀犯故二初解善學二初正明二乗不究竟学者二乗一切對菩薩皆不究竟学所修行品但諦緣所證果德亦極無餘土限三千佛解五分朝夕觀念纔空人我實有之犱晝夜勤修只存禁𢙣防非之理退他本自終殘所知一分即證生空一理四智中纔妙觀察智中生空智一分法空妙智猶絕聞况自餘三智二乗不究竟学其理諒尒二如下證述云二乗小乗人設雖至究竟位望菩薩行時不其行究竟菩薩雖初心堅固𤼵三聚菩提心盡未來際誓利樂一切眾生故於一切有情悉有恩分故一切天人等欲供養此菩薩二乗者反之可知故云云二此下解不犯微塵三初積成大故二初標義雖過輕微積成大者依小罪後終致犯重非云小罪聚成重罪也二如下證如經頌曰云云此𣵀槃經文也彼經十四曰舎衛國有一丈夫羅捕鳥得已籠繫随與水糓而復還放𠀍尊知其本末因緣而偈言如也二或下愚人罪重故二初標義述云凢聖相對蕳之凢夫不得智故依所造𢙣業堕𢙣趣也聖者等得𢙣趣不生故設雖犯戒等不得𢙣道報依修智恵也意云今經所殊令被凢夫地前機故是皆愚人故云不應一犯如微塵許也若有犯者可堕𢙣道故如是誡之也云云二如下證二初有頌如有頌曰俱舎文也光記十二云故有頌言愚作罪小亦堕𢙣趣無慙愧故智為罪大亦能解脫𢙣趣苦果有慚愧故文二即下智論二初述意智論四十一云譬如䥫器中空故在水能浮中實則沒菩薩亦如是行般若波羅密智恵心虚故不沒重罪凢夫人無智恵故沇沒重罪文私云此文凢聖相對見云云二問下釋疑二初問如文二荅三初正荅如文二謂下舉喻如文三愚下合結如文三十下小善成重故科文小善成重者謂愚人由小善小罪亦成重為言私云十住論第五卷文也如文集而准本文斗字可作𫝣池字可作海字欤云云文可知之經何况具足犯十戒者云具足五緣成十根本故云具足犯十戒也文此釈意具足之言指五支具足然見文相具犯十戒故云具足欤云云二示犯失壞故二初明因失三初標章牒文如文二此下釋經密意宗要云然此經中約犯七密意惣犯十重者現身不得戒文意云指十重之中入七罪若有犯者不得現身等也更非一切犯譬如𭣦生戒中若𭣦父母羅漢等者於現身中不得𤼵菩提心得菩薩戒也已上五怙抄取意記之瑜伽論四十一云若諸菩薩以上品犯如上他勝處法失戒律儀應當更受文本業經下卷云十重有犯無悔得便重受戒文此等文可重受見但於今經文者為誡新學菩薩付入七之罪如是也云云三問荅决疑初問本業經下云菩薩戒有受法而無捨法有犯不失盡未來際文全文如文集二荅二初有義二初約三乗一乗解二初彼解八怗抄云問何故三乗教退失一乗教不退失乎荅三乗教淺順事故有退失一乗教深順理故無退失欤彼師遊心安樂釈菩提心相云於中有二一者随事𤼵心二随理𤼵心言随事者煩𢙉無數願悉断之善法無量願悉修之眾生無𨕙願悉度之於此三事决定期願乃至此心果報雖是菩提於其花報在於淨土乃至是明随事𤼵心相所言随理𤼵心者信解諸法皆如幻夢非有非無離言絕盧依此信解𤼵廣大心雖不見有煩𢙉善法而不無可断可修是故雖願悉断悉修而不於無願三昧雖願皆度無量眾生而不存有能度所度能随順於空無相乃至是名順理𤼵心相也随事𤼵心有可退義不定性人亦得能𤼵順理𤼵心即無退轉菩薩性人乃得能𤼵如是𤼵心㓛德無𨕙文三乗教菩提心當随事𤼵心一乗教菩提心當順理𤼵心也云云他宗人難云瑜伽願我决定等𤼵心随事𤼵心未知順理𤼵心所以教也師云此難頗管見至欤顕揚論出二種菩提心一𠀍俗𤼵心菩薩戒作法從今日等文也二法性𤼵心云云不見此等文致問難也云云二然下今破問新教宗者指能破欤將指所破欤乎荅一義云所破云新教宗法相三論等宗義自天竺傳來此久花嚴五教天台四教等令於震旦初立此義故云新教宗云三乗一乗真實新義故難可依定也一義云能破云新教唐三藏以後所經教云新教也意云新譯法相宗意不立菩薩故唯三車是以今師同此義不依用彼義故云難可依定也又凢於教雖許立實以瑜伽論為教云事深不可許之故也云云二義下約㓛能種子解二初彼解云以躰從㓛故言捨戒以能從躰故經云不失文二此下今破又云問若尒聲聞戒五緣應不失荅㨿躰實應然但佛為彼聲聞教中多就㓛能戒是色是故不永在不失文准此今問難彼問荅然而彼會尺不當理故主亦猶例難欤二指今解宗要云下乗向大有應捨法棄菩薩戒無應尒故或菩薩戒無無餘犯無有惣盡如前故文問今師意廻心向大之時可小乗戒所捨哉然何捨戒五緣中不列之哉荅先小戒不可謝成菩薩別受戒也其義如上述也然而今云捨者捨小乗心依大乗心護持之故云捨也其道理可知也此外勝莊等以中下品犯菩薩戒無捨之義故本業經以中下品犯相無捨法也法銑同之云云二言下明果失二初惣標撲揚云若持十戒為國王因由破戒時王因則失果位亦失此是小國王并粟散王等也轉輪王位者金銀銅䥫四種通名轉輪王亦皆失也文二當下別釋三初失𠀍間與二乗果失國王位者失花報也下佛性常住者失實報也云云私云二乗果者有餘無餘果欤經失比丘等者云失比丘等者失勝類也不復堪入二眾數故下三眾亦随類攝文法云失比丘者謂犯此戒應入地獄定不得為人作比丘又由犯重現在不成比丘用故云失也文二何下失出𠀍之大乗果二初𢝰明失如文二言下略釋文佛性常住云云莊嚴論常有三種一本性常謂法身此身本來性常住故二不断常謂受用身恒受法樂無間断故三相續常謂反化身沒已復現化無盡故如是法身雖離一切分別論而無生滅故名常二身雖有念生滅而依常身無間断故恒相續故名為常文通餘二身云云報身化身也云云三不下惣結於二𠀍無救𠀍間及出𠀍間云云二刧三刧間在三𢙣道中不被𠀍間父母救濟及出𠀍三宝加被故云無能救也云云三餘下誡學指廣故經八万威儀者與减云八万者熙抄云准三千威儀經約二百五十戒各有四威儀合為一千指三𠀍轉為三千威儀配身口七支為二万一千又對三毒等分則成八万四千諸文举其大數但云八万威儀然今大乗頓戒恐不應以篇聚增數釈之彼文約小可然更請詳之文已上熙抄義與减不許之良以八万威儀形相互異故知一各有其相若增數計義甚不可减師不許實有由乎云云
