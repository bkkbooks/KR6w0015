body:
  text: 時處故機根故藏攝故翻譯故宗趣故題名故本文故凢於今經諸宗人師製作記䟽其數頗多至明大義各設多門大周法藏於玄談立十門解大意新羅義於卷首竪諸門釈經大義今師上卷古迹設七門解釈一品大𮈣文言廣略取大意以消文相第一時處故䟽云言時處者本即盧舎那佛在蓮花臺藏世界末即釈迦初成佛時於摩伽陀國寂滅道塲說矣問此經處會惣有幾種哉荅經自言十住處會亦随尒上卷古迹云初成佛已徃第四禪大自在天王宮放光攝眾事盧舎那𦗟心地品還來樹下出定而十世界海云云凢經文等意釈迦成道即至色界頂次徃臺上事舎那佛聞心地品還來樹下出定而於妙光堂十世界是第一會也上卷古迹云菩提樹者畢鉢羅樹在伽耶城西南二十余里金精窂名曰金剛可冝金剛躰之㘴也妙光堂者即花嚴云普光堂也因佛放光而立名也在摩訶陀國寂滅道塲去菩提樹三里也滅生死處名寂滅道塲有人寂滅道塲者菩提樹下欤妙光堂菩提樹下俱在摩訶陀國同在一國故云寂滅道塲界也問第一會舉金座妙光堂二處意如何荅正處雖妙光堂金座隣故舉之加之成道處故因出之也云云復從座起至帝釈官十住是第二會復至夜摩天中十行是第三會復從座起至第四天十囬向是第四會復從座起至化樂天十禪定四善根一向修恵故定是第五會也復從座起至他化天十地是第六會復至一禪中十金是第七會復至二禪中十忍是第八會復至三禪中十願是第九會復至四禪中摩𨢸首羅天王宮我本源蓮花藏世界盧舎那佛所心地法門品是第十會此處上下兩卷也自是又下樹下寂滅道塲唯十重六八之戒法也云云一義意也補問化佛心地一品二處演見謂第四禪及菩提樹下也若尒二處法俱上下兩卷耶荅一義云第四禪具上下兩卷菩提樹下悉上下兩卷也既一具一品法門豈有不𥁞云云泉公師云見今經始終第四禪但上卷菩提樹下但下卷也如來成道則經歷十住處法上卷科之傳上賢聖內門行云云第四禪但上卷解釈分明次下卷經始云復從天王宮下至𨵻浮提菩提樹下為此地上一切眾生凢夫癡闇之人本盧舎那佛心地中初𤼵心中常所誦一戒光明矣上卷古跡科之言傳初𤼵心外門戒行文言經文言解釈菩提樹下但十重六八戒相不可及異論者欤問既一具一品法門何如是二處之荅雖俱心地一品所法門既教正行門誡𢙣行門兩門若尒所被機根一時不並何故悉可𥁞如是諸經常例也何𬾨疑難矣云云問今經廣本十万頌六十一品云云舎舎那所唯心地一品欤亦通心地已前十品乎荅付之學者異義非一准一義云舎那唯心地一品也上卷古迹釈題号盧舎那言云梵網字下摽此名者為蕳餘品釈迦故文故知舎那但心地一品餘六十品釈迦自不待言者欤付之有問荅略之一義云心地已前九品俱通報化二佛也凢化佛十住處法者即心地品已前品也然上卷釈十住處法云傳上賢聖內門行文既通攝十住處法言傳明知心地已前九品通報化二佛之為言付之難云若尒為蕳餘品釈迦故之解釈云何可得遣乎荅餘品者除心地已前十品餘五十一品言釈迦也云云已上二義任情取捨也云云問付心地上下兩卷俱通報化二佛之乎荅傳云尒也經現文上卷明報佛下卷明化佛雖然上下兩卷俱通報化二佛之也下卷十重六八之戒化佛傳受之見是盧舎那誦我亦如是誦金言傳初𤼵心外門戒行解釈無諍自報佛傳受見若尒者下卷經通本師分明者欤亦化佛第四禪心地品其心地品上卷釈云傳上賢聖內門行文故上卷所五位修行亦通化佛不及疑盧者欤然雖上下俱通報化二佛結集家且影畧上卷明報佛下卷明化佛也問若尒者何故下卷經始安報佛耶荅傳云為顕上下兩卷俱通報化佛譯家分卷時下卷始安報佛也云云下卷經始至一心而行是報佛也第二機根故䟽云言機根者有菩薩性得𤼵心者為謗不信不得故文今經具出十八梵等本業經𭤩通六道具種姓𤼵心解語三悉是菩薩戒機也無色界等受戒成不具如下記之云云第三藏攝故䟽云藏攝故者通菩薩藏毗奈耶攝文即菩薩三藏中毘尼藏所攝為言問安通之言何所以乎荅一義云今經三藏中素怚覧藏而亦輕重戒相故兼毘尼藏義故經義上亦通毗奈耶藏義故云通也云云難云何不舉根本經義但明傍通毗尼義而云通乎頗難信矣一義云修治章今此梵網既是大乗故二藏門是菩薩藏而言通者此菩薩藏即通諸經此經随一故致通言云云一義云上下兩卷俱通菩薩藏毗奈耶攝為言意云法銑䟽上下心地前後兩判今蕳彼等義安通之言欤彼䟽上云初化制者聖教雖眾攝為二種一者化教法門二者制教法門今此戒經後門所攝上卷非戒化教所𠬧文對此云通也云云一化制二教事餘師釈云開其信解用捨任緣故名化教制其修奉反有過名為行教文南山釈云制唯道化通道俗文補云今經可言化中制也云云補有問荅可見之第四翻譯故䟽云翻譯故者後䄅有西𫭫三藏鳩摩羅什此云童壽持菩薩戒偏誦此品與義學沙門三千餘人遂於逍遙及長安草堂寺翻譯經論五十餘部㝡後因䄅主欲受禁戒別誦譯出恵私曰恵者恵觀也融融者謂道融也等筆受法藏師云西𫭫有十万頌六十一品具譯成三百餘卷此經序云可有一百二十卷文問今經翻訳時代諸師異釈法藏䟽云大䄅姚興𭤩始三年文與咸注云𭤩始三年𠮦羅什在長安草堂寺及義學三千餘僧手執梵文口翻解釈文南山內典錄云𭤩始八年文相何荅𭤩始三年什公西來時也非正訳經時則上卷經序云天笁法師鳩摩羅什誦持此品乃至𭤩始三年淳風東扇文故知訳經時非𭤩始三年若尒內典錄𭤩始八年正訳經時分也云云第五宗趣故䟽云言宗趣者語之所表曰宗之所㱕曰趣此經正以心行為宗證覚利生以為其趣言心行者略有二門一教正行門二誡𢙣行門教正行者即經初三賢十聖內證之行誡𢙣行者即經後十重四十八輕戒行文問法藏䟽釋宗云以菩薩三聚淨戒為宗以是文中正所詮顕所尊所崇唯此行故文此尺意通上下兩卷以三聚淨戒為宗若尒與今師宗趣同異云何荅彼師且釈下卷戒本是故取誡𢙣行門為宗也若通上下兩卷解釈如今師可立二門又一義云三聚淨戒攝諸行無不𥁞是故可云上下兩卷俱以三聚淨戒為宗也今䟽下文云此身應第二地戒波羅蜜此經宗故文不蕳上下不同但云戒波羅蜜此經宗故若尒教正誡𢙣兩門俱可云戒為宗欤由此義法藏解釈曾不今師意欤云云第六題名故䟽云言題名者梵網經一部名也盧舎那佛心地法門品第十者此品別名也梵者能淨之義網者攝有情義謂此經者乃至有頂生死大海拘持有情終致無上寂滅之岸無盡饒益諸飢渴類如世網故為顕此義故諸梵王持羅幢供佛𦗟法佛因此世界差別猶如孔佛教門亦如是世界別者湏㫆樹形覆世界等遍涉入故佛教門者雖一味法薀界處等法門別故是則如梵王孔多䌉一法王戒法當知亦尒雖塵沙門終㱕一道万行一門所謂得意而行皆稱法性是故從喻名梵經文梵開題云具云伇羅𢜩摩此言淨行尼婆羅波素怚覧經當知今梵網經者初一字梵語省略次二字此土名亦不空三藏傳云此經金剛頂經淺略云云問諸經立名不遇人法喻三則單複一具是也如𣵀槃大品大集楞伽等單名法如湏陀那太子經毗舎門經單名人如大雲經單名喻如法華經法喻雙舉如善生優婆塞戒經人法雙舉如菩薩瓔珞經人喻合稱如大方廣佛花嚴經𬾨三今經當何義耶荅於今經題名諸師解釈不同法藏師作四尺且第一尺云一約行躰用謂梵者當躰為目離染為義者就喻為名勝能為義乃至此則依躰起用以梵成故云梵即持業釈也又亦法喻雙舉為名也文此釈法喻合名見謂戒法離妄染其躰清淨是故名梵者極淨之義故也第二釈云二約義者此舉梵王之喻所詮之義俱從喻稱故云梵乃至此則梵之依主釈亦是有財釈以俱是喻故文此第二尺人喻也謂以梵天王所持之喻今戒法名梵經也梵是能持之人是所持之物梵但召能持之人無喻戒法為以喻戒法言梵網經故結文言梵之也自餘二尺恐繁不引義寂䟽云梵網謂梵王網如因陀羅網其義相似佛法門随機無量其理一絞如梵王網孔雖無量其䌉唯一故從喻事名梵也文此第一尺人喻合举見又云又戒為梵行亦是法故云梵文此第二尺法喻合名見名問如是諸師解釈分明也今師解釈何荅學者異義徃一義云梵王修十善四無量其性清淨取彼極淨義喻今戒法取羅網救魚能譬今戒法是故梵與網俱喻也則結文言是故從喻名梵網經故文一義云師云梵能淨之義一言未見以梵為喻釈文網言無異論喻見如世網故文故今師多分依義寂法藏二師彼二師中以梵喻戒法釈文都不見若尒今師或人喻或法喻可得意解釈不分明上准彼二師釈可得意也問若尒是故從喻名梵網經之解釈何會乎荅且依一義言是故從喻具可云從法喻等也云云問梵王所持羅幢非世何有救𮫭能若尒今合攝有情義甚不相合乎荅誠如來難今非世網法藏䟽云問此中梵網與花嚴中因陀羅網何別荅彼是帝釈網此是梵王網彼網在殿此網在幢文故知今網在幢實無救魚能但網義𭤩通故釈攝有情也自元攝生義今經不見法藏等依花嚴釈之若尒梵王所持網無救能網義寬通故如此釈也云云問梵王何時何處以羅網供佛乎荅上卷古迹云摩𨢸首羅天王宮中心地時諸大梵王供網羅幢因此法文即十住處中第十今品供之依此一部惣号梵網經矣梵網二字畢經者上卷古跡云經謂𭑕經貫持為義貫義持生不散失故文天親論云謂能貫穿以教貫義以教攝生名之為經猶綖貫花如經持緯眾生由教攝不散流𢙣趣義理由教貫不散失隱沒文盧舎那者此云淨滿無障不淨無德不圎故文又法藏䟽云梵本皆名毗盧舎那此云光明遍照智照法界身應大機故文佛者法藏䟽云佛謂覚者三義如常謂圎音巧應生解文心地者同䟽云唯識万德從此生長名為心地文天台云心地者亦是譬喻也此品內所明大士要用如人身之有心能𢝰万事能生勝果為大士所依如地文又云三業之中意業為主身口居次㨿勝為論故云心地文法門者法藏云出苦之津入淨之戶稱法門文品者同云文義類別故名為品文玄賛云品者類也別也區玄旨而異類𣲖幽筌而彚別文第十者次數也玄云第者次也居也文私云十者六十一品中當第十也而利涉牒云心地法門品第十一文此所覧不同欤已上六門大摡畢第七本文故者即上下兩卷所具如下記之梵網經古迹記科分二初標題二初題号題名中上三字所釈經名下五字能釈文名又上三字通諸師就梵網製記故下五字別今文故取所㱕能會通從惣成今記題名也凢就今文題有惣別兩題如現行本是別題也惣題云菩薩藏素怚覧古迹卷第一題下注云梵網經記也惣大部古迹二部流行見則素怚覧藏古迹阿毗逹摩藏古迹付素怚覧藏古迹其數多第一第二今經古迹也第三四五六四卷不知釈何經七八九三卷釈𣵀槃經其題云菩薩藏素怚覧古迹卷第七乃至卷第九題下注云𣵀槃經述記第十已下不知有無是外藥師經古迹一卷三㫆勒經古迹三卷則素怚覧藏三四五六欤追可尋之云云述迹抄云梵網二卷花嚴十卷金剛般若古新各一卷𣵀槃八卷仁王經心經藥師經双觀無量壽小阿㫆陀經稱讚淨土㫆勒上生下生成佛广耶已上各一卷理趣分四卷最勝述記四卷同料蕳一卷文次阿毘逹磨藏古迹十七卷見文述迹云百論雜集論唯識論瑜伽論因明論理門論觀所緣論二十唯識論成業論五薀論掌珍論廣百論弁中邊論顕揚論佛地論無性攝論𠀍親攝論已上文凢今師製作多稱古跡則示下語也依義法藏等記製之是故言古迹也唯識學記云𢙢失古迹今故述之文修治章第一云太賢法師解釈大乗諸經及論多名古迹随彼典各依諸家所釈蹤跡取要錄之斯乃言有典㨿事不檀已述而不作必有依羕故也云云問跡與迹同異何荅有抄云以生類足跡云跡以餘相似義云迹也云云記者盂蘭盆經新記序解云記錄要言之妙詞𬾨討論之忽忘文則錄大𮈣安紀言解釈委曲安記字也云云卷者蕳正記云卷者舒為義從前向後曰舒為卷此㨿紙墨為言文真證律師云卷者可舒可卷自在義也文下者對上卷古迹云下也云云已上題号畢二青下撰号付撰号有名同名故蕳以處青丘者文撰注云服虔曰青丘國在海東三百里文又東宮切云青丘國名文野馬臺注云青丘謂新羅國也彼國茂松故云青丘文百法䟽云新羅太賢文菩薩藏阿毗達磨古迹摽新羅國青丘沙門文故知新羅國別國有青丘國欤持犯要記摽新羅國遊心安樂抄云青丘也相例可知云云有義云山名也玉篇云水出青丘山故云云問若尒者文撰等如何會乎荅取惣國名合別山名云青丘國也云云但前義勝也青丘東大寺讀樣也青丘興福寺讀㨾也太賢者祖師諱也人畏不呼召是則實名用諱字若滅後贈号用諡号也如南山大師贈澄照大師也有人云唐三藏有三千人門徒撰之以七十人達者此中之随一名西明師圎測師也彼門弟云道證師又云要集也太賢彼道證師之弟子也初習花嚴後入法相卜跡幽閑恒彈於琴外隱德行內懷光矅文宗要序云用韜光故云太賢可訓太賢也或太賢云云此師不好名誉隱德行故僧傳等不見是故如是訓也云云凢付撰号有讀不讀異論一義云可讀也禮記文云入國問禁入門問諱臨文不諱廟中不諱文此義向文時撰号廟中讀祭文等亡者諱讀無過也云云一義云不讀之臨文不諱等文非撰号文中連讀文字中人名有不諱也廟中祭文以可准同正作者名不讀為好凢天笁召人名為勝故稱佛名等唐土不召諱名為礼是以日本菅家等不召天神諱号為好也云云集者瑞應鈔上守千云問作述撰四名何異荅即口談造即起本並非先有名造也先有名述乃至撰即集也集舊成本名之為集文已上題号撰号畢凢於此經梁代恵皎始製䟽其䟽不見于今次隋𠀍天台智者大師製䟽其後盛造諸䟽當時流行䟽記具補忘抄等載之可見之也二下卷已下十下勸信故三初標章述意凢付梵網設釈諸師随意不同也太賢善珠法進通上下卷造於䟽注圎證平𬾨唯解上卷勝㽵法銑道璿傳奥利涉撲揚自下卷初解天台賢首義處行明曠並從下卷偈頌釈之也問就今師解釈有重疑第一疑云譯家什公付此心地一品分上下兩卷何不随彼分卷超越釈我今已下文哉是一第二疑云下卷經始猶有本師超越之少有其理何尒時千花上佛已下化佛傳不釈之而超越哉是二第三疑云於化佛有二叚教正行門誡𢙣行門縱雖不解教正行門何自為此娑婆已下誡𢙣行門不釈之自偈頌釈之哉是三荅有義云我今已下為下卷經有之欤師云不尒見諸師釈什公翻譯時分卷猶同現流布但䄅主請什公云又誦何文可護持戒躰云云什公受其請別譯出偈頌已下題云梵網經盧舎那佛菩薩十重四十八輕戒本文自其相羕即稱戒本諸人翫之但於戒本作䟽義法藏解釈皆以如是是故今師自偈頌為下卷製釈也法藏䟽云仍別錄此下卷之中偈頌已後所戒相獨為一卷名作梵網經盧舎那佛菩薩十重四十八輕戒一卷首別摽當時受戒羯摩等事文天台與咸注如是恐繁不文問第二勸信者對何云第二哉荅上卷古迹科分今經始終取要圖之信為入法之本者此取本業經下卷文意也彼經云佛子若一切眾生初入三宝海以信為本住在佛家以戒為本文智論云佛法大海信為能入智為能度文玄賛第一云智度論云有信心人入佛宝山得諸道果若無信心雖解文義空無所得文諸經初案證信序皆此意也是以義云序中有二初偈頌為勸信序餘長行文為結戒序信為受戒之本故先序信戒是宗所明故次序戒文問信行相如何荅唯識論第六云云何為信於實德能深忍樂欲心淨為性對治不信樂善為業文戒為住法之原者謂住在佛家必可依戒五眾七眾皆受戒也𣵀槃經等不受戒号外道故但㝡勝王經中列四部眾竟言及餘善男子善女人等四部外得益是且一途癈立非常途所談也故補注云以受持戒名七眾若出家人犯一重佛海𨕙外非佛弟子故以戒為本文礪䟽第六云多論有四義故重一戒是佛法平地万善由之而生二一切弟子皆依戒而住此義苻順今文也三是趣𣵀槃初門若無戒則無由入𣵀槃城四佛法瓔珞能㽵嚴佛法文更令信戒者筞𤼵令勸信故云更也二然菩下傍述三門二初標列然菩薩戒者直不釈文叚因廣餘經論等述菩薩修行故云然也此與𡙸未决之詞也上言所以偈更令信戒與詞也而不釈偈摽三門故是𡙸也此𡙸又始終一向𡙸非不釈偈故與𡙸未决故置然字也進與即此非釈偈退𡙸終非不釈偈故云與𡙸未决也略有三門者義師等開多科叚述菩薩戒先分受随於受亦分得受失受於得受後開四門於其中科叚委細也今對彼等師廣釈云略有三門也此三門中第一受躰後二随行就後二初持後犯雖持犯異俱望受躰得其名是故皆名随云云二初受下正明三初受得門二初應成機二初舉解語有情六道眾生等者問今經舉十八梵等具不舉六道何故言六道眾生但解師語等乎荅雖今經具不舉六道由本業文如是釈也云依本業經六趣皆得受文彼本業經云六道眾生受得戒但解語得戒不失文問六趣中地獄并無色界眾生受得菩薩戒乎荅於地獄眾生表無表章云言六趣者別解脫唯人趣菩薩戒通六趣乃至地獄無由得別脫戒菩薩戒勝可攝於彼文是別受不通地獄通受通六趣見亦地藏菩薩等與其受戒等也解釈以佛菩薩神力別受五八亦通六趣見等文問通地獄眾生受得菩薩戒輕重地獄俱得之乎荅義云當知地獄有輕有重者不得輕亦得受文今案云言重者不得者則由自業力可尒若由佛等力輕重俱可受欤云云次無色界眾生受戒者義與咸許之云言無色界者顕即不蜜亦無文意云雖不顕無色眾生成受戒亦不言不得受戒故俱可受菩薩戒為言有義云顕即不者謂顕宗經中不之密教意可許之故言密亦無云云此顕密相對頗才覚至也一義云不許之諸藏章慈㤙云盧舎那佛經十八梵天諸神王等但能解語皆悉受持菩薩戒法故知調伏亦致二界五趣之身此依實身無色界中無有耳識不聞教故知但致二界五趣有情實身文又十業道章溜洌云然除無色無趣大故文當知宗家定判無色界不得別解脫戒也別解脫必由思成定果所變無實思故不許受戒也問但解師語分齋云何荅傳奥䟽云曉了文義方名解語不同鴦但襲其言文則解了不殺生等戒相方名解語也二要下被𤼵菩提心二初舉心相要湏先𤼵大菩提心等者謂雖解語不𤼵菩提心不成今戒故云要湏先𤼵等也問今經言但解法師語盡受得戒文不言𤼵菩提心何故云要湏先𤼵等乎荅今經重戒結成門不得現身𤼵菩提心等文受得菩薩戒湏菩提心見其上瑜伽論等必種姓𤼵心上受得菩薩戒見依之如是釈也謂誓定取無上菩提等者非猶預心故云定取菩提可有期利生不可盡故云窮未來際也問菩提心者入道章出菩提心躰性云躰性者以信精進正念正定正恵為躰文尒者何以上求下化二心釈菩提心乎荅於菩提心有躰相境三今文者以行相釈菩提心章云顕行相者希求為相希求有二一求菩提二求利生文次下瑜伽論决定希求以為行相之文是也問菩提心者菩提即心欤亦菩提之心欤荅菩提之心也以依玉為名菩提所期果号心即得彼菩提果願樂心即文所述求菩提利有情二心也問菩提之心者求菩提之一願何有利有情之心乎若又心分二種者可云菩提薩埵心如何荅遁倫有此問荅彼第八云問文中既求菩提復為有情而𤼵心者何故但名𤼵菩提心不𤼵薩埵心乎解云本為救他而求菩提但云𤼵菩提心即是𤼵救薩埵心也又𤼵心令生同我俱證菩提故但云菩提心不得言𤼵薩埵心也二如下文證如瑜伽云菩提心等者謂本論𤼵心品中就菩提心出五種相自性行相所緣功德㝡勝也然今所文行相文也𢝰自性行相所緣相合云菩提心也自性者能緣見分於菩提有情作上求下化誓以此能誓心為其自性也行相者能緣之心必依所緣之境能所相合以决定無轉之形為𤼵心行相也所緣者以菩提有情二種為境謂境界之相也問第二行相者於四分何可配當哉荅有異義且如倫以相分為行相云云謂此義意能緣見分緣彼境决定無改轉形即相分也又親所緣也决定無轉之形心中浮現此名相分如鏡中影像以鏡之躰為自證分此上光明見分也此見分上所現菩提有情是相分也笠置上人云唯識宗意相分名行相義尤勝也愚夫迷此相故云云以為行相者影像也下義利為境者境則第八所變相分為第六等見分即本質亦踈所緣也此境正與能緣見分相應成親所緣時菩提有情二種相云行相也由此義行之相可訓也行者能緣見分相者所緣相分也能緣行解浮現相㒵也以相分為行相故所緣則第八所反相分為第六識等為本質以此本質為所緣也問就之疑云見唯識論見分名行相相分為所緣文加之相分非緣盧法豈為𤼵心相㒵倫記釈用不任意何唯識誠文由末師解釈乎荅倫記釈是非彼師自義瑜伽論以相分為行相是故仲筭私記云唯識見名行相瑜伽相名行相取意本論既相分為行相末師解釈何本論哉若尒定菩提心行相時以倫記可為指南依之文集引之以為依𠗦矣問若尒瑜伽唯識如何相乎荅義利為境者演秘一云按佛地論亦有四句現益名義當益名利世間名義出𠀍名利離𢙣名義攝善名利福德名義智恵名利文問上明發心相其𤼵心者未入僧善法欲菩提心位受得菩薩淨戒欤將又已入僧深固大心乎荅有義云受得菩薩戒必已入僧深固大心上可云得之善法欲位但結緣分不能成其戒躰由之宗要釈云尒時於此解脫分心由羯摩緣得菩薩戒文解脫分者已入僧位故知僧祇已前不能成菩薩戒云云本淨長老等専執此義歎云通受戒不𤼵深固大心不成別受戒不三国相羕故亦不成故當時通別二受俱為結緣不成其戒躰也云云傳云善法欲位可成菩薩淨戒也凢解脫分者寬通未入僧雜集論四種解脫分中依𠗦順解脫分者則未入僧位也又唯識論云一資糧位謂於大乗順解脫分文述記云此在四十心及前位從初𤼵心及至十囬向終皆名順解脫分文故和順解脫名寬通未入僧位也加之今經上下兩卷配次位今十重六八初𤼵心外門戒行云十住已上傳上賢聖內門行云云外門者是未入僧更無疑欤亦主釈汝等一切𤼵心菩薩亦誦之經文云言𤼵心者十信位也行實有退非三賢之正位若十信等未入僧位不許得菩薩戒半月制令誦有何所益乎故知菩薩淨戒但已入僧許之恐不足言事欤云云二𤼵下受得法二初二種受戒二初標分問一分多分全分有三種何云有二種受乎又付十善戒受一戒名一分一九名多分十名全分何况本業經云一分菩薩乃至二分三分四分十分等故有一分多分全分見尒者何不摽三種乎荅今於一分中包多分也百行律儀時開立多分今合云一分全分也一義云多分攝全分本業云有受一分戒名一分菩薩乃至二分三分四分十分名具足受戒云云既二分十分名具足受故属全分受也問若尒者何釈一分時云或受一戒或多皆得成戒乎荅此且為顕随其受者意樂所堪義尒釈欤必一分攝多分故如是非釈欤二一下正明二初一分受三初正明菩薩分受依本業經文也彼經云又復法師能於一切國土中教化一人出家受菩薩戒者是法師其福勝造八万四千數其師者夫婦六親得互為師授其受戒者入諸佛界菩薩數中超過三刧生死之苦是故應受有而犯者勝無而不犯有犯名菩薩無犯名外道以是有受一分戒名一分菩薩乃至二分三分四分十分名具足受戒文補云就此一分受古來異義頗以繁多也略举三疑方顕相羕實義一戒躰成不疑二七眾通疑三住前住內疑第一戒躰成否疑問一分受者本論并宗家解釈不見今師依本業瓔珞相許一分受持若尒可云戒躰成就乎荅付之異論多途要儀抄云一分受菩薩戒躰可成本業相今師解釈更不及疑慮如成山海塵渧為初之道理不可之加之六波羅蜜經第五之乃至護持一禁戒者亦得名為入佛淨戒波羅蜜多能得無上正等菩提文若尒戒躰成就理在絕言等云云委細問荅如補忘抄略抄之興正菩薩𭤩安年中表無表章御談義亦依上義講畢文次由文集注文一分受不可成戒躰本業且初根攝一相不盡理取意具如注文彼經三聚相是則断𢙣一途非顕了誠彼既不盡理例今分受方非實理為言已上御注意也中古碩學實寬法印等今御注意叶宗家御釈云云然𭤩安年中㝡後章御講改御注義講上義畢若尒相傳義不可取捨欤問就初戒躰成義為許分受十戒俱可許一分受哉荅有人云自𭣦生戒至謗三宝随受者意樂悉可許一分受也云云傳云分受之時於前四重可有一分持第五已下是不共戒也是故必分持後六戒時於前四重必受一戒後諸戒可分受律儀戒上後二方立故玄賛中云律儀戒為本方有後二若破律儀三戒俱捨文前四重是攝律儀根本是故定可受之云云已上戒躰成不成二義畢第二七眾通疑問今一分受者通七眾許之欤亦但在家二眾許之乎荅八云出家在家俱可許分受也等云云委可見補𭜘抄傳云八怗抄義不足言也於出家許分受都所不見也等云云委細也可見之第三住前住內疑問今一分受者但未入僧輕毛等位將亦通已入僧深固行相乎荅今一分受者專依本業經彼經於住前信相菩薩明之加之出已入僧行相云十重滿足方入初住經文分明但住前義不及異論者欤云云二不下簡異比丘𢝰受不名比丘者𢝰比丘名通大小瑜伽論中聲聞七眾菩薩七眾故然而今師且比丘名于聲聞也三謂下𢝰明二受不同三初明比丘𢝰受意現身得阿羅漢者問彼極速猶經三生故俱舎論二十三云謂初生起順解脫分第二生起順决擇分第三生入聖乃至得解脫文何云現身等乎荅賢聖義私記第二仲等云凢夫不覚生多少乃至聖人知業多少文凢夫不知生多少故欲現身得果也實雖不可得約彼意樂云現身等也若知業多少第三生人亦修可得也云云一義云性相望多分而之或經中依持二百五十戒許即證第四果義故云現身得阿羅漢等欤云云圎滿䡄則者果既欲圎滿故其上行又可圎滿是故戒行圎𬾨受持故云尒也云云言學處者資持記云言學處者是修行者所依處故文攝釈云白四羯磨受具足戒等名為學處二百五十戒等為所學文難者十三難十六也十三難者一𨕙罪難四重犯人也二行尼難三賊住難䨱聞羯磨戒也四破內外道難五黃門難有生揵妬反半五也六𭣦父難七𭣦母八𭣦阿羅漢九破法輪僧十出佛身血十一非人天修鬼獄四趣十二畜生十三二形難也十六者一不稱自名二不稱和尚名三年不滿四衣不具五鉢不具六父不𦗟七母不𦗟八負債九奴十官人十一非丈夫十二十三癕疽十四白十五乾痟十六㒹狂云云二菩下明菩薩分受意二初歷刧修滿故謂凢必無現身成佛者問法力甚深也機根千品也何無現身成佛之類哉依之菩提心論云父母所生身即證大覺位文花嚴經云初𤼵心時便成正覚文法花經湏聞之即得究竟加之天台可有一生入妙覚者云云若任此等何不許現身成佛之類乎荅雖宗計各別然法相宗意必經無數三大刧也瑜伽云决定無轉無數大刧修行圎滿方證菩提文且聲聞鈍根經三生六十刧獨覺利根經四生百刧况菩薩尤利可經三大刧道理必然也依之幽𮚌云獨覚利根尚經百刧况求作佛無多刧因文笠置上人云無餘還生無性有情成佛事自他宗遂無和會三大僧轉不轉不可設別會釈我宗人可𠈟起信論諸文自被會云云彼論云或示超地速成正覺以為怯𭋘諸眾生故或我於無量阿僧刧當成佛道以為懈𢢔諸眾生故能示如是無數方便不可思議而實菩薩種姓根等𤼵心即等所證亦等無有超過之法以一切菩薩皆逕三阿僧刧文西天笁之習設有道理無文證者為非義今既有文理尤可指南也要經無數大刧者入道章云始從資粮終盡法雲經三大刧其初資粮加行二位是初大刧從通達位至七地終是第二刧從第八地盡第十地是第三刧時畢三行𬾨四位方登究竟菩提果文二如下無德不攝故菩提心經云譬如大海初有一渧能為諸宝作所依處文史記云泰山不讓土壤故能成其高河海不嫌細流故能成其深文既大菩提等者唯識第十云諸根相好一無𨕙無限善根所生故文趣生者趣謂六趣生即四生也云云三雖下明大小勝劣意唯受一戒猶勝二乗功德者大般若五百八十六云尒時滿慈子問舎利子言云何菩薩有漏淨戒能勝二乗無漏淨戒舎利子言聲聞緣覺無漏淨戒唯求自利廻向𣵀槃菩薩淨戒普為度脫無量有情廻向無上正等菩提是故菩薩所有淨戒能勝二乗無漏淨戒文但為自身者顕揚論第十二云自義利者謂自利行如聲聞獨覚彼雖或時起利他行然本期願為自利故亦名自義文菩薩修一善悉為眾生作之故言不荷恩故也云云又云菩薩𤼵心時一切眾生饒益依此心持𭣦生一戒云不𭣦一切眾生是一切眾生壽命故云不荷恩故也云云二二下全分受謂從一戒至九戒初一分受攝之且随初云一分受也全分受者謂通在家出家十戒滿足者悉此門攝也云云二謂下三聚誓願二初𢝰標問謂三聚戒之言但全分受欤亦通一分受哉荅就之異義徃古義云但全分受不通一分受也全分受下言謂三聚戒故亦攝律儀断一切𢙣云云一分受等纔受一戒等豈具三聚戒乎為興正菩薩言傳云謂三聚戒之言寬通分全也全分受別無煩五戒受五戒十戒受十戒故不可用別料蕳是故不釈具出一分全分已欲明能受誓願云謂三聚戒也仍訓文云二者全分受讀断謂三聚戒於伊乎可破文也古點云二者全分受謂三聚戒可訓也即但全分受也甚非文意也問一分分受猶𤼵三聚誓願何受一戒等乎豈非躰誓相乎荅三聚誓願遠期來際祈願也非即時成就何不云断一切𢙣乎全分受時誓未來故即云三賢十聖伏断二障等豈縛凢夫伏断二障雖然彼遠期來際故誓伏断二障也是亦如是縱雖一分受遠期來際故誓断一切𢙣也次下文云非諸凢夫即能一切三聚頓誓漸修滿故者釈一分全分俱即時不成就之所以也云云三聚淨戒者法銑云初釈通名謂三聚淨戒三者是數薀積名聚離過名淨防非為戒即𭘧數尺初三聚者一攝律儀戒離𢙣有䡄名曰律儀𭇥多一名並𭠎稱之攝所謂靜慮無漏及別解脫律儀即戒名律儀戒持業尺也二攝善法戒順益有䡄名為善法眾多故取在此門故名攝善即戒名攝善戒亦持業釈也三攝眾生戒眾生所生名眾生令㱕善名之為攝生即戒亦持業釈文二攝下別解三初正明三初攝律儀戒凢就三聚有戒門誓門二種今所明非戒門是誓門也古義同本業瓔珞断𢙣門三聚云云甚背文意下云非諸凢夫乃至三聚頓誓即誓門見故戒門三聚得意不叶文意也文應断捨法者断惑障捨生死也生死者分叚反易二種生死也古准唯識論第十所棄捨躰以非障有漏劣無漏攝捨之言云云甚不叶文意如今文断者寬通二障伏断等也捨者捨生死法見宗要云一切雜染非障有漏劣無漏何云雜染耶依之近來改之准唯識論第四然雜染法略有三種煩𢙉業果種類別故文料蕳之也謂断煩𢙉業捨分叚反易二種生死也三賢十聖伏断二障者三賢者十住十行十廻向也十聖者十地也於五位述断惑行相者謂分別惑資粮之位漸伏見道頓断其相易知於俱生惑有種不同依唯識義私記委細圖之捨生死法等者唯識論第八云生死有二一分叚生死謂諸有漏善不善業由煩𢙉障緣助勢力所感三界異𤎼果身命長短随因緣力有定齋限故名分叚二不思議變易生死謂諸無漏有分別業由所知障緣助勢力所感殊勝細異𤎼果由悲願力改轉身命無定齋限故名反易文今捨生死法者謂分叚生死或初地智增菩薩或七地悲增菩薩捨之反易生死者至佛果捨之也問分叚生死初地或七地捨之何今不蕳至佛云捨生死法乎荅玄賛一乗義章出勝出分叚躰云通取因果出分叚死所有理智以為一乗文私記真興云問因位有出分叚義乃至佛果位中無出分叚義而何云通取因果出分叚死乎荅水抄云若㨿果位直是勝出反易乃至果中不出分叚義文意云分叚死實因位捨之果中亦無分叚死是故果中出之不道理今乃至佛捨生死法釈文例可得意也云云二攝善法戒應修證法者古由第十所顕得所生得得意今亦一具由第四卷諸清淨法亦有三種𠀍出𠀍道断果別故之文得意寬通漏無漏善悉為攝善法戒躰也云云私云𠀍出𠀍道漏無漏道修之断果無為可證之也十勝行者謂十波羅密也無垢稱䟽二本云然此十度在地前位於一行中唯修一行唯是有漏七地已前於一行中修一切行通有無漏八地已上一切行中修一切行唯是無漏勝前位故文二轉依者菩提𣵀槃也轉謂轉捨煩𢙉所知轉得菩提𣵀槃依是轉捨轉得所依第八識或是真如也云云唯識論九云便證得轉依乃至依謂所依即依他起與染淨法為所依故染謂虚妄遍計所犱淨謂真實圎成實性轉謂二分轉捨轉得由數修習無分別智断本識中二障重故能轉捨依他起上遍計所執及能轉得依他起中圎成實性由轉煩𢙉得大𣵀槃轉所知障證無上覚䟽云今言依他起名轉依者流轉還滅依也文又云或依即是唯識真如生死𣵀槃所依故愚夫㒹倒迷此真如故無始來受生死苦聖者離倒悟此真如便得𣵀槃畢竟安樂云論或依即是至之所依故述曰第二師解依即真如迷悟依也文三饒益有情戒謂布愛語利行同事以四攝法為躰也云云上攝善戒度約自利之𨕙今四攝本利他也意云六度為除自分慳貪等障是即自利四攝法為救前生行布是則利他行也是且一途立也實何攝自利他也云云窮未來際等者問三聚淨戒俱是盡未來之調伏也何唯饒益有情戒如此釈乎荅至佛果無可断惑亦無可修善断惑修善二行已圎滿故佛果上所行但為濟度眾生也都無為自修一切所修皆攝第三戒也故初二戒期乃至菩提第三戒者願盡未來際也問若尒者至佛果者初二戒可謝乎荅至佛果者一切功德善法圎滿成就都無漏依要期力至佛果已亦成就故不謝也又佛果位戒依已曾得住設雖第三戒期盡未來際非未曾得法若許未曾得者可有佛果勝劣之過故云云問𤼵三聚誓持𭣦生一戒唯𤼵律儀一戒不𤼵後二乎荅由一戒具三聚通諸戒持一戒三聚圎𤼵若依差別三聚随所持戒但𤼵律儀若攝善攝生等少兼持随其可𤼵但𤼵攝善攝生不許之也必持前四重其上可兼持故也依許分受義明之也云云二非下釋疑疑云初心始行菩薩云何有断一切𢙣修一切善盡有情界之義乎為此疑云非諸凢夫等也初心菩薩一切三聚頓非誓修行随位可修之為言又云一切三聚雖不能頓修行所𤼵願心可誓断一切𢙣等也云云三如下舉德言無礙者古義云無相清淨𤼵心也故云無礙也又有義云於十方法界塵沙万境真俗二諦上求下化之心無不遍滿故云無礙也云云随所生處心其中王者謂未證菩提以前或生人天或生鬼畜等随其所生處必得王果報云云心者一義云且舉能依心必可具所依身也一義云可作身字恐字誤欤一義云師義可作必字古本中作必字故知字誤也云云何無相心其中王身必王故也心地觀經第三具其相略取意引之彼云上品戒法王身佛中品戒轉輪聖王下品亦三謂先上中二品俱持上分勝劣下品三品皆犯戒下上品鬼神王下中品禽獸王也下品堕地獄受熖魔王身也無畢竟等者無礙所𤼵願行勝因所荅勝果無上菩提外無堪果者也故瑜伽四十三云又即如是所集無量福智資粮更無餘果可共相攝唯除無上正等菩提文上明三聚是誓門三聚戒門三聚事補忘抄舉五門釈大䌉大切也可見之文義長略之二護持門二初標上受得門是受躰是則随行也明曠䟽云言受持等者受謂受戒三業領納名受順受防護名持文述云護即持故云護持云云有人以此十門為五對一二共不共相對科意云具不具相寸也三四性相對五六貪嗔相對有開制對七八緩急相對九十護不護對云云二一下隨釋二初九門𠀍俗戒護二初隨心一門一分持二初立義三初法述云問隨心門者𢝰受上隨心持欤別受上隨心持欤荅或別受上随心持或𢝰受上随心持可通兩𨕙也云云述云問此門通在家出家欤將在家欤荅西大寺此門在家次門通出家在家招提寺此門通在家出家云云補問云此門但一分持亦寬通全分受乎荅有義招提寺同之云寬通全分持也既言随心何限分持乎又随其宿習等解釈尤可通全持依之本業文云乃至具受名具分菩薩文故知通一分全分俱此門所攝也云云菩薩御義也傳云但可一分持也全分持可攝遍學門也受得門一分全分各別明之依之護持門立十門初随心門為一分持随行遍學已下諸門為全分持随行前後苻順文相尤便全分自元具持無随心義豈号随心亦釈随其宿習加之故先固一漸具餘行之解釈但一分持見若尒本業文随文故來也如是釈家常習也随其宿習等者瑜伽四十二於戒出九種相中云一切門戒者當知此戒畧有四種乃至三者串習戒乃至謂諸菩薩昔餘生中曾串習如先所三種淨戒由宿因力所任持故於現在𠀍一切𢙣法不樂現行於諸𢙣法深心猒離樂修善行於善行中深心欣慕文二猶下喻猶如𠀍間随其本色等者八云此有異義一義云一器物有種色彼器物入水随器物色其色不同器物色不同喻受者不同薀水譬菩薩戒意云如來戒法唯一也皆可断法故但随眾生先𠀍宿因受𭣦等戒猶如一色水随器本色成綠碧等為言鏡水抄第十三云青色白色兩中間色為碧色赤色白色兩中間色為紅色青色黃色兩中間色為綠色赤色黑色兩中間色為紫色其中青黃赤白黑為正色紅紫碧綠不正色文師云持公存此義一義云綠碧等者水有種色彼黑白等水雖一處交流不乱猶類雖人道一類同𤼵心依宿習機不同也則本文有之文集詩云濟水澄亦潔河水渾而黃交流列四瀆川河淮濟為四瀆也清濁不相傷文三故下結漸具餘行者對一戒二戒等餘戒云餘行也二如下證問此文述受得之相何護持之證乎荅受随不相離故受有一分等受随必可有一分持等故為證也二然佛下二下八門全分持二初遍學一門專念護持三初簡前摽章有人於今十門以五相寸料蕳随心與遍學共不共相對云云遍學共随心不共則以分全兩持俱随心門攝之号不共也若依科文意必不為五相對若准有人義由科文意得意第一第二相望可云具不具相對也随心是不分持故遍學是全持故云云問遍學者全分持故為遍學性共學故為遍學荅凢就遍學有多種一性遍學則今門也正取性共學号遍學則性諸戒遍學之傍兼全分持故遍學義也是故科文二下八門全分持云云二通別遍學下云遍學行別受七眾是也則通別同學故云遍學也三內外遍學下以富樓那為遍學是也雖有三門不同今但依初性遍學也云云問此門通道俗二眾乎荅可通也優婆塞戒經中亦出戒令在家眾持之故况亦五戒中飲酒亦是戒四十八輕中亦有戒故在家全受亦此門可攝也云云二如瑜下引論證成瑜伽四十一云若諸菩薩安住菩薩淨戒律儀如薄伽梵於別解脫毘奈耶中將護他故建立罪制諸聲聞令不造作諸有情類未淨信者令生淨信已淨信者令倍增長於中菩薩與諸聞應等修學無有差別何以故以諸聞自利為勝尚不棄捨將護他行為令有情未信者信信者增長學所學處何况菩薩利他為勝文三故下𢝰結護持諸機嫌戒者聞戒也如𣵀槃經等也是以戒䟽二上云菩薩持性重戒與息𠀍機嫌戒等無差別文同記云彼性重戒即目十善息𠀍戒通篇聚文事鈔一云或随𠀍譏而起文同記云言𠀍譏者即諸戒緣多因俗譏起過方制文二然智下三下七門有緣開制三初利生通二初隨性門出家二初簡前標章二初引論簡前新行菩薩等者意云自在菩薩一行中行一切行為蕳此云新行也一𠀍者三𠀍中現在一𠀍也一時者加行等三時中根本也故云一𠀍一時也遍行五度者謂彼論意進為能行餘五為所行故精進不別立所以五度也彼云復次菩薩精進遍行五波羅蜜是為精進波羅蜜文如護三衣不能等者問随性門意相學慶現在前時可有三衣事乎荅輙不可三衣也付之不明若乞者來乞三衣之時不之寧不犯慳貪性戒哉是以令智論文證随性門離衣是罪不三衣可犯性罪哉如何荅智論文既如護三衣不能等云云不三衣之㫖明智論文意只為證相事由不三衣雖不行布非慳貪相何云犯性罪哉但若有慳貪心𤼵者可為善根未𤎼之謝意樂故又不可有過若不能悔謝有可犯慳貪性罪者可之欤為護随性門故然而勝㽵師智論文新學菩薩遂成不能三衣㫖如下所引問如智論諸比丘以所着三衣上佛𤼵阿耨菩提心見即智論四十云是般若波羅密時三百比丘從㘴起以所着衣上佛𤼵阿耨多羅三藐三菩提心文此文意如何荅攝釈第三云經中各脫身所着淨衣等者問比丘奉衣雖成檀恵離衣犯禁豈不招辜荅略有二尺一云既聞一乗悟解正法得正法戒離衣乃是息𠀍機嫌故捨衣無罪二云經中而有𢝰別心喜踊躍四眾皆然脫衣以奉別属於俗文水抄三十三云三解一由聞法花成攝善法戒二云言𢝰意別三云當日却得不經宿不犯文瑜伽七十五云若有出家菩薩除三衣外所有長物乃至思擇來求者當知無罪若䫃染法非慳貪障而不者亦無有罪文勝莊云問出家菩薩三衣否解云菩薩有二一者已見第一義諦二者新學已見第一義諦菩薩見三衣有利益者不䫃破戒及持戒而行恵皆無犯乃至若新學菩薩三衣不無所犯等文准如此文三衣不義分明也云云二由下標章述意問第三門通道俗乎荅科文云随性門出家文問付之猶不明如優婆塞戒經在家猶持戒加之在家菩薩受十重六八戒可有性諸戒何無随性義乎荅出家遍持性戒是故有相事在家希雖持不盡諸戒故相學處現在前義希是故但出家亦無性攝論釈相出雨安居等緣是則常律蔵等戒分作之是故出家也科文趣如是云云一性戒戒事瑜伽九十九云何性罪謂性是不善能為雜染𢙉於他能為雜染𢙉於自雖不制但有現行便徃𢙣趣雖不制但有現行能障沙門云何罪謂佛𠀍尊觀彼形相不如法故或令眾生重正法故或見所作随順現行性罪法故如是等事名罪文瑞應記云佛制不制皆招𢙣趣即名性罪因佛制已招𢙣道因成罪名為文燈七云論此與二乗有共不共等西明云舊云性罪謂𭣦生等生草等是罪今依攝論云𭣦盜等貪等所生名為性罪行生草等非貪等生名罪此意染心断生草等即名性罪今謂不尒彼攝論意若故𭣦生等必貪等起故是性罪故断生草非必貪等起故是罪又断生草等十業道中是何業道染心起時得名性罪若云由貪等是意業者自由起貪等何䦕断草又為貪等起𭣦等時應犯身意二處業道又解深密云十地中所起煩𢙉不染汙相由知而起但為利生不為過失此起貪等應成性罪何名不染汙若雖起貪等非染𣲇相不犯性罪故不得言但貪等生即為性罪云云二如下文證成攝大乗論聞菩薩相對於菩薩出四對勝中第二共不共對勝叚文也一差別殊勝三廣大殊勝四甚深殊勝也傳云與聲聞共之手相似𠀍利可破文也云云付之有人難云如本文以共不共名言結之是故訓文云與聲聞共𠀍利相似之罪等云相似性戒是故号相似罪既結言共不共何相似言属上耶是一失亦如攝大乗論四言偈也若尒可有乱句失是二失而𠀍親攝論云一切性罪謂殺生等名為共相似罪謂堀生地断生草等名不共文此文顕然以相似属下若尒未論解尺是三失是故可讀相似罪也云云今案云此難頗非也凢以罪号相似餘處有其證乎今文及論不可成其證若餘文無其證者如是料蕳太成憶度是一失次乱句難文句誠四言湏依道理可取其義是故名共其上相似義必然若尒依理訓文都不妨也然𠀍親釈論𬾨其證彼文亦與本論一同訓之都無相何取自義文訓難他義哉是二失云云二然下隱密門通道俗二初簡前摽章有人以五對料蕳十門其中第三第四性相對也第三依相事開第四由利益緣許性云云科文意可許此義也云云若有勝利性罪現行者宗要云問既生功德何名性罪荅意樂雖善方便𢙣故處不染不犯但由意樂不由方便以方便時有染故文方便𢙣者正𭣦之時具刀杖等方便似外相𢙣故云尒也問何故号隱密門乎荅少分希行故言隱密也由此宗要云少分現行其意同也有義云隱密者即甚深義也由之攝論云甚深殊勝即隱密義也云云問性罪現行通凢夫位許之乎荅由天台南山圎測與减等師意并宗家解釈但地上見無性攝論七云由是品類善巧者謂諸菩薩悲願相應後得妙智行𭣦生等十種作業文由此等文慈恩等諸師但地上許之又行事抄引攝論淨心地菩薩得無分別智行𭣦生等云云慈恩理趣分略之如是諸師解釈俱地上見若由今師意性罪現行通凢位見宗要云若以至知唯佛境界而随分故一切由心文又云或有作而非犯謂見勝利菩薩戒中乃至下凢善心所作皆非犯故云云解釈分明也問若尒攝論悲願相應後得妙智行𭣦生等解釈何可會乎荅彼文雖限地上以道理釈之宗要述理云不尒如何自判地獄以諸聖者既断彼故文此則瑜伽文不蕳登地未登地差別故如是釈給也若尒攝論且依極位可會釈也問此門通道俗乎荅科文云隱密門通道俗云云問若尒出家菩薩有利益時可行乎荅倫記云為護𠀍間誹謗重故制而不許文崆峒記云問出家豈無悲愍之心荅形相別故就利多故文如是諸文於出家有利益不許行也若依餘性罪有利益或地上慈㤙等意或下凢今師意也於出家可許之也若尒今科文依多分科通道俗也云云二如下引文證成二初引文攝大乗論第三云甚深殊勝者謂諸菩薩由是品類方便善巧行𭣦生等十種作業而無有罪生無量福速證無上正等菩提文二就下對簡瑜伽但開七非等者問瑜伽論是本論攝論即支末也如何相乎荅攝論之開十𢙣文無性攝論第七釈云十種作業而無罪等者謂愛樂善法憎𢙣不善見諸邪正名後三依止此故行𭣦等七而無有罪生無量福速證菩提或行前七不起後三大數言十或已伏除為試彼力故心蹔起不能招苦故無有罪能助道故生無量福文准知攝論實性罪現行限前七後三非正性罪現行還同瑜伽論也私云文集注意同之也然其第三但非性罪者問七非𢙣俱是性罪也何無属女非性罪乎荅依在家出家有不同也在家分戒邪是性罪無属女并自婦非邪行不障道果等故非性罪初二兩果許有婦女故出家菩薩邪正俱可性罪也云云私云瑜伽開七非中第三戒不許為性罪有属女客有利益開無属女故云開七非也然其第三但非性罪等文此意也文攝大乗論若有利益通開邪行故云行十𢙣也然瑜伽論意有属女利益難有護主心不饒益故是故二論文異意同也已上文集注意取記畢如𭣦生等随一攝故者謂如云𭣦生時無所蕳云戒時𭇥邪随一攝故為言私云此文攝論見利開邪行云事成欤一故起煩𢙉與性罪現行同異事師云多分同躰得意故起煩𢙉性罪現行故雖然少異事云云委如補忌抄二然莊下貪瞋差別二初順勝門堅禁勝嗔二初簡前摽章二初論簡前然莊嚴等云云述云問病何云然乎荅舊一義云瑜伽開七非攝論既開十𢙣然而十𢙣俱雖開之付後三業道貪可開嗔不可開為定故云然本今師本末二論相被意得故末論本論例非一故云云同述師御義云上二論不開後三既無性攝論會攝論令同瑜伽故如此雖不開後三莊嚴論意利益心至切時又開貪許故對上不開云然也本攝論等開十𢙣何又重可立此門哉問許貪何上二論不許之荅私云上二論與莊嚴論義不同故也由利群生等者彼論第六曰次貪罪偈曰菩薩念眾生愛之徹骨髄恒時欲利益猶如念一子故釈曰諸菩薩愛諸眾生此名為貪餘如偈偈曰由利群生意起貪不得罪嗔則與彼恒欲他故釈曰若諸菩薩愛諸眾生起貪名罪者此義不然何以故此貪恒作利益眾生因故文瞋則與彼者唯識論云嗔唯不善自他故文補云問莊嚴論文云起貪不得罪文與下愛順大悲故罪為劣同異云何荅有義云上貪與下愛俱同躰也意云初心始行菩薩將利眾生誤起愛染此貪雖實罪為利眾生起此故與嗔相對其罪誠劣由劣義且云不得罪實可有少罪是故下云故罪為劣也上下互舉𨕙其躰實同也云云師云見莊嚴論本文言愛諸眾生此名為貪文是則起貪不得罪貪大悲心号貪也次下文云悲愛諸眾生云由得慈心故由愍念眾生大悲故言不得罪也既生多功德豈有少罪下云愛順大悲是則染汙愛貪也然相對嗔其罪是劣而染汙心故可有少罪由之云故罪為劣也是則上下大不同而相對嗔愛順大悲貪義故其罪劣為顕此義莊嚴論生起順勝門也二由下摽章述意問順勝門得名云何荅八怗抄出二義一義云勝者大悲貪順大悲對嗔罪為劣為言一義云貪云勝貪嗔相對貪利群生不得罪於菩薩名勝欤二義中以初義為勝云云若依科文以嗔名勝於貪重罪故故云罪為重故輕劣重勝相對其義可知謂順勝嗔可謹護之義由此号順勝門也挍上下文相科文誠以叶文云云二如下引文證成多分與嗔等者倫記云菩薩戒中起貪煩𢙉或不犯若利益有情貪不犯菩薩戒為自利益即犯菩薩戒若嗔煩𢙉為自為他並能犯戒文立為大罪者小乗以戒為第一菩薩以大悲利生為本故以𭣦生戒為初戒也云云二然瑜下意樂門勝嗔亦開二初簡前摽章二初引論簡前然瑜伽等者上制嗔今亦開之故云然也瑜伽四十一云若諸菩薩安住菩薩淨戒律儀起貪欲盖忍受不捨是名有犯有所越是染犯無犯者若為断彼生起意樂欲𤼵勤精進煩𢙉猛利𮑇抑心故時現行如貪欲盖如是嗔恚惽沇睡眠掉舉𢙣作及與疑盖當知亦尒文盖即覆障義五盖覆善心故演秘云盖者能令善品不得顕了是盖義覆蔽其心障諸善品令不轉故文述云問瑜伽意都不開後三何今意樂門瑜伽文證起嗔盖等第五順勝門又瑜伽證非貪所起開貪尒者何彼開貪嗔等後三哉若云開後三又可同攝大乗論哉荅瑜伽意為利益不開後三也其㫖如上示也但順勝門瑜伽非貪所起文𢝰諸戒能起因不過三毒此三毒中又嗔所起多貪所起小云義也此但為顕貪嗔勝劣證也必非云開後三內貪次今門意為利益故非云開嗔等後三随分雖欲断彼煩𢙉熾盛不思起嗔𭾂等此若制犯非菩薩濟機故依意樂力時開不犯也雖然瑜伽意故非開作後三也云云二由下摽章述意補云由此第六有意樂門者有人云第五第六貪嗔相對云云意云第五貪順勝大悲是故開之第六雖嗔依意樂亦開之則二門俱開而貪嗔差別云云若由科文於順勝門不開貪嗔同禁之其中殊堅禁嗔為言是故科文云順勝門堅禁勝嗔云云第六門雖嗔依意樂開之所以科文云意樂門勝嗔亦開云云師云由科文意第五第六俱於嗔可云開制相對也第五制第六開云云二如下引文證成十住毗婆沙第六云龍樹造云何不捨如是自勸猶貪惜者應謝尤者云我今是新學善根未成就心未得自在願後當相與應辞謝乞者勿生嗔恨我新𤼵意善根未具於菩薩行法未得勢力是以未能捨於此物後得勢力善根成就心得堅固當以相與云云三然經下護法緩急三初怖畏門自利謹護二初引經簡前四門浮囊云云盂蘭盆新記云大智律師浮囊謂𤎼皮為囊以鳥毛貫之或以氣吹用此度海無慮沒溺即喻菩薩所受戒躰𣵀槃經云羅𠛴乞浮囊羅𠛴喻三毒欲犯戒初全乞喻犯四重二乞半喻犯僧殘三乞三分之一喻犯偷蘭四乞手許喻犯捨堕單堕五乞塵許喻犯吉羅菩薩皆不與喻謹護性故也文草繫云云莊嚴論第二出如下引之問科文七八九三門護法緩急文其意云何荅大有深意諸律所制性戒悉為護法制之見智論云毗尼皆為𠀍俗攝意不論實相為護佛法故文所以自利謹護性戒處自有護法之功是以此門護法中科之也二由下摽章述怖畏意述云上性密勝意之四門一向開門若開無制護戒之心可成踈浮故立此門令護戒心堅固也云云補云問𠀍有人云小乗性等學大乗小有戒緩云云此義云何荅此大誤也今䟽十門悉付菩薩戒立之其中怖畏門性等學何大乗云戒緩哉加之智者大師釈大乗戒云菩薩持性重機嫌等無差別自永佛道性重則急為度他故機嫌則急小乗自調性重則急不度他故機嫌則緩菩薩具持兩種故名大乗戒文此等解釈大乗勝小乗性等學見何不明此㫖妄立邪義乎云云二然𣵀下成勝門作善放止二初引經簡前補云問乗急戒緩者專出𣵀槃經今文其意云何荅天台止觀第四文句第二等廣明之彼釈意云乗者則定恵也為進修定恵則許緩戒是則名乗急戒緩則作四句云一戒急乗緩舎衛三億不見佛不聞法類二乗急戒緩如雙林圎時禽獸等也三乗戒俱急在𠀍舎利弗等諸見佛聞法得益類四乗戒俱緩如來一代之間不見佛聞法在三途苦域極重𢙣人是也惣釈云諸道沇由戒持毀見佛不見佛任乗緩急然持戒有麁細故報有優劣持乗有小大故見佛有實文古抄等多分由此義云云傳云乗急戒緩者見𣵀槃經始終并僧亮寳亮及今師古迹𣵀槃經古迹也等解釈大乗三學名乗乗家之別事名戒欲興大乗正法無持戒而知法人時菩薩随犯戒非法人敢不逆調礼敬供養等儀同彼畜八不淨財八不淨財事有律名句現随順相是名戒緩如是随順終令彼改非大乗三學流布𠀍間是名乗急是則欲佛法滅沒時為護法故少分有緩案摩礼足等戒是則号乗急戒緩見為進修自分定恵緩性戒都不見處也大乗三學何皆運載行者俱是乗何乗言但定恵哉寳亮云乗是護法之維戒是乗家之別事維既立則万行斯舉也文𣵀槃經古迹同之恐繁故不引之見經文始終此等解釈相苻文相若尒止觀文句等解釈不得經文大意者欤云云二由下摽章述意有成勝門者有人五對中第四緩急相對也第七急性俱急護故第八緩為護法緩戒故云云作善有勝等者首律師第二云持有二種言止持者方便正念護本所受禁防身口不造諸𢙣目之曰止言作持能䇿勤三業𭄺進修習三藏諸經定恵等行有善斯修名之為作文八怗抄古義云作善者定恵也止者戒也文意云為自分定恵增勝故戒為言傳云作善者興法利生作善也為興大乗三學放戒是故云且放止也問成勝門得名云何荅成者謂成就守護也自破一分戒門𢝰守大乗無相甚深三學法門成護勝正法故号成勝門為言問既云放止若尒非護持門何荅大乗奉戒但為興法利生為興法緩戒都不護持門由此經云菩薩摩訶薩於此大乗心不懈𢢔是名奉戒文同經義記恵遠云以法滅罪成戒不緩乃至大乗水自洗浴故雖破不緩文三然莊下護障門永禁自利二初簡前摽章二初引論簡前大乗莊嚴經論第六云無着造雖恒處地獄等文二由下摽章述意問護障門來意何荅上云為護法放止由之生疑有興法事一切可放哉依此立此門云縱有興法利生殊勝作善不可放自利心以自利心是小乗心護小乗心不可放之為言南山大師云凢夫唯自二乗自利兼他菩薩唯利他云云護小乗故者防守自利作善不可作義也二如大下引文證成二初引經文大般若五百八十四云如是菩薩雖處居家經於恒伽沙數大刧受妙五欲而勝意樂常不退壞謂常趣求一切智曾不𤼵起二乗之心是故不名犯菩薩戒若諸菩薩雖經恒伽沙數大刧修行梵行而起囬向二乗心應知不名持淨戒者文二解下解意趣述云問經文在家菩薩尒者受五戒等菩薩者雖受五欲不可有犯故經云不犯有妻子等故可有受五欲然如何云貪所污荅有義云經文既云受妙五欲無所蕳恒伽沙刧間受五欲時豈無五戒犯等之義哉随經文云雖受五欲或云不名犯戒意無數大刧間受五欲雖犯戒曾不起二乗心故不名犯戒若起小乗心即名犯戒為言故安雖字也但云無犯無餘犯不起小乗心故云無犯非謂無貪所起犯也云云付此義不明若云有犯戒貪所污一戒可失戒哉文相對云雖貪所污無餘犯故名無犯知所犯戒失云事若依之云尒者經云勝意樂不退壞何起上品心亦云污准下污是中下心何有随所犯支失戒義乎故此義非欤私云今云雖貪所污處在家畜妻子𭹀宝等物有貪欲心故云所污非謂污戒未起退大心故不制犯淨戒若設一念起退大心制犯淨戒終可至無餘犯故而又起一念二乗心時即非謂有無餘犯此時別輕戒犯也三十四退菩提心戒見等云云猶委細也可見之也二然文下究竟門出𠀍戒護二初簡前九門標章二初引經簡前彼經地上戒出四重犯戒相此其中戒文也下文四戒各證地上戒也此內心者愛染之心云也若𪵬尒有分別心者必不可云戒犯欤但有相之心可非究竟護持相以不取法相云究竟故云云二由下摽章述意補有人以五對料蕳文第九第十護不護相對云云若由科文十門中前九門𠀍俗戒護對此立第十出𠀍戒護見雖然由義門不可護不護相對第九護護自利障故第十不護以不護圎滿故云云問究竟門戒相其義云何荅𠀍俗戒迷情為本猶見能所勝義戒悟心為本能亡能所故上卷古迹云菩薩行六度時皆無所得以為方便無所得者即不住道若唯空有便可得無而復空故無所得故三輪清淨是名究竟修菩薩行文宗要云以二空破三輪相文謂戒罪人云三輪者展轉義有人故有罪有罪故有戒也以生空破人犱以法空破戒罪犱也云云二如大下引般若經證成是則破增益减二犱也若堕增二見俱成不究竟故今大般若文言應以不護者實有增益有執離有相執心護持是故云應以不護也圎滿淨戒者除無减空犱不依他法相悉持之故云云犯無犯相不可得者智論十四云若菩薩於罪不罪不可得是時名為尸羅波羅蜜問云若人捨𢙣行善是為持戒云何言罪不罪不可得荅曰非為邪見麁心言不可得深入諸法相行空三昧恵眼觀故罪不可得罪無故不罪亦不可得復次眾生不可得故𭣦罪不可得罪不可得故戒亦不可得何以故以有𭣦罪故則有戒若無𭣦罪則亦無戒等文此文釈三輪清淨行也補云問今究竟門者但為地上深位行相亦為通薄地淺位我等若但言地上深位行相者凢究竟門者由離能取所取得稱也若尒依分離犱相何不名究竟加之今師釈初𤼵心外門戒於護持門立十門通凢位更不及異論若依之言通凢夫所行今門生起文殊問經立究竟門彼經所由地上深位明之叚文由之下戒云當知此皆依地上制文次今文但地上解釈分明也究竟稱但深位名也凢位我等豈得究竟稱乎如何荅凢究竟門者正由登地所行相出之所以旦云皆依地上等若由分分雖薄地輕毛我等何不得究竟稱乎若由實究竟等覚深位猶隔見聞都非究竟况地前淺位行相雖薄地輕毛我等随分離犱相可名分究竟門也云云已上護持門畢
