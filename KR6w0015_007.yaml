body:
  text: 第四九戒二初標列自下九戒等者云此下兩九明攝衆生文開正故者第一不救尊厄戒也八怗抄一義云佛菩薩父母等為外道𢙣人所賣買則以錢贖留是則救尊厄難也由此成無畏云云一義云此義不得意於有情者雖有此義於非情形像經卷等不可有此義以錢贖之故則財也是以云初九戒中大分為二初一戒明以財攝生後八戒明以法攝生文與今疏釋大同故知財也撗取故者任價直取故如是以下諸戒皆以法式所定故當義法釋云云發願求故立誓猒故二解釋九初不救尊厄戒開正故二初標名牒經藏云第二次第者前故犯重禁今不救尊厄故也文云大小不共聲聞見眷屬被賣不贖犯第七聚經像及餘人不見別制菩薩一切不得不救唯除力所不及七衆同學也文問此戒所救物躰唯限三寶及己二親歟將復通一切有情歟答既云不救尊厄戒故可所尊境見付之不明菩薩大行遍以救衆生苦為本何於受苦有情偏蕳尊境哉依之義釋云文中但道人者妨多故餘人墮難理亦應救文此釋既明通一切衆生之旨尤有其謂若爾戒名一相有疑如何答戒相各別然而今戒於所尊所𭣦不救彼厄難教又慈故制此戒但救𪵬爾有情等之苦者可攝下不行利益戒也云不救尊厄尤有其儀歟是以法藏云自所尊三寶二親𢙣人所賣而不救贖故須制文加之經文正將列所救境佛菩薩父母經律及比丘比丘尼舉都通餘類義不見今師依此等文相立戒名不救尊厄尤順經文等也義釋者從本別趣𭤽不可會同歟云云二隨文述解二初制意云貨賣經律有辱之過貨賣行人有幽逼之惱大士既以護法濟苦為懷文問贖與販賣有何別乎答贖者只以錢等易也異常販賣販賣者諍價高下也經若諍經卷價高下五百生被賣文故知今贖者異常販賣云云二父下釋文經佛度後等者藏云於中先明犯時謂以佛在𠀍時無此事故云佛後也雖佛後然信心純厚之𠀍亦無此事故云𢙣𠀍中文父母形像等者藏云言父母像者己父母形像為他所賣又釋謂佛菩薩尊重如父母非謂二親形像文云一云只是大慈父母故云菩薩父母像一云刻鑄父母形像如丁蘭之類故云父母形像文義法藏等並存二尺也云云已上不救尊厄戒畢二撗取他財戒撗取故二初標名牒經藏云第二次第者前尊厄不救令害衆生故也文云此下八戒以法攝中有二前七以行法攝第八以教法攝以行攝中有二初二戒明離過行後五戒明攝善行離過行中初離害之過後離放逸之過畜養害乖慈攝行故制令斷大小俱制七衆同防文今師名撗取他財戒此中制雖有多事今以偽斗𫝣撗取他財是正制也如防殺見戒名不畜害戒亦釋不得畜刀杖等云此防殺害之過文亦釋因官形㔟云此亦防盜也文雖防盜殺二戒正防殺見若由今師解釋此戒皆防撗取見云云二隨文釋義二初制意如文二今下釋文四初釋不得畜刀杖等與前愛𭣦而畜者別者前畜𭣦生具戒也二此下釋販賣輕稱等如文三此自下釋因官形㔟等異前慿他者依㔟𢙣求戒也非盜戒攝者蕳異餘師義藏等諸師定兼重戒故今設會釋也問南山等釋雖他與少與多取犯盜戒見爾者何云非盜乎答實以盜心少與多取撗取他財上兼可犯重盜若無盜心設雖少與多取不可犯盜歟云云四養下釋長養貓狸等貓狸豬狗者藏云貓狸等豬是所𭣦餘三是能𭣦文法進注云貓狸𭣦鼠狐狢亦被侵傷故豬犳者獦入山𮚶其𭢓鹿此等解釋貓狸豬狗等非覓財具歟已上撗取他財戒畢三虛作無義戒避邪緣故二初標名牒經藏云第二次第者前貯畜非冝今觀𥊸作𢙣故也文云大小同制七衆不共文中列事有五一不得觀諸鬪若無緣事道俗俱制二不得𥊸諸樂若為自娛道俗俱制若供養三寶道俗俱開若自身作制道開俗三不得作諸道俗俱制四不得作卜筮為利道俗俱制如法指示俗人或開五不得作盜賊使命前十一戒制公通使命此戒制私竊使命此亦道俗俱斷文二隨文釋義二初制意應惜對隂者帝王毗論云聖人不寶尺壁而重寸隂文不得觀鬪事曠云初觀鬪者鬪謂鬪打俱通身口軍陳兵將即王者軍劫賊等鬪以賊等軍若自若教若試若並不得觀故云等也文二具下釋文三初釋制作樂等文吹貝者與減注云吹貝即螺貝也海中介蟲文藏云明𥊸音樂戒於中略明十種前九列九種音樂聲後一通結伎樂並可知文九種者一吹貝二鼓三角四琴五瑟六箏七笛八箜篌九歌叫也吹具知時者但證人所吹也為知時吹非謂不可𥊸也鼓法進注云鼓謂鼓動人燒泥瓦作之兩頭著𤎼皮曩打合出曲亦云胡鼓也玄𮚌云鼓木有皮動之即鳴文角法進云角者白水牛角形曲長三尺五寸用口吹令出聲大唐極多有也云云玄𮚌云曲形而似角吹之有聲也文琴進云𠀍本云琴者神農皇帝作三禮圖云琴長三尺六寸也文郭知玄云琴樂器神農皇帝作之本五絃周加文武二絃文白虎通曰琴禁也以禁邪令正心也此琴類也今琴十二絃也郭知玄意七絃見瑟進云瑟者其形相貌似琴瑟是庖羲作雅瑟長八尺一寸廣闊一尺八寸有二十三絃其常用者有十九絃其餘四絃有時用之復有瑟長七尺八寸廣一尺八寸二十五絃盡用之見三禮圖瑟形𩒐少由如琵琶釋名云本於胡中馬上所鼓也文箏進云箏者形似瑟短少許有十二絃文異當時箏云云笛進云漢武帝時丘仲所造長二尺四寸今時所吹笛者唯有七孔文與減注云笛竹之樂器七孔風俗通云武帝時所造或黃帝時伶倫造文箜篌進云史記云武帝時令樂人侯調始作此樂器出聲清雅空國諸侯來𥊸因以名之文郭知玄云箜篌樂器空侯國進來餘國無空侯國有故名空侯二十四絃文此依風作聲者也云云口傳云宇治平等院堂角所懸物是也云云不得摴𮑱者此已下至行城第三制諸有十種如下列之摴𮑱者進云物志云老子入胡作之用卜知吉今時人擲之為戲名摴𮑱形貌者有五掘木子各長四寸上各有刻一有四刻二有三刻三有二刻四有一刻五者無刻用以擲卜若擲得多刻者吉封若得一刻及無刻者𢙣封木既有五還有五名文圍基者進云圍基者以黑白石相乘被𭣦得他者名為勝文二波下釋制勝負文波羅塞與減云釋音云梵語波羅塞此翻兵即兵也文法藏師云等者即當今少將基書象馬等作軍陳效也撲揚云波羅塞者此象馬鬪是西國象馬法文彈基者進云以人手指彈基子得上高頂住者方名勝也文魏宮者魏代宮中出也云云六者與減云六法藏云即雙也乃至榮鈔云圖中左右各畫六路謂之雙文拍毬進云拍毬者毬也或以大毛毬盡力打地令高起者為勝也文擲石進云如大唐前周未有孔子弟子鐘葵共子路鬪擲石兩頭相去五里中間仍隔一高山竪石高一丈五尺闊一丈二尺兩人手各投一石闊六尺厚四尺盡力擲之葵石者打西竪石東南角一行墮地子路擲者數一丈五尺不到竪石處所此二人相共角鬪力處者今乃現在文投進云投者案投經太子洗馬上宮儀集𩒐長七寸口侄二寸半腹五寸侄長九寸已上容五𫝣乃至籌長一尺二寸文有抄云東大寺三倉有投之云云𭷣𭷣道者進云大唐已南朗冽人多樂作之畫地作河兩𨕙各有百人或二三百五百人相對以一𭛹大繩上復有子繩頭一木板方三寸長二尺五寸兩頭繫繩各樓人前向前𭷣挽使過河得度者為勝文有俗士語云正我昔作此隔河兩岸繩負者墮入河中是名繩𭷣也八道行成助尺云八道行成者取一尺方板以為其畫為三重方口從小至大四方四維各一直畫即成八道用馬各有十二黑白為殊共爭其道若三馬相隨即得一道取其者一馬隨道多小乃至取盡其者餘殘三馬任意驀城若無三馬即成輸了此是八道行城法也文三枛下釋制咒術卜巫文抓鏡者與減云爪鏡為二一爪二鏡爪謂以藥塗爪鏡謂以藥作鏡令人見其吉等事今時見有以鏡為卜者文今師意爪即鏡爪喻鏡也以爪甲知吉故名鏡也云云即御子也云云芝草楊枝者與減云蓍草易卜蓍也行傳云當端午日午時至栁樹下栁枝取刻作人形置於靜室以香花酒祭之仍以咒之有能知人休咎文今師釋異之別釋故云云鉢孟者與減云西土外道咒一切器物令人於中卜吉此以鉢盂為言即器也文髑髏者明曠云西國外道打人頭骨決知死生因緣等也問上邪命養身戒既制卜巫咒術如何亦重制之乎答上戒制為養身作之此戒制作無義利虛度時節也云云已上虛作無義戒畢四退菩提心戒趣正乘故初標名牒經藏云第二次第者前則制令斷𢙣今則䇿令修善故又前斷身語𢙣令斷意中細念文云第四不念餘乘戒乃至恐大行故道俗同學大小不共以所習各異故文此戒亦不共戒也問此戒犯與退菩提心捨不同云何答退菩提心捨者決定退心今戒非決捨心一念退惰心故經云若起一念二乘外道心文釋云故制堅持不應𮜋失文由此藏云堅持守心戒天台云𮜋念小乘戒云不念餘乘戒私記云𮜋學小乘戒皆此意也加之付退菩提心捨上品不待言中下待言若中下未出語內心生退心悉此戒攝也義古云問𮜋念小乘亦是本何故不失戒答心知大勝非都本故戒不失欲𮜋息大乘故輕垢身子者昔退戒可如此文問若爾下文大般若文為此戒證太不相應彼文無餘犯相此戒不犯失一支戒豈有無餘犯答疑難誠爾但雖一念猶有至無餘犯故不可起𮜋時一念輕戒之分為言二隨文述解二初制意大菩提心万行之本者花嚴經云因菩提心出生一切諸菩薩行三𠀍諸佛成正覺故文菩薩淨戒三德之原者云由三聚戒成三佛果謂律儀戒成斷德法身攝善法戒成智德應身攝衆生戒成恩德化身文問諸經論通談以戒為万行之本依菩提心成佛果是以上釋万行之始以戒為本万行之終菩提為果文如何今釋相反乎答可有兩𨕙思可知也云云二言下釋文五初釋行住坐臥法藏云制於四威儀六時誦持戒只自撿三業無毀纖塵文經六時讀誦者云若文若義誦持不忘文傳云當時十四日四分布薩攝律儀門之布薩十五日梵布薩攝善攝生門布薩云云㔟相接二言下釋猶如金剛如文三如下釋如𭘧持浮囊二初釋文明矌云涅槃經云譬如有人帶持浮囊欲度大海爾時海中有一羅剎來乞浮囊初則全乞乃至微塵悉不與此譬大少等持之相分假變易二死深廣譬如大海證三德果猶如彼岸戒浮囊無彼岸有期如針孔愛見之水漸止身心因少致大六道輪回失惠命名沒海而死文二如下證二初舉喻如文上委注之二生下合法如文四釋如草繫比丘二初釋文問此經成道最初之如何草繫比丘事乎答彼論文分明不出時𠀍但云我昔曾聞雖然定可非釋尊𠀍最初經此事故又義云雖成道最初未來事也今經如云佛度後故問若爾者草繫緣一時一會必可非三𠀍不改之事何三𠀍貫通梵可此事哉答實如來難雖然少事隨𠀍𠀍佛可歟故今且置草繫事實必亘三𠀍非謂可有此事歟或亦草繫緣三𠀍不改可在之也云云二如下證二初緣六初為賊所縛問命難梵難具許戒何故草繫比丘至死不轉答事鈔持犯篇云若論戒有開不開道力既成至死不毀如草繫海版等例餘志者命梵二難開下三篇以上二篇是梵行本故文二國下王見起疑如文三傍下人答佛子如文四王下王問比丘如文五爾下比丘答王如文六王下王發信心如文二舉况菩薩戒者彼草繫比丘持小乘戒不惜身命小乘持戒尚以如是重戒輕命况大乘菩薩重身命輕法哉依之藏云是故為持小戒不惜身命小乘尚爾大乘乎文菩薩勝二乘性等學故天台釋云菩薩持性重機嫌等無別自求佛道性重則急為度他故機嫌則急小乘自調性重則急不度他故機嫌則緩菩薩具持兩種故名大乘戒文由小乘機嫌則緩為蕳對彼云况菩薩戒也云云經常生大乘信等者藏云信知自是未成之佛者信佛性定有故行必可成故此信因決定也佛是已成者信佛亦曾如我修成此信果也由此信故行無退轉文經發菩提心者藏云菩提心下明制護大心謂由前信故令菩提心念相續無𮜋離心故也文五言下釋一念二乘心二初釋文退乘本故者若一念起二乘自利心者必終可至退菩提心之位故深禁微遠防退大心也若不禁微數起自利心必致退大心故云退乘本故也云云問經文廣制堅持大信發心三種然結犯時何但就第三結犯乎答雖有三種制以菩提心為本堅持之行必依菩提心有故又勸大信令不退菩提心方便故若一念退菩提心即乖餘二種故云爾也云云二如下證大般若經五百八十四云若諸菩薩雖經殑伽沙數大劫安處居家受妙五欲而不發起趣向聲聞獨覺地心是諸菩薩應知不名犯菩薩戒文今云若起一念三乘之心者取彼經意之經全文制永退大乘趣向二乘地者名犯戒也云云已上退菩提心戒畢五不發願戒發願求故二初標名牒經藏云第二次第者前防心不向二乘今誓願趣求大行故也文云七衆同學大小不共所求異故此戒亦不共戒也文今師此戒制四種願見一切惣願故藏分五願彼云一制願成孝行二願勝師友三願問大法四願如修行五願行堅持文義撲揚等制十大願云云曠云不發十願戒曠所制十願者於今經文分之彼云孝順父母師僧為二三願得如師友四願常教我大乘五願常教我十住六願常教我十行七願常教十回向八願常教我十地九願便我開解如法修行十願堅持佛戒通於初後故知十願因果具足文勝莊道璿同之也二隨文述解二初制意邪正是非莫不由願者邪由願者如鬱頭藍非想後報生飛狸獸殺噉多生命類也濟緣記二下云坐得非想定於林下水際修之為魚鳥所喧發起嗔毒欲害魚鳥以定力故生無色界非想天以嗔害故彼天壽終墮飛狸中能飛空搦禽入水取魚以食之文正善業亦如是如大太子酌海得珠類也智論第七云福德如牛願如御者問曰若不作願不得福乎答曰雖得不如有願能助福常念所行福德增長問曰若作願得報如人作十𢙣不願地獄亦不應得地獄報答曰罪福雖有定報但作願者修小福有願力故得大果報如先罪中報苦一切衆生皆願得樂無願苦者是故不願地獄以是故福有無量報罪報有量文二今下釋文二初惣述意孝順為因者以是為所修行業正感果因業大願為緣者希求回向心感果助緣願因緣遇會故感所期果故云所願成就也二願下別釋文二初別配願有四種者涅槃經十六云一切男女若具四法則名丈夫何等為四一善知識二能𥊸法三思惟義四如修行文瑜伽六十四云有四正行一親近善士二𥊸聞正法三如理作意四法隨法行文問義等諸師釋今戒約十願挍次戒發十大願已文相頗叶經意何故今師約四種願釋之乎答義等諸師釋尤有其理但今師意由諸願中此願最勝釋之則心地觀經云親近善士為第一乃至十方一切大聖主修是四法得菩提文兩師解釋何俱有其謂不可偏云云法隨法行者攝釋云法謂教法隨法行者能行之人隨教行故名隨法行由隨教行能生修惠文法隨法行與如修行同物也新譯舊譯不同故云云二如下惣結盡攝諸善等者凡菩薩所修雖無盡不出此四種六度十波羅密之諸行四十二位五位之修行無不攝此四願故云盡攝也云云已上不發願戒畢六不生自要戒立誓猒故二初標名牒經藏云第二次第者前則對順起願今則對非立誓故文戒名言要者即要誓也通而為言誓即願也然非無少異云第六作誓自要戒在心為願形口為誓恐隨緣傾動故立誓自要大小不共七衆同學文璿注云問誓與願何別答在心為願發口為誓故云作是願言又樂善為願防𢙣為誓故云寧以此身等如𠀍咒誓不名願又要所未得曰願必固勇烈之心曰誓文決擇記釋法花我本立誓願之文云問願誓何別合此雙舉答誓願小異願寬誓狹自有願非誓謂但發一念願心而不起𭤩誓之志自有誓即願如立誓言我當勇猛精進更不退轉等文上戒明可發四種惣願旨畢當戒制十願十三誓願言通於誓故十三誓俱云作是願即要誓之願也云云二隨文述解二初制意頎貝酌海者賢愚經八云取意乃往過去有波羅門號尼扚樓𨹔其子號大一切人民與衣須食金銀七寶稱意而與又欲入海求多𭹀寶用給濟民所乏即往三龍宮得三如意寶珠然海中諸龍密持此珠去即眠覺此不見茲大當盡力抒此海水誓心尅去若不得珠終不空歸即往海𨕙得一龜甲今云此也兩手抒之海減四十里二反抒之減八十里三反百二十里其龍惶怖出珠還之文如來及六十侍者乞於僧中陳如優留頻羅等上座欲給侍皆佛不許目連入定觀佛心如日出照西壁佛心偏指阿難是昔大太子入海阿難龍王供八千由旬雨寶如意珠起願云作侍者惣持弟子也是故如來以阿難為侍者也云云潤羽灑林者如引放火生戒處也獲珠感帝者獲珠者上大太子事也感帝者雉潤羽時帝尺感之故云爾也云云二云何下釋文二初釋十大願二初徵云何名為十大願等者問撲揚云今初十大願者指前戒也文如是餘師多分於上戒分十願已當戒指前戒云十大願已文相太便然而今師指餘經大文相凡今戒成道最初頓法爾常恆之䡄則豈待發菩提心經十願乎答今師解釋大有深意凡發菩提心經十大願者諸經通大願也古迹上卷釋十住處之中復次三禪中十願之經文云十願者如花嚴發菩提心經下當釋文此則心地品已前於今經中十願見但彼廣本未度上其相全同故發菩提心經釋之若爾經文發十願已之言更非指他經自指上品然者不最初頓義餘師中亦有如是釋義云文中發十大願已者或有本云發十三大願即下所立十三誓也先心中發已然後口立故云發已若言十大願者別有十願初心菩薩之所先發如發菩提心經文撲揚等解釋自元別師所立不可例難矣二謂下釋三初標轉勝十大願者謂從淺至深第一至淺第十至深中間兩望云云二一下釋十如文曾今所有等者釋尊五百大願中一云一分不留我身悉與衆生文今願意大同也第二願不生無佛國者問菩薩利他為本故好可生無佛剎釋尊因位願穢土濟度地藏本誓樂無佛利益何諸經通十願如是狹少乎答於菩薩有自利他二願今十之中從初至第五自利願第一猶云共成故亦兼自利也第六已下皆利他願故於自利他有別自利𨕙不生無佛國利他故亦不問有佛無佛八寒八猶如三禪樂甘心受苦况無佛𠀍界如是二𨕙釋諸經所菩薩大願都無所不遣第三願即如影隨形願第四願菩薩五通者上生云神通他心宿命天眼天耳文五通成就自有㔟力欲度有情隨心自在六通中漏盡通佛果方得之因位必不得故第五願達二諦者真俗二諦即根本後得二智第八願轉法輪者第六為衆生何異乎答第六只義令開解非令斷證故不得名轉法輪者正令斷惑證理也輪者摧破之義摧破煩惱故如云如來鹿𮏑初轉法輪五苾芻始證初果故第十願心無所行者謂所被機根令無犱相也三是下結惣誓此願等者十大願菩薩惣願十三誓護戒別願則戒戒皆有十三今且付明之藏云二別願大願有十三種前十二大願自護戒後一大願他成佛前中於戒立十三大誓餘戒準知文云下諸願門皆約戒從此有十三願若於十戒一言之即成一百三十以不別故以例之文則第一惣誓不行第二下別起不受信等願也問經文何故不誓初戒先誓第三乎答自行之時為初故約出之若約利他亦約𭣦先出攝律儀門如律藏以為初攝善利生門殺為何俱今經見攝善饒益為面故七衆通被教故重戒次以𭣦為初為自斷𢙣別發護戒誓願以明之餘戒準此兩門不同文據非一諒無相亂然信願上人義云菩薩通受戒七衆俱以𭣦為始故苾芻尼戒亦可列𭣦盜妄云云大背文相更不及取歒云云二發下釋十三誓三初標判問戒律儀根律儀其相云何答戒律儀者防身語七支𢙣前七誓中以言破戒之身破戒之口故也即七衆戒是也根律儀者意地護六根非正念惠為躰故後五皆云破戒之心戒律儀有無表根律儀無無表但依能防意立律儀言菩薩意地戒有無表是則別𨕙不可相亂又大小俱談二種律儀大如瑜伽二十一本文如文集亦如俱舍等明之彼以根律儀名意律儀恐繁不引問根律儀念惠為躰者出在何文乎答倫記云根律儀者即是防護六根念惠文勝莊云問第三不受飲食與十一不受百味有何別答先舉四事顯其不受後舉根門欲不貪故有別復次先口中不受百味後心中不貪百味此中意若諸菩薩防護正念即不犯戒不墮𢙣趣若失正念犯淨戒文二二下指證瑜伽二十一二種律儀之如文集三此下惣釋如文已上不生自要戒畢七故入難處戒離難故二初標名牒經藏云二次第者前則護戒心堅不避炎灰今則存身長道微難皆離文云七衆同制聞避難亦應同制文付此戒古師名不畜十八種物戒然而今師義法藏勝莊等諸師入難處犯也云云二隨文述解二初制意身心道器者善生經第六曰人身難得雖得人身難具諸根雖具諸根難得正見雖具正見難得信心雖得信心難遇善友雖遇善友難聞正法雖聞正法難得受持能如是觀是名人身文遂靜遊行者見經前後有五時一頭𨹔二遊方三坐禪四安居五布薩此時入諸難處者犯此戒惣離此五時分無餘時分故知制一切時入難處也然此五種不出動靜頭𨹔遊方俱散業故云遊行坐禪安居布薩可云靜業故云遂靜也二言下釋文三初釋行道道具二初明行道二初泛明頭𨹔二初別明二初定名二初正梵音言頭𨹔者等者舊譯梵語云頭𨹔新譯大般若等云杜多玄應法師經音義有多或云抖擻或云斗藪或云修治或云業除唐三藏云瑤動云洗灌謂瑤動滯洗灌煩惱故鏡水抄云頭𨹔誑也此云斗藪隱居淨處五塵不染義同斗藪如衣有塵土斗藪令落此義亦爾亦云除棄文二此下明漢名抖玉云多口切拂也擻同云思口切抖云云煩惱生死染等者煩惱者下經貪嗔癡也生死者即下經三界染者即下六入也云云貪嗔癡者即煩惱是因也三界者苦道是果也若捨因果隨所捨也六入者內外六入也資持記下三云抖擻舉於物合盡無餘從喻為名乃至抖擻即能治之智欲恚癡即所治煩惱乃至彼云抖擻貪欲乃至抖擻內外六入六塵為外六根為內也云云二依下出躰二初標列或十二或十三者問今家御意十二十三多小依何有此不同乎答如下解釋於乞食中常期乞食次第乞食開之有十三合之有十二也二依下牒釋三初依食四三初列釋四如文常期乞食者瑜伽論云隨得乞食者謂隨往還家隨獲隨得而便受食文遁倫記云以常期乞食即名隨得乞食文謂不蕳先至家行乞食也次第乞食者此不越次也多論有三品次第乞食上品一日唯一家中品七家下品從家至家取意但一坐食者瑜伽云謂坐一座乃至應食悉皆受食從此座起必不重食如是名為但一坐食文大抄記云一坐食與不作餘食人有何別答一坐食謂但一回食不食粥文遁倫記云不作餘食屬一坐食莭量屬先止後食文先止後食者瑜伽云謂為食故坐如應座乃至未食先應具受諸所應食應正了知我今唯受爾所飲食當自支持又正了知我過於此定不當食如是受已然後方食如是名為先止後食文二瑜下對治若依乞食無別性者倫記云以隨得乞食入次第乞食中收故文三大下受緣三初受乞食緣如文二尚下受一坐緣如文三有下受節量緣三分留一者舊有二料蕳一云三中一分自食故云留一舍利弗日只食五六口智論䄅人十口許云云順一分自食義也一云三分中二分自食而餘一分留不食也留字與先止後食之止相對同義故知留一者明是不食分也後義為正順文故云云二依衣三初標列毳衣者如瑜伽本文通三衣及長衣也瑜伽云謂所持衣或三衣數或是長衣一切皆用毛毳而作終不貯畜餘所作衣如是名為但持毳衣文倫記云基師又云無問鳥獸之細毛皆曰毳恐三衣以無價疊等為故以毳毛為之也此又或是長衣故知杜多亦有長毳衣應須淨也文三持糞掃衣者瑜伽云謂所有衣他捨棄擲或街或巷或市或㕓或道非道或雜便穢或為便穢𦡊血洟唾之所塗染取如是等不淨衣物除去穢堅執洗浣縫染受持如是名為持糞掃衣文問此糞掃衣通長衣歟答雖有三衣一衣異論未見通長衣釋是三衣一衣中以三衣為所存之義等云云此事補忘抄委細也可見之也二如下對治瑜伽二十五云於衣服中有三種貪能障修善一多衣貪二軟觸貪三上妙貪為欲斷除多衣貪故但持三衣為欲斷除於諸衣服軟觸貪故但持毳衣為欲斷除於諸衣服上妙貪故持糞掃衣文三大下受緣二初但三衣緣如文二好下衲衣等緣如文三敷具六初住阿練若二初標治定量瑜伽論二十五曰云何名為住阿練若謂住空間山林垌野遠離一切村邑聚落如是名為住阿練若乃至於諸敷具有四種貪能障修善一喧雜貪二屋宇貪三倚樂臥樂貪四敷具貪為欲斷除喧雜貪故住阿練若文敷具六者一切居處皆敷具攝之云云一住阿練若者釋梵云阿練若此云遠離處又云空處亦無諍處亦靜處亦無事處亦間靜處文一扚盧舍者事抄云明了論一鼓聲聞雜寶藏中為五里俱舍二里餘文惠𮏑云阿練若者乃至此為無諍聲謂要去村落一俱盧舍大牛吼聲所不及也文問今云可聞惠𮏑云不及處相云何答才聞明不聞故無相云云二大下受練若緣大智論六十八曰行者以居家多惱亂故捨父母妻子眷屬出家行道而師徒同學還相結心復嬈亂是故受阿練若法文二樹下坐二初標名智論云樹下思惟如佛生時成道時轉法輪時般涅槃時皆在樹下行者隨諸佛法常處樹下如是等因緣故受樹下坐法文二瑜下對治瑜伽二十五曰云何名為常居樹下謂常期願住於樹下依止樹根如是名為常居樹下乃至為欲斷除屋宇貪故常居樹下文三露地坐二初標名瑜伽二十五曰云何名為常居逈露謂常期願住於逈露無䨱障處如是名為常居逈露文二智下對治彼六十八曰行者或觀樹下如宇舍無異蔭䨱涼樂又生愛我所住者好彼樹不如如是等生漏故至露地住作是思惟樹下有二種過一者雨漏濕冷二者鳥屎污身毒蟲所住有如是等過空地則無此患露地住則著衣脫衣隨意快樂月光遍照空中明淨心易入空三昧文四間坐二初標名瑜伽二十五曰謂常期願住墓間諸有命過送尸骸處如是名為常住間文二對治智論六十八曰間常有悲啼哭聲死尸狼藉眼見無常復或火燒鳥獸所食不久盡因是尸觀一切法中易得無常相空相又間住若見死尸臰爛不淨易得九想觀是離欲初門是故受間住法文五常期端坐二初標名瑜伽二十五曰云何名為常期端坐謂於大牀或小繩牀或草座端身而坐推度時日終不以背或以其𦚰依倚大牀或小繩牀或壁或樹草等座等如是名為常期端坐乃至為欲斷除倚臥樂貪故常期端坐文二對治智論六十八曰身四威儀中坐為第一食易消化氣息調和求道者大事未辦諸煩惱賊常伺其便不宜安臥若行若立則心動難攝亦不可久故受常坐法文補云臥增眠沇行立增悼舉故常坐也云云六處如常坐二初標名瑜伽二十五曰謂所坐臥或諸草座或諸座如舊敷設草座座而常坐臥一敷設後終不數舉修理如是名為處如常座乃至為欲斷除敷具貪故處如常座文二對治以次上所引可知之也補云處如常坐與隨坐經論所出沒不定妙樂大師四十餘年不床是處如常坐也云云二瑜下惣明二初修道堪忍論全文如文集如未彈毛不任作氈者具貪等人不順梵行事如不彈毛不任作氈也不增不減者白衣多食多衣外道以食風裸形為妙行佛法不爾存中道故云云二智下皆助道法不以苦為先者問行十二頭𨹔等豈非苦行乎答對外道行頭𨹔還樂行故云爾也云云二言二下別釋經文二初正釋文述云春秋二時等者此釋文且依四時配立歟爾者準前戒自正月十六日至四月十五日為春時自七月十六日至十月十五日為秋時冬夏可知然經文將明二時分齊云從正月十五日至三月十五日等餘有三十日秋分亦爾是漸近復㔟故止遊行杜多歟秋時初三十日安居未竟故不能遊行故不出之云云二七十下顯非本七十三云者此宗人師只標卷數皆瑜伽文然而瑜伽無此文由此文集智論更加注顯則勘文者誤歟或智論兩字脫之歟云云補行注云私曰瑜伽論七十三無如是文云云智論七十三曰復次須菩提菩薩摩訶薩不貴利養雖行十二頭𨹔不貴阿練若法乃至不貴但三衣等文二此下明道具四初別釋十八二初別列十六初楊枝義淨三藏內法傳云每日晨朝須嚼齒木摺齒刮舌𭄍令如法乃至其齒木者梵云揮哆家慧哆譯之為齒家慧哆即是其木長十二指不減八指大如小指一頭復須𤎼嚼良久淨刷牙開乃至齒木名為揚枝西國栁樹全𮁻譯者輒傳斯號佛齒木樹實非楊枝文如阿𭇥者增一云爾時𠀍尊告諸比丘入楊枝有五㓛德云何為五一者除風二者除啼唾三者生藏得消四者口中不臰五者眼目得清淨文四分律云大小便嚼楊枝如是三事應在屏處文二豆與減注雖出八種但豆米也彼注云有八種豆胡豆大豆蓽豆小豆豌豆山豆䕪豆鵲豆用此淨身淨口文常豆與米粉去垢也三三衣資持下一釋大悲經文云㫆勒當來人壽八万穢時出𠀍三會法度人無量釋迦遺法弟子初會先度縱不得度乃至千佛最後樓至釋迦弟子無不度盡故曰無遺也文有戒無戒但有被云云問毀破四重禁之輩非佛弟子者出聖教而三衣是如來福田法衣也何可許犯重無戒之類哉依之見律文懷結使者不應被袈裟云云何况於犯重比丘令脫離三衣者諸律通相談也解釋一相有疑如何答凡三衣解脫幢相之法衣諸佛福田之服也離三毒之慙愧衣降四魔之忍辱法衣也犯罪無戒輩雖不可被著歸三寶不破正見之類何又不預其分哉何况經於沙門分多類律於比丘開多種既號沙門亦稱比丘可被袈裟之旨不可待詞又學侮比丘既受持三衣此豈於犯重者非許其義乎但諸律文者於無慚愧亦住邪見之輩不可被法衣等乎今者指正見類故無其相云云已上五怗抄也四瓶如文五鉢四初舉用如文二梵下明名如文三大下明量即容斗半者行事抄云四分大鉢受三斗小者受斗半中品可知此律姚秦譯彼國用姖周之斗準唐斗上鉢受一斗下者五𫝣十誦斗量同四分僧祇鉢他羅者受四𫝣也文故知今所出斗量約唐斗若爾上鉢受一斗然而云受斗半半之字𠝶可除之也有義云訓文云大者即容斗絶句半和小那利云云師云文就甚非便只去此無妨不勞曲釋八云四分意誠雖然諸部異太多故依餘律之文釋之歟云云而南山大師等於鉢器篇勘諸律異未見如是異部別會釋不足信用矣四律下明體資持下二云木鉢外道石鉢唯佛比丘俱離但用泥鐵文六坐具如文七錫杖錫杖經云佛告比丘汝等應受持錫杖所以者何過去未來現在諸佛皆執故又名智杖又名德杖影顯智行㓛德本故聖人之表𢡠賢聖之明記道法之幢迦白佛何名錫杖佛言錫者輕也倚依是杖除煩惱出三界故錫明也得智明故錫醒也醒悟苦空三界結使故若二鈷六環是迦佛製若四鈷十二環是釋迦佛製文釋氏要覽云梵云隟竒羅此云錫杖由振時作錫聲故十誦云聲杖文四分律五十三云諸比丘道行見蛆蜈蚣百足未離欲比丘見皆怖白佛言投錫杖搖文有抄云釋迦錫杖四方各有三輪合十二輪當時𠀍間但二方各有三輪合六輪迦佛錫杖也云云上錫杖經其意見云云八香爐有處云勇揵長者受五十丈大蛇身香爐者彼身之形也云云九漉水如文十手巾如文十一刀子與減注云相羕呼為護戒刀楞伽經云為截袈裟故𥊸畜四寸刀頭如月刃文與今釋所用不同也云云十二火燧如文十三鑷子螢鈔云西天多跣足擬之刺未知何出云云若由律文鼻毛四分云比丘鼻中毛俗譏故佛令畜銅鐵者文十四繩床如文十五經律如文十六尊像如文二是下惣結如文二十下惣釋十八二初舉有義問義師除揚技滲豆有何所以乎答師古中以楊枝滲豆入十八種物數猶同唐國古云十八物者一楊枝二澡豆三衣為三乃至十七經律十八佛菩薩像文然而後除此得經文小各別也彼云常用楊枝澡豆者楊枝有五德故常用澡豆為清淨故亦常用十八物者三衣為三四瓶五鉢六坐具七錫杖八香爐九漉水囊十手巾十一刀子十二火燧十三鑷子十四繩床十五經十六律十七佛像十八菩薩形文此二種日用物故不取十八數也依之𧦐經文云常爾用部師楊枝土澡豆土於句絶二然下陳正義此唐國師意經律佛菩薩為二三衣為三加揚技澡豆成十八云云此師意常用字遙從下反讀也云云問唐國者指誰人乎答玄三藏歟又法藏釋同此義彼云常用下明所用道具於中三衣為三佛菩薩像為一故有十八也文勝莊同之云云問今師解釋順何乎答見文假始終同唐國也上釋文云經律生解尊像起信文不開經律佛菩薩見云云又法銑亦有別義彼云三衣為一佛像菩薩像為二經律亦然為十八也文與減法進等同之璿注云初列十八物者如文一云闕針筒剃刀經律像等不入十八數也文此亦異上諸義也雖異義多由不除楊枝澡豆義也云云問此十八物闕一種可犯輕垢乎答莊云有人云此十八物隨闕一物犯輕垢罪今解此中不入難處以為戒耳此十八物若具不具無所犯文銑云有人云此物隨闕犯輕垢罪今解制加法受持如三衣鉢坐具闕則成犯無受法者如火燧等即無犯也文三常下持十八由初業菩薩常樂等者問上七十三文菩薩云不貴阿練若如何相反乎答可有兩𨕙上文自利為本一向住練若不利生𨕙今文制為自畜多物樂多事𨕙非謂唯受練若法歟於多事人莫起嫌心者初業菩薩雖不樂多事而又向多事人不可起嫌心也云云四若下決俗持衣二初牒問𥊸聞集云問近事優婆塞衆可有受持三衣鉢之義哉今古迹中經應畜僧伽梨衣鉢等云云付之割截不正之衣是則為別俗服也若二衆同持者頗諸律制意何况出家下衆尚限中下二衣在家俗衆何可畜僧伽梨哉解釋一相不明如何答正見善生優婆塞戒經文若優婆塞受持戒已若不貯畜僧伽梨衣鉢盂錫杖是優婆塞得失意罪文不受持既是犯罪也可畜之事不可及異義但諸律中不之事者彼依共許戒相明三乘通相威儀故可限出家衆也菩薩意樂廣大也戒相甚深也更以威儀不可為本只以心可為先立威儀不定之稱事源在此義㔟何况外相雖在家內心存出家故心出家菩薩受持衣鉢之事都不可疑之中國即淨名居士而持衣鉢我朝又聖德太子俗形而畜衣鉢是其心出家菩薩也敢勿疑外義云云二和下釋準之可知之如無垢稱經等者彼經第一云雖為白衣而具沙門威儀㓛德雖處居家不三界示現有妻子常修梵行現有眷屬常樂遠離文二餘下指布薩等文如文經半月布薩者縱雖在家若受一戒必可作布薩也云菩薩僧尼至半月應兩𨕙布薩誦大小二本不然者輕垢更詳本文在家菩薩若家內有淨室半月應自誦若無者由旬內寺舍作菩薩布薩則應往𥊸都不然者輕垢若自家迫及由旬內無菩薩會集者不犯也文經於諸佛菩薩形像前者法進云對佛菩薩形像前戒多生敬心又令憶念如來恩報恩德又因對形像用表真儀兼明如來法身常住而不故文銑同之經各被九條七條五條等者云各被九條等者一云以此文證三衣皆得入衆用一云此是并被衣如三千威儀云不泥洹僧不得被五條不五條不得被七條不七條不得被九條故知并也更詳彼文願行房有人云唯五條入衆布薩不可有苦經云各被等故云云此義同義初釋傳云凡三衣所用各別五條專為作𭄶豈堪入衆則以次義可為正今經重相西天之習上根人多但三衣人必中上二衣下五條不許直中上二衣所以經文具出非謂唯五條布薩曠云言各被九條等者去聲呼制令出家菩薩設不曾受聲聞律藏若菩薩戒亦異辨三衣加法受持非制重著文此釋制令具足三衣云各被等也非重也有人云出家必上中二衣可行布薩在家五條可行布薩云云此義勿論上既優婆塞戒經三衣俱通二衆何至布薩制令作𭄶衣云結復安居一一如法者結時依處受日出界自恣舉懺皆準律行之文三於下釋故入難處二初標分經若頭𨹔時已下正出此戒犯相也經文莫入二字先立讀之亦自一切難處讀之二點俱無相一切難處下可絶句云云二一下解釋二初標科配文二初制初入藏云略舉十二難處一國難𢙣王者彼國王不信三寶頭𨹔不得入彼界中二地有高下三草深林密四黑師子噉人五六狼七水八火九風十賊十一毒蛇所行之路十二惣結一切難處文二二下制住中故言頭𨹔乃至等者自釋伏難也先難云經既云悉不得入何可科制住乎通之云不得入此難處而頭𨹔安居是故制入中而住為言經悉不得之言自下安居可讀也二自下牒前結犯二初標判如文二是下正明二初牒前二初牒初制如文二此下牒後制如文二見下結罪如文已上故入難處戒畢八坐無次第戒無亂故二初標名牒經藏云二次第者前令外避危難今使內順衆儀故也大小俱制道俗同學文二隨文述釋二初制意如文二不下釋文二初牒文如文二法下正明二初標有義二初法藏師義二初行古義藏第三曰有人釋云令四衆等雜合通坐以明長幼今解不爾文今所引藏語少異也取意述也云云二此下陳自義藏云比丘衆中因辨尊卑餘衆皆爾是則大小然男女道俗不相和雜文私云今所取意述也此文意者藏師釋經不問老少等文也云云二義師義二初標如文二一下釋二初依菩薩戒義二初但受菩薩次出三師義此第一師義也但由菩薩戒不問聲聞復有無云云述云第一釋意云悉以菩薩戒為次第單受比丘戒者不可雜坐菩薩假令百歲比丘後受菩薩戒一歲比丘前受菩薩戒則一歲比丘在前坐百歲比丘在後坐為言彼一悉以受菩薩戒為次第百歲比丘後受菩薩戒一歲比丘前受菩薩戒則一歲比丘在前坐百歲比丘在後坐男女黑白尊類別雖先受戒不得交雜若奴前受即後受者則奴上即下已入戒法中不隨本位故文二一下受後變成二初出家第二師不持菩薩戒時雖百歲坐於菩薩下猶同第一師若受菩薩戒依舊復與第一師異是即上玄談許轉成菩薩戒師義也云云彼云二若本未受菩薩戒者皆在前受菩薩戒下若進受戒則還本次如百歲比丘未受一歲比丘已受已受者為上未受者為下若百歲者進受則還在上文二如下在家如此在家等者意云主雖後受奴之上可坐例如百歲比丘雖後受菩薩戒在十歲菩薩上而坐故云亦爾也更出例證云如比丘雖初復在百歲尼上為言彼云奴即亦爾若奴先受即未受者則奴上即下若進受還在奴上既同在戒應隨本位如沙㫆進受則在百歲尼上文二一云下不問別義二初出家第三師不問大小二戒別一切依先受文殊㫆勒雖威儀不定在𠀍出家形也云云述云第三意云以比丘戒為次第不用菩薩戒次也不問聲聞菩薩別者有聲聞比丘菩薩比丘不問其別只依比丘戒方前後依聲聞法得出家故為言此義者經文不菩薩戒云先受後受可得意也證智論文殊㫆勒事是心也文殊㫆勒菩薩戒方又雖經三大劫釋迦文佛𠀍出家受戒入聲聞衆之時依比丘戒次第坐所受之戒比丘戒也亦釋迦文佛無別菩薩僧故也云云彼云三威儀坐次皆以聲聞法為次序莫問聲聞菩薩但先受者為上若聲聞比丘十歲菩薩比丘九歲猶十歲者為上智度論云諸佛多以聲聞為僧無別菩薩僧如㫆勒菩薩文殊師利菩薩等以釋迦牟尼佛無別菩薩僧故入聲聞僧中次第坐此文但言先受者在前坐後受者在後坐不蕳聲聞菩薩戒故文二在家二初解同類在家亦應等者謂奴與奴主與主約同類言之故科文云解同類云云彼云在家菩薩既無歲數悉以菩薩戒為次今謂在家中亦應以受戒為先若受聲聞五戒若受菩薩五戒但先受者為上二雖下點奴主二初正明彼云若奴先受即後受者不得以受為次奴即位別本不雜故文二問下釋疑二初問問意云在家既不由受戒先後分尊卑若奴主俱出家猶分貴賤可定位乎二答二初正答答意云在家雖受戒猶奴主都不易本故分尊卑別出家奴位不許受戒必約放奴方許出家戒故不問尊卑別為言彼云設放奴為即應受次文二此下點文不同律云等者聲聞比丘由受戒沙㫆取生年今菩薩戒五衆俱以受為次第為言問師以何為正乎答彼云𠀍中行事多依後文則以第三師為正也今時行事不問通別先受為先相似第三義云云二和上下陳正義二初和上義二初據實解二初立義和上云等者自下有和上義主自義二和上者圎測師之弟子道證法師也主和上故一義云玄三藏云和上云云此師意以菩薩戒為上座也此和上義大𣥜同義第一有設雖在家坐聲聞大僧之上出家菩薩云坐聲聞上勿論也問菩薩在家坐大僧之上者許雜坐乎答不然阿闍𠀍王經為證彼文文殊所將二千在家在前而住文故非雜坐也若坐分左右左為上故菩薩可就左方坐行時例爾也云云二如下證舍利弗云者是舍利弗回心已後經云已發無上心故云云二雖下隨時解二初立義以前依實戒勝劣定坐次第了此以下明依時冝坐也二如下證二初文無別菩薩僧者釋迦法中聲聞僧為本故也惣化土以聲聞僧為本菩薩為末菩薩但化現也實身在報土故報土菩薩為本聲聞為末彼聲聞衆但化現十八圎滿之中云補翼圎滿是也云云二此下述意三初現身出家為初此明等者行事抄云釋迦法中無別菩薩僧乃至而坐文抄批云非謂釋迦佛法都無菩薩僧其菩薩皆剃染入聲聞衆中隱於菩薩之像從聲聞之像如經云內祕菩薩行外現是聲聞文此明現身出家者釋上智論意也出家分齊不依實戒次第文殊多羅聚落梵德婆羅門家受生示發心受戒之相㫆勒彼婆利大婆羅門家受生示出家剃染之形故云爾時相現也二若下明非實戒次第如文三亦下明非祕菩薩行二初明非現小亦非遍學入聲聞衆者有義云富樓那也富樓那雖內祕菩薩行都無顯菩薩相故非遍學也文殊㫆勒形相同聲聞而示菩薩相故是遍學行也法進注云問㫆勒文殊何時受聲聞戒令入僧中次第而坐乎答有二解一者遍學中當須受聲聞戒二者或可自然得於獨覺尚爾菩薩何須更疑文既以文殊㫆勒云遍學故知今云非遍學指富樓那也意云文殊遍學行現菩薩聲聞相故有現身出家實戒次第兩邊闍王經由實戒次第智度論由現身出家富樓那內雖菩薩非遍學行故但取現身出家不可由實戒釋此由云是聲聞非菩薩故也傳云此亦非遍學等二句文殊也凡於遍學有多重舊依不辨此別悮致料蕳也若由性及通別二遍學文殊㫆勒亦是遍學也法進注云遍學依通別遍學今文殊㫆勒云非遍學非大小遍學也文殊雖通別遍學行儀不定與聲聞異也謂往酒家至家等也富樓那是遍學行者即大小遍學也經云內祕菩薩行外現是聲聞文意云於大小遍學富樓那不可及論和不和全聲聞故於非遍學文殊等可論和不和別全是菩薩故為言非菩薩故者謂非現菩薩相也科文意如是釋文假倫次諒如是見然八云順法進故指文殊云遍學行義為正云云是則不解遍學有多重故有妄判也云云二若下點入聲聞如文二惣下疏主義三初定座次三初大小相對二初得戒為次惣而言之已下科文意主自義云云上出諸義竟取諸師意重述自義故云惣而言之也意云未受菩薩戒以前以聲聞復數為次可坐也若後受菩薩戒時以今菩薩戒方為次第云云二設下縱會反成設先所受等者點第二義然主不許轉成菩薩戒故言設也二菩下男女相對如文三王下主從相對若就俗坐等者內俗坐依其種姓公法會等隨戒﨟次也法坐者俗布薩等時也當時本寺本山等僧俗同此義也二由下合經文如文三問下決衆數二初問如文二答二初依通受明四衆智論四衆者瑜伽云七衆開合不同四衆之時比丘比丘尼攝出家五衆也二若下依別受明七衆若遍學行者此通別遍學也如聲聞七衆可有菩薩七衆為言經兵奴之法者云坐無次第兵奴之法者兵奴𭤽者為先不以長幼佛法道尊不應如彼文已上坐無次第戒畢九不行利樂戒利樂二初標名牒經藏云二次第者前制坐儀今制導故文云大小不共七衆同學也文戒名利樂者次下文自釋此則不共戒也二隨文述解二初釋戒文二初述意惣判福惠二善等者瑜伽論三十六云福即是三種波羅密多一波羅密多二戒波羅密多三忍波羅密多智唯一種波羅密多謂惠波羅密多精進靜慮波羅密多應知通二分文唯識論第九云諸勝行中惠為性者皆名為智餘名為福且依六種波羅密通相皆二行相前五為福德第六智惠或復前三唯福德攝後一唯智餘通二種文惣於今戒分二假自始至皆應立之福行而菩薩下智行云云經建立僧坊等者藏云教化衆生令作六事一建立僧坊二於山林中作禪屋等三為三寶立田四令作佛等五令作冬夏坐禪之處六但一切行道處所皆勸營立令諸行人得依此修道文銑云山林以取柴薪田以取果米文如此等釋山林田所之躰見奧云山林田是立僧房及佛處一切行道處者誦習禮念等處也但是修習佛道之處文勝莊同之若由此釋山林田立佛等處也今師釋不分明準上二尺云云二若疾下別釋救難二初釋文四初救諸難南人者江南人也産業者出息等也出生利分如母生子故若由大智律師解釋不屬出息通一切活業名治生見資持記云經營治業名為治生文藏云二救災厄難乃至於中有五一治生不利時二火災三水災四風災五海羅𭃯謂怖彼諸災皆應講此大乘文經黑風所吹者一義云惣黑風所吹云事也一義云船舫黑風所吹也是以明曠云𢙣風黑色所吹船舫無有的癀或在江河大海值羅𭃯鬼煩悶切文二救下救罪報三時報罪者一順現業舍利弗入慈定之時鬼神打頂地破烈現墮地獄是也供養慈定之人受王等現報也二順次生業五無間等業也次生必定受之故三順後業餘不定業也云云三救獄難如文四多下救病難前天行等者今一戒中二處有疾病難故會之謂上疾病中叐也鬼病等云天行又云時行也經三𢙣者奧云三𢙣即是三途璿注云三𢙣者有本云三報也藏云三報者一現報二生報三後報文與現行本異也云云二何下決疑如文二言下釋結文言梵壇等者藏云梵檀者此翻默良以非理犯不受調伏故以此治之彼品中明此義故故以為名可知文行事鈔上二云言默者五分云梵壇法者一切七衆不往交言智論云若心強撗如梵天法治之以欲界語地亦通色有不語為惱故情故不語治之此法最要文資持記云梵壇者有云梵王宮前立一壇天衆不如法者令立壇上餘天不與往來交語五分因闡𨹔惱僧故用此治文撲揚同資持記釋今師御所覽云梵怚法藏撲揚御所覽云梵壇現流布同法藏等本也曠云指廣中梵怚梵壇聲相近也此云默𢙣口惱僧故加此罰文故知怚與壇兩本有之歟云云已上不行利樂戒畢第五九戒二初標列云第二九戒中初五戒辨以戒法攝受後四戒辨以悲心教化前中初三明戒法授人後二明戒法自攝菩薩自攝令他隨學故雖自攝則是利他初三中第一明有器者不擇攝第二明有障者教令懺除第三明未受者不輒為文解釋趣與今同釋文委細故具之也云云二攝下解釋二初以戒攝受五初攝化漏失戒攝器故二初標名牒經藏云二次第者前講法生令受戒攝物故也文云聲聞許而中悔是犯若本不許不犯七衆同學文二隨文述解二初制意不擇而捨等者經云不得蕳擇故可擇取受器擇捨非器也經不得蕳擇之言先讀及從下一切鬼神句讀之二點俱無相云文中與人受戒時不得蕳擇乃至盡得受戒者舉十七類悉許受戒文中不蕳在家出家沙𢏏具足唯言得受若準下文教服異俗應通出家然云受法有二若準律法白四受者應須蕳擇無根等類若依三皈三聚惣受文既不蕳理應通受準半擇等許受五戒而近事性此中亦許受具足而比丘性等更無別蕳以義準的諸有智者當更尋教文準此解釋經云一切鬼神盡得受戒等由戒成𨕙性成𨕙七衆俱可蕳擇其機也出家戒得否具如上抄之二身下釋文三初釋身所袈裟等二初正釋經文二初釋皆使壞色二初三衣二初釋文別制出家者如今戒七衆同學彼云七衆同學經許支婦互為師故文惣今戒通七衆別制出家也皆使壞色之文別制出家見經青黃赤黑紫色者今經制五如法色律多制青黑木蘭三如法色舍利弗經遺教法律經等出五如法色與今經同也法律經有真偽諍矣不正色者八云有二義一云以五色交雜染衣故云不正色曠云此等五色互相參染名不正色文藏同之一云雖一色非正色故云不正色文殊問經等是也問今師解釋云何答亦有二義一云五色交雜故名壞色下經云青黃雜色故二云雖一色名不正色見雖言青等非正青等之解釋如此見今案云如律三如法色雖一種染色是不正色也今雖言青等解釋尤如是若爾非純正色中間之色故云雜色有何相乎故知上二義中後義順文云云述云於袈裟道俗俱可壞色俗人云各被九條七條等故又袈裟具躰色量三云如法服故今付內衣等云別制出家歟既云身所衣故非身所袈裟歟云云證之略之也二如下證二初正明法衣二初正明三衣如法三法服者三衣事也云云二及下傍證餘衣常使清潔者涅槃經云衣服垢穢破戒之相取意二如下因點臥具如文二言下餘衣如衣二與下釋與俗有異檨亦須別者述云依此等文北寺左前衣裳也然而此義不得意今云樣者三衣祇支䨱肩等衣非唯壞色作㨾與俗別意也非謂㨾也是以義云作之方法亦令異俗文若㨾得意何內衣等不左前唯褊計哉依之當寺義樣者三衣五衣作㨾也但律文見左前南山章服義左前右前隨方俗可之故律文且出天笁相彼俗人左前之故出家隨方毗尼故律文云左前也日本風儀左右前義冝也云云二言下釋不得與七逆人現身受戒二初牒文如文二有下述解三初惣解七逆二初開制二初懺已得受二初陳義有未懺等者義記與咸法藏等悉出今二義云云二如下證觀虛空藏菩薩經曰爾時佛告諸大衆言吾本無數劫中處於凡夫時字他陀在加倫邏國作於商客販賣治業虛妄無實造諸行不可稱計荒無𨕙不可具是時愚癡害父愛母經數年中舉國人民一皆知之吾時思念與六畜無異更無人事時於加倫邏跳城奔走趣於深澤時此國王名毗闍告令國中人民此他陀荒無道致為此事其有能得此人者當重賜寶物時此國人各欲捕吾身是驚怖出國作沙門在於他國修行十善坐禪學道晝夜泣淚經三十七年在於山窟常舉聲泣苦哉苦哉當以何心去此苦悲歎下窟乞食時道中地得一大鉢中有一匣經更無餘經唯有進法恱捨苦𨹔羅尼過去恆河沙諸佛泥洹時常在毗恱羅國此𨹔羅尼付諸大菩薩後有人得聞此𨹔羅尼者此人過去𠀍時修持五戒十善當令得聞此𨹔羅尼能除去百億劫生死五逆大罪若有人受持讀誦者終不墮於三塗地獄餓鬼畜生等文全文如文集二有下依文不得有不然等者彼觀虛空藏經但云得定未云得受戒故今師取第二師義宗要并今上文七悉除之故也云云問既罪障懺悔清淨何不受戒乎答雖懺悔清淨作五逆裎意樂者於今生尚非為法器分歟問此七逆者已受戒人所犯為障歟又未受戒所犯為障歟答解釋雖不分明準經文又例比丘戒十三難中五逆等之難未曾都受戒人有𭣦父母等者可成戒障也二言若下釋文一罪具等者寂云具有兩義一私云如今釋二於一身中容具七逆文具緣成犯者具五支等犯緣成故云蕳彼闕緣不具足逆文不取義次釋故云非謂要具等也問具七有何所以乎答罪根深結不能發菩提心故今經不得現身發菩提心等文約七釋之故問若爾闍王等發菩提心可許受戒乎經云王及夫人皆發無上正等菩提文故答利涉云雖七難不得為受以義言之亦應得受乃至下文所以七逆者不堪為作師證但自學於理無妨心清淨有情清淨故諸方等經犯四重五逆罪等皆許懺悔得見好相本戒還生乃至此是大乘即當方等何為不許為犯逆人阿闍𠀍王阿逸多皆蒙度故文此釋上所出初師義同也懺竟許受戒故即闍王逸多為其證今案云此釋大不可也闍王發菩提心涅槃經文分明未見受菩薩戒三逆逸多是亦非常途一時一會事若以逸多為證別受具足戒亦可許之乎佛度百二十婆羅門度造逆之人等皆一時一會緣非常開故闍王等縱百千一有發菩提心不可許受戒也造大罪故此且由今師正義第二師如是料蕳也云云二破下別解破輪破法輪僧等者婆沙論百十六曰問破羯磨僧破法輪僧有何別答破羯磨者謂一界內有二部僧各各別住作布灑他羯磨戒破法輪者謂立異師異道如提婆達多言我是大師非沙門喬答摩五法是道非喬答摩所八支聖道私云正見正思惟正語正業正命正精進正念正定也所以者何若修習是五法者速證涅槃非八支道云何五法一者盡壽糞掃衣二者盡壽常乞食食三者盡壽惟一坐食四者盡壽常居逈露五者盡壽不食一切魚肉血味監乳等是謂破羯磨僧破法輪僧別文補云提婆破法輪之時破僧逆業究竟雖有異且依南山等解釋正行羯磨布薩竟其業究竟雖然非俱時作法佛所布薩後時故破羯磨僧如智首南山解釋定一界兩處俱時作法犯偷蘭罪文故提婆不破羯磨也但謗單白二等可名破羯磨故云然謗羯磨等也當知提婆非具成二破然而有人云戒意提婆兼二破見云云此義大誤如別破之云云唯取破輪者於破羯磨僧出二義一云破羯磨非逆一云於菩薩為逆於聲聞非逆取意今蕳除彼後義故云不為難也云云述云問僧衆不和合是正法壞也罪既重也何不攝菩薩難乎是以經文云破羯磨轉法輪僧具列二類依之新羅義師受今文於聲聞非逆於菩薩是逆云云爾者如何答羯磨僧者界內別二部雖不成和合事未壞一𨵻浮提正法罪科輕也何可攝戒法難乎但經文舉二種者破法輪僧之時必有破羯磨法故云爾次師義是二尺中一解也文中無正不何以一義可難一義乎云云三善下因會餘經彼先入故者若𭣦已發菩提心衆生從自身先立入佛法故望自身者同和尚闍梨位也此以前受戒位且攝屬也云云三言下釋不向國王禮拜等經出家人者云言出家者蕳彼在家菩薩既隨俗儀雖禮所尊亦無所犯鬼神者乃至若審知現鬼神乃至禮亦無犯文今時諸神由知其本地致禮也乃至不輕比丘如禮四衆皆念佛性故無犯和光之諸神準例可解矣經一切衆生戒者等者藏云言一切衆生戒者有二義一不與彼一切求戒衆生之戒也二此是戒名謂名菩薩戒為一切衆生戒以此是一切衆生所應得戒故云也文由初釋一切衆生者指所被機也由次釋指能被之戒號一切衆生戒也六道四生不蕳趣生一切皆得故也云云已上攝化漏失戒畢
