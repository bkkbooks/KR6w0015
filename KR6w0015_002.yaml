body:
  text: 三第三下犯失門三初標章述云犯雖含失別開顯義也凡捨戒者捨未曾得戒不失曾得戒從此以後不增長防非之用是以表無表章捨相者初得㓛能念增長令不新長但順舊住不同前位更不新生即名為捨非捨昔者曾得躰無名捨不同小乘無得屬己文補云今言犯失者犯言寬通三失言狹上也文二謂下釋義三初明無無餘犯二初正明問無餘犯名義云何答𢝰談犯重捨有𢝰捨別捨不同如慈恩等諸師立𢝰捨義謂以上犯重戒𢝰頓捨諸戒也是名𢝰捨義如太賢等立別捨義謂以上犯重戒隨所犯支但失一戒無捨諸戒此名別捨義如是異論源由無餘犯料蕳不同瑜伽四十一云又於菩薩犯戒道中無餘犯文就之有二師不同初宗家所立義略纂釋云慈恩無餘犯者謂無有餘故以罪是極故此聲聞戒若菩薩戒無此無餘犯罪也文又倫記第十四景興聲聞戒中若犯四重於現身中不可悔名無餘犯今明菩薩戒捨而還受故云無餘犯文崆洞記云今詳纂意約不共住治罰之罪菩薩犯重不同聞定永擯也文是則宗家𢝰捨義表無表章等見依之今無餘犯者倫師及守千師不𢝰捨義釋之則聞具有有餘無餘犯犯四重名無餘犯僧殘已下名有餘犯初篇不許懺已復僧數故號無餘倫記意或聞犯重戒永擯之是故名無餘守千意也菩薩不爾雖犯重戒懺已復本或不擯是故云無餘犯也已上宗家無無餘犯意也次今師無餘犯者聞犯一重失一切無有遺餘故云無餘犯也菩薩不然犯一戒隨所犯支失一戒不失餘於戒猶有餘殘故云無餘犯也今始終文相如是見已上今師無余犯意也倫記第十更出別師釋等云云略之可見補忘抄已上取意少記之補云如有一分受等者意云分受分持本業經明之全受後分持未分明故例分受分持立全受分持也若有全受分持既俱受十戒後持一戒雖破餘戒不失所持一戒若不失所持一戒者無餘犯義極成畢文為言問表無表章於近住近事二戒許分受分持否具出二師義第一師義云缺受具足為後具持及小持亦成彼二文此師俱許分受分持及全受分持也第二師義云近事初雖全受可一分持成近事性既云成就而名犯戒故知可一分持非不全受文是但𢝰受分持不許分受分持也例彼二師今師當何義乎答今師既許分受分持例彼許全受分持若爾可云同第一師也有義云同第二師也云云此義不爾既許分受分持何同第二師乎第二師不許分受分持故不同聞犯一重時等者問如四分律同種同名俱云後犯亦爾如十誦律同種後犯得突吉羅同名猶犯夷如是諸律破一重時不破諸戒見何今𢝰指聞云便破一切失比丘性乎答付會此難有兩義不同八云雖不失戒犯一重失比丘性現身無得果其戒無用也指無用義𨕙言便破一切也云云要云雖四分十誦不許失戒二十部中大衆等諸部立三俱失義今指彼部云不同等也倫記第十云景云如小乘中經部上座部正量部等皆云於是三品中隨起何犯初重罪即捨律儀唯起三品犯他勝處皆不捨戒今大乘宗不同彼二文師云此義不爾於苾戒犯重捨章出二師義第一師義云五十三苾五衆律儀五緣故捨乃至依十輪經第四卷犯重不捨乃至瑜伽據彼上品犯十輪但據中下犯乃至二云犯重不問何心決定失戒五十三云犯重捨故乃至雖為此解言不失戒文多理正又犯戒者實有三心何因一類是令失戒故前解正文章主取第一師今師取第二師則苾戒不蕳三不同俱失故云不同聞等也云云宗要云又比丘戒三品犯重皆捨淨戒菩薩必由上品𮉐捨文補行文集上云表無表章云乃至此有二尺如上之注云私云今師第二義為正宗家以初義為正今且顯大勝冝依宗家文故知今云不同聞等由主自義釋之也非云指無用義𨕙及大衆等部也云云二如下引證二初引文盡心為躰者於此有二點一云盡心為躰一云盡心為躰謂凡聖二衆皆悉以心為躰為言師云後點順文相也云云述云元照師意心性理為盡心即以真如為戒躰也歸性談之也然今師意準文是要期思願正非戒躰依要期思願有戒躰若要期謝戒隨謝戒有無以心為本故云為躰也云云二心謂下述意二初明有心不捨二初陳法無盡戒願者述云道璿意以戒相戒躰遍十方界義云無盡戒也文今師釋不然先本業經證意為顯菩薩戒無盡無盡犯彼經也無盡者盡未來際法故經云心無盡故戒亦無盡心者菩提心也菩提心無盡期故戒亦無盡期至未來際也是以釋無盡戒願也又勝莊疏上云無盡戒謂菩薩戒盡未來際無窮盡故非常聞捨衆同分即捨戒故文若以周遍境義云無盡者聞戒亦可云無盡戒周遍一切境故文補云凡今師得意菩薩戒捨緣退菩提心必𢝰捨上必別捨也俱捨流類故但於一處之問就上別捨且犯殺生一戒時一戒分齊悉全捨但九戒不捨如本乎將又如何答付之有二義一義云以上犯一戒一戒全失但九戒不失乃至犯十戒其戒全失無有遺餘然犯一戒時頓不盡十戒故云無有盡犯也一義云不爾今師如南山存七毒立其南山所立一毒犯皆不失四分等不立犯重捨故若今師意南山相一毒分可失其一毒者所犯人上一毒不通餘人其所犯上一毒者謂以貪於女小便道行乃至大道口道貪分三道俱可失自餘瞋等戒於三道猶不失况餘盜殺等戒不失不及異論若不放捨無盡戒願等解釋尤如是見若犯一重皆失一戒分犯十重畢是有盡犯何云無有盡犯乎亦無餘犯稱恐成有無餘犯歟問若爾云隨所犯支失戒律儀文所犯一支分失見何答隨別境捨所犯一支是故云隨所犯支亦無相也云云師云後義順文歟可思之云云由此轉生戒亦恆隨等者問運增長相云何答付之有二義一云第三羊廣竟發得十支無表第二念增成二十支其中十支初一念無表前滅後生也是曾得殘十支未曾得新生無表也第三念三十支二十支曾得十支未曾得也第四念四十支三十支曾得後生無表也十支亦未曾得新成無表如是念中未曾得同十支也一義云初念第二念如前義第三念四十支二十支曾得二十支未曾得也第四念八十支四十支曾得四十支未曾得也如是念中一倍增也二義中以次義可為相羕實義仍引文證云倫記中釋不律儀無表倍增長未得對除已來念增長謂從十不善業道種次念增成二十第三增至四十乃至無𨕙文如是善律儀相例可同若爾第二義頗苻文相者也云云二猶下舉喻如文可知之二唯下明心盡戒盡述云問𢝰有菩薩捨緣幾哉答宗要云比丘五緣菩薩四緣云云瑜伽論決擇分第七十五云捨因緣略有四緣一決定發起不同分心作休捨意二於有識別丈夫前故意發起捨語言發言對捨三𢝰別毀犯四種他勝處法起根本罪四以上品𮉐𢝰別毀犯隨順四種他勝處法犯隨順罪文問瑜伽論菩薩地第四十云略由二緣捨諸菩薩淨戒律儀一者棄捨無上正等菩提大願二者現行上品犯他勝處法文二四相如何答此開合異也章云其菩薩地退菩提心即攝決擇中初二上品犯即攝後二文二然犯下明犯重捨不二初標列犯戒捨戒不同事守千釋集玄其意云犯者其戒不失但由犯無表微劣捨者其戒永失防非用云云當世學者多分存此義乃至今師失不失釋順此義歟次守千自義意三俱犯其防非用隨謝但中下懺還相續上品永不續現云云雖有此釋用不未判也能可抑處解釋也守千尺如補忘抄私云破戒失戒捨戒何上犯其義同歟汙戒中下犯不捨戒戒躰徵劣分歟又犯言廣可通三歟今古迹文如是見於犯分二故此事追可尋之二若以下別釋二初正明二初上纏失戒隨所犯支等者付之有二義如上抄之此則今師別義背宗家等正義其意如文集注文二若中下中下不失若中下唯汙不失之文付有論義可見𥊸聞集也二如下引證二初證上纏失戒文集注文云數現行等者謂煩惱纏猛不猛差別非謂數犯失文依之訓文云數現行仙土可讀云云問見是㓛德行相何答古義云無邪見也謂作𢙣思殊勝㓛德也傳云作𢙣思有殊勝㓛有殊勝德也必非無見也問付三品纏諸師分句不同大唐千師以三句分纏相私云毀犯等一句數等一句深生等一句也幽𮚌上云數犯四種都無慚愧樂犯為德名上纏犯非一暫行即名為捨文崆洞記云問其上品纏如何相狀答如文自辨有其三義一者毀犯四種他勝處法二者數現行都無慚愧三者深生愛樂見是㓛德具此義名為上品若具一二即為中下品可知非一暫行上三義非一初暫行二暫即不數但行不愛文新羅義以四句定三品數已下也今師解釋未分明依何可定乎答傳云以四句可定纏相也今師多分依義法藏兩師設解釋若爾依彼師可分纏相也義云若就心言數現行都無慚愧深生愛樂見是㓛德是上品犯即失戒也不具足四是中下品犯而不失文謂以初二句為𢝰句數現行已下為纏相當知上品纏者必可具數現行句有數現行意樂可具後三句故亦中下纏可闕數現行句論中下相云非諸菩薩暫一現行故又付中下品中下品纏必可闕都無慚愧句以不具一句方為下品故有慚愧心不可具後句故中品纏必可具都無慚愧句則都無慚愧已下三句隨一具之為中品纏依之元曉大師釋云若纏現行非極猛利或發慚愧是為下品文則下品纏闕都無慚愧句分明也又云雖極猛利無慚無愧未見為德猶在中品文則中品纏具都無慚愧句亦分明也又云都無慚愧深生愛樂見是㓛德是名上品文問上品纏必具數現行云云而元曉釋出上品纏但出都無慚愧已下三句云何答於上纏必具數現行句中下必暫一現行闕數現行論文分明所以略不舉實具四句方名上品其義如云云有人云依元曉釋以上三句為惣句都無慚愧已下三句當分三纏云云此義大不明文相大意故如是料蕳出來也云云法藏中云一若由煩惱現行非極猛利或發慚愧是為耎品二雖或猛利亦無慚愧未見㓛德猶在中品三都無慚愧深生愛樂見為㓛德是名上品最重也文則與持犯要記釋同也問義法藏等釋分明未審今師解釋順何乎答今師解釋順義元曉等釋宗要云中下品纏犯他勝處謂有慚愧亦不深耽見是㓛德文謂有慚愧者則下品纏必有慚愧故別云謂有慚愧也亦不深耽見是㓛德者則中品纏中品纏必具都無慚愧可有不具後二句是故云亦不深耽等也云云問今師所立義與崆洞記為幾別乎答有多異一四句三句異可知二彼記不立𢝰句今以毀犯四種等二句為𢝰句三彼記意必欲作四種方名上品此則不爾欲作一種有數現行等句亦名上纏云云問今師纏相大途可知未審宗家所立如何答師云崆洞記既解釋幽𮚌以三句解之若爾以三句義可為宗家所存也云云問八怗抄云但具數現行都無慚愧二句可名上纏則失戒云云此義何答此義大非也何有數現行意者不具後句乎亦若具足四即為上品不具足四是中下品之義解釋何可料蕳故知上纏必具四句若闕一句可云中下也云云二非諸下證中下不失私云非諸菩薩暫一現行等次上所引準幽𮚌并崆洞記可知之也不同聲聞一犯即捨文付五怗鈔有論義可見之表無表章於苾戒犯重捨出二師義如上引今師以章第二三纏俱失義為自義也故云不同聞等也述云問小乘中何部存中下不失義述中下失戒義乎答四分十誦俱舍成實等存中下不失義歟是以章家初釋依此等義歟正量部上座部等許中下失戒義依之章後釋來也凡撿本論文無不同詞付彼本文有長短讀樣若長讀聞三品纏共失如上座部經量菩薩不爾也謂非如棄捨別解脫戒若短讀聞中下不失如四分等律以聞例菩薩也謂非捨菩薩淨戒律儀如棄捨別解脫戒云云今記置不同字可知也三又上下明失戒重受經即懺者即今經上下卷𢙣求弟子戒云若有犯十戒者應教懺悔若無好相是人現身亦不得戒而得增受戒文三廣下指餘教理者述云非釋文故云教理也云云三且止下牒文解釋二初摽分傍論者釋經勸信偈以前其假分別三門故名傍論也云云傳誦本師門者問釋迦傳誦亘上下兩卷歟如何答爾也上下俱題安盧舍那佛言亦第四禪釋迦上卷菩提樹下但十重六八戒見若爾上下俱通報化二佛之明委如時處下記之也問上下俱通報化二佛何故義釋下卷題號盧舍言云上卷心地舍那自今此戒本釋迦所推㓛在本故云彼是則上下各見何答實上下俱雖通報化二佛結集時近上下互舉一佛依之上卷報佛之為本結集故文言難解舍那寸化佛故下卷化佛之為本結集故其義易解釋迦為凡夫癡暗故若爾且由現文釋之不云據實亦不通也云云述云釋迦傳誦者是初七日之間事也小乘凡夫見自受法樂也問若爾者初七日間一切菩薩衆悉俱見十住處化相乎答雖未分明由經文始終於菩薩衆有二機不同見偈中所各攝徵塵衆俱來至我所云云此微塵衆俱釋迦相從𥊸聞十住處法次長行所為此地上一切衆生凡夫癡暗之人等相亦菩薩衆中不聞見十住處機有之見爾者其凡夫癡暗定初七日自受法樂可見聞歟云云二經我下牒釋二初傳誦本師門二初顯主尊勝門二初現身本末門四初他受用身二初牒經標章經我今者法藏云以是舍那自故云我今然通辨我義略有六種一執我謂分別俱生在於凡位二慢我謂俱生在有學位三習氣我謂二我餘習在無學位四隨𠀍流布我謂諸佛子隨𠀍假稱五自在我謂十自在等如來後得智為性六真我謂真如常樂我淨等以真如為性此中稱我通後三種隨義應知文此義訓我今義云我今盧舍那者此是誰言即千釋迦中一釋迦言指自本身故云為我時非曾當正在今也文此義訓我今也我者釋迦自稱語也青丘解釋雖不分明文相始終同法藏歟現身本未門者問三身佛土相貌何答佛土章并三身章等具明之今略引之一自性身居法性土佛土章云自性身土即真如理雖此身土躰無差別而屬佛法相性異故以義相為身以躰性為土以覺相為身以法性為躰具恆沙真理㓛德此佛身土俱非色攝非心所但依一如差別義文唯識論云雖此身土躰無差別而屬佛法性相異故文云佛義是相法是性義躰為土義為身文又云此有三義有為㓛德法所依故衆德聚義故二身自躰故私云釋身義也又云㓛德自性故能持自性故諸法自性故私云釋土義也二自受用身居自受用土唯識論云諸根相好一無𨕙無限善根所引生故文又云謂鏡智品現自受用身淨土相文言自受用土者大圎鏡智後得智相分也佛土章云既成佛竟盡未來際相續變為純淨佛土周圎無際衆寶莊嚴隨法性土量無𨕙故文三他受用身居他受用土唯識論云平等智品現他受用身淨土相三身章云他受用身為諸菩薩現種身言音相好形量不定梵網經我今盧舍那方座蓮花座乃至初地自見百大千界一盧舍那阿㫆𨹔佛量是此所見如是二地見千三地万等積數應知乃至十地文佛土章云他受用土既有分限皆依蓮花而方建立文是則身土俱平等性智後得智相分也四變化身居變化土三身章云轉換舊形名反無而忽有名化文唯識論云成事智品能現反化身及土相文三身章云其反化身化地前衆資糧加行二位見別隨衆所冝形量不定文佛土章云其反化土或淨或穢或小或大前後改轉亦無定限隨生所冝一時現故文是則身土俱成所作智相分也依唯識論成事智後得智若依佛地論通根本後得二也凡於化土有二種一淨土二穢土於淨穢土各有二付之慈恩青丘二師所立各別具如下抄之三身佛土相貌大溉如是凡諸經論之異頗多如最勝王經法應化三身法身之中以能證智所證理合名法身能證者則自受用身也所證者則自性法身也以如理如智同法身故應身者則他受用身也最勝王經云他受用身有其二種一四善根位所見之身二地上菩薩所見之身今此但四善根位所見身文如此解釋十重舍那并上大化身俱號他受用也化身者中小釋迦及六道四生反化身也云云或經有法報化以所證如為法身能證智四智具足云自受用平等性智所反十重舍那為他受用以此自他受用二身為報身以彼成所作智所反淨穢教主為化身則上中千百億釋迦是也乃至六道四生雜類身等悉化身攝也或法報應化法報二身如前應者但淨穢化身也言化者六道四生反化難思議妙用也問他受用報身示現八相乎答為化悲增菩薩猶分假身則假示八相如鼓音王經㫆𨹔佛有父母問上大釋迦示現八相乎答淨土化身不現八相具如最勝王經三身品下明之恐繁不引云云二傳下隨文解釋二初釋上句二初正明言此身應第二地者十地各雖十度周修約圎滿位以十度配當十地也述記中明初地菩薩戒相云性罪必無犯但於罪猶有誤犯文至第二地則離罪誤犯是故戒波羅蜜圎滿位也依之能化佛通雖諸法門殊其相當法教之也戒波羅蜜此經宗故者問心地一品有上下兩卷其所法亦別戒法其隨一何惣指戒波羅蜜云此經宗故乎答此經雖有六十一品悉以戒可為宗所以者何宗要中釋題號云𠀍尊因梵網一部宗心文今心地品梵網經得名出來依之𠀍尊心地品云一部宗心既為六十一品貞心何不言此經宗故乎雖於心地品有上下兩卷不同言教主戒波羅蜜教主千臺上舍那也言釋迦娑婆能化主自述出𠀍本懷云如是十波羅提木刃出𠀍界文由本末佛身考經文始終以戒法為經宗致更不可及異論况三聚淨戒寬攝諸行万善万行更無殘若爾雖所法無量都不可背戒為宗故解釋依之香象大師今經以三聚淨戒為宗云云解釋趣大與今同也此義可祕也云云二非下行非非自受用等者問定今教主人師及異釋法藏有人義云此自受用身云云道璿注惠嶽師義云是法身云云如義師釋之云盧舍那者兼自他二受用身所以知然上卷云吾百阿僧劫中修行心地得成盧舍那故知通自受用為千釋迦所將微塵菩薩衆心地法故知亦兼是他受用此則對登地機所現身文此等解釋似有依準何由青丘所判偏他受用乎答既千百億釋迦各攝微塵衆俱至舍那所亍時舍那心地法門法化導儀式都非自受用身相自受用身身土俱無𨕙也此既有千分限若爾他受用身其理極成者也依之考香象慈恩等解釋今經能化悉為他受用身法藏上云此中盧舍那等三類佛有人釋云花臺上盧舍那佛是自受用身千花上佛是他受用身百億釋迦為反化身此釋恐不應理以花臺上佛亦是隨他受用身故則勝莊傳奧同有人義也三身章云梵網經言我今盧舍那乃至即他受用土也處行注云寂德解上卷經云百阿僧劫中乃至通自受用也乃至愚謂以此文證自受用身理當未可積行成佛餘身亦通此何為證故依我和尚義及取基等解他受用為定也文如是諸師解釋與今師頗同若爾今為破義寂師義云非自受用也云云花嚴等彼無𨕙故者就自受用身有躰遍用遍二義躰遍者一相好周遍法界雖然佛不思議力故互不障得心地觀經云自受用身諸相好一遍滿十方剎四智圎明受法樂前佛後佛躰同雖遍法界無障得譬如妙鏡不思議是真常住報佛土自受法樂無間斷文如是諸文皆躰遍義見用遍者謂肉髮在頂上千福輪在足下雖然其㓛德作用遍法界云云述云二義中用遍勝云也然而諸論多躰遍云云二方下釋下句六初成所居土解二初立義方者正也等者法藏云方坐蓮花臺者方有二義一將欲義謂方將等二正住義謂方住等今依後義在花上故云方坐也所化部落處為言有義云部落者𠀍界也部類之義落在之義謂千𠀍界百億𠀍界各別衆生各落在其中故云爾也或部落𧦐村云云貞觀改要中打其主部落不全云意打其主其餘黨其處不安填故云部落不全也此部落村義云云二如下文補云金剛般若會釋中云意地前十住十行十回向名伏忍以有斷智伏煩惱故初二三地名信忍相同𠀍間修三福業證淨信故四五六地名順忍順同二乘作菩提分等出𠀍觀故七八九地名無生忍長時相續作彼觀智故十地佛地名滅忍因果滿故文今云信忍則初二三地也百佛千佛万佛等者謂上釋迦也云云述云問初地能化佛自二地小化百佛上釋迦然中釋迦二地百億減可云十億乎又三地四地中釋迦增可云千億万億等哉答於中無增減歟是以淨土義林章云慈恩他受用土隨十地菩薩所冝現攝論等云初地菩薩悟十百門見百佛土一佛土三千𠀍界有百億四天下各有一化佛三千𠀍界中有百億化佛等云云十地經者花嚴十地品異譯也云云二於下破所坐花解二初直行補云有是座非也者𢝰付今蓮花臺漢朝土座二傳今師土傳也以上卷經為證問今有者指誰乎答古指慈恩云云上生并三身章改今經臺字為座字故知宗家是座傳也同學抄等如是見問若爾上卷經文如何可得意乎答同學抄等煩之會云或約㓛德云百万蓮花云云則今千是座量此花臺外可有無𨕙際土也師云此義大誤見佛土章宗家土傳見頗與今師同也佛土章慈恩云梵網經我今舍那方座蓮花座乃至一國一尺迦即他受用土既有分限皆依蓮花而方建立文則為成淨土義所出證文何為座義隨與咸等釋花臺云𠀍界形相似蓮花故云蓮花藏文加之法相宗立四種土法性土及自受用土無有𨕙際周遍法界無處不有他受用土及反化土有量土也佛土章他受用土既有分限等解釋分明何千臺外云有無際土乎問若爾何故今經文臺為坐乎答御所覽不同歟設雖云座以所居義爾云也與臺更無相也近來宗學者以宗家土傳為祕藏也問若爾今有誰人乎答指義師云有也義上云蓮花臺者乃至其量周圎千三千界此是座量非國土量文故知今有者義不可及異論仍宗家青丘俱同可得意土傳也二上下引文如文可知赫乎格切赤也發也明也盛也云云三既下引文成土義我住蓮花藏𠀍界海等者上卷古迹云𠀍界海者如智論云數此三千大千𠀍界如恆河沙為一𠀍界種數此種復至恆沙為一𠀍界海數此海復至十方恆沙為一佛𠀍界雖在千中央臺上而言在於𠀍界海者如化身在一閻浮冽言在娑婆為一佛土文四有下引有難解釋二初𢝰難是則座傳難土義也意云㫆𨹔慈恩三身章應是初地菩薩所見云云第二地能化佛土豈狹初地能化圎光乎二此下別解答之有二尺付初尺難云凡圎光者必一身半分如丈六釋迦圎光一尋也即八尺何以作意光明遣常光廣大難哉今會云諒如來難但光卷舒自在故長短不定也仍不可為難為言次釋難云彼佛身量既六十万億那由他恆河沙由旬云云例之眼分量尤相何彼云但比廣大哉加之見大智律師觀經云準身量勘眼量四大海猶狹取意何舉此為例彼難乎今會云既如者俱比度義故為言此二釋古來難義也誠二義俱未盡歟大智律師觀經義正觀記下云四明龍山足庵沙門戒度述台乃準度身曰𠀍人身長七尺眼長一寸一海八万四千由旬四海合三十三万六千由旬身過其眼五十六億倍假令極多無出万億何緣佛身長爾許耶乃是譯人謬加恆沙之言云云今曾無一語評量其意叵測文五故下結所居土解文意易知六何下因決蓮為座述云何故諸佛等者因述上百万蓮花為座所以也法藏云二就理如來智身依於真理義等蓮花故以表示亦有四義梁攝論中一如土蓮花在泥不汙譬法界真如在𠀍不為𠀍法所𣲇二如蓮花性自開發譬真如自性開悟衆生若證則自性開發三如蓮花為群蜂所採譬真如為衆聖所用四如蓮花有四德一香二淨三𤏙四可愛譬真如四德謂常樂我淨文表佛雖在𠀍等者影略互顯釋也天親攝論十五云以大蓮王譬大乘所顯法界真如蓮花雖在泥水之中不為泥水所汙譬法界真如雖在𠀍間不為𠀍間法所行文二經周下淨土化身二初牒經標章傳奧云周匝等者謂於真佛四面周匝有千花圍繞他受用身各依而坐文是則一一編周也非如今花但取似蓮花相也問上淨土者有何處哉答有第四禪也入大乘論云有淨居天成等正覺領三千界非𨵻浮提文準論藏第二禪小千界第三禪中千界第四禪大千界當知今上佛為大千主尤可居第四禪也法藏云其千花上千釋迦云即是千摩𨢸首羅天上各有一釋迦文有人云今此娑婆𠀍界千角第十三千蓮花重事二十五重也四十也云云述云淨土化身者淨土有多種天台四土一光土法相自性土及自受用土二實報土他受用土三方便土不共土有穢土中也彼宗意入無餘聖者所居界外土是也四同居土淨土今淨土也穢土今穢土也云云法相宗意亦有四土四身配立一自性身居法性土二自受用土三他受用身居他受用土四反化身居反化土云云委如上記二傳下隨文略釋三初正立自義問應地前機者但已入僧亦為通住前信相位答準淨土經餘亦生故解釋并唯識學記廣通住前凡夫異生見學記太賢云西方兩解一云如觀經等實凡二乘生淨土故然瑜伽云別時意者約受用土故乃至一云無反化土受生之處諸論皆云別時意故乃至初順諸教文即以初義為正二釋俱於反化釋之初釋反化淨土許實凡二乘生也次釋不許之也若於報土都不所論也問上既通凡夫異生中釋迦應無用何答正為加行菩薩資糧位等位隨分修如幻三昧修練淨業菩薩亦可生此中是故廣通凡夫異生也中穢土為不薰修淨業資糧菩薩及二乘所反三乘同見佛也仍無相云云二有下傍破有義補云問今有者指誰人乎答師云有者則指慈恩也三身章云一界即有一大釋迦四善根所見百億小釋迦餘三乘所見乃至資糧加行二位見別文則大釋迦但四善根見而今有同更不可異求然要云有慈恩青丘三師義云云是大誤也以唯四善根方生淨土解釋更為別師都無準據不可依用云云問阿㫆𨹔是初地能化何報佛報土文證淨土化身乎答有義云今師乘願力凡夫異生許生報土既生報土况不生化土乎為言今云不爾學記文分明於化土釋之凡於報土凡夫生都不可許之性相所定何不見如是文致憶度料蕳乎當知西方凡夫異生往生㫆𨹔三身中上土生得意故為證也問慈恩意西方淨土報化二土中何乎答佛土章出二彼云一云準攝大乘等西方是他受用土觀經自云阿鞞致不退菩薩方得生故乃至攝大乘云非唯由願力乃得生別時意故乃至二云西方通報化二土報土文證如前所化土證者鼓音經云阿㫆𨹔佛父名月上母名殊勝妙顏乃至二尺任情取捨隨意文則唯報土釋通報化二土二尺也淨土經云云雙觀經上云設我得佛十方衆生至心信樂欲生我國乃至十念若不生者不取正覺唯除五逆誹謗正法文問宗家上土但四善根方生云云淨土經餘亦生故解釋云何可會乎答依宗家意會之雖資糧菩薩等不生上於中雖有異義且依一傳有長時不共淨土是故觀經等指生中不共土言餘亦生也若依青丘意於中不許長時淨土是故淨土經為上淨土證也演祕七云問瑜伽論七十九云地前菩薩不生淨土攝論亦云生淨土者是別時意也如何今云化居淨土為未登地菩薩哉答傳有兩釋一云二乘異生亦生故觀經等皆誠故瑜伽論言不生者據受用土不化土二云不生瑜伽論以自會故乃至此言淨土據暫反即如法花三反淨土乃至詳曰今同前多經論中生淨故文二釋中初釋為正彼釋中不化土者即中不共長時淨土也淨土經等依此也為言問上生云雖知佛力念亦可生聖教不同數生心惑文此文許乘佛力生報土否答有義云此文許乘願力生報土也則與淨土宗諸義一同得意也師云不然上土猶外凡不生况報土然上生文云念亦可生即反化長時淨土也是則為淨業熏修資糧菩薩及回心向大受反易生菩薩所現淨土也雖然凡夫異生乘佛力亦可生觀經等所皆依此為言已前所明宗家與今師所立不同作𠷰示之三淨下惣彰不異淨穢同處者上佛土遍三千界故是同處也是以道璿云一花是淨土百億是穢土淨穢同處文然而上見之淨土也中見之穢土也是以大般若云諸佛如來所居之處則是淨土有情薄福見淨為穢文慈恩大師解釋云隨心淨處即淨土處文猶如四識等者阿毗逹磨經頌云鬼傍生人天各隨其所應等事心異故許義非真實文唯識論第七云謂於一處鬼人天等隨業差別所見各異境若實有此云何成文唯識學記云所見各異者鬼等濃河𮫭等宅路天琉璃地人清水故非實有境文實寬法印傳云雖同大海同反方四識共可同別受用之時已別業門也𢝰報𨕙可同反別業門自元所感不同故隨自果報所見不同云云述十卷私記四云問鬼等見濃河等者異質異見歟為當一質異見歟答他國有二傳謂古人云一質異見新人云異質異見也問二意何答古人意本質一然四有情見異也新人意有情第八所反本質各別隨質而四有情眼等識反影像而別緣亦別故云異質異見也問二傳中何為正答古人義有異唯識理不成故其本質境一者唯識所反境哉故不可依也云云鶖子所見等者維摩經云爾時舍利弗羕佛威神作是念若菩薩心淨則佛土淨者我𠀍尊本為菩薩時意豈不淨而是佛土不淨若此佛知其念即告之言於意云何日月豈不淨乎而亡目者不見寸曰不也𠀍尊是亡目者過非日月咎舍利弗衆生罪故不見如來國土嚴淨非如來咎舍利弗我此土淨而汝不見爾時螺𮫀梵王語舍利弗勿作是意謂此佛土以為不淨所以者何我見釋迦牟尼佛土清淨譬如自在宮舍利弗言見我此土丘陵𪫤坎𮏂𮑾沙礫土石諸山穢𢙣𭀚滿螺𮫀言仁者心有高下不依佛惠故見此土為不淨耳舍利弗菩薩於一切衆生悉皆平等深心清淨依佛智惠則能見此佛土清淨於是佛以足指安地即時三千大千𠀍界若于百千珍寶嚴飾譬如寶莊嚴佛無量㓛德寶莊嚴土文問螺𮫀梵王所見報土化土中何乎答報土也無垢稱云持𮫀所言我見釋迦佛土嚴淨復有無量㓛德莊嚴故亦他受用土持𮫀乃至第八地故文問舍利弗所見報化二土中何乎答師云以佛力令見化暫反土非報土也三經一下穢土化身二初牒經標章述云凡穢土有三好𠀍土㫆勒土濁𠀍土釋迦土暫反土穢土中暫反淨土今所言第二濁𠀍土也云百億釋迦者即是穢土四天下中為彼凡夫二乘及初發心菩薩所現身也文𥊸聞集云問經文一花百億國一國一釋迦文爾者今此釋迦者穢土成道化身歟將淨土所見佛身歟通云古迹穢土化身文付之為莊嚴他受用土現上中之佛身既是花藏𠀍界莊嚴之佛身也尤可云長時化身穢土出𠀍之化身暫時也亦有間斷何可云淨土莊嚴化身乎若依之穢土出𠀍佛身即中百億佛身者穢土出𠀍之化身懷劫等時無之是故於花藏𠀍界莊嚴佛身可有闕如之失爰知中百億佛身為淨土莊嚴佛身長時有之穢土出𠀍之佛身利沒不定佛身也依之勘宗家解釋以機不恆會互有所屬故多間斷云云爾者中化何云穢土化身乎答中百億佛身淨土所見穢土出現其躰不異穢土中待機根故有現不現不同淨土中無間斷故長時出現於一佛地上菩薩所見與資糧凡位所見有有無不同也資糧菩薩無見佛因緣之時雖不見此佛淨土莊嚴佛身既無隱沒佛化境界如此事何始可疑之故於中佛身云淨土莊嚴之𨕙云穢土攝佛身同躰而無差別云事不背道理歟云云已上補云穢土出𠀍成道人壽極增不過八万歲極減不越百歲有人師釋所由云有情樂增難教化故五濁極增難可化故文二言下隨文釋義二初釋所牒經二初釋下句問智論地持一三千界唯一佛見今經心地觀經等多佛義相違如何答三千界但一佛出𠀍者則小乘義也大乘許多佛出𠀍義但經論異三身章會之多佛者資糧道所見三千一佛者加行道所見也取意有抄云法相宗意每一須㫆界可有實一釋迦乎天台意不爾一大千界之中唯釋迦可一佛即娑婆界也雖但一佛能化無不足是故金剛座一種也但今經一國一釋迦者即餘方是化現也云云凡諸宗皆為大論義恐繁不載文南冽現故者分別㓛德論出其所由云見佛聞法出家悟道南列故文取意述云問小化身為化三千界將但為化一四天下乎答三乘同見小化身一四天下之能化也等云云委細也可見之二瑜下釋上句二初問問意易知也二億下答億有多種者上生云西方有三億數一十万為億二百万為億三千万為億文略纂一云然西方有四種億私云初三如前四万為億文二此下因𢝰結前此依麁相等者薩婆多唯知四方四維不知上下二方談佛唯一佛經部十方共許之則談多佛俱舍出彼計云東西南北無間無斷上下二方亦復如是色究竟上復有欲界於欲界下有色究竟文亦大乘猶許異類𠀍界故具出樹形人形等也樹形等者探玄記釋人形𠀍界云衆生形謂有二義一有𠀍界似衆生形二即種衆生皆是𠀍界如身中八万戶蟲各有九億蟲等此則是𠀍界文準此等釋於樹形等皆可有二釋也倒者如𧊵巢之類側者如宗密禪師釋如四天王居所文則居須㫆半腹也四天王側方住能可尋之因𨹔羅者帝尺名也具梵語云釋迦提婆因𨹔羅者帝尺前所懸羅五色互映無所障得例國土異類無礙也惠𮏑云因𨹔羅者天帝尺殿以珠覆其上一明珠內万像俱現珠皆爾此珠明徹互相現影而無窮盡文四經各下舉淨穢土二初牒經標章問各坐菩提樹等者義法藏等唯穢土身云云今師通淨穢土云云若爾上成道可有菩提樹乎答可有也心地觀經云大小化佛各於菩提樹下一時證得阿耨多羅三𦴭三菩提文乃至他受用報身坐菩提樹見彼經第三云為化十地諸菩薩一佛現於十種身乃至如是十佛成正覺各坐七寶菩提樹前佛入滅後佛成不同化佛經劫現文是則報佛於臺上菩提樹成正覺上第四禪菩提樹下成正覺中南冽菩提樹下成正覺也入大乘論釋上釋迦成道云在淨居天成等正覺領三千界非𨵻浮提文有義云上中同處隨衆生業力不同云云此義不爾所以不見入大乘論也經如是千百億者若由義法藏意但中釋迦也仍訓文云千百億則千亇百億為言若依今師意𧦐文云千百億謂千者上大釋迦百億者中小釋迦也二機下隨文釋義一時重化者大小化身一時化現舍那化大釋迦大釋迦化小釋迦是故云重化若約所化可云並化故問如唯識論等他受用身平等性智化現大小化身成所作智反化云云今經上卷文臺上舍那現千釋迦者其義相如何答論藏所判實理今且顯勝劣本末義如是也問上中釋迦舍那為莊嚴他受用土現之既是花藏𠀍界莊嚴佛身也依之見宗家解釋今經我今盧舍那乃至一國一釋迦文云即他受用身若爾今云一時成佛道依花藏𠀍界莊嚴佛身歟亦依淨穢土化身云之歟答凡今千臺舍那為第二地菩薩所現身土上中釋迦皆同報土莊嚴也永離間斷長時莊嚴寶土當知花藏𠀍界莊嚴佛皆同時化現豈異時故知今一時成佛道者具通兩𨕙謂淨穢土資糧加行能化佛一時成佛道花藏𠀍界莊嚴佛亦一時成佛道今文且依資糧加行土能化淨穢土面云舉淨穢土也問花藏𠀍界莊嚴佛與資糧加行所見佛同異如何答雖有異義且依一傳則同躰也但為莊嚴報土上中化佛永無間斷爰穢土機根𤎼雖示八相化儀依報土都無間斷但令機根見種相為加行菩薩顯大身第四禪令見成道為資糧菩薩顯小身摩伽𨹔國現成道皆是花藏𠀍界上中釋迦依機根現隱顯依躰但一也問大小化身長時為淨土莊嚴有之三身中何乎答一義云報土莊嚴上中釋迦三身中化身也則相續常一義云今云大小化身依淨穢土機根釋之若依報土莊嚴大小釋迦三身中他受用報身則不斷常也既為二地菩薩現大小身莊嚴之何云相續常乎燈文釋化身相云以機不恆會互有所屬故多間斷文即成事智有間斷見今報土莊嚴佛永無間斷故知平等性智所反加之燈文釋他受用相云化地上菩薩平等觀察二智能故不假事智文既言不假事智知平等性智所反他受用報身更不可及異論者歟云云三身成道同時異時之事補述二抄委細也可見之二經千下法本末門二初牒經標章述云第二法本末云云問本身者指他受用身將閞上化身歟答準今文指盧舍那見付之不明化身所得微塵衆者是應地前淺近凡夫而他受用非凡境何對淺近菩薩可法哉何不了法空實證之類不至報身如幻之身土者是性相所定也以知指上釋迦為百億釋迦所得衆法也是以義寂云教本末中初五句顯本億釋迦為時衆文爾者閞報身之解釋恐似乖性相之旨如何答凡釋一假經文以臺上舍那為本身以上中之身為末身之旨是則今大𮈣也是故本身者尤可閞舍那也就中文既云千百億釋迦各攝徵塵衆其意千釋迦百億釋迦各攝若干衆云趣彼文言明鏡也何可上釋迦哉但報佛身土非凡境界者是望自身力可談也若受加持之時所亘見聞也是以太賢師釋加力見聞給家法師解釋是別義之趣也不足會釋云云五怗抄意也取意此義本舍那末大小化身也二盧下隨文釋義四初釋初三句顯幽抄第一云問凡夫得見佛受用否答不見也若加𬾨力即凡夫見他受用身也如靈山會四衆八部皆見多寶如來是他受用佛也以常居淨土故文問若爾者依他力十地菩薩可見自受用身乎答三身章云問凡夫二乘以自力不得見而若佛等通力所引見他受用者十地菩薩以自力不得見自受用如來若佛力所引亦有自受用身及土見物歟答菩薩若自力若他力所引自受用身不得見身與土問何故爾哉答自受用身㓛德自內所得㓛德故菩薩等都不得見但佛與佛所知也他受用身外他德故凡夫等佛通力所引得見也云云二既下釋𥊸下一句述云問於今經可許三𠀍改之義哉答不可許也若爾者見今經文草繫比丘之事爾者餘時佛豈此事哉當來慈尊出𠀍之時食肉戒可制重戒見如何答食肉戒者非今經於餘經中可制重戒見委細料蕳至下可知也次至草繫之難者今三𠀍不改之者輕重及戒數多少不轉改故云三𠀍貫通蕳聞隨冝之故也但為勸持戒加因緣事都不可云云三味下釋甘下一句二初喻最極𣵀槃甘露者或言天酒疏作二尺初尺見義疏次釋法藏釋見二或下喻所詮戒法藏云彼以甘露配三聚戒彼云又釋甘露有三義一當食充飢同攝善內𬾨二當飲解渴同攝生濟乏三當藥療病同律儀斷𢙣故以為喻文出三界門者法花經云以佛教門出三界苦文對機而顯者撲揚疏云佛教如甘露能除煩惱機教相扣譬如門開文四凡下釋是下五句二初𢝰釋五句八怗抄云凡心者所得微塵衆機也報土非凡境不可久住故欲還故云易竭也勝影者上中能化身也是則成事智所反相分身佛故云勝影也機根既不堪任還本處故能化佛不可留也又有人云凡心者見分勝影者相分也又有人云凡心者自證勝影者相見二分也今雖有多義第一義勝也云云此義意者訓勝影難留所化凡心易竭故能化身佛難留也一義云勝影者指臺上舍那也是自受用影像佛也此義意訓勝影難留也二此下別釋本師二初本身為本師補云問付誦我本師戒有二釋本師言可知我之言指誰乎答有抄云依初釋訓文云我禮本師之戒謂舍那自謂也我即本身故次釋意者訓文云我之本師多留戒是我者舍那自也云云述云一義云我字屬大小化身云云二或下戒法為本師義云本師戒者諸佛以戒為本師文法藏云謂此戒法諸佛所師故云本師戒也文補云初釋今疏自義次釋義法藏義也云云二戒如下讚戒㓛能門二初牒經標章如文可知之二戒下隨文解釋二初釋上二句二初性合釋二初性喻日月法藏云初二句菩薩戒德圎滿於中初能破無明大暗出生死長夜顯無住𣵀槃故云如日月也二能莊嚴行者令諸佛護念人天樂觀故如瓔珞珠也又釋初是惠嚴後是福嚴又釋律儀戒以能破諸默𢙣故如日也攝衆生戒以大悲清涼為相故如月也攝善法戒以能攝修具諸勝善法而自現故如瓔珞珠也云云二莊下性喻莊嚴如遺教等云云問此文意如何答彼經加料蕳可成證據之義也彼經既不分明是影略之文歟上句出法下句舉喻意云法云慚愧之法於諸法最為第一喻云瓔珞莊嚴於莊嚴最為第一以慚愧喻瓔珞法喻各出一句也證之意經文為顯戒勝利以瓔珞喻之此瓔珞於諸莊嚴為成第一義經之喻比例之也還為成第一也今戒法彼慚愧此𨕙雖不同莊嚴第一義彼此同巴一義云慚愧喻戒慚愧即戒故是以七佛略戒云有慚有愧樂學戒者云云於諸莊嚴最為第一者大集經云菩薩有四瓔珞莊嚴一者戒瓔珞莊嚴二者三昧瓔珞莊嚴三者智惠瓔珞莊嚴四者𨹔羅尼瓔珞莊嚴文二或下性別釋三初性戒喻日月如文易知二戒喻莊嚴如文三破下𢝰述二喻意私云破性罪暗故性戒喻日月嚴性戒故戒喻瓔珞也為言二万下釋下二句私云微塵菩薩衆由是成正覺二句也述云文意云夫成佛道依万行成其万行中以戒為本万行圎滿即是成佛果此果成事但以戒為本乘此道理云是故也是以事鈔云發趣万行戒為宗主云云𠀍親攝論云謂菩薩由此尸羅建立無上正等菩提云云三聚如應等者義云成正覺者由三種戒成三佛果謂律儀戒成斷德法身攝善法戒成智德應身攝衆生戒成恩德化身云云所集福智者正三聚戒時攝善法戒屬智攝律義攝衆生屬福業也私云是一往配當歟無餘果可共相攝者因果不相應故云云二經是下末主顯揚門二初牒經摽列配文可知也二此下隨文釋義四初展轉開化門二初標此即初也四字歟二謂下釋謂上六頌等者今疏釋大綱義記上於今經文分四戒三勸彼云偈中大意四戒三勸四戒者一舍那戒是盧等一句二釋迦戒我亦等一句三菩薩戒汝新等二句四衆生戒受持等二句舍那為本傳授釋迦為迹乃至三勸者一勸受受持等二句二勸持汝新等二句三勸誦是盧等二句文今疏意不可之歟述云經汝新學菩薩云云下釋發心云十信位也行實有退非三賢之正位文準此文今新學者住外之十信乃至可通薄地凡夫等歟至下廣可述之也云云戒手相攝者戒法手喻如𠀍間人自手羕傳物戒法師資受傳故云爾也云云二經諦下所成戒相門二初牒經標章如文二𠀍下隨文釋義三初釋第二句八云諸餘所制戒文云一切禁戒并定惠諸法上乘下乘皆出今菩薩戒以三聚𭇥攝一切法故今師釋云三乘万行從此生故云云元曉釋云此三聚戒能定惠等諸行有𭇥攝義故為藏云云依此義戒即藏持業釋也八怗抄正義也自餘略之若依文集薩遮尼乾子經意即於諸戒中此戒為藏一切所大小漸戒出自今梵頓戒是故今菩薩戒為一切大小戒成藏也文一切禁戒者𢝰摽也上乘等者別釋也上乘者謂善戒本業等所戒相下乘者律藏所制戒法皆出梵頓制為言依此義則戒之藏依主釋也問若爾下云三乘万行等相何答非無其義然而今文未必然也云云二簡下釋第三句二初約三律義簡蕳定道戒者彼𢝰離一切非故云𢝰解脫也表無表章云有漏定俱現行思上有防欲界𢙣戒㓛能為躰定共戒也無漏道俱現行思上能斷欲界諸犯戒非為躰此二戒躰俱現行思隨心轉故文義鏡云問何故靜慮名定無漏名道解云光法師俱舍云定道兩種雖俱通二為蕳差別各立一名文二梵下梵為漢語二初語此云別解脫云云別即上提名解脫即下毗木刃名上下兩名取合云別解脫也云云二別下釋義二初以別出非釋表無表章云別防非名之為別能防所防皆得別稱文則因解脫也𣵀槃經等離三業非為波羅提木刃者則此意也二又下以順解脫釋此遺教文果解脫也離𢙣之義順果故因中攝果號別解脫也述云問果名因者果解脫何云別解脫哉提木刃別解脫故何答一義云因別解脫所果果故名別解脫今順彼果故又云別解脫也云云一義云別者戒當躰別離非故解脫者隨果遺教經云是順解脫之本不云別故義鏡云戒是正順解脫之本故名解脫七支別起發名為別文三若受下釋大下五句二初述文意若受菩薩戒者補云問凡今偈約未受者勸信也何故今師於已受戒釋之耶依之法藏疏發入理菩提心名具足戒品淨名言發菩提心名具足戒等此意也取意義意約能堪護持云戒品具足也皆約未受戒釋之今師所立頗經文歟答一義云今師意與義法藏一同未受戒上可得意也仍訓文云若受兼爾和菩薩戒謂於母𡧃部之謂受戒前念約未正受得意也傳云不爾今疏意約已受人言已足雖未受得上顯受得已之上行相也若如法藏釋者有妨今勸菩薩戒雖發心未得戒故異勸菩提心維摩意也如法師得意今疏則應第三能受有情門非所成戒相門也仍訓文云受𡧃家手菩薩戒謂於母倚手已成下之可讀也云云述云不同分心者退菩提心也此當決擇分中四緣第一緣也彼云一者決定發起受心不同分心云云遁倫記云本受戒心名不同分心文善思分限者以種上㓛能雖名戒躰攝假從實云善思分限名為戒故也準十章思種是實法種子所生法故㓛能即假法分位假立之法故離種不立故唯識論云然依思願善𢙣分限假立無表文二如下引文證二初引文盡心為躰者即善思分限也心者思也隨本心王云心故法鏡云此就勝理實是思也思屬心故云心為躰也文有點盡心為躰云云而義㔟非便今訓盡為悉謂凡聖同悉以菩提心為躰也云云二此下釋心述云大乘心者是思願分限心名大乘心亦上云心謂期心也退乘及未發心者退乘者既起不同分心者也未發心者聞戒通生得加行之二心菩薩戒唯加行之一心故不發菩提心者不得戒也云云三經一下能受有情門二初牒經標章易知二應下隨文釋義四初釋二句二初正釋經一切有心者等者問義疏云皆應攝佛戒者謂一切衆生有成佛信心皆應攝佛戒也文此釋攝上經文常作如是信等文則指菩提心云有心也今師解釋不分明云何可得意乎答傳云有心者有情識者為言故有心者得發大心之解釋尤如是見依之法銑釋云蕳草木石水故云有心文法藏疏云但解法師語盡受得戒故云一切有心者等文是等解釋必不約菩提心但一性宗故不蕳有性無性也𣵀槃經凡有心者必當得阿耨多羅三𦴭三菩提文等是也五性宗不爾故蕳有性無性也應者容也者師云可字必決定容字必不定也應字通定不定故蕳釋也唯識論第十釋四𣵀槃云二乘無學容有前三唯我𠀍尊可言具四文不定性二乘不具無餘故云容𠀍尊具四決定故云可也仍為今潤色云云問今經所被機通漸頓二機乎答爾也正機唯頓也而漸悟菩薩亦可受今戒故俱可攝也云云二此下問答二初問文意易知二誰下答難發心者㫆勒論三云若以一指能舉三千大千𠀍界此事非難發心能取菩提是事為難文二即下釋衆下二句補云佛位有二者義依占察經立四種佛位一信滿法故謂種姓地二解滿法故解行地已上三證滿法故初地已上四一切㓛德行滿足故佛地取意今但取初後方為二位也今入初故等者究竟佛果其㓛在初發也大品經阿等四十二字他宗釋配當四十二位而初阿字攝盡四十一字也亦初發心亦復如是云云述云一義云因果不二故云即入諸佛位也宗家之意因果上能生道理果因上所生道理故因有果能生故即因佛位果因之所生故即果有因都不相離故唯識論云定異應非因果性故文三初下釋位下一句位同大覺已一句釋也經者法𮏑林章云者當至合之義所言經者天親論解云謂能貫窂乃至名素呾覽文今經者𣵀槃經三十四卷彼云如是二心先心難今證同𨕙故不也四已得下釋真下一句二初正明真是諸佛子者凡立佛子稱諸不同本業從初住方號佛子或文初地方立佛子名則約證位也今經諸師解釋一同縛凡夫初發心得戒則名佛子見法藏云入菩薩三聚戒中即是佛本因之位故名佛子下諸戒首皆云若佛子者是也文二頌下證二初略頌是頌依攝大乘等主私結之也方便為父者𠀍親攝論以佛為父則以佛善巧方便為父信者信樂大乘一念信攝大乘名解脫分善方為成佛種般若為母者母懷妊時能知毒藥輒不服其子安穩也以智惠力蕳擇邪正也腹中靜時其子安穩也行禪其善種能生長也具如𠀍親攝論十八卷眼禪房五師有義云約通門如前釋別約戒門審決二思為方便動發勝思名信此所熏種無表所依也信心義雖通審決二思且動發勝思勝故如是配釋也為言此義不審能思之云云二廣下指廣如文可知也四其下點開許廣門偈終二句如文可知也三經爾下結戒序二初牒經標列第三結戒序等者古迹上云經為此娑婆至一戒光明述曰大假第二誡𢙣行門於中有三開序故正故流通故初亦有三時處故勸故結戒故文初經家序者五百羅漢結集阿難誦之或文殊㫆勒等於鐵圍山外結集阿難令誦云云此則阿難序也撲揚云結集經家序文言序者律攝第二勝造云言序者是由緒也謂戒時以此為先乃至得生起故文問阿難佛成道夜生年二十初佛侍爾者何第二七日今經聞而安此序哉答報恩經六云佛二十年法阿難不聞何得云我聞答曰諸天語阿難又云佛入𠀍俗心令阿難知又云從諸比丘𨕙聞文問經家序餘經皆置經始何今此經置中間哉答實證信等六成就等序此大部經最前置之歟雖然此品殊更舍那所品故重又經家置此序也問若爾者何此品上卷始不置之哉答盧舍那上卷正為三乘菩薩凡夫等不知之故今十重四十八正菩提樹下之故此置之也問若爾者我今盧舍那偈頌已前為此娑婆𠀍界初何不置偈頌後置之哉答實雖可有為此娑婆𠀍界初經家意欲續經文告諸菩薩言今置之歟云云二此下隨文釋義二初經家序三初釋初坐頓結三初釋文三初時問法藏上云爾時者是此化身從報佛所受旨回還至此之時故云爾時也法銑撲揚明矌傳奧道璿處行等皆同之然今師遙捐都天下生之時大難思如何答今師意臺上還來十住處法等所作初七日自受法樂時分是則多分但見自受法樂不知十住處法等依之結集者於此時者不名爾時由多分人知約應現之時也問付今師義應現者八相化儀悉攝取云應現乎答一義云爾時之言八相化儀皆俱攝入別蕳初座也一義云爾時之言自入胎至成道五相云爾時也諸佛常法付屬菩薩必生都天經八万四千歲下生𨵻浮示入胎成道義式成道期近即十地滿位入自在宮中唱成道化身下𨵻浮示八相化儀法報二身大自在宮成覺三身成道同時異時如常論義科文云時順取入胎已後五相義古迹上卷云東方來入天宮者自都天宮下菩提樹下座文故知後義科文趣青丘本志歟云云裏書大般若經第五百六十八卷一從兜天沒即入胎相二嬰兒三童子四苦行五成道六降魔七轉法輪八入般𣵀槃云云二釋下教主法藏云釋迦此云能是姓也牟尼此云是名也文大智律師釋云以默故不住生死即法身也以能仁故不住𣵀槃即報應也文若依遺教論牟尼法身釋迦應身佛則自他受用身本文如文集佛者住法記云梵云佛𨹔此覺者準起信論覺有三義一者始覺即能證智二者本覺即所證理三者究竟覺即理智根始本不二具此三覺故云覺者文又有三覺自覺覺他覺行圎滿如次蕳凡夫二乘菩薩也問上釋迦淨梵王為太子給能仁姓可名釋迦乎答三菩下處上卷古迹云菩提樹者名畢鉢羅樹在伽耶城西南二十餘里金中精窂名曰金剛可冝金剛躰之坐文法藏云菩提樹者在摩伽𨹔國於此樹下有金剛座賢劫千佛皆在此座成等正覺此樹下得菩提故名菩提樹文法銑云菩提樹下在金剛座周圎三百餘步上窮地際下據金輪賢劫千佛皆登此座而取正覺文慈恩傳百餘步云云二何下徵釋二初徵問意云聞戒自成道五年始制之漸結二百五十今經十重六八成道最初結之故令問顯也二三下釋通三初正明此經初曰是過去一切佛已未來佛當現在佛今三𠀍菩薩已學當學今學我已百劫修行是心地號吾為盧舍那汝諸佛轉我所與一切衆生開心地道文二不下簡餘述云𣵀槃經第四漸制并補衣之文在之生疑文無之云云可見文集也三令下結宗補云問今經可云成道最初乎答爾也經言初坐菩提樹下乃至初結菩薩波羅提木刃文云初成佛初結此戒文問若爾花嚴云於滅道場始成正覺文隨宗家解釋以花嚴定高山頓大教成道最初於今經全無如是解釋若爾今經可不成成道最初何答宗家之習諸經時未輒定之是則佛智境界不可推計故也依之諸師解釋非一途法銑云以成佛竟未往餘處未餘經此經在初於樹下第二七日方花嚴文是則今經自花嚴先見天台宗等以今經為花嚴結經若依之則花嚴後見雖宗家解釋未分明秋篠子嶋等今經成道最初也云云仍釋由云今教主第二地能化千臺上舍那反化中小釋迦也是故成道最初戒波羅蜜菩薩淨戒貫三際法則生万行洪基也尤成道最初可之云云若依如是道理今經花嚴以前更不及疑慮但今經制教中最初花嚴化教中最初是故兩經俱云初依實理二經中以今經可為最初之也云云傳云凡見一代相三𠀍諸佛出𠀍本懷但為此戒依之成道始今戒爰五百千二百聞機未調𤎼依之四十餘年間調根機遂一乘至極法俱令回心向大其回心向大者但發菩提心受菩薩戒也是則法花宗旨出𠀍本懷只是菩薩三聚戒云云此傳可祕也三依下結時依十地論等者問十地論釋十地經十地經者花嚴十地品同本異譯也彼品花嚴七處八會中第六會也何依釋彼品論釋今經乎答且為取起言始時之也彼論初七日思惟行因緣行故不法第二七日始十地經云云今彼文此經云初結應非初七日則第二七日已後言初結為言二經俱第二七日但第二七日內今經先彼經後可得意也問於菩提樹下今戒第二七日云云若爾十住處何時乎答初七日自受法樂間經十住處也花嚴不離道樹而升天宮等此意也但依機見不同或見自受法樂或見十處法也則古迹上卷云大小乘機所見不同菩薩衆見初成佛已往第四禪大自在天王宮放光接衆事盧舍那𥊸心地品還來樹下出定而十𠀍界海文問如此釋文菩薩衆見十住處化儀云云若爾爾時一切菩薩衆悉俱見十住處化相乎答雖未分明由經文始終於菩薩衆有二機不同見偈中所各接微塵衆俱來至我所云云此微塵衆俱釋迦相從𥊸聞十住處法次長行中所為此地上一切衆生凡夫癡暗之人等相亦菩薩衆中不聞見十住處機有之見若爾其凡夫癡暗類定初七日自受法樂可聞見之歟云云𢝰於如來初轉法輪異甚多㫆沙塞律三昧七日同十地論廾八夕傳六七日不智論五十七日不法法花三七日不法今十地論一七日不法云云玄𮚌云冥見不同未可和會然今解者大乘以法花為正此通行四諦法輪故三七日若大乘法輪十地為正第二七日十地故文意云三七日者依三乘共見通行法輪第二七日者但依大乘所見別行法輪為言二孝下釋孝為戒制二初泛明孝順二初孝順私云孝謂養育配父母順即恭敬當師僧三寶可意得歟但知恩報恩即是孝道解釋孝言廣可通師僧等見然順即恭敬可通父母歟父母養上恭敬生也論語云今之孝者是謂能養至於犬馬皆能有養不敬何以別乎文亦師僧三寶供養恭敬事如常也二恩下恩所即父母云云法藏云父母有二位一現生父母二過去父母謂一切衆生悉皆曾為所生父母又由發菩提心持菩薩戒救一切衆生悉令成佛是故二位父母皆為孝順文長養法身等者唯識論第十云躰依聚義𢝰名身五法為性非淨法界獨名法身文法藏等於恩分三種彼云一父母生育恩二師僧訓導恩三三寶救護恩文今後二合為一種文述云以財法二如應敬養云云意云一恭敬師僧三寶等以財物可供養二敬順父母以法門可供養也亦雖互通非無傍正於父母教法令成菩提因於三寶等供養衣食二法如律文等所出四種供養物等是也云云私云此義意以財法二配當師僧父母云如應歟補云一義云以財法二叶時莭與之云如應云云有義云父母等與財師僧等與法則如修行云與法以財法二配當父母師僧故云如應也云云此中師僧等者付今經文諸師解釋非一準法藏出所孝順境出三種如上之至道之法者彼云至道法者謂至極之道莫先此法又以此道能至於果故云至道此則道能至也文宗密禪師盂蘭盆經疏并大智律師意皆同則稱美孝順云至道之法也訓文云孝順和至道之法那利如今師并義傳奧及勝莊等於所孝順出四種境義云至道法者得果之本故略舉四處明孝順也文勝莊云至道者謂菩提分法戒順菩提分法故言順至道之法傳奧云略之此等諸師俱受菩薩戒順法性真理是云孝順至道也今經上長行云一切衆生皆有佛性一切意識色心是情是心皆入佛性戒中文與今同也今師解釋大同彼師等釋恩分二種第二中亦分助伴所依所緣三合上父母則成四則所孝順躰有四種見仍訓文云孝順寸部那利至道之法爾云云二孝下正明戒制孝為百行之本者後漢書云孝百行之本衆善之源也文先王要道者二帝三王也二帝者堯皇舜皇也三王者夏禹王殷唐王周文王也俱以孝順為要道也孝經云子曰𭆤先王有至德要道以訓天下民用和睦上下亡𭜨汝知之耶又云孝德之本教之所從生文述云最初舉孝養善者諸善根源滅𢙣根本故也此孝養即今所三聚淨戒也故此孝名為戒亦云制止初二句依俗家述孝養為本次二句明戒法為基義此二假兩句各別論善下述孝戒一躰由初句明名戒義次二句述名制止義下二句𢝰結也從此者所文舉孝順父母等之孝養善出生諸善本故云從此此孝即菩薩戒故云為戒也孝順父母師僧等之義即攝善攝生故此孝順有制止之義即攝律儀戒順師僧等教命不作七支十𢙣故等云云勝莊云孝名為戒等者隨順佛教名之為孝亦為戒亦名制止者防非止𢙣文三言下釋放光招衆招有緣者今經有四類機見法藏之中有四衆一菩薩二色天三欲天四人王初一是同生衆後三是異生衆文表無礙門者一義云佛口是名面門也四無礙門故云云述云此義道理不顯其所以者佛口是光所出處正無照義光正照導衆暗爾者何舉口門云照導長夜乎其理不顯云云一義云無得者正戒法也云云此義順文相上放無量光等二句是能表示瑞相也對之下表無得門等二句即所表示法故放光與無得門招緣與照道長夜相寸可見是以上文云甘露門時以戒名門又上文舉三聚菩提心畢云如是無礙所發願行文又宗要云雖無得門皆戒名無得也付戒有二無得一人無得六道通得故二法無得一分全分俱許故云云大戒者大乘戒也者現流布經有乘字不及釋之御所覽不同無聲聞衆者此經當機之衆無之故云無聞衆也凡通聞等也下出所被機經言比丘尼文先受聞也云云意可見也云云二經佛下佛序二初牒經摽分自下佛序者有抄云上經家序當常證信序四成就是也今佛序當發起序云云三輪者付輪有二義一摧破義二運轉義今取運轉義師法故有弟子弟子後為人師法如是無絶義演釋施三輪相云輪者是展轉義由有我身則有財物由有財物即彼前人故名輪也文今可準之二師下隨文釋義三初師二初明本末二師誦三初摽列合文私云言我誦汝等亦誦者我誦二字經我今半月自誦諸佛法戒當汝等亦誦四字經汝等一切發心菩薩亦誦等文略引歟二半下摽半月誦二初明半月誦述云依法住故云云生身雖滅法身常有故云我不滅度半月一來云云增即易退等者述云有兩義一義西大寺思公增不布薩月數一月等一是增退者即犯失戒也減者減不布薩日數四五日一等進者即定惠也布薩數故定惠也此義名言順律增減布薩名律文增減布薩者若外界鬪諍比丘知十四日來十三日可若知十五日來十四日可是減也若已入界乃至增至後十五日等是增也鈔批云向後名增向前名減也文輔行注云私曰戒久故持戒易退布薩數故定惠難進故曰為不退戒等文一義招提當寺迹抄并五怗抄之意增減名布薩也謂若增布薩數作戒成煩勞還可退也若又減布薩久不誦戒暗戒相寸境有犯失若有犯者難進定惠故云若時久延便令忘若時更促事恐煩勞故唯半月而文是故半月等者問云就前六佛中初佛六月一度布薩如其次第五四三二一月今釋迦佛半月一文善見五云過去諸佛弟子不犯非故乃至不半月戒乃至六年文若然今經三𠀍不改佛道同法何約釋迦一代云半月耶答佛之道同約大途文言事相非無少隨冝異如非釋種姓如草繫比丘等過去諸佛出𠀍時代非末劫衆生根勝故隨應可有五六月不同釋迦出𠀍時代及劫末衆生根性鈍故若久不誦暗持犯相可有犯失之義依之半月令也善見文言乃至六年者即毗婆尸佛戒或云六月或云六年經論異中阿𭇥經中毗婆尸佛六年尸佛五年等與善見同問下輕戒晝夜六時誦之云云今何只云半月乎答元曉上云半月誦者約僧法故作如是若約別人行者乃至一日中六時中誦文有義云此釋未了也半月六時俱通衆別故下文云一人布薩則一人誦故云云今案云元曉解釋尤叶文意謂半月約布薩指布薩云衆法六時依別人自行若非布薩縱有百千誦此亦可名別行等云云二如下引證誦意遺教論釋此文云示現波提木刃修行大師故如經當知此則是汝大師故又示住持利益人法相似故如經若我住𠀍無異此也文三言下別釋末師言發心者十信位等者宗家處解釋於十信有二種見一住外十信則輕毛十信也二住內十信則於發心住立之今十信者當初十信也本業經曰爾時住前名信想菩薩亦名假名菩薩亦名名字菩薩其人略行十心所謂信心念心進心定心惠心戒心回向心護法心捨心願心若經一劫二劫三劫乃得入初住中文取意行實有退者𢝰退有權實二退此師意住前有實退見今行實有退釋如是見住內無實退但退見下慳戒云鶖子十解示退之迹文是則退見若依宗家等意前六住猶有實退見身子第六住實退位云云法藏上云以信行不成位故但云發心十行增修善根故云長養十回向是𠀍間修終堅固不懷故云金剛文聖胎者無漏種子也此位殊修十波羅蜜長養法爾無漏種也攝五力故者八云金剛故攝五力也若攝五力故名金剛於四善根中忍位并𠀍第一法攝五力才第十回向少分名金剛餘九不可得名故知十俱金剛故攝五力也師云不爾文攝五力故名金剛見謂第十攝五力故十回向俱號金剛為言二戒能下明口放光因緣有緣非無因者付之有多義一義八怗抄云準次上即口放等釋者以光為瑞者招有緣十八梵等故云有緣從口出者以無得門導衆生之因由故云非無因也義上云有緣非無因者謂外有時衆感法勝緣內有如來大悲本因方得現瑞表所法故文此釋順古義也一義云依科文意明口放光因緣文則不如上義凡如來法放光諸經不同也法花經自白毫放光上生經從遍身放光今經面門放光則以光明為戒瑞相故云有緣亦表常誦持從口出由故云有因因者因由之義緣踈因親也法藏云有緣非無因者今此誦戒口出戒光非無因緣以多劫積集因緣深固致令如此文此釋順科文意歟云云此外述迹抄有兩義可見之二經光下法二初牒經摽章私師法弟子三輪中第二法也二此下隨文釋義六初釋光光言光者重言即顯諸義也喻瑞相者喻直喻法躰瑞先表義如欲先放光也如火出先有𤏙氣也二戒下釋非青黃等戒雖名色者正是法處所攝色故云爾也章云其無表色實是無表無所表示故而躰非色亦從所發所防假名為色故文而非顯形者顯色有十二謂青黃赤白光影明暗煙雲塵霧也形色有八長短方圎高下正不正也經旦出顯色也依善思分限等者唯識論一云然依思願善𢙣分限假立無表文三無下釋非色非心無質得故者有形貌云質有障物義名得也文集注云無表戒體者依種子假立非如眼根等質礙之色故曰無質礙故非色受所引色者即是㓛能也非如心所緣盧之法故曰無緣盧故非心文四不下釋非有非無不離緣故等者古依懷素開宗記以師僧等諸緣名緣也若由文集意緣者種子也三業思初念所熏種子待第三羊廣發得防非止𢙣㓛能是名戒躰防非㓛能種子之上假用種子則是躰也躰用相望則其躰不異故云不離緣等也凡因緣所生法其躰空也如因緣生故無自性故畢竟空文雖然亦種子即非戒躰第三羯磨已前無發無表故躰用相望亦不一也依之云不即緣故等也五以下釋非因果法非因果法等者古義云今戒法不成人天等因亦不成人天等果故云非因果等也補行注云私曰無表戒躰思種㓛能假立法故非因果法文若依文集注文因果者即種子生現行熏種子因果也斯戒法不如彼種現因果故云非因果也此等義門相叶宗家所讀可貴則表無表章云此等解釋文集注文也云云六以下釋佛等根本二初明為根本三初諸佛諸佛本原者當果實雖種子𭘧㓛能之種能佛果則燈云種子之上由期願力防諸𢙣無表㓛能倍增長由此令思有感果用㓛能決定非即無表假能感果故下論云假法如無非因緣故文大智律師云行者當知本所受躰即是一躰三佛之種文皆與今同也云云二佛下菩薩如文三以下時衆以與因果作根本故者此因者則菩薩果者諸佛也上舉佛菩薩後云以與因果故如是得意也與上非因果之言異也不可之云云二是下釋結勸經是故大衆已下釋也明曠云對文宣唱名讀背文通利名誦修集義理名學文
