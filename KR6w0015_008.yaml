body:
  text: 二𢙣求弟子戒簡非故二初標名牒經藏云二次第者前實有解來求不與今實無德𭤽為他作師皆不應故也文云大小俱制七眾之中正在出家兼通在家亦有互作師故文不明輕重是非為名利故正授人於戒𨕙制此戒也述云此戒名依經文為利養故為名聞故𢙣求貪利弟子之文立此名也䟽解云非法求利故曰𢙣求此制貪利𢙣求弟子文云文中教化人起信心時者謂教他人令起欲受菩薩戒信菩薩與他人作教誡法師者謂與他人作受戒師應正制和上始終親教是和上故見欲受戒人應教而請二師者自未被請故教令請為和上也又湏一人作羯磨師故更教令請一人為阿闍梨等即是羯磨阿闍梨也義同聲聞沙㫆受法而法仍通五眾受戒無蕳別故文准此解釈今戒正制和上見二随文解釋五初釋應教請二師二初釋文行事鈔上三曰初請和尚者以是得戒根本若無此人羕習莫由闕於示導不相生長必湏請之乃至戒師阿闍梨者受戒正緣若無此人羕於聖法則法界善法無由得生文二普下彰異三初三師彼經曰尒時行者若欲具足菩薩戒者應當合掌在空閑處遍礼十方佛懺悔諸罪自己過然後靜處白十方佛而作是言諸佛𠀍尊常住在𠀍我業障故雖信方等見佛不了今㱕依佛唯願釈迦牟尼佛正遍知𠀍尊為我和上文殊師利具大悲者願以智恵授我清淨諸菩薩法𢏏勒菩薩勝大慈日憐愍我故亦應𦗟我受菩薩法十方諸佛現為我證諸大菩薩各稱其名是勝大士䨱護眾生助護我等文問彼經正請不現前五師何云三師乎荅八云和上闍梨得戒之本雖然為慇重亦加教授師彼經雖及證伴二師舉根本師云三師不背經文云云此義不尒彼不現前五師彼外更可請現前師何云根本三師乎於不現前五師分本末条不足信用又古義云今經既明和上闍梨彼經更加三師舉故云三師實五師也云云此義亦悮今經請現前師彼經不現前師相大不同何云更加三師乎若由上出畧不云和上等瑜伽一師亦不可舉今經故傳云正可云五師三字悮三五悮常例不可始驚也二瑜下一師瑜伽唯請一師者義云問菩薩地受戒中不云請二師文相似唯請羯磨師無請和上文何故彼此不同乎荅理應具請二師而彼文中不請和上者當是預請為親教師是故不湏臨受方請或即一人具兼兩事謂作和上及阿闍梨是故彼文不別請也文由初釈瑜伽令請羯磨師和上先立請之惣合二師與今經同由次釈請和上兼作闍梨事今師解釈由次釈也倫記云聲聞戒因力湏假𭤽緣故湏十師菩薩之人菩提心𭤽一師即得文今師解釈倫記釈并次釈俱同之三善下二師善戒經云師有二種者上普賢經但請不可見今及瑜伽但請可見善戒經正通二故云通也想對所師者不可見可見如次配當云云二問下釋應問七二初釋文點異問七者云若請二人阿闍梨應問正作羯磨人故若請一人為二師則無所妨也文問今時受戒何不問七乎荅傳云當時依瑜伽授之瑜伽別不問七故然問𤼵心中可攝之具七者不能𤼵菩提心故云云善戒經問十種事者藏云善戒經約德通問十種事具者方得受戒一具三戒所謂五戒十戒及具戒彼經意約出家菩薩要具此三戒方得受菩薩戒二𤼵菩提心否三真實菩薩否四能捨一切內外所有物否五能不惜身命否六能於貪處不貪否七能於瞋處不瞋否八能於癡處不癡否九能於畏處不畏否十能於我所受一切菩薩戒否皆應荅能尒若具足言應先問七後問上十德方可得受若在家菩薩十中除初餘皆同問文法進注同之有義云不用法藏等釈對善戒經文自可云十事種彼經云取意實是菩薩否是一𤼵菩提心否是二具足三種戒否三種戒為三共上成五捨內外所有物否是六惜身財否是七受一切菩薩戒否是八律儀戒也攝持一切菩提道戒否是九攝善戒也攝利益一切諸眾生戒否是十饒益有情戒也文則挍合文集所本文可知之云云二問優下問荅决疑十五難者文集具今取意𢲻要列數汝之父母妻子奴婢國王𦗟否是一汝不曾負佛法僧物及他物是二汝今身將無內外身心病耶是三汝不於諸比丘比丘尼所作非法耶是四汝不作五逆罪否是五汝不作盜法人否是六汝非二形人否是七不壞八戒齊否是八父母師病不棄去耶是九非𭣦𤼵菩提心之人否是十不盜現前僧物耶是十一不兩舌耶是十二不𢙣口耶是十三不於母姉妹作非法耶是十四不於大眾作妄語耶是十五善生經文難見故具分之挍本文可知之付之異義徃且由正義出之也何故通俗者今經道俗通被之教故彼依近事性者八云性者躰也有十五難者非近事躰云云是則未明性𪮲也凢於性有躰性有用性設雖有成戒躰者必皆成躰性也今云依近事性由用性之𨕙也二形等無近給仕比丘等之用故雖成具足戒不足數等是亦不成比丘用性也故問十五難約用性成𨕙今經問七約躰性𨕙為言三言下釋應教懺悔二初泛明懺悔三初教懺悔如文二如瑜下示懺心如文三依下誡䨱罪此等随品者謂䨱提得蘭䨱蘭得殘如是随五篇相何䨱重於本罪問何故如是重於本罪乎荅菩薩意地為本犯戒表淨相其意樂尤𢙣也故制罪聲聞身語為本故䨱藏但吉云云二言三下別釋經文二初釋三𠀍千佛三𠀍千佛者水抄二十一云即未來千佛初淨光稱王佛出𠀍亦名日月光佛名別義同此佛為首下至湏㫆相並是星宿刧出𠀍當得作佛後更經三百大刧空過無佛乃至由如星居希曆而住佛出亦尒名星宿刧過去莊嚴刧中得成佛者以花光為首下至毘舎浮佛於莊嚴出𠀍諸佛出𠀍莊嚴國界故名莊嚴乃至又㨿藥王藥上經昔有三千人礼五十三佛名字後時行滿一千人於莊嚴刧成佛一千人於賢刧中成佛一千人於星宿刧中成佛乃至上來兩箇成住壞空計一百六十箇增减刧惣名為賢刧前八十箇增减名大賢刧賢人多故名大後八十箇增减名小賢刧文上文云刧初成時於水輪上有一蓮花有一千而現出𠀍光明赫𭴩照第二禪諸天宮殿第二禪諸天人尋光來下至於欲界見此蓮花有一千中有賢聖影更相謂曰當來必有千賢人出現得佛果故名賢刧也此賢刧名是二禪諸天以立名乃至問此賢刧有多少增减刧為一賢刧荅成住壞空各二十增减刧共有八十增减刧為異文問賢刧千佛出𠀍成道次第何乎荅玄𮚌第四云如賢刧千佛今第九住刧已四佛出後第十刧㫆勒佛出至第十五刧有九百九十四佛出此刧增已鶻盧支佛獨至一刧文水抄第二十一云今第九住刧已四佛出𠀍者明時節也問為第九刧中有四佛出𠀍為通前住刧共四佛出荅有二解一通前住刧共四佛出問從何刧即佛出荅住刧有二十增减惣名住刧初五住刧無佛出𠀍第六住刧人壽六万歲時有一佛出名俱留孫佛第七住刧人壽四万歲時有一佛出名俱那𭇥牟尼佛第八住刧人壽二万歲時有一佛出名迦佛第九住刧人壽百歲時有一佛出名釈迦牟尼佛第十住人壽八万歲時有一佛出名曰㫆勒佛後十一十二十三十四無佛出𠀍至第十五住刧有九百九十四佛出俱有名字通前成九百九十九佛出𠀍從此已後至二十住刧無佛出𠀍住刧壞經二十壞刧後有二十空刧後有二十成刧後二十住刧此於二十住刧中有佛出名曰樓至佛獨至一刧通前滿一千佛也二准五濁經唯第九住刧有四佛出𠀍謂第九刧中人壽六万歲有俱樓孫佛出𠀍人壽四万歲時有俱那𭇥牟尼佛出人壽二万歲時有迦佛出人壽百歲時有釈迦牟尼佛出後此漸减至人壽十歲時然後刧增至八万歲初减㫆勒佛出故即第十刧㫆勒出已後與前解同唯前四佛出兩解別也文二言下釋若無好相等二初點文證二初釋文如文二如下證二初通標二初明罪躰𢙣作所攝者菩薩一切所犯輕重二罪皆是第五突吉羅聚攝也遁倫記云一切犯皆是𢙣作者景云若輕若重皆可悔除皆名𢙣作測云即是菩薩四十五輕罪聚中第五𢙣作攝也云云述云問𢙣作所攝言通三聚欤將攝善攝生二聚欤荅西大寺義唯攝善攝生義也律儀全讓聲聞故生馬并招提寺義三聚通𢙣作也委細如別抄云云私云西大寺義一切言少分一切也後二𢙣作攝故二應下明所對於語表義等者測云謂是能解語表非聾盲等人大小雖異同行人故得對之文善戒經云一切犯突吉羅所攝文地持論同之通受懺悔畧料蕳問菩薩通受懺悔其相云何荅付之義道非一苾茤畧要云以十重六八攝入六聚一切皆是吉羅所攝也瑜伽等分明故以比丘六聚攝入十重六八未見教文但推此事壇上四重即是菩薩四重僧殘之中媒嫁一戒定菩薩重教他故所餘殘罪皆輕垢也三十戒中販賣少分菩薩重攝所謂酟酒餘皆輕攝單提已下准此可知一切五篇諸戒攝皈重輕二聚悉俱用今𢙣作所攝懺悔也取意若依相羕不尒詳躰文集注云問此懺悔法通三聚乎荅如倫記景測兩師唯懺四重四十三輕攝善法利有情戒攝律儀戒七眾戒故具足之戒六聚別故問若尒者二四捨緣亦同可攝善饒益乎荅言不尒捨戒失戒受躰故受法既通三聚淨戒捨緣失緣何後二故知受戒捨戒共通三聚随戒懺悔各随相是故攝善饒益懺悔當随此文𢙣作所攝律儀懺悔依毗奈耶六聚別若不尒者菩薩苾茤混勤筞故决擇分七十五故文師云依上注文菩薩三聚戒中攝律儀本地决擇兩處讓律藏上随戒懺悔敢不可律藏由五篇不同可致眾別悔法於攝善饒益菩薩不共戒法懺法更不共彼所以本論別懺儀一切者且由本論所後二稱一切攝律儀全不何可攝之由此西明寺之圎測師云即菩薩四十五輕罪聚中第五𢙣作攝也云云但瑜伽所見雖景法師解釈猶通重戒其且瑜伽所後四重為言少分一切宗家常例則不為難也問酟酒談他二戒懺悔方䡄如何荅於此二戒有共不共論具如彼戒下抄記之且由共義明懺悔方法酤酒戒販賣少分也若犯之時致捨堕懺於談他過失戒兩尺中依初同法異道之荅不問根實否對異道犯七逆十重可得波羅夷見依此釈者向異道實犯可攝罪即致單提懺向同法實犯輕罪可為不共戒則用本論悔法依次有根無根荅不問境同異實犯七逆十重事波羅夷由此釈向異道實犯重攝罪向同法實犯重不可相攝犯之時亦可依今悔法兩釈俱無根則無根謗僧殘故可致殘懺也若由中間二戒同後四重為不共義二戒俱用今懺法也於人師解釈及異釈致相羕之義前後不定故具出兩義雖然以共義可為實義順本論意故以此義比畧要文理順天地雲泥者欤畧記大途餘廣如別云云二若下別釋三初上纏犯更受問於上品纏不出悔法云何荅今犯失門云經即懺亦得重受文以知懺方可受也表無表章云若上纏犯他勝處法失戒律儀𤼵露悔應當更受𤼵露之法如中纏犯文集解㝡行云文若上纏犯至應更受者𤼵露懺悔四字取上文㔟而加參餘是畧論文𤼵露之法如中纏犯者師例明之論文云上品纏犯中不𤼵露法文幽𮚌上云若上纏犯或三或多解諸乗者如法悔悔已更受下中纏犯對一𤼵露文解節記護命云上品犯不應𤼵露但更可受戒若中下不失戒故應𤼵露也上品更失以𤼵露除罪何更其戒生乎是故此文可傳之也文如此釈上纏不應𤼵露𮚌文云𤼵露傳云云此釈大非也表無表章并幽𮚌一同令𤼵露皆俱可為謬乎雖先德解釈不足信用云云述云依太賢慈恩等御義上纏失戒之人必可作對人懺悔之法也凢受戒之習先應懺悔初受戒人尚修懺悔况重受戒人乎尤可懺悔豈懷犯罪過直可致受戒作法哉云云二若中下纏犯懺悔如文三若下下纏犯懺悔二初對首懺如文二若無下責心悔問中品纏犯通責心悔乎荅中下纏俱可通對念也幽𮚌上云中下纏犯對一𤼵露現前若無可對者淨意自誓更勿重犯由此於犯還出還淨文惣通下中纏出對念悔法故知俱通無疑若又由章𤼵露之法如中纏犯之解釈上纏亦通責心既同中纏豈有別又崆峒記中卷云問准寳積經第九十卷乃至五逆亦許自淨云何不同荅此言現前若無云下貫前用之文心念之法貫上此文亦明科文且順便下品纏科之由實理如幽𮚌文可料蕳也問責心悔作法其文云何荅苾茤畧要云我比丘若沙㫆越菩薩毗奈耶法某罪重輕随犯可举之犯𢙣作罪今向十方諸佛菩薩𤼵露懺悔不敢䨱藏我當决定防護當來終不重犯一雖至義道不用彼義若由後二懺悔無對首時由此文可懺也准羯磨文出之故問上來懺法請經若有犯十戒者應教懺悔之文主之若尒十重俱用此懺見何俱後四重四十八輕乎荅今懺悔非釈犯十戒者之文既標若無好相雖懺無益釈此約上纏犯失等故為顕雖懺無益之經文上纏犯失今文也不為顕十重懺悔也問若𭤽十重中前四重等共戒相随戒懺悔全用律藏即攝律儀懺也若尒今經後二不攝律儀義亦當難立於一經文義道頗矛揗者欤荅此難大非也凢今經惣不三聚但重輕二聚雖然挍合善戒瑜伽所顕了三聚相不共故且判攝善攝生若見其躰全是共戒也故致懺悔依用律藏都非𢎨揗依不明今經大意如是疑難出來湏此義勿守株矣云云二今下委釋經文二初釋雖懺無益等若得好相舊戒還生等者八云上纏失戒之上若得好相舊戒還生若不得相不還生故更作法受藏二師其意同問上纏亦還生上瑜伽何云應當更受乎荅瑜伽文且對中下犯不得好相懺即清淨尒云也非上纏還生之類也云云此義大誤既失戒躰何可還生乎若由懺悔力得戒者是新得焉云旧戒還生乎又自受從他作法之外未見有懺悔得恐不足言義欤傳云若得好相旧戒還生者中下品犯也若不得相等者上纏犯也謂由好相有無知三纏分齋也今撿藏二都約上纏論還不還生未聞見之加之表無表章中十輪經不失方等經還生悉約中下釈之上纏之上還生義諸師解釈都所不見也問中下戒躰全不失何云還生乎荅犯之令戒微劣懺之䨱本明故云還生也非云全失再還生若依守千師解釈中下纏亦有失戒彼釈云諸處皆用修旧故應犯捨必定不增用皆修旧但犯之者懺已再增私曰中下纏云犯也其捨之者不可再增如是別不可異求文私云上品纏名捨也依此釈中下同失戒由懺悔力旧戒還生如𠀍間𮜋時死者還得生活雖死第八識不去故亦還生猶中下品失戒亦還生第八識全去者𣱵不還生例同上纏𣱵不還生為言此義能可挍合論藏等云云二既下釋而得增受戒得增受戒者增謂重之義也意云此上纏犯非旧戒還生故云現身不得戒非謂不得重受云云三言下釋不同七此戒有三叚十戒四十八輕七也四言下釋一一好解等二初釋好解二初正明唯從有德等者義云要具四德方堪為師授菩薩戒一同法菩薩蕳異二乗二已𤼵大願蕳未𤼵心三有智有力謂於文義能解能持四於語表義能授開謂言語弁了法授人開心令解云云二經下會異本業經下云其師者夫婦六親得互為師文此且在家五八戒事也瑜伽意必非如是欤此上唯從有德文故會釈也云云二言下釋不解三初不了教法如文經若輕若重是非之相者云若輕乃至之相者不解教法於律知其輕重於經知其是非謂十戒為重四十八為輕又染犯為重不染為輕又故作為重誤作為輕是謂輕重之相順理為是理為非又大乗為是小乗為非所断為非所修為是為是非之相文二言下不了理法第一義諦者所證真諦理云云三習下不了行果法二初不了正位二初行法二初資粮位三初十住習種姓即十𤼵趣者唯識論云勝解行地𤼵心已去未入初地名習種姓文地前惣雖名習種姓今習種姓初故云即十𤼵趣也云云二長下十行長養性者義云十長養者即十行亦名姓種姓長養聖胎故云長養文三不下十囬向如文二道種下加行位道種姓者即四善根位也親可生見道無漏故名種姓道即無漏也由此仁王等者由第十囬向有道種姓已前九廻向相從名道種姓為言二正下果法十地佛地正法性者通攝十地佛果也自初地漸證真性故云正法性也佛果得名可知欤然而義釈此不同欤彼云道性者謂十地正性謂佛地文二言下不了所依三初惣標十禪支者付四靜慮束十八天為十支同者合為一但取異者也云云二何下徵列其相難明作圖示之言內等淨者若大乗意以念知捨三法為躰初禪雖有念知捨三依有尋伺其相不明了劣故不別立也二禪已上無尋伺故別立之然二禪定中離障念知捨三平等令心於內清淨而轉故云內等淨若出定時為喜心及随惑所纏縛不明了故非外等淨第三禪喜心及随惑既遠離故內外俱淨也其躰殊勝增明故顕彼自性開為三支也三雖下釋疑雖知內等淨等者釈伏難也難內等淨即念知捨既躰全同何別立之得有十支乎故通之云惣別異故也若由小乗俱舎意內等淨以信心所為躰初禪樂與第二禪樂同以輕安為躰是故上十支外加輕安一支故成十一支也俱舎云靜慮初五支尋伺喜樂定第二有四支內等淨喜樂定第三具五支捨念恵樂定也第四有四支捨念中受定此實事十一初二樂輕安內淨即信根喜即是喜受文傳如此者云十禪支者上卷經中云十心第十心云入百三昧十禪支而不列名未詳是何旧云十八禪支中除同取異故成十支文道璿注云出入十禪支者花嚴十定品十種大三昧名諸佛菩薩禪定文五言下釋𢙣求等二初正明文如文二此下决同異第十八戒者虚偽作師戒也勝莊云問此與第十八戒何別解云第十八戒直不解為他作師此戒為利與人授戒故有別𭅒文已上𢙣求弟子戒畢三非處戒外護故二初標名牒經藏云次第者前則為利詐解今則為利妄傳故也文云大小俱制七眾亦同文述云非處者指外道𢙣人云非處也二随文述解二初制意二初文大無知者不知佛法大無知也云云二有下舉意如文二此下釈文四初釋未受戒二初釋文未受戒者藏云未受菩薩戒者此有三種一純不信菩薩道故不受二雖不謗亦不能受三信擬受未受前二結犯文後一可今釈意同之云云二如下證遁倫記云問准下文云智者欲授菩薩戒時先應為菩薩戒及犯戒相今自思惟我堪受戒何故聲聞受戒以後為四重四依菩薩先戒及犯相荅聲聞法中若為恐成賊住不得先菩薩不尒要湏對靣先菩薩籌量堪與不堪然後為文又云摩怚履迦者此名本母生智本母即是論藏名也文二言下釋外道等二初列釋二初正明經千佛大戒者藏云言千佛者多也謂一切諸佛皆同此戒故云千佛大戒非但賢刧千佛也文曠云言千佛大戒者惣舉賢刧之數也文莊同之傳千佛者千花上佛也或是諸佛上云三𠀍千佛大數言故以一切佛皆同故文雖如是有異釈法藏釈傳次釈頗甚深欤云云二如下證如文二何下述意如文三釋除國王二如文明曠云王設邪見亦乃開之恐疑誈𡧱也文四言下釋名為畜生無生囙故者藏云此身無戒雖人名畜以無人囙故後身永不見三宝如木石無心豈有能見文經七佛教戒者法銑云七佛大戒者同俗七且舉七代理此大戒諸佛共有本言千佛亦舉大數文已上非處戒畢四故違聖禁戒內護故二初標名牒經藏云二次第者前則不應而今則不應犯而犯故也文云大小乗俱制乃至正在五眾文言信心出家故文戒名故者由經故起心毀犯之文可得意欤云故起心毀犯聖戒者佛所制戒皆名聖戒知而故名故起心虧受躰故云毀犯文銑云此戒無別過境為護諸戒惣制此一乃至以作故聖制之心名為故也若煩𢙉所逼或懈怠所為但犯餘戒無故罪文是則故者知非澷教作之故号故聖禁戒也二随文述解二初惣明意故教𨕙得此罪者問本罪上重得此罪乎荅今若重若輕等之解釈本罪上雙得此罪見撲揚云随所作犯二罪一随所作犯十重罪二今制故犯輕垢文經信心出家等者云文中信心出家受佛正戒者由出家受戒當住福田故偏言出家文撲揚云信心出家者有又云此一徃是出家五眾在家不犯若審思佛意實一切有戒者同犯文問今戒與諸戒遠方便罪同異云何荅遠方便罪正向事欲之今別作澷教心故方便罪外可得澷教犯是名今戒則果頭罪也云云二言下別釋文四初釋不受供養如文二釋不得飲國王水藏云於中有八一供無一毫分二大地無一足分三飲水無一滴分問供破戒無分可尒王水土眾生同感何故亦無分乎荅白衣無戒食王水土皆有輸稅出家不稅良為戒行今既二種俱無豈有其分而用豈非是賊四鬼罵賊是此義也謂戒行若金剛有戒神讚護今既戒破神去則有五千大鬼其前而罵賊掃其後而迹五𠀍人亦罵之謂於佛法中作偷形相賊偷利養等賊故也六一切眾生不欲見者以如𭜨詐親故七犯戒同畜生者以是罪身同故八同木頭者無所知故文三於下釋大賊如文四有下釋畜生無異等如文已上故聖禁戒畢五不重經律戒敬故二初標名牒經藏云二次第者前令不毀禁戒今制令敬法故也文云七眾同學大小不共文凢今戒惣通三宝制此戒下瑜伽其意可見而今經付重令敬法宝佛所師故云云二随文述解二初解經惣意如文可解者付今戒五種六種人師解釈不同義為五種彼云文中凢列五種一受持二讀三誦四書五供養文勝莊云於中有六一者受謂於師前領所未解二者持謂受已不志三者讀四者誦五者書冩六者供養文藏分四受持合為一讀誦合為一故四種也剝皮為紙等者與咸注云凞云恐約得忍菩薩方能如此湏知此是舉况若剝皮為紙折骨為筆尚應書冩木皮素竹帛等豈不為也文糓者進云糓謂楮皮者進云染黃色𤎼書其經論文素者進云用生白書其經戒文帛者進云取灰汁煑白令𤎼將用書經文二瑜下經論證十種法行者一書冩二供養三他四𦗟聞五披讀六受持七諷誦八開演九思惟十修習文此當瑜伽供養三宝等者瑜伽四十二輕戒第一不敬三宝戒也如文集也已上不重經律戒畢二以悲教化四初不化有情戒第六唱導故二初標名牒經藏云二次第者前則於法不敬今則於生不化故制也文云道俗同學大小不共以聲聞本不兼齋故文二随文述解二初正解文惣意他音為本者此娑婆𠀍界殊以音為本耳根利故聲塵得道餘界依光明妙香味等法生解香積𠀍界香塵得道唯識論云且依此土名句文依聲假立非謂一切諸餘佛土亦依光明妙香味等假立三故文雖有其性等者涅槃經第八云不能親近善知識故雖有佛性皆不能見而為貪滛瞋恚愚癡之所䨱蔽文聲入毛吼者涅槃經第九云佛言善男子除闡提其餘眾生聞此經已能作菩提因緣法聲光明入毛吼者必定當得阿耨多羅三𦴭三菩提文彼經述𮚌云憬興眾生善狹少若毛孔經亦入中令其𤼵心既非身毛文同經古迹太賢云言毛孔者凢夫善根受法器小是詫喻名毛孔眾生雖不曾𤼵大心經入毛孔作𤼵心因文又云除一闡提者闡提有三一断諸善根通有無性二無出𠀍善即無性也三無大善根即趣也此無毛孔大法不入文如此等釈毛孔者喻心器非身中毛孔也云云法藏云若見下明化畜生類謂彼無領解故以此言驚覚成自薰修則與彼遠作勝因如昔有牛前食草舉頭見後便得度等文問領法義起善心之時可受其利益而若無領解心者甚難感其益自業自得之理法尒必然也若心雖無領解唯依外音聲可得益者諸佛菩薩之法何待根𤎼乎是以佛地論中無生心大聖不通云云如何荅菩薩依慈悲心對下劣有情咒願之時能化願心慇重故其聲薰入毛孔令滋潤所化善種依此因緣遂必可𤼵菩提心為言此時忽非云殖正因緣佛地論者指正因緣云也故述大聖不通也云云二然下彰善巧方便二初惣標四十五惣教化有情有十二種善巧方便內外各六種故今外六種文也本文如文集能披覧二一下別明三初明二種二初以小善感無量果三初標如文二謂下釋鄙穢田者二田中悲田也下出蠢動是也傍生者舊訳名畜生新訳云傍生也地獄傍有畜生故云傍生或人間傍生故云傍生或撗行非竪行故云傍生也三如下結物田二物也二二下以小因攝無量善三初標如文二以下釋三初標如文二若下五初勸令改邪四十五云若有信解受邪齊戒乃至一月都不食等諸有情類為八支聖齊戒法令其棄捨最極艱辛感非愛果受邪齊戒勸令修學無極艱辛感大愛果受正齊戒等文二又下勸令隨喜本文如文集三又緣下令代受苦如文四又下意樂礼三寳謂意生觀念礼之不現前供養尤㝡大故也五又下悔徃修來如文三如下結如文三廣下指廣如文二三下明四種二初標列三增背正教者增字誤可作憎字瑜伽本文如是意云眾生聞空有教互執一𨕙憎一𨕙者三性等法門除空有犱憎為言鏡水抄十五云憎聖教等者憎益憎嫌之義有諸眾生於諸聖教而不解了随文犱義而生憎嫉謂不解佛密意有空二種言教道理執空者憎於有教而生恚𢙉執有者憎於空教而生恚𢙉如佛空本空遍計不空依圎惣為空即是憎他聖教也菩薩以種善巧方便随順而會通解釈之除其恚𢙉故文又云言處中住者於內外及空有教中亦不生愛亦不生憎名處中住文二辯下解釋二初惣標弁次前四者謂第三至第六曰也二一下別釋六如文水抄云第一随順會通成前憎背聖教者除其恚𢙉也第二共立要第三異分意樂第四逼迫所作成前處中住者令其趣入第五㤙報㤙成前已入趣者令其成就第六究竟清淨成前已成𤎼者令得解脫文順行彼欲者謂同事行也異分意樂者上要𭑕故云異分地持云異相意樂方便善巧文水抄云言異分等者有二意一者先許之名同分意樂二者異於彼故名異分又意一者先許後異前分故二者非內心尒外現內故言異分文又義云約瞋恚相云異分也究竟清淨者謂機根之𤎼時八相化儀令得三乗之益等也無著攝論云謂諸如來任運佛事無有休息於其圎滿波羅密多復更修習六到彼岸文謂到究竟者論云安住菩薩到究竟地文如此等文三身成道異時義欤謂到究竟第四天四千歲盡後現八相也周記云先在菩薩十地滿位欲成正覚先作一身在都史多天本身徃彼自在宮中成正覚已知足化身即下𨵻浮亦成正覚文如此等文即異時見具如上抄之三如是下惣結如文二法乖儀戒第七化故二初標名牒經藏云二次第者前則教人𤼵心今教令敬法故也文云七眾同学乃至大小共制文問當戒結犯為能法師哉為所𦗟下眾哉兩樣若𦗟法眾結犯者經文其法者若不如法者犯輕垢罪能法者乖儀之時結犯見随戒名号法乖儀戒制能明若依之尒者見䟽釈制意述敬人重法勝善方生等明制𦗟眾云事若制能者何云敬人哉有能法師可敬下坐𦗟眾哉若尒者兩方如何荅今此戒制能法師也經文等分明也但制意云敬人者兼囙制𦗟眾欤非正制也二随文述解二初彰意如文二此下釋文二初明檀越貴人如文經四眾𦗟者云云法進注云一僧二尼三男子四女人是為四眾文二言下明𦗟者下座二初釋文如文經如孝順等者云如孝順父母者尊人也如事火婆羅門者重法也事火婆羅門者一云事火神也文矌云西國外道多事火神專注礼敬念相續故舉此事比敬人法文一云事𠀍火也與咸注云事火婆羅門榮抄云伽耶迦計執火能反壞万物有大㓛能由是多不敢用今敬法師之教由彼之敬火也文法進云事火波羅門有人事火常令存活不使断求生天故此是邪法不可依也文二如下引證如第二天奉事等者花嚴音義云謂湏㫆山頂四方各有八大城當中有一大城帝釈所居惣數三十三處故文三非法立制戒第八𢙣故二初標名牒經藏云二次第者前法非儀今則恃威法為失既重故湏制也文云大小俱制七眾同防文中皆以信心受戒者謂本受戒時皆用信心也文義記云不𦗟出家断僧宝也乃至不𦗟造立形像断佛宝也不𦗟書冩經律断法宝也云國王太子百官四部弟子釈曰乃至四部僧尼士女我四部弟子乃至釈曰與前四部異者前是能制此為所制又王臣自恃四部憑他皆起異端立茲嚴令文進云若國王太子百官者出其所制之法四部弟子者出家僧尼居士男女皆約有大力㔟制押佛法不令流布断佛種故我四部弟子乃至言四部者謂在家四部一優婆塞二優婆夷三童男四童女如是四人乃至制約不許入道文如但上下俱於僧尼士女以能所分之如進注分能所同於四部上下亦別上同釈下四部者俱於在家分之意云僧尼既出家故非彼所制故為言二述解開制如文四自破內法戒第九護正故二初標名牒經藏云二次第者前恃自威今恃他㔟各皆法故同制也云大小俱制七眾同學文又云文中以好心出家者謂本出家時有愛法好心也而為名聞下乖本好心從名利文經撗乃至作繫縛者藏云四具緣者亦四緣一為名利二王前戒三撗作留難四繫縛內眾故成犯也文問見經相此戒與上非處戒云何異乎又與十重第六何別乎又與次上戒異云何荅此皆旧尋也然而今戒對王等前戒相欲令罸內眾意樂戒之𨕙犯今戒也與諸戒自別也若令罸人者即成破法故名破內法也天台第六重戒之下對釈云稱犯者名字在此戒正制若謂治罸心在第四十八破法戒制文與次上戒不同法藏分之如上之問此戒住治罸心還重第六重何輕乎荅第六戒稱犯者名字所四眾䧟沒永失興法等義此惣雖舉內眾過不指名字故所罪過不如第六戒故有輕重不同欤二随文述解二初明經惣意如文二如下餘文證全文如文集三經佛下結勸奉行如文大文第三經尒時下流通分三初牒經配科第三結勸奉行門付自下經文諸師御所覧不同故解釈互別藏䟽云三結勸修學諸佛子是四十八輕戒乃至現在諸菩薩今誦三大文惣結勸學四初挙佛同誦諸佛子諦𦗟乃至我亦如是誦二勸眾令持汝等一切大眾乃至解書冩三流通不絕佛性常住戒卷乃至不絕四傳授利益得見千佛乃至天中三結勸流通分四初結已畧我今在此乃至法戒二勸學令修汝等大眾乃至奉行三指彼廣文如無相天王品乃至廣明四眾聞奉行三千學士乃至受持文此釈我今此樹下為惣流通次云諸佛子下大叚第三惣結輕垢勸令受持佛子諦𦗟下是流通分文此師佛子諦𦗟已下為惣流通二師俱不釈尒時釈迦已下是則兩師所覧本尒時釈迦已下文闕次莊云經諸佛子此是四十八輕戒自下第三惣勸受持乃至經佛子諦𦗟自下第四惣勸流通乃至經尒時釈迦自下大叚第二明惣結上乃至經如一切佛等者乃至自下第三明流通分文義記云諸佛子第三惣結乃至佛子諦𦗟第三大叚流通也乃至尒時釈迦第二重惣流通一品文矌云諸佛子下第三惣結乃至諸佛下第三大叚流通乃至尒時下第二流通一品文則天台明矌勝莊解釈所牒經文與現行本同也問今師御所覧云何荅八云今師御所覧本諸佛子四十八輕等二行文遺闕故諸佛子諦𦗟已下為輕戒結勸奉行云云師云此義不尒既文言此十重四十八輕何今師以此文但輕戒乎亦若諸佛子諦𦗟已下為結勸奉行湏下釈之但云結勸奉行都無解釈故知今師御所覧本諸佛子諦𦗟已下文無之也但諸佛子是四十八輕已下二行及尒時釈迦牟尼佛已下文有之也問若尒今牒佛子𦗟十戒相似諸佛子諦𦗟已下文云何荅傳冩誤也湏牒諸佛子是四十八輕也問何以得知諸佛子諦𦗟已下遺闕本乎荅明矌云諸佛子下第三惣結乃至諸佛子下第三大叚流通乃至時坐𦗟者舉此南冽亦有戒本無此一叚文不周足前勸奉後受持故尒時下第二流通一品文諸佛子諦𦗟已下文有本闕此文頗明足為准㨿矣經佛性常住戒卷者藏云佛性常住明理湛然文戒卷流通等明教法傳通又釈佛性為本有之因戒卷為外緣傳受謂從過去傳至現在傳向未來展轉相受故云不絕也文經得見千佛等者有二點也一云得見古都扵千佛之佛授扵手扵是則法藏意也彼云謂得見此賢刧千佛相授文一云得見千佛扵佛授手扵不堕𢙣道八難文餘師義也義記云佛授手者非即舉手更授明羕戒如法與佛相隣次不遠故云授手也文奥云授手者佛以慈教為手人以信心為手二手相即是授義也乃至十王傍報故生人道天中又為道器身攝眾生處不同凢小耳文又云見千佛者得入二地文撲揚云得見千佛者三𠀍刧各一千佛授手展轉告云此是我法子汝當護念故𠀍不堕𢙣道八難文已下諸師解釈少異也如藏指賢刧云千佛如撲揚通指三𠀍此二師俱約竪如傳約撗入二地見千花上佛為言我今在此樹下等者云我即釈迦所稱樹謂菩提樹如毛頭許故曰略開然雖親授舎那今論展轉故言七佛猶略其實無𨕙文三千學士者撲揚云言三千者應是釈迦略戒時有三千學士也文璿釈同之此釈會坐有三千人為言義記云乃學三千威儀之士也文明矌云言三千學者者謂三千界所學之者有本言士天台之人悮改之文銑進意同矌也大文第三經尒時下流通分三初牒經配科始終卷初分為三叚等者經為此娑婆下傳初𤼵心外門戒分三門開序故正故流通故也今指彼第三也二此文下釋經惣意言此文意等者釈千百億釈迦等文也行作意時者欲法意名作意也摩𨢸首羅等者一切經音義云摩𨢸首羅正云摩𨢸濕代羅言摩𨢸者此云大也濕代羅者自在也謂此天王於大千界中得自在故文則第四禪也十𠀍界海者花嚴第二卷亦也經十住處者問如何可數十處乎荅當卷初有之然卷始文正十一處見云出已座金剛千光王座及妙光堂文今文云十住處付此料蕳非一有抄云嵯峨法皇御時𭮿山学侶用此論義會座中無知此事者也一義云十處可得意初金剛千光王座者但举成道座處非謂法處數妙光堂以下十處正是法處也是則十處十會也進云言十住處者一明佛在妙光堂十𠀍界文明矌云言十處者初坐金剛座十𠀍界海文如法進釈頗有其理可為此義潤色如曠釈不取妙光堂取金剛座未詳其道理一義云十一處可得意也傳釈十一處而初一會涉千光王座與妙光堂二處也則十一處十會也依之卷始合云坐金剛千光王坐及妙光堂十𠀍海也文今經文云十住處約會數為言更無相古迹上卷云菩提樹者畢鉢羅樹也在伽耶城西南二十餘里金中精窂名曰金剛可冝金剛躰之坐也光中㝡勝名光王座妙光堂者即花嚴云普光堂也因佛放光而立名也在摩伽𨹔國滅道塲界去菩提樹三里也生死處名道塲文三言下畧釋經文言心藏等者與咸注云心藏地藏即心地二字戒藏即法門也無量行等者即果人因人稟此品而修行願也因果佛性惣包初後也如是一切等文惣結上句也文地藏地者生長依持義也果即四智者則能證也佛性常住者所證此即立法也經如者一義云如真如名如所證理也㝡勝王經所證名如能證名如智故知今如指真如也法進注云三𠀍諸佛所戒法俱會真如之理無別故曰如謂一色一心皆入佛性戒中如不動是名法藏文璿注云前明一切眾生皆有佛性為戒本源其躰不易名為常住其理無故曰如謂一切色心皆入佛性戒中無不如故文若依此等義如属下梵網經私記云如者心藏亦如地藏戒藏亦如心藏凢所皆互如是故云如也文是則如是義也如言属上也𧦐文云如那利句絕有抄云有本云如是一切等今私記釈意欤寬永甲申中冬吉辰中野氏是誰新刻
