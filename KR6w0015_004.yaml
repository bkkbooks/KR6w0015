body:
  text: 四故心妄語戒二初牒經故者簡誤不犯等詞也妄語者法藏云第二尺名者言非稱實為妄令他領解為語戒防此失此從所為名乃至第三次第者先身業次語業事為次第文二述釋二初制意二初文顯過二初智度論二初妄語過智論十五云云云今出十三調卷不同也云云譬如䨱瓶者法藏云彼論云復次佛子羅雲其年糿稚未知填口人來問之𠀍尊在不詭言不在時人問羅雲𠀍尊在不詐言佛在有人語佛佛語羅雲澡盤取水與吾洗足已語羅雲䨱澡盤如勑即䨱佛言以水注已住問言水入中不答言不入佛告羅雲無慚愧人妄語䨱心道法不入亦復如是文二又下實語德如文二瑜伽論二初文所犯學處重修行支者五十三卷付近事律儀立三支方攝五戒此即第二支也彼云一受遠離最勝他事支𭣦生偷盜邪也遠離𡧱他命壞他財他妻妾名初支也二違越所受重修行支遠離妄語是第二支倫記云若已犯前三師僧撿得由不妄語發露懺悔重修前三也云云三不越所受支遠離諸酒衆放逸處文是第三支周記云由妄語故䨱藏己罪不肯懺悔重修戒也文意云犯前三戒等云越所受其越戒而懺悔云重修行也對不犯前修行今又修行云重修行不䨱藏所犯修行云離妄語䨱藏所犯即妄語故也云云二妄下反證如文二既下因過示次顛墜𢙣趣者花嚴經云妄語之罪亦令衆生墮三𢙣道若生人中得二種果報一者常被誹謗二者為人所誑文二釋文四初違犯相門二初標章舉經如文二言下別釋方便方便者假詫餘事者十誦律云我今日不入𠀍間禪定若人問言昨日云何答言亦不入如是語應得何罪答言得偷蘭若禪法得波羅夷文取意天台義記曰方便妄語如蜜塗樹文與咸注云頂山云以蜜塗其樹以物掩之衆蜂奔集詐言得神通爾或問三性之義以不解故妄云我今日不入定故不能答皆方便妄語之相文二次下違犯性門二初標章舉經五十九曰妄語業道事者謂見聞覺知不見不聞不覺不知想者謂於見等或彼想欲樂者謂䨱藏想樂之欲煩𢙉者謂貪瞋癡或具不具方便究竟者謂時衆及對論者領解文二此下指略餘文此中問答如大論記者宗要序因述瑜伽纂要三卷准此今師就瑜伽論作纂要記三卷給今指彼云如大論記也然而未流行問答趣不辨其旨相傳云付今戒究竟諸師解釋不同所謂瑜伽論等究竟相前人領解料蕳此領解或以信解云領解或以聞知云領解慮大論記問答定决此事歟今師御意前人雖不信只領解妄語言可成重見於今戒者分明解釋雖無之見下法化宗戒云准妄語業雖不信犯文解釋意趣分明也智首云誑人知解結罪不待其信文法礪同之勝莊師對佛菩薩妄語不成文若爾彼師取信解歟云云三境界事門三初摽章配文如文二為下隨文略釋三初釋乃至二初大小對簡如文二或下四言對簡或見聞等者攝餘聞觸知也反即八語也以此四配六根時眼耳意三即如次見聞知也鼻舌身三合為觸也云云二釋身妄身妄語者雖不發語言由身表令人妄解也四分律云時有檀越語常供養比丘言若大德是阿羅漢者脫僧伽梨比丘即脫現相不語疑佛言偷蘭文三釋心妄心妄語者今記主意於不見事起見想而離言不見等也法藏同之然而義師不同此歟彼云心妄語者如戒時默表清淨雖由二表令他妄解而所成業語業所攝故云妄語文問誑言不見等者若爾何云心妄語哉既假言成即是常途語業是以勘餘師解釋述心妄語者云如戒時默表清淨法銑釋同之見此等解釋都無假語業然而今師釋以䨱所知名心妄語似無其謂如何答今師解釋之趣唯非意念業歟於不見事而起見想欲誑他人未出言時未成業必出言方成其業故必假言唯意念位未成然此心妄語者自稱前事故非語妄語但䨱自所知令他妄解故是名意妄語也非如常途默妄意念罪雖然依想成犯故出心妄語之相也云云問妄語者依自表彰令他生異解是名妄語罪而於意念他人不知之又所出言語稱實事無前妄解義爾者何名妄語乎答實今所稱前事故雖非語妄語異自意念令他生異解故名意業妄語也望自妄念云妄解也爾者無過歟云云三又如下出𠀍戒如文四結成罪門二初標經如文二菩下釋義二初正行私云科文正行者經而菩薩正語正見釋假故云爾也為蕳䨱想者有義云即上心妄語也蕳心妄語云正見云云今云一切妄語皆䨱想也由想成犯故但蕳邪語言正語蕳邪想云正見也下䨱想正知豈心妄語乎云云二而下反結二初成犯如文二若下開文二初正論文䨱想正知者謂䨱想知之則妄語想也仍訓文云䨱想奈利土正知師手此等皆宗家等意但地上也若依今師意亦通凡夫也理趣分云如在路行見人逐㝹他問見不應坐答言我實不見為護𭣦事即現坐相云我不見非是立時我不見也不犯妄語護𭣦事故文師云為助他命開之但無利益如是現異相可成方便妄語歟設為利生不假如是相直作妄語於地前者不可開之也云云二不下無利反結如文已上妄語戒畢五酤酒生罪戒二初牒文法藏云第二釋名者令人惛醉名酒貨授與人曰酤防止此患為戒亦從所治為名乃至飲唯己一身過未深故屬下輕垢酤多人故今制重又為菩薩二利之中利他為最但乖益生已為非理况乃成故非所冝文問生罪之時結此罪歟答不爾也即下自釋云酒已屬彼即為究竟文明知酒前人手取位即犯也然而摽生罪者為顯酟酒之過重摽之也非明結犯分齊云云二述釋二初制意二初制戒意二初耽酒過文集云智論十三曰酒有三十五失何等三十五一者現在𠀍財物虛竭何以故人飲酒醉心無節限用費無度故二者衆疾之門三者鬪諍之本乃至六者䨱沒智惠乃至八者伏匿之事盡向人九者種事業不成辨十者醉為愁本等云云同善生經第三曰若復有人樂飲酒者是人現𠀍喜失財物身心多病常樂鬪諍𢙣名遠聞失智惠心無慚愧得𢙣色力常為一切之所哥責人不樂見不能修善是名飲酒現在𢙣報捨此身已處在地獄受飢渴等無量苦𢙉是名後𠀍𢙣業之果若得人身心常狂亂不能繫念思惟善法是一𢙣人因緣力故一切外物資産臰爛文二制下酤酒過此不共戒者問今戒至第十戒悉不共戒云云後四重但菩薩不共妙戒更非所論中間二戒亦號不共相不共故如前四重雖名不共躰可云共彼乎亦如後四重躰性不共故得不共稱乎答付中間二重諸師解釋非一准元曉並遁倫記前六重悉名共戒今師并法藏後六重稱不共依此學者義解往傳云致中間二戒共不共諸師解釋非一徹雖然何無相由躰共戒酤酒三十販賣中一類談他僧殘二謗並九十罪中隨時可攝是故遁倫師及元曉名共戒元曉云第五酤酒戒大小同小乘上二衆同一切販賣犯第三篇下三衆者犯第五篇大乘中酤酒七衆同犯重文若由相大不共彼制輕罪此制重罪故今師及法藏號不共戒藏云上來四戒大小同犯名共戒自下六種小乘非重名不共戒文是故中間二戒躰性是共相大不共可得意也問由相不共十重俱相不共何獨中間二重號相不共乎答於相不共有重凡今經孝順慈悲為前戒皆制修善利生障若依此義十重俱不共二於四戒分大小聲聞以斷人命為夷罪以斷畜生命為波逸提今菩薩戒𭣦至一切有命者盜至一針草同得波羅夷名由此亦四重俱號不共是二重由此二義文集注文梵廣本但後二戒相不攝律儀云云雖如是不共前四重猶𭇥斷人命過五錢等俱名夷罪則有全同義故亦名共由此今師並香象大師前四重號共戒三酤酒談他雖大小同制小但制輕罪大但制夷罪不同前四重有一分全同義是故但云不共也是三重問中間二戒躰性全共若犯時可致律儀懺乎答付此亦異義多至下輕戒第四十一戒具抄之亦有躰性不共傳云云同至下戒抄之二或下列次意或對五戒等者法藏云第三次第者前四同聲聞四重此戒非彼故在第五又五戒於此當第五不飲酒戒但以飲唯己一身過未深故屬下輕垢酤多人故今制重文圓公有義云以法藏挍今明此戒列次意有二意可料蕳也此不共戒者第一意也凡列罪自至細故十業道門列身三語四意三此戒亦如是是故先列共戒列身三語一畢身業尤語業次故酤酒已下亦不共戒故亦由身業先列次及語意不共中酤酒身業戒冝可為不共第一所以亦列不共戒配立身一語二意三也由此云此不共戒當法藏此戒非彼故在第五解釋也或對五戒等者即列次第二意也當藏次釋也依之難科文云大背文相云云若不分二意或言對何乎今案云藏二釋見但向今此不共戒為列次由諒難思或言科文意亦無相就釋列次可有多意且出一意故云或也如是諸師常習也不可始驚矣二餘下釋文二初𢝰指四門補行文集云經曰若佛子至教人酤酒私曰犯相門酤酒因至酤酒業犯性門一切酒至起罪因緣境界事門而菩薩至波羅夷罪結成罪門云云二具下略釋二門二初釋違犯性酒已屬彼即為究竟者法藏云前人領入手便犯文義云方便究竟者一云授與人時便犯不待前人飲與不飲一云待前人飲方犯文勝莊亦有二尺與此同雖義勝莊及兩尺今師並法藏但前人領受便犯欲樂既求利究竟何待飲若爾領受便犯解釋尤可勝歟云云二事下釋境界事唯除破僧者智論云多聞持戒有清淨人方能破僧文飲酒醉亂者其事誠難作故也經明逹之惠者矌云明逹惠者實相般若也文曉云明逹惠者照理為明知事者為逹文已上酤酒戒畢六談他過失戒二初牒經補云藏云第三次第者於此十戒初四同聲聞四重後四同瑜伽菩薩四重中間更加酤酒過酤酒顯故先辨過細隱故後論文又云問何故不制佛及法過答以彼無過故若無失而即是謗故屬第十戒修行之者劣位有失易嫌故是故制也文問所罪過為通輕重但重罪答諸師解釋不同莊云言罪過者自有兩釋一云他十重七逆罪者犯他勝處法若輕罪是輕非重一云不論輕重但是壞他利養及恭敬故彼過罪皆是犯重文具出兩尺俱無取捨云具緣中事者謂有戒人所有罪過向無戒人七逆十重是正所制自餘輕過亦兼制也文同下云輕戒第十三戒下也向無戒人有戒過若重罪犯重前戒正制若輕過犯輕前戒兼制文義記云所過者謂七逆十重文則天台義兩師但重罪見於今師解釋雖不分明但七逆十重見下問答於七逆十重分別之故知但重罪見就中今師多分同義法藏時有不同自即破之然今不分明明重罪仍今師解釋同可得意也况解釋趣同彼釋上更不可及餘義也八云見制意云佛法過必壞他信云云無蕳但云過故知寬通輕重之可成此戒犯云云此義恐不足言也制意為顯過重通漫舉之結罪必不依此如酤酒戒舉醉亂失究竟但取前人領受如是諸戒常例何不明文相始終𭤽立非義冝捨此義勿守株矣二述釋二初制意二初述過彰名佛法過云云述云問此戒所制通三寶歟將限僧衆歟答佛法二寶無過失也若但謗者犯第十謗戒故此戒唯限僧寶有凡聖二位於凡僧者行有持破故此過之時犯此戒然而佛法二寶並假僧𭤩若僧壞之時佛法隨滅故云爾也云云二如下文示苦二初苦果如文二大智下先蹤大智論云等者准彼論勝意者是文殊因位也喜根比丘無戒者以現破戒相云無戒非謂一向無戒也論第八云先過無量阿僧劫有二菩薩比丘一名喜根二名勝意是喜根法師容儀質直不捨𠀍法亦不分別善𢙣喜根第子聰明樂法好聞深義其師不讚少欲知足不讚戒行頭𨹔但諸法實相清淨語諸弟子一切諸法欲相嗔恚相愚癡相此諸法相即是諸法實相無所𦊱㝵以是方便教諸弟子入一切智勝意法師持戒清淨行十二頭𨹔得四禪四無色定勝意異時入聚落中至喜根弟子家於坐處坐讚持戒少欲知足等呰毀喜根言是人法教人入邪見中是欲嗔癡無所𦊱㝵相是雜行人非純清淨是弟子利根得法忍問勝意言大德是欲法名何等相答言欲是煩𢙉相居士言若欲非內非外非東西南北四維上下來遍𣱵實相不可得是法即不生不滅若無生滅空無所有云何能作煩𢙉勝意聞是語已其心不恱不能加答從座而起如是言喜根多誑衆人著邪道中從居士家至林樹間入精舍中語諸比丘當知喜根菩薩虛誑多令人入𢙣邪中何以故其言欲恚癡相及一切諸法皆無㝵相是時喜根作是念此人大嗔為𢙣業所䨱當墮大罪我今為甚深法雖今無所得為作後𠀍佛道因緣是時喜根集僧一心偈欲即是道恚癡亦如是三事中無量諸佛道如是等七十餘偈時三万諸天子得無生忍等是時勝意菩薩身即陷入地獄受無量千万億歲苦出生人中七十四万𠀍常被誹謗是喜根菩薩於今東方過十万億佛土作佛其土號寶嚴佛號光踰日明王文殊師利言今時勝意比丘我身是也文問以何義煩𢙉即是道乎答莊嚴論會之云由離法性外無別有諸法是故如是煩𢙉即菩提依理會之於貪起正思於貪得解脫故貪出貪嗔癡出亦爾於事會之云云初會釋之意云法性之外別不可有諸法何煩𢙉之外別有菩提道哉是故煩𢙉即菩提也次會釋意云於貪煩𢙉起正思惟觀察思惟貪躰相遠離之者即得解脫由此義煩𢙉即道也嗔癡亦如是實非三毒則菩提歟凡欲即道諸法無行經也云云又不思議光等者彼經云爾時毗婆尸如來法中有二菩薩一名賢天二名饒財賢天菩薩於無上道得不退轉得𨹔羅尼彼時饒財菩薩習學頭𨹔為賢天菩薩作給使彼人恆往聚落城邑多諸事務是賢天菩薩呵責教化彼便生嗔念以忿恚故毀敗身心敗身心已嗔恚罵詈輕賤女兒私通所生從他人得不識其父又不識母况汝當有戒聞定惠彼嗔罵已後不悔過恆有忿心嗔賢天菩薩賢天菩薩即便捨棄既捨棄已倍生嗔恚罵詈揚𢙣以此不善業行因緣身壞命終生女胎為彼賢天菩薩所護不生地獄女生已恆常棄之為𤜶狼犳之所餧食大王以是因故九十一劫常如是死生常棄為多人衆之所罵詈是女子被棄空處𤜶狼食彼饒財今此不思議光菩薩是也彼賢天菩薩今名曰德藏文二釋文二初違犯相門二初標章配文如文口字現流布本無之所覽不同乞二今下兼境界事四初略標述云初門兼攝境界事門者問餘戒無此義至此戒犯相門攝境界事門有何故乎答此戒出家在家菩薩比丘尼四衆之過之時犯今戒依之有名四衆過戒之人師若犯相門無左右如𭣦生戒等若自罪過教人過等云者一切衆生罪過談之者皆可犯此戒疑之故為蕳之故初門兼舉之也二此下釋文三初菩薩初二受菩薩戒者瑜伽四十云云何菩薩一切戒略有二種一在家分戒二出家分戒是名一切戒又即依此在家出家二分清淨戒略三種一攝律儀戒二攝善法戒三饒益有情戒文二聲聞後二聲聞者法藏云問此中何故制小乘僧尼過哉答俱是佛法相住持故是自內衆故文文集注意比丘攝沙𢏏比丘尼攝式沙摩尼沙㫆尼𢝰攝五衆也三俱下𢝰結如文三若下决難二初舉難如文二猶下釋難二初立義文意易知傳奧云大悲經出家人左手男右手女從一酒家至一酒家不出賢劫當般𣵀槃是故於彼不應過文又金剛般若𮚌述云慈恩龍樹釋云如有七寶處金為最大乃至無好物處䥫鍻為最大如是有三寶時佛最大乃至於末後時破戒僧為最大等文二如下證二初證菩薩二衆本業經下云其受戒者入諸佛界菩薩數中超過三劫生死之苦是故應受等已下如今引二又下證比丘比丘尼二初文占匍花者抄枇第五云瞻蔔花者中梵正音瞻博迦此云黃花而小香西𫭫多有文或抄云樹似躑躅香甚芬馥文若有戒若無戒者一義云此句於破戒中約失戒不失戒述之歟謂以中下犯之者不失故有戒上品犯者失戒故無戒也云云一義云可云無十三難等得戒故是有戒若身具十三難等者不得戒故則無戒也此本受不得者也常途無戒者非此所論云云一義云大集月藏經云若有為佛剃除髮被服袈裟不受禁戒其𭃯利王與作𢙉亂罵辱打者得幾許罪佛言若有人於万億佛所出其身血得罪多彼文准此文今云無戒者為解脫出家剃著袈裟未受戒者歟此等人過所以其罪重者同經云何以故如是為我出家剃髮袈裟片雖不受戒或受毀犯是猶能為諸天人示𣵀槃道是人便已於三寶中心得敬信勝於一切九十五道其人必速能入𣵀槃勝於一切在家俗人唯除在家忍辱者是故天人應當供養文二解云下解意述云問五逆七逆中有出佛身血豈不障道乎答自雖障道於佛多人未壞信又佛無生煩𢙉有此道理故云不能障道等也云云四是下結勵三初勸求德麟𭺸聖者從喻為名獨覺作𠀍無二佛國無二主思三千界中一人出現如是彼獸國君有道希出現故以喻比也蕳正記云此麟形如馬有一𭺸京房云是肉𭺸非骨也尾似牛腳似人手𤠸蹄頭有五色腹下黃高一丈二尺壽二千歲三千年一現此獸有德行不折草木不踏蟲蟻不入羅不寄穽之中亦號為似人獸君王有德則現堯時曾獲麟於野文有失可取等者俱舍光記二十九云若於有情樂求德者乃至以於斷善者有德可録先福業果貌端正等現可見故若於有情樂求失者以於麟喻獨覺有失可取先罪業果貌黑疲等現可見故文若由文集意以自利心為失云云大順文意斷善德𣵀槃文出佛性意頗異光記若爾麟𭺸失必不依形㒵歟金般若讚述云基龍樹釋云如有七寶處金為最大乃至無好物處䥫錫為最大如是有三寶時佛最大乃至於末後時破戒僧為最大故經云瞻博迦花等文二如下證求德𣵀槃經二十四曰菩薩摩訶薩雖見衆生諸𢙣過咎終不之何以故恐生煩𢙉若生煩𢙉則墮𢙣趣如是菩薩若見衆生有少善事則讚歎之云何為善所謂佛性讚佛性故令諸衆生發阿耨多羅三藐三菩提心等云云三𠀍下誡談他二初正誡如文二如下引證二初大集經補云十六行云等者師云十六行中無此文即十六行鄰近文假也故爾云也云云大集經二十六曰復有五種一持戒已不生憍𢢔二見毀戒不生輕𢢔三見持戒心無嫉砳四終不求聲聞之乘五者不念辟支佛乘文二諸下無行經久亦得道者法藏云又大慈經中出家人左手男右手女從一酒家至一酒家不出賢劫當般𣵀槃等是故見有少許佛法所被之處皆應讚歎文二結成罪門三初𢝰摽章配文經外道𢙣人及二乘𢙣人者銑下云一者外道二者二乘之人謂初心者若是得果以無我見不合他以初心人不信大乘人過亦名𢙣人即如諸部小乘不信大乘者是乃至即是外道通佛法二乘別大乘之過言惣意別文矌云言外道者除七衆外並名外道外道即𢙣人也二乘𢙣人者乃至利他心劣乃至此心即𢙣名為𢙣人文二言下別釋常生悲心想似㓛德者瑜伽四十六云又諸菩薩略有五種相似㓛德一者於其暴𢙣毀犯淨戒諸有情所由是因緣作不饒益二詐現種足威儀三者於順𠀍間文詞咒術外道書論相應法中得預智者聰者數四者修行有罪等善行五者宣建立像似正法廣令流布文三問答决外疑二初問下輕戒云若佛子以𢙣心故無事謗他良人善人法師師僧國王貴人言犯七逆十重於父母兄弟六親中應生孝順心慈悲心而反更加於逆𡧱墮不如意處者犯輕垢罪文二答二初同法異道答如文二或下無事有事答補云問今答文有二尺為相違釋為𨕙釋答八云𨕙釋也非相釋謂實犯向異道為重罪不實犯向同法是輕罪為言問實犯向同法不實向異道其罪何答俱輕也云云傳云見今文假不爾二尺俱相釋依初答不問實不實向異道為重向同法為輕次釋不問同法異道實犯重罪不實輕罪為言義輕戒下有兩釋分明如是見仍今師例同可得意也問若相釋以何可為今師正義乎答以第二尺為正上文言若實有犯過何失文今戒但實犯歟下輕戒名無根謗毀戒無根俱輕亦分明也加之彼戒下釋云離三根故亦言無事乃至於彼自行通輕重故文則付有根無根蕳大小乘不同實犯重不實輕旨分明也同法異道釋餘處都所不見仍為不正義以初同法異道釋為正重戒下云具緣中事者謂有戒人所有罪過向無戒人文致第十三戒名不毀良善戒以第二實不實釋為有人義故知師以初釋為正今師以第二釋為正可得意也云云彼云云文字倒可作彼也云云問今戒究竟時分何答法藏云七前人領解故成犯也文已上第六談他過失戒畢後四重惣分別補問瑜伽論中於前後四重出隨順根本二種得名云何配當乎答諸師釋不同義并集解意則以前四重名根本四重三乘根本故後四重號隨順前四重故又今師并勝莊等以前四重為隨順以後四重為根本宗要云無𢙣不由貪嗔癡者亦無不為好推𢙣所以後四為根本重文乃至今後四重戒皆有為根本重言故後四重根本前四重隨順今師所存歟勝莊抄略之問宗家意何答同今師解釋勝万述記云唯持其性非唯重非輕唯根本非隨順也於中有四即四波羅夷文出後四重故知宗家以後四重名根本明鏡而集解釋以宗家同師所以不見勝万述記也問後四重結犯待語言方成其犯亦但居意地得重罪稱乎答讚毀一戒必待語言諸師一同更無異解經言自讚毀他等釋云四身三語仍無相於慳戒已下三戒人師解釋不同等云云委細如補忘抄必可見之也七自讚毀他戒二初牒經自讚毀他者法藏云顯揚己德為自耻辱有德名毀他防治此失故稱為戒文此戒名者依通途犯相摽名亦有自毀他等犯相至下釋假可知也二述釋二初制意二初明義通一切二初儒教且孔丘云等者不內典先儒教故云且也史記云魯𮕱公二十二年孔丘生名丘字仲尼姓孔氏長九尺有六寸文朗詠注云孔子之名丘也頂凹如尼丘山頂故名丘也孔子之頂凹可容三合又名孔丘又名仲尼又名宣尼也文天台止觀六云我遣三聖化彼真等文𭤩决六云清淨法行經云月光菩薩彼稱顏回光淨菩薩彼稱仲尼迦菩薩彼稱老子天竺指此震旦為彼文𭤩明集少異之吾有一言等者論語第八云子曰君子不以言舉人苞氏曰有言者不必有德故不以言舉人不以人言子貢問曰有一言而可以終身行者乎子曰其怒乎己所不欲勿人文二此下明此戒義通一切者凡此戒意𢙣事自向己好事與他人是為正行而反好事自向己𢙣事與他是為所制過此義者通諸戒如𭣦盜等比之可知毀之言雖限第七戒其義理通一切故云義通一切也宗要云𢙣無不為好推𢙣文二菩下明為根本重誓處生死者若由三類各別傳且依悲增一類爾云也若依大悲為躰傳俱通三類也述記云六七以前代諸有情受三途苦乃是實身文二釋文四初違犯相門二初摽章配文云亦教人自毀他者此有二一教前人彼自德毀他人失二教前人我自德毀他人失二俱應犯文初釋律常教人也次釋律所謂遣使也俱同犯重撲揚云略無喜文今師意同准盜戒可解云云私云經口自毀他者御所覽異歟二必下隨文略釋三初釋文別別毀別得兩輕者付此義法藏兩師解釋不同云又要毀方結重若毀而不而不毀唯犯輕垢或先後毀或先毀後但令運毀心𬾨二結重先後毀時方便輕毀時成本重先毀後亦爾如尼八事一作時方便故蘭具八事時方結夷罪若單欲或單欲毀雖前後具二別結兩輕不成重也如斷心數取四錢不成重也文今師解釋與此同也藏云一單自亦重如善戒經彼云菩薩若為貪利養故自身德犯菩薩戒住地是名菩薩第五重法樓戒經亦同此二單毀他亦重如此文云他受毀者犯重故文則與今師解釋不同問如藏善戒經文但自得重見如今經毀他因毀他緣等但毀他亦得夷罪見若爾藏師解釋頗本文今師云何會之答由今師及師義經且舉一𨕙可會奧云略於自理必有之文今經且舉一途證也又勝莊疏云瑜伽第四十云若諸菩薩為欲貪求乃至并善戒經及地持論亦同瑜伽文既以善戒同瑜伽若爾彼亦且舉一𨕙也云云述云重云今經及瑜伽論等之意必具二義可成重見今經云若自揚己德隱他人好事令他人受毀者是菩薩波羅夷罪文瑜伽云為欲貪求利養恭敬自毀他是名第一他勝處法文若單自單毀他者好推𢙣二義各闕二義故非重也云云一別毀輕罪與第六戒差別事補忘抄有問答略之一第六戒與第七戒不同事補云一前七逆十重此通卑賤等事二前實犯此通實不實三前依境意此依希求利養意四前但毀他此通毀應作四句一第六非第七雖七逆十重無利養意二第七非第六如他種姓卑賤形相好𢙣重自德貪求利養三亦六亦七他七逆十重作境意貪求意准謗妄離合可分單腹四俱非形相好𢙣無貪求意是也次輕重相望亦可作四句一第六第七非輕戒如前俱句二輕非六七如貪求利養他種姓卑賤即不自德有貪求意故犯此戒方便不具自故亦非重罪不重過故亦非第六三亦第六亦輕非第七他實犯七逆十重作境意樂作貪求意樂故具犯輕重二戒但不自故非第七重四俱非如盜𭣦等餘戒非輕亦非六七故云云問第六戒但境上玄談云三語由三得究竟文第四六七三戒依三毒究竟見若爾第六貪心犯必非境歟若非境但以貪心犯第六罪與今戒別毀何異乎答第四六七三戒依三毒究竟其罪更非所論云三語由三得究竟故但由貪究竟境義可通歟欲得自利養若不言沒他我利養難得是故無恚但為利養境心方生是名貪談他也若爾以境意七逆十重方則犯第六由貪求利養心別毀𨕙得輕罪也云云有義云七逆十重一切第六犯縱別毀不可得別毀輕今言別毀得輕且由餘別毀不由七逆十重也二猶下例如文三餘下指廣宗要云若於自他毀必罪設毀者亦是福耶謂有四句或有毀罪毀福如次他𨕙𡧱故饒益故或有毀福毀罪摧邪等故倿利故或有毀亦福亦罪毀亦爾謂順淺小深廣等或有毀非罪非福謂如彼心增上狂亂或重苦逼或未受戒無記所作文二違犯性門二初標章配文法藏云具緣成犯者具六緣一正境謂自他二起彼想三作毀意四為名利等五正加毀六前人領受毀便犯文二次下業重相攝問前以三語隨相攝第六第七了今又出其義似無用何答此可有別所以歟意既於犯性門攝之犯性門以五支成犯究竟門也瑜伽論中於離間等出五支相以彼五相可知第六七犯相為言依之今此以第六七相攝離間等見十不善門無第六七犯相故其相以難知寄離間等如此所釋也其意尤可然也云云妄語雖通等者法藏云解云此中亦攝𢙣口兩舌𦂶語等三從首為名以過患相起故智論云四種口業中妄語實重故復次但妄語已攝三事後次諸法中實為最大若實語四種正語皆已攝故文准此等文得意今解釋妄語中雖通餘三前第四戒別既制妄語一種故彼不攝今第六七兩戒攝餘三種也法藏等意妄語中攝餘三智論等文亦爾然而今師御意不爾故安雖字痛之歟或可云第六七戒中通雖容有妄語前戒既為一戒制之故不攝妄語也為言三略下境界事門二初示文闕補問略無第三境界事門者今師以何為境界事哉答八云以所毀事所毀人為境界事云具緣成犯中事者有二一所毀人二所毀事大賢意與此同歟云云若由科文意然下論補文則以貪求利養恭敬為境上云略無第三次云然瑜伽云等以利養恭敬為境界事旨明若以所毀事人為境界事第六第七全無異若以利養恭敬為境二戒都無混亂兩義不同得失遙明云云述云此科文義不審凡境界者以為所毀者為境界事利養恭敬所求非如此之事也全非出境界事也所毀何不為所毀境界事哉但瑜伽文為顯毀戒犯相也云云此事可思之二然下論補二初論文私云瑜伽論前四重讓律部唯後四重故云是名第一他勝處也二是下解論意二初正出論意如文可知之二若下點嫉妬重補云但由嫉妬等者瑜伽但出貪心犯今依勝經釋之也唯識論六云嫉妬者聞見他榮深懷憂戚不安隱故此亦嗔恚一分為躰離嗔無別嫉妬相用故文鏡水抄云問疾妬何別答緣他人學問道德名嫉緣他人榮樂名利稱妬又見外相名妬見內德名嫉文問依嗔毀無利養希求心乎答有人云既云以嗔究竟無名利希求心也若有希求心則以貪究竟也非嗔犯故云云今案云此義不爾既此戒境界事者利養恭敬也何但貪犯不通嗔犯境界是一貪嗔方別若依貪嗔境界更別大背文相是一亦以希求但屬貪此亦不爾希求行相則是別境中欲心所也若爾欲心所但與貪相應不相應嗔乎是二又今嗔犯者源出勝彼述記云深生嫉妬所有造作皆為名等今既無嫉所作不為名等也文嫉妬猶希求名利證據誠明是三問若爾貪嗔二犯別云何答欲利養恭敬毀是名貪犯雖希求名利意猛利我今利養思不可叶以嫉妬心毀是號嗔犯也雖貪嗔別何為名利也云云四第下結成罪門二初釋正行私云科文正行者指利他行歟二下反結罪二初正結罪如文二若下因釋疑二初問如文二謂下答云前人無道毀菩薩時菩薩作念如有的箭中無則無所中由有我身故衆生興𢙣無我身則無由起𢙣由我𢙣在我也是則𢙣事自向己也又作是念由前人毀我故我得修戒而防若無前人我善何緣而生生善由彼善在彼也是則好事與他人也文藏云問若自無𢙣而認若他無善而推豈非諂曲而妄語乎答自居不足安得無失謂無失者唯佛一人以纍盡故又他無餘善猶有佛性即是真善若意至此而認推者非直無諂亦無妄語而乃具發無量善根令戒清淨故為持也文八慳生毀辱戒二初牒經云菩薩地中直云不財法不言加毀應名不惠戒祕財法名慳罵辱前人為毀從所防過為戒名也文法藏云云何故嗔依本名貪就慳性謂嗔障慈悲乖菩薩行重貪或容有順悲愍故是故約慳慈齊文同云次第者前毀自他以求名利望未得之財追求時過今約已得屬己慳不捨之財貯畜時過前此細義次第故來也文一補云自下三戒未待語言慳心决定可生毀辱則犯重罪都不可業道門依此文集後三業道配當自下三戒此戒當貪欲業道而業成少異是故文集注文釋不同云此戒以慳自有為制業門以欲他財為罪當以業門准知之耳文業門以貪欲為罪於他財物作决定屬己思則成究竟制門以慳心為罪故於自所有慳心决定可生罵辱則不待語言結之也唯識論釋慳相云耽著財法不能惠祕為性能障不慳畜積為業文今戒犯相准此可解但慳三雜染中惑也未為此戒犯故浮現業則為戒所防非由此取慳心决徹可生罵辱裎意則為犯也一問此戒必對乞者不與方犯重罪亦雖無乞者慳心决徹故若有人乞時應生罵辱雖不對人應結其犯乎答有人云必對乞者方犯重罪法藏云具六緣成犯乃至二乞者現前乃至六前人空回故犯也第五闕緣義者乃至次闕第二緣乃至無乞不犯乃至雖無乞者而不捨福田乃至皆得方便罪非正犯重文今師解釋雖不分明准經文隨前人所須等文依香象大師解釋必對乞者方起慳即犯重罪但無乞者起慳心可犯輕罪也云云師云勘今上下文假縱雖不對乞者若起慳吝假令有人乞之可生罵辱則可犯今戒也上文云自慳即成慳文不對人犯今戒分明亦下戒云非衆生不懺謝若對起嗔亦成犯取意彼既不對情境亦犯重夷今戒例可爾若爾法藏釋自本別師解釋更不及會文私云今慳生毀辱戒意必至罵辱犯夷罪歟事五怗抄論義也可見之一文集注文經略無境界事門文問云具緣中事者謂所辱衆生及所惜財法所惜財法者文云乃至一錢一針一草等文既經文明出境界何注文云略無乎答別不立境界事門結成罪門中有而但出最下一針一草等其躰實狹由此且云略無論文廣明之也云云私云經自慳教人慳者犯相門也經慳因慳緣等者犯性門也經而菩薩見一切等下結成罪門也故別無境界事門境界事門結成罪門加歟二述釋二初𢝰明佛制戒意二初述不慳財意留生死身者瑜伽四十四云為益諸有情故誓受長時生死流轉文同四十七云於內身命尚能惠何况外物文二故下述根本重意故慳障等者法藏云初制意者初檀為万行首故攝六度故是捨慳成文多求廣等者五戒威儀經云菩薩為他人故從百千非親里波羅門居士盡力所求衣鉢為他人故應乞縷等文故為輕罪者問指何戒云故為輕罪乎答有人云為利益令多求廣若不多求廣則制輕罪文集引五戒威儀經其意如是云云今案云文集且為顯多求廣相引五戒威儀經文凡今文意此戒不制貪心則制慳心為顯貪慳不同如是釋意云雖慳由貪起貪猶有順大悲義依此染𣲇貪制不為重罪愛順大悲故罪為劣意也瑜伽論第二十三輕戒云若諸菩薩安住菩薩淨戒律儀起貪欲蓋忍受不捨是名有犯有所越是染犯文今指此戒云故罪為劣也若由多求廣不起貪欲方為犯罪若為利益起貪欲大順大悲由此莊嚴論云由利群生意起貪不得罪文何指順大悲多求廣云貪不深乎若云不深有少分若有少分制令多求廣聖言頗𢎨揗者歟故知為顯貪不深由引多求廣非云指多求為輕罪云云私云多求廣事五怗抄論義在之可見之也二釋下別釋結成罪文二初正行二初釋所境二初牒經文經一切貧窮人來乞者藏云但𠀍人貧有二種一財貧二法貧故云一切也菩薩此二事故云一切給與文撲揚同之二菩下論文二初文意二初有勝利欲以財攝易化導故者智論四十五云問曰佛何以檀為初門答曰攝衆生法無過於檀大小貴賤乃至畜生檀皆攝之乃至𭜨家得則為中人得則成親善文二若下無利不二初摽義瑜伽論三十九云謂諸菩薩若知種內外物於彼衆生唯令安樂不作利益或復於彼不作安樂不作利益便不與若知種內外物於彼衆生定作利益不定安樂或復於彼定作利益定安樂即便與文凡利與樂相對有多別然今此意以濟後𠀍為利與現𠀍樂為樂又以出𠀍為利以𠀍間為樂歟云云二何下徵釋如文可知也二此中下指廣文二初正指如文二略下略攝是辨攝衆生戒文彼論長行也而今賢師以義作略攝頌述彼六處也所謂自他財𮕱財盛法𮕱法盛是名六處也全文如文集遁倫記云即失於三學失於三惠名為法𮕱與此相即名法盛菩薩為他經管財物給衆生自失三惠及失三學此不應為文問菩薩利他為先設雖自𮕱何不為此乎答此亦不為自利化度衆生以法可攝之故云不𮕱自法也是以幽𮚌中釋輒不與法之義云若不增智資糧當豐巧惠亦為愛念此及餘生若彼時便唯念此如是不非淨戒等云云二言隨下明能三初牒經文如文二七下論文二初瑜伽明別二初文如文易知也論文彼所者所從也云云指上僕從歟二今下會經如文二如下十住明意十住毗婆論第四云身如藥樹衆生有用根荎枝花實等各隨意與取無護菩薩亦如是為利衆生故能自捨身作是念若衆生取我頭目手足支節血肉骨髓等隨其所須皆能與之文問如彼論文者喻菩薩於身肉手足無吝惜也然而今所喻意似無想無所得之心云何相乎答一往釋文相之時似不同深案義理之時還彼此同其所以者若有惜心者設雖身肉等必定可有分別之心若有所惜能捨與之者隨分別心以所物人故依之於彼衆生謂有重恩還欲受報恩是即有分別也無吝惜心者反之其相可知也故今師深得彼論意之令知意也三若下釋疑難二初標問如文二不下解答二初略攝頌未許者人不許物也自無能者我力不堪物也二菩下廣解釋三初釋有恩故不二初依有利無利身命者瑜伽論三十種不中二三四五四種也毒刀酒等者第六不也以上并無利益時不之故云不若有利之時者開之故云但有義利與也云云二父下設利不父母師長等者第十七不也是無開文故云定不應也瑜伽論云若有來求父母師長定不應何以故諸菩薩於其父母尊重師長乳哺養育有恩者於長夜中常思頂戴不生猒倦恆持自身繫屬隨順任所屠𡧱捶貨買尚自不敢竊壞心何况顯然來求者文二言下釋未許故不二初標分如文二一下解釋二初他所有未許他所有者我妻子等之物也有罪福者瑜伽四十六云出五種相似㓛德中第四云四者修行有罪等善行文二自所有未許二初標章論二初論文二初明不能二初未許述自所有者直我妻子等也准藏瑜伽三十種不內第十八十九兩種也從初至來求者是第十八不之物也自雖復曉喻至作奴婢者是第十九也云云二雖下已許如文易知述云問第十九雖復曉喻等之人已是許何科文言下釋未許故不云屬未許科乎答鄰次上第十八未許科故𭣣之也云云二不以下明不意述云不以妻子等者述上𭜨家𢙣者所不人躰及其意也准此非𭜨家𢙣者者雖妻子耎姓男子可之歟云云同問正見今經文隨前人所須一切給與云云設雖作奴婢前人有乞求者何可惜哉是以須逹拏太子對波羅門兩兒令作奴婢見爾者今論文如何答布行相隨位可有其不同何必可一准哉菩薩意樂於一切衆生平等可愍之以姓男女等𭜨家𢙣者令生苦𢙉者平等慈悲似有所闕但今經云一切給與正言曉喻令生歡喜又來乞者非𭜨𢙣之人者可有與歟或又得忍菩薩頭目皮骨一切可之故至深位行如此布歟今論文云不以妻子等或對𭜨家𢙣者或指不曉喻之類或付淺位相或依不歡喜之類如此歟爾者經論一往無相者歟問梵初心外門戒何云深位之所作乎答梵唯非初發心既云十地諸菩薩等𢝰舉五十二位故無相也云云補云有人難云今論文三種見初一切曉喻可與來求者是一假次雖復已下有二假初雖曉喻不與𭜨𢙣者是二假次不以已下雖復曉喻不以耎男女來求者是三假而科文不以下明不意文甚背論文如何答師云本論文爾也但今師之後須太拏太子𬾨問答之言彼亦曉喻故知曉喻亦可也故上云不曉喻不付耎男女言之雖姓男女曉喻亦可為言惣今問答趣少背道理挍論藏太子所行大而今俱會釋與論令同深有意趣為顯如來因行不思議事假問答故順今文科文如是科若由本文科之次問答乖各若由實理如本文可分三假問若爾須太拏太子所行云何會之答深位所行仍不可為難云云問太子何位號深位乎答有人云十回向中第六回向花嚴經二十一云第六回向乃至布妻妾男女如須逹拏太子現莊嚴菩薩文既出第六回向須逹拏太子故知第六回向位云云師云為顯布男女行相引此舉上例下處常例不知登地所行未以此文成明證追可尋之矣二此意下解意述以下文者今師述上兩種不之意也二若爾下問答决疑二初疑就前科曉喻之言難之也二彼下釋二初正釋述問前云不令𢙣者姓男女作奴婢云何太子以兩兒波羅門令為奴婢乎答是波羅門非𢙣者故之給歟問爾者何兩兒不肯隨去以鞭捶之而出血流地乎答𢙣者者或作十𢙣五逆不律儀人歟或又非理逼𢙉他人或又𡧱誑惑於人等人也然而是婆羅門者非如此等人以兩兒不去為欲從隨打之計也敢非無慚放逸打之歟文意易知二問下轉難二初以不去難西𫭫記云三國乃至彈多落迦山舊曰檀持山誤也乃至有都婆太子於此山以男女婆羅門其男女流血染地今諸草木猶𭘧絳色文述云太子淚下者此父須逹拏太子淚也云云二答下以待母答女良反也云云平聲陽唐也又如常反三言下釋自不能不二初正明三初明非分不如文二為下非分退智論十二云如舍利弗於六十劫中行菩薩道欲渡布河時有乞人來乞其眼舍利弗言眼無所住何以索之若須我身及財物者當以相與答言不須汝身及以財物唯欲得眼若汝實行檀者以眼見與爾時舍利弗出一眼與之乞者得眼於舍利弗前嗅之嫌臭唾而地又以腳踏舍利弗思惟言如此㢢人等難可度也眼實無用而強索之既得而棄不如自調早脫生死思惟是已於菩薩道退回向小乘等文補云問鶖子退位耶實乎答天台花嚴云退不思議境界經云花嚴賢首品同品異譯也舍利弗等五百聲聞皆是他方極位菩薩文由此等經文云退也法相宗意付舍利弗有實二類花嚴七處八會中前六會舍利弗是不思議境界經由此爾也入法界品已後舍利弗實類此舍利弗古三千塵點當初智勝如來所預䨱講法花莚發菩提心既至第六住而遇乞眼緣趣小乘淺近行是實退也法花論中如是見由此宗家實退云云而今示退之迹者退見宗學者云今師本花嚴宗人後改宗隨本習如是釋攝釋中釋云鶖子行誘實人文是退見然而撲揚大師本天台宗人亦由串習釋之例彼得意因舊古本宗主退釋唯識學記二尺恐繁不問玄贊云不退有四一信不退十信第六名不退心自後不退生邪見故二位不退十住第七名不退位自後不退入二乘故三證不退初地以上即名不退所證得法不退失故四行不退八地已上名不退地有為無為法皆能修故文身子既至第六住則信不退位何故本業經云作大邪見及五逆無𢙣不造文乎答宗大論也一義云雖實不造且毀行云作大邪見也亦開示抄中付信分事理二理信不退所以與目連同味甘露於事信猶有退是故云作大邪見也信不退且依理信也付鶖子退有重論義云云且注大途追可受學述云水抄云有三品發心上品更不退生邪見中下品有退也不妨鶖子當時發中下心文三如十下舉應分齊三初十住論本文如文集二由下毗尼經述云由此云云問指上十住論歟答不爾也指凡今大科本旨也意云凡菩薩行依分可行非分行退菩薩行即如舍利弗是也故隨分出家菩薩者行法在家菩薩可行財如是行之時不失菩薩行各成其行云云問云何經論所不同乎答且經論各述一𨕙義故似不同其意趣互不可之也紙墨筆類財十住論意不可之亦金銀等重物財决定毗尼經意不可許之也亦在家出家菩薩相對之時在家菩薩法不及出家菩薩法故不之偏於出家菩薩明之若亦有勝利之時可許之故毗尼經許之十住論意不可之也依大途判之故不云有法也云云補云得忍菩薩者云得忍菩薩行三乃至得忍應是十解已上文勝莊云彼無生忍菩薩應行三文如十住已上號得忍勝莊師地上稱得忍經云得無生忍若爾勝莊師意叶經文歟云云三然下會大集大集十三云菩薩於如來所許念捨者所謂捨財捨法復次有捨身及命捨一切邪道文文集注云如是等文散在一部疏主取大意惣加會釋歟云云二如下證本文如文集二言有下反結二初釋有求法者二初舉法二初明法勝𣵀槃經云若有能知如來常住無有反易或聞常住二字音聲若經耳即生天上文譬喻經云若有凡人深經一句誦之有心念自身中三毒四魔八万垢門皆不能忍何况採衆經法為𠀍福者文𡧘云四言為句四句為偈偈句不滿為法如欲聞無常言而不為此無常言不成句也文二如下廣指論經瑜伽第七十出五相一者戝於他身中發起𢙣行法决定起諸善行二者財於他身中發起煩𢙉法能令對治煩𢙉三者財於他身中無間發有罪安樂法能無間令發無罪安樂四者財若佛現𠀍若不現𠀍易可獲得法若無諸佛現𠀍難可獲得五者財與有盡法與無盡文八卷金光明經第二云其法者有五種事何者為五者一法彼兼利財不爾二者法能令衆生出於三界財不出三界三者法利益法身財增長色身四者法增長無窮財必皆有竭五者法能斷無明財止伏貪心文二然下開不瑜伽三十九曰知欲祕藏亦不與不求勝智亦不與必求勝智若自了知於經卷等其義已辨即隨所樂如應與文二言下釋而反罵辱三初明罵辱業果慳財反罵等者法藏云得報者略辨七種一生餓鬼中如目連母等餘趣受苦二疥野干乃至無一毛可以䨱身等三於人受貧窮苦六由慳法𠀍常受愚癡七由遲法眼恆無眼目文二瑜下明犯不犯別二初違犯二初染犯補云瑜伽中付不財由慳心不為重戒由嫌恨恚𢙉心不為輕罪則第三十八布障第三戒也今文引彼輕戒且顯犯不犯也云云二若下非染如文二無下無違犯永不冝物者毒刀酒等也王所匪冝者違勑人也云云三問以下因釋大集文二初問如文二頌下答大集經十四曰妻子珍寶及王位臨命終時無隨者唯戒及不放逸今𠀍後𠀍為伴侶文九瞋不受謝戒二初牒經補云云𭇥毒損人謂之嗔結恨不捨名不受謝亦從所防為戒名也文藏云第三次第者前慳貪次嗔恚故來也文此戒亦不待語言嗔恚猛盛不可受謝則犯重夷也云方便究竟者古云前人領解知彼不受被身口罵打結重隨身口業多少結今謂不論前人領不領若决意結𭜨不受悔謝便結重也所以知然嗔即嗔恚業道乃至嗔恚業究竟者謂𡧱等期心决定故知不待前人解領文今師意亦三解釋與此同由此文集嗔恚業道也勝莊云五方便究竟謂懷恨心不受彼悔前人領解文嚝云六前人領解便犯文此等諸師待語言結犯見大不得經意也此師但心亦犯今戒見二述釋二初制意二初制戒意唯識論云瞋唯不善自他故文𦗟聞集云問安住淨戒菩薩起嗔恚煩𢙉之時必成犯戒罪歟答未必然也云云論義也可見之也二菩下根本意二初標意述云菩薩捨二乘有餘無餘二𣵀槃住無住處𣵀槃利衆生也云云二如下證二初論經證補云如𠀍尊等者瑜伽則經也則當善戒經歟彼云若諸菩薩犯如恆河沙等貪如是菩薩不名毀戒若犯一嗔因緣毀戒是名破戒何以故嗔恚之心能捨衆生貪愛之心能護衆生文二論下論解意釋二初論文二初解非貪所起二初解貪不犯私云所作者利益衆生所作歟二非下解貪亦犯非作所作等者謂非為利有情但由自情貪可成犯戒為言二若諸下解多分瞋起如文二解下疏解二初述貪實亦犯如文二非下述瞋非通犯二初正釋補云但舉顯相等者付此異義頗多且依科文三毒相望嗔自餘二毒第一顯然而於菩薩戒雖無無餘犯為顯嗔毒顯相經文偏舉嗔恚深密無餘犯義且顯有無餘犯相意只為禁嗔如是由實理菩薩戒無餘犯極成畢由此上品邪見起時無餘犯義難立問之也仍訓文云但舉相示義一義云但舉以下屬下問答不釋上嗔恚實十戒俱雖無餘犯十中舉顯上品邪見且示無餘義不許無餘犯同前義但付邪見得意為異仍訓文云但舉顯相示義一義云但舉等一句結上貪嗔相對示深等一句生下上品邪見釋也則結前生後意云貪嗔相對顯門雖無餘犯起上品邪見時可有無餘犯義為言此義於上品邪見許無餘犯義與上義大異也仍訓文云但舉相示義云云已上三義俱八怗抄見第一義順科文道理亦尤然仍可為相羕實義後二義中初義少有其謂第三義於上品邪見許無餘犯義大背前後文相能思之云云二上品下問答二初舉犯上品邪見者問三中上品名上品邪見乎答不爾於謗有全分謗一分謗今指全分號上品邪見於此中亦三品答中爾時唯犯一波羅夷者是亦通𣲇失二由三有不同故云云問上品邪見者與斷善同異如何答古義云上品邪見則斷善云云師云此義大非也前後文相上品邪見唯犯一重不捨餘戒不同分心位捨戒見其不同分心者則斷善前方便菩薩戒無斷善捨云云瑜伽九十九卷云由此邪見為依止故有一沙門若婆羅門斷諸善根文斷善已前有無因果邪見見今指此云上品邪見則非斷善也凡今師立隨所犯支失戒律儀之義故於上品邪見犯重捨𨕙隨所犯支失戒律儀也由不同分心有惣捨不可混亂為言付之有委細分別至下戒具抄之云云二爾下答釋如上准可知之也二釋文二初指犯相犯性問今境界事門如何答結成罪門中攝則情非情等境也云具緣中事謂衆生文師但情境犯今戒若由今師意通情非情如下應知云云二言下解結成罪門二初明正行二初標舉如文易知二謂下解釋二初標作三念者第一大集二卷出第二念同經二十五卷智論十五出第三念𣵀槃二十六出二一下釋三初念本淨如文二念本願如文三念彼恩如文二言以下反結三初釋文以𢙣口罵辱者語業也加以手打及以刀杖者身業也意猶以下意業也二雖下釋疑二初述自解補云以所等起顯嗔重故者謂意地因等起身語所等起由嗔三業方𬾨以此顯嗔重為言述云此意地罪决定時結者此解釋祖師別義亦可亘前後兩戒俱意地戒故云云雖非衆生等者是述今師正解也今師意者木石等非情云非衆生則上文云瞋邪見亦非情今又釋不來懺謝故凡今師意不待猶瞋不解之位意地决定之位結故設雖非情若對彼瞋恚猛利起設雖來謝懺不可受謝懺裎心者可結重為言問今師意不待他來謝意地决定時犯何瑜伽云他來諫謝不受名他勝處哉何况云瞋不受謝戒其義云何答瑜伽論顯所等起云爾也示意地决定分齊也次瞋不受謝戒名約經現文一往釋之也云云義云今謂不論前人領不領若决意結𭜨不受悔謝便結重也文二有下有解述云有人意者必加刀杖不受謝位犯重故非情木石等無此義分故云犯輕也依之義師於木石等非情者不犯重釋巴云聖人名非衆生非處受生故云非衆生又云若非情名非衆生是深防語等文雖於非衆生作二尺於非情不犯重莊云於非衆生中者舉輕顯重於非衆生嗔非犯他勝故文元曉明嚝等同之今摽有指此等諸師也三百下定躰二初徵如文二即下釋二初立義唯識論第六云云何為忿依對現前不饒益境憤發為性能障不忿執杖為業謂懷忿者多發暴𢙣身表業故此即瞋恚一分為躰離嗔無忿相用故文二如下證他來諫謝者問此他經文前人求悔人嗔所對人歟將傍人等歟答勝莊云他者自有三尺一云懷嗔心時有餘善友他來諫謝作如是言何須如是猛利嗔恨長老思擇更不須嗔如是諫時不捨𭜨結犯他勝法非𭜨家來不捨𭜨結犯他勝法若𭜨來求悔不受其悔止輕非重瑜伽云一云所對𭜨家來求諫謝不受其悔犯他勝處所言他者𭜨家名他非善友他故地持云一云此中他者𭜨家及善友皆名為他問𭜨家來謝不受其悔犯他勝處如前所引輕罪何異解云若有𭜨家犯觸菩薩彼還求悔菩薩不受其謝是輕非重如前所引若此菩薩犯觸於他懷恐怖來求諫謝不受其謝不捨𭜨結犯他勝處故有別文義同之意云他來對我作過彼還謝不受為輕罪我對他作過他來諫我不受為重罪為言師云今師解釋必不如是嗔恚猛利及忿意樂則為重罪但由嫌恨意不受謝為輕罪云云瑜伽輕戒中第十七他侵來謝不受戒文云若諸菩薩安住菩薩淨戒律儀他所侵犯彼還如法平等悔謝懷嫌恨心欲𢙉彼不受其謝是名有犯有所越是染犯文問由忿恨分輕重恨猶可重所以者何唯識論釋恨行相云由忿為先懷𢙣不捨結𭜨為性𢙉為業文既云由忿為先故知忿輕恨猶重見今何㒹倒乎答唯識論且由重恨一往釋之若不至忿心所但起恨心豈非恨心所若非恨心所隨煩𢙉中何攝當知及盆意樂犱杖為業嫌恨恚𢙉一切俱可為重罪若不及忿意樂嫌恨恚𢙉悉為輕罪文已上第九戒畢十毀謗三寶戒二初牒經藏云第二釋名者勝德可𭹀故稱三寶非理塵黷故名為謗戒防此失故以為名第三次第者前瞋次邪見故來也文問謗三寶樣如何答勝莊云謗佛寶者謂如有一是外道類作如是言𠀍間無有一切知者或作是言佛非其實唯是幻化謗法者法有四種謂教理行果懷嗔恚故誹謗如來甚深經典作如是言非佛所非法律謗毀僧者謂作是言𠀍間無有真阿羅漢菩薩僧也文問今經通舉三寶瑜伽但言謗菩薩藏相如何答云第十毀謗三寶戒地論唯云謗菩薩藏三中謗法過偏重故文意云地持瑜伽唯云謗菩薩藏且由重云也法是佛僧師也故重佛僧實彼論意通三寶謗之俱為重罪為言一補云藏云第四具緣有五一對人衆二三寶境三起彼二想四作邪見五發謗言便犯文又云闕第五緣言未發故或異言故皆重方便文明矌云別具六緣五言了六前人領解便犯闕緣犯輕文此等諸師今戒皆待語言見義師并今師意不待語業結之見問性相所定後三業道必由方便思貪欲業道作屬己思嗔恚業道作𡧱命思邪見業道欲宣人誹謗决定成業道俱皆方便意也今謗戒必方便意可犯乎答慳戒已下三戒多分順業道門其中少有異制業兩門自元差別故若爾不欲宣內心起無見可犯重戒也勝莊云一切倒見皆名邪見而此中意但取誹謗為波羅夷於諸邪見此最重故云云二述釋二初制意二初制戒意必證常樂者𣵀槃四德常樂我淨也常沇苦海者法藏云誹謗三寶罪同五逆墮阿鼻地獄等云云二行下根本意述云因邪見謗三寶終起斷善根等故云爾也二釋文二初通指三門私云科文三門者犯相門犯性門境界事門歟二言下別釋結成二初釋如鉾心二初牒文證經見外道及以𢙣人者云外道者謂佛法外行異道者𢙣人者謂佛法中起𢙣見者文見者謂聞如見也云見者聞見文經一言謗佛音聲者奧上云謗佛者不言法僧略有二意一文不便故二以本未故為法是佛所僧是佛弟子故也文如三百鉾心者與咸注云鉾者長二丈建於兵軍猛剎也三百即表三毒各具諸𢙣以三百言之文二衆下合證釋意無過謗法者倫記第三云問何故謗法不為逆乎解云謗法本重超於逆類故無不立也依薩揵子經五逆者謗三乘法為第二逆也文二言下釋况口自謗二初牒文證經况口自謗文𦗟聞集云問誹謗三寶戒必依語業成犯歟將雖不假語言唯許意業犯歟兩方若必假語業者見古迹上文述四身三語意亦三以誹謗戒正攝意業爰知尤可許意業犯也若依之如此者正見今經文或云見外道乃至一言謗佛音聲或述况口自謗等文相無諍必可依語業見是以勘法藏師解釋妄語毀謗是語業犯也云云旁不明如何答依邪見謗三寶名之他勝處法設外雖不出謗聲內心中猛利邪見决定之時可有無三寶之義何不犯第十戒哉是以新羅法師釋究竟犯位相究竟者謂誹謗决定云云故於第十戒設雖不假語聲可有犯義歟太賢師既以此戒屬意業許意業犯事無疑但本經文者犯彼謗戒之人其類應不同正出謗聲之時其心猛利故可有結犯之輩此類通相也是故顯所如此歟或又犯必雖結意地誹謗正是語聲㓛能也故云謗佛音聲况口自謗事又以如此謗心决定之人遂必有發謗聲旁無其相歟次法藏師釋者法門義理多途也何無其趣乎云云像似正法云云瑜伽論九十九云云何名為像似正法謂略有二種像似正法一似教正法二似行正法若於非法生是法想顯示非法以為是法令他於中生正法想若廣為他如是宣令他受學亦自修行妄法想習諸邪行而自憍𢢔稱言我能修是正行應知是似行正法於諸經中安置僞經於諸律中安置僞律如是名為像似正法文勝莊云瑜伽云如解云相似正法者有兩尺一云外道及小乘教名相似正法一云外道教名相似正法不能顯示出𠀍方便故雖有兩尺初為勝所以者何執小謗大犯他勝處毀菩薩藏故云云云像似正法者謂五法等相狀似正法而非正法故文瑜伽文或隨他轉者謂隨他受也或自信解但自起邪見或隨他轉由邪師發邪見故地持云或從他受文二此下通釋邪見二初明無斷善捨此通增益减者上論文愛樂建立增益謗菩薩藏减也上論所制通增二見為言金剛般若釋云有遍斗所犱名增益無依圎名减是是無著義依龍樹義犱有俗諦名增益無真諦名减文菩薩戒無斷善捨者問此釋意云何答本論中於捨戒緣聲聞五緣菩薩四緣然而聲聞五緣中有斷善捨菩薩四緣無斷善捨故云菩薩戒無斷善捨也意云於受戒心有生得加行二心生得心劣故待斷善其戒方捨加行心𭤽故斷善前加行方捨聲聞戒通二心受得故立斷善捨菩薩但加行心方成其戒故所受戒斷善方便方捨也表無表章云斷善根者有二心受戒謂生得加行斷生得善非加行善心受者斷善根前加行道其戒已失斷善為緣亦名斷善若生得心受要邪見起現在前其戒方失文决擇抄云方便心受斷善方便其戒即捨生得心受正斷善時其戒方捨所以然者斷善根但斷生得善根無力能斷方便善故為此其戒捨有前後問生得善心如何得戒感於果乎答求三乘果名為方便求三界果等皆生得收所以生得亦能受戒文述云於比丘戒者求三界等勝果尚許之菩薩戒唯求無上菩提果不欣三界果故不許生得受戒也為言補云問菩薩淨戒斷善前方便捨者何位捨乎答諸師釋不同由今師意凡及斷善有三階心見一無邪見位瑜伽云由此邪見為依止故乃至斷諸善根文則斷善前方便必發無邪見上戒云爾時唯犯一波羅夷文今戒云若至上亦失淨戒文則不及退菩提心無位可有上𮉐捨義若此位及上但失此戒於犯重捨今師云隨所犯支失戒律儀故二起不同分心位雖起無邪見未別起捨菩提有情心不退菩提心無見决徹後別發捨菩提有情心是名退菩提心是位惣捨一切戒上戒云然必生不同分心文今戒云必起不同分心文此也此位菩薩淨戒悉捨無餘故無斷善捨也三正斷善位文集所引略纂具明其相此位生得善悉捨略纂云善根有二一種子二現行唯斷現行非種子折伏㔟力令不起現行名之為斷非斷種子唯斷生得非加行善加行善勝前方便時已不起故文問續善時分云何答瑜伽云云何續善謂由性利根故見親朋友修福業故謂善丈夫聞正法故因生猶預證决定故還續善根文問及斷善有三階大難思無見起後欣求何物不退菩提故知無位可退菩提心何更別重立退菩提心乎答見今師始終解釋斷善方便必可有二心見其釋文如上挍之凡邪見心迷惑正理無三寶等也起此心已起佛果難期衆生難度等心是退菩提心若無位一切退菩提第十戒可無犯重捨一切退菩提故若爾下文云若至上亦失淨戒文今戒有犯重捨理在絶言有人料蕳今文云凡於無二種若至上等釋依一分謗釋之若全分謗一切退菩提無犯重捨云云此義大非也上出全分一分竟後云若至上等豈不亘全分有人云無見即斷善云云此等大論藏等斷善方便無見諸文分明如是諸義恐不足言事也云云二邪下明犯失別問一分謗有斷善乎答師云無斷善義不謗餘故云云述云問執小乘謗大乘之時必起不同分心歟乎答今師意者退菩薩道捨大乘向小乘道此類必起不同分心捨戒不退菩提執小不信大此類非起退菩提心若至上品犯者亦可失所犯一支故云若至上亦失淨戒也又於大乘中別謗法花花嚴等別教故犯輕戒第八背正向邪戒既今師云此謗別教非惣背故文問上品邪見惣一切若至上第十一戒分一切可捨乎曰公答有人云全分謗時約境可失一切然而約心七毒立中可有所殘故亦第十一戒亦非全捨也若亦一分謗約境亦有所殘云云能思之云云義料蕳并宗家解釋略之問犱大謗小為重罪乎答勝莊云若有犱大謗小作如是言聲聞藏教非佛所是輕非重一云此亦犯重文犯無取捨今師意順勝莊初釋歟出一分謗但云謗大乘若大小俱犯重何獨出大乘哉取意略記之問若爾全分謗時望大乘犯重望小乘犯輕乎答思之有義云全分謗時不蕳云犯重大小俱犯重見故知別謗小乘俱犯重全謗既大小同犯重一分謗時小乘豈不犯重乎云云二已上所下結指勝義門述云已上所皆𠀍俗門者問上所明之出𠀍門戒尚取𠀍俗門乎答八怗抄意猶取𠀍門也一義云已上所等者且指當經十重護持相云皆𠀍俗門云云此義可然歟三輪淨者如宗要以戒罪人云三輪亦古迹上卷云受者授者及所受戒不可得故三輪空也文少與宗要別開合不同更無相文第三經善下結成故二初牒經摽分經善學諸人者法藏云善學諸人者此有二義一謂此諸人是善學戒者二是學善之者告此諸人謂大衆也又是當來無學菩薩道人也文二初下隨文解釋三初勸不毀犯故二初解善學二初正明二乘不究竟學者二乘一切對菩薩皆不究竟學所修行品但諦緣所證果德亦極無餘土限三千佛解五分朝夕觀念才空人我實有之犱晝夜勤修只存禁𢙣防非之理退他本自終殘所知一分即證生空一理四智中才妙觀察智中生空智一分法空妙智猶絶聞况自餘三智二乘不究竟學其理諒爾二如下證述云二乘小乘人設雖至究竟位望菩薩行時不其行究竟菩薩雖初心堅固發三聚菩提心盡未來際誓利樂一切衆生故於一切有情悉有恩分故一切天人等欲供養此菩薩二乘者反之可知故云云二此下解不犯微塵三初積成大故二初標義雖過輕微積成大者依小罪後終致犯重非云小罪聚成重罪也二如下證如經頌曰云云此𣵀槃經文也彼經十四曰舍衛國有一丈夫羅捕鳥得已籠繫隨與水穀而復還放𠀍尊知其本末因緣而偈言如也二或下愚人罪重故二初標義述云凡聖相對蕳之凡夫不得智故依所造𢙣業墮𢙣趣也聖者等得𢙣趣不生故設雖犯戒等不得𢙣道報依修智惠也意云今經所殊令被凡夫地前機故是皆愚人故云不應一犯如微塵許也若有犯者可墮𢙣道故如是誡之也云云二如下證二初有頌如有頌曰俱舍文也光記十二云故有頌言愚作罪小亦墮𢙣趣無慙愧故智為罪大亦能解脫𢙣趣苦果有慚愧故文二即下智論二初述意智論四十一云譬如䥫器中空故在水能浮中實則沒菩薩亦如是行般若波羅密智惠心虛故不沒重罪凡夫人無智惠故沇沒重罪文私云此文凡聖相對見云云二問下釋疑二初問如文二答三初正答如文二謂下舉喻如文三愚下合結如文三十下小善成重故科文小善成重者謂愚人由小善小罪亦成重為言私云十住論第五卷文也如文集而准本文斗字可作𫝣池字可作海字歟云云文可知之經何况具足犯十戒者云具足五緣成十根本故云具足犯十戒也文此釋意具足之言指五支具足然見文相具犯十戒故云具足歟云云二示犯失壞故二初明因失三初標章牒文如文二此下釋經密意宗要云然此經中約犯七密意惣犯十重者現身不得戒文意云指十重之中入七罪若有犯者不得現身等也更非一切犯譬如𭣦生戒中若𭣦父母羅漢等者於現身中不得發菩提心得菩薩戒也已上五怙抄取意記之瑜伽論四十一云若諸菩薩以上品犯如上他勝處法失戒律儀應當更受文本業經下卷云十重有犯無悔得便重受戒文此等文可重受見但於今經文者為誡新學菩薩付入七之罪如是也云云三問答决疑初問本業經下云菩薩戒有受法而無捨法有犯不失盡未來際文全文如文集二答二初有義二初約三乘一乘解二初彼解八怗抄云問何故三乘教退失一乘教不退失乎答三乘教淺順事故有退失一乘教深順理故無退失歟彼師遊心安樂釋菩提心相云於中有二一者隨事發心二隨理發心言隨事者煩𢙉無數願悉斷之善法無量願悉修之衆生無𨕙願悉度之於此三事决定期願乃至此心果報雖是菩提於其花報在於淨土乃至是明隨事發心相所言隨理發心者信解諸法皆如幻夢非有非無離言絶盧依此信解發廣大心雖不見有煩𢙉善法而不無可斷可修是故雖願悉斷悉修而不於無願三昧雖願皆度無量衆生而不存有能度所度能隨順於空無相乃至是名順理發心相也隨事發心有可退義不定性人亦得能發順理發心即無退轉菩薩性人乃得能發如是發心㓛德無𨕙文三乘教菩提心當隨事發心一乘教菩提心當順理發心也云云他宗人難云瑜伽願我决定等發心隨事發心未知順理發心所以教也師云此難頗管見至歟顯揚論出二種菩提心一𠀍俗發心菩薩戒作法從今日等文也二法性發心云云不見此等文致問難也云云二然下今破問新教宗者指能破歟將指所破歟乎答一義云所破云新教宗法相三論等宗義自天竺傳來此久花嚴五教天台四教等令於震旦初立此義故云新教宗云三乘一乘真實新義故難可依定也一義云能破云新教唐三藏以後所經教云新教也意云新譯法相宗意不立菩薩故唯三車是以今師同此義不依用彼義故云難可依定也又凡於教雖許立實以瑜伽論為教云事深不可許之故也云云二義下約㓛能種子解二初彼解云以躰從㓛故言捨戒以能從躰故經云不失文二此下今破又云問若爾聲聞戒五緣應不失答據躰實應然但佛為彼聲聞教中多就㓛能戒是色是故不永在不失文准此今問難彼問答然而彼會尺不當理故主亦猶例難歟二指今解宗要云下乘向大有應捨法棄菩薩戒無應爾故或菩薩戒無無餘犯無有惣盡如前故文問今師意回心向大之時可小乘戒所捨哉然何捨戒五緣中不列之哉答先小戒不可謝成菩薩別受戒也其義如上述也然而今云捨者捨小乘心依大乘心護持之故云捨也其道理可知也此外勝莊等以中下品犯菩薩戒無捨之義故本業經以中下品犯相無捨法也法銑同之云云二言下明果失二初惣標撲揚云若持十戒為國王因由破戒時王因則失果位亦失此是小國王并粟散王等也轉輪王位者金銀銅䥫四種通名轉輪王亦皆失也文二當下別釋三初失𠀍間與二乘果失國王位者失花報也下佛性常住者失實報也云云私云二乘果者有餘無餘果歟經失比丘等者云失比丘等者失勝類也不復堪入二衆數故下三衆亦隨類攝文法云失比丘者謂犯此戒應入地獄定不得為人作比丘又由犯重現在不成比丘用故云失也文二何下失出𠀍之大乘果二初𢝰明失如文二言下略釋文佛性常住云云莊嚴論常有三種一本性常謂法身此身本來性常住故二不斷常謂受用身恆受法樂無間斷故三相續常謂反化身沒已復現化無盡故如是法身雖離一切分別論而無生滅故名常二身雖有念生滅而依常身無間斷故恆相續故名為常文通餘二身云云報身化身也云云三不下惣結於二𠀍無救𠀍間及出𠀍間云云二劫三劫間在三𢙣道中不被𠀍間父母救濟及出𠀍三寶加被故云無能救也云云三餘下誡學指廣故經八万威儀者與减云八万者熙抄云准三千威儀經約二百五十戒各有四威儀合為一千指三𠀍轉為三千威儀配身口七支為二万一千又對三毒等分則成八万四千諸文舉其大數但云八万威儀然今大乘頓戒恐不應以篇聚增數釋之彼文約小可然更請詳之文已上熙抄義與减不許之良以八万威儀形相互異故知一各有其相若增數計義甚不可减師不許實有由乎云云
